# cargo-nextest settings. CI Fast's coverage lane runs the Rust suites with
# `OH_COV_RUNNER=nextest` (scripts/ci/rust-coverage.sh): every test in its own
# process, in parallel, which isolates the core's process globals (event bus,
# registries, env vars, one-shot OnceLocks) without changing them.

[profile.default]
# No test may run longer than 5 minutes: flag it slow after 60 s, kill it at
# the fifth period. A hang (a self-deadlock on the storage-slot lock, a wait
# with no deadline) is a failure, not a stalled run.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Report every failure, never stop at the first.
fail-fast = false
# Flag a slow test after 60 s; a hung one is killed after 5 minutes.
slow-timeout = { period = "60s", terminate-after = 5 }
# Print failures at the end, where the lane log's tail shows them.
failure-output = "final"
success-output = "never"
status-level = "fail"
# List slow passing tests in the final summary too, so a run shows where its
# time went, not only what failed.
final-status-level = "slow"

# agent_harness_e2e changes process- and filesystem-wide test seams (HOME,
# keyring storage, and the RPC token bootstrap). Its in-binary mutex provides
# that serialization for cargo test; retain it when nextest runs each test in
# a separate process.
[test-groups]
agent-harness-e2e = { max-threads = 1 }
json-rpc-e2e = { max-threads = 1 }
mcp-registry = { max-threads = 1 }
doctor-e2e = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'binary(/^agent_harness_e2e$/)'
test-group = 'agent-harness-e2e'

# RPC bootstrap writes a fixed temporary token path across processes. Retain
# the original serial contract of both resource-sensitive integration suites.
[[profile.ci.overrides]]
filter = 'binary(/^json_rpc_.*_e2e$/)'
test-group = 'json-rpc-e2e'

[[profile.ci.overrides]]
filter = 'binary(/^mcp_registry_multi_server$/)'
test-group = 'mcp-registry'

# doctor_e2e shares one mock backend when the lane supplies BACKEND_URL
# (scripts/test-rust-with-mock.sh), and every case resets that mock's state and
# asserts on its request log. Run in separate processes in parallel they reset
# each other mid-test, so keep the binary serial.
[[profile.ci.overrides]]
filter = 'binary(/^doctor_e2e$/)'
test-group = 'doctor-e2e'

[[profile.default.overrides]]
filter = 'binary(/^doctor_e2e$/)'
test-group = 'doctor-e2e'
