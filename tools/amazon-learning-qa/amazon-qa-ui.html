          ${items.length ? `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}
        </article>`;
      }

      function renderTopicGroup(group, selected = false) {
        const meta = `${Number(group.dossierCount || 0)} 个档案 · 证据 ${Number(group.evidenceCount || 0)} · 材料 ${Number(group.materialRecords || 0)} · 实验 ${Number(group.experimentResults || 0)}`;
        const takeaways = Array.isArray(group.keyTakeaways) ? group.keyTakeaways.slice(0, 2) : [];
        return `<article class="study-material" data-selected="${selected ? "true" : "false"}">
          <div class="overview-item-head">
            <strong>${escapeHtml(group.label || "研究主题")}</strong>
            <span>${escapeHtml(meta)}</span>
          </div>
          <p>${escapeHtml(group.sourceScope || "全部作者")}</p>
          ${takeaways.length ? `<ul>${takeaways.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}
          <div class="workbench-actions">
            <button class="small-action" type="button" data-topic-open="${escapeAttribute(group.id || "")}">${selected ? "收起主题" : "打开主题"}</button>
            <button class="small-action" type="button" data-topic-room-open="${escapeAttribute(group.id || "")}">来源阅读室</button>
          </div>
        </article>`;
      }

      function renderTopicWorkbench(group, learningProducts) {
        const metrics = [
          `档案 ${Number(group.dossierCount || 0)}`,
          `证据 ${Number(group.evidenceCount || 0)}`,
          `材料 ${Number(group.materialRecords || 0)}`,
          `实验 ${Number(group.experimentResults || 0)}`,
          `待推进 ${Number(group.openMissionCount || 0)}`,
        ];
        const evidenceStatus = group.evidenceStatus || {};
        const sources = Array.isArray(group.keySources) ? group.keySources.slice(0, 3) : [];
        const claimSupport = Array.isArray(group.claimSupport) ? group.claimSupport.slice(0, 3) : [];
        const supported = Array.isArray(group.supportedConclusions) ? group.supportedConclusions.slice(0, 3) : [];
        const hypotheses = Array.isArray(group.validationHypotheses) ? group.validationHypotheses.slice(0, 3) : [];
        const materialGaps = Array.isArray(group.materialGaps) ? group.materialGaps.slice(0, 3) : [];
        const learningPath = Array.isArray(group.learningPath) ? group.learningPath.slice(0, 4) : [];
        const nextActions = Array.isArray(group.nextActions) ? group.nextActions.slice(0, 4) : [];
        const dossiersForTopic = Array.isArray(group.dossiers) ? group.dossiers.slice(0, 4) : [];
        const sourcePackage = group.sourcePackage || {};
        const relatedProducts = Array.isArray(learningProducts)
          ? learningProducts
              .filter((product) => !product.topicId || product.topicId === group.id || product.type === "research_brief" || product.type === "faq_pack")
              .slice(0, 4)
          : [];
        return `<article class="topic-workbench" aria-label="${escapeAttribute(group.label || "研究主题")}主题工作台">
          <header>
            <strong>${escapeHtml(group.label || "研究主题")}主题工作台</strong>
            <span>把本主题的证据、结论、档案和下一步集中到一个入口。</span>
          </header>
          <div class="topic-metrics">${metrics.map((item) => `<span>${escapeHtml(item)}</span>`).join("")}</div>
          <p>主题工作台只整理学习档案，不写入原始知识库；没有已采纳证据时，只提示补证据，不生成正式结论。</p>
          <section class="topic-status" data-level="${escapeAttribute(evidenceStatus.level || "unknown")}">
            <strong>${escapeHtml(evidenceStatus.label || "证据状态待确认")}</strong>
            <span>${escapeHtml(evidenceStatus.summary || "需要继续补充来源、材料或实验记录。")}</span>
          </section>
          ${renderSourcePackage(sourcePackage, group)}
          <div class="topic-workbench-grid">
            ${renderTopicPathBlock(learningPath)}
            ${renderTopicBlock("关键证据", sources.length ? sources : ["这个主题还缺少已采纳原文证据，先回到相关回答标记真正有用的来源。"])}
            ${renderClaimSupportBlock(claimSupport, supported)}
            ${renderTopicBlock("待验证假设", hypotheses.length ? hypotheses : ["暂无待验证假设，先保存一次有明确行动建议的问答。"])}
            ${renderTopicBlock("待补材料", materialGaps.length ? materialGaps : ["当前主题暂未发现新的材料缺口。"])}
            ${renderTopicActionBlock(nextActions)}
            ${renderTopicDossierBlock(dossiersForTopic)}
            ${renderTopicProductBlock(relatedProducts)}
          </div>
        </article>`;
      }

      function renderTopicBlock(title, items) {
        const safeItems = Array.isArray(items) ? items.filter(Boolean).slice(0, 4) : [];
        return `<section class="topic-block">
          <strong>${escapeHtml(title)}</strong>
          ${safeItems.length ? `<ul>${safeItems.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : "<span>暂无内容。</span>"}
        </section>`;
      }

      function renderTopicPathBlock(path) {
        const safePath = Array.isArray(path) ? path.filter((item) => item && item.label).slice(0, 4) : [];
        return `<section class="topic-block">
          <strong>学习路径</strong>
          ${safePath.length ? `<div class="topic-path">${safePath.map((item) => `<div class="topic-path-item" data-status="${escapeAttribute(item.status || "todo")}"><strong>${escapeHtml(topicPathStatusLabel(item.status))} · ${escapeHtml(item.label || "")}</strong><span>${escapeHtml(item.reason || "")}</span></div>`).join("")}</div>` : "<span>暂无路径，先保存一次相关问答。</span>"}
        </section>`;
      }

      function renderSourcePackage(sourcePackage, group = {}) {
        if (!sourcePackage || typeof sourcePackage !== "object") return "";
        const accepted = Array.isArray(sourcePackage.accepted) ? sourcePackage.accepted.slice(0, 4) : [];
        const candidates = Array.isArray(sourcePackage.candidates) ? sourcePackage.candidates.slice(0, 4) : [];
        const excluded = Array.isArray(sourcePackage.excluded) ? sourcePackage.excluded.slice(0, 4) : [];
        if (!accepted.length && !candidates.length && !excluded.length) return "";
        const statusLabel = sourcePackage.status === "source_backed"
          ? "已有采纳证据"
          : sourcePackage.status === "needs_adoption"
            ? "待确认来源"
            : "待补来源";
        const packageControls = sourcePackage.sourceControls || {};
        const acceptedKeys = uniqueSourceKeysForTopicSources(accepted);
        const acceptedSourcePayload = accepted.map(normalizeSelectedSourceForControl).filter(Boolean);
        const promptButton = sourcePackage.nextPrompt && acceptedKeys.length
          ? `<button class="small-action" type="button" data-overview-prompt="${escapeAttribute(sourcePackage.nextPrompt)}" data-source-package-excluded="${escapeAttribute(JSON.stringify(packageControls.excludedSourceKeys || []))}" data-source-package-authors="${escapeAttribute(JSON.stringify(packageControls.allowedAuthors || []))}" data-source-package-allowed="${escapeAttribute(JSON.stringify(acceptedKeys))}" data-source-package-selected="${escapeAttribute(JSON.stringify(acceptedSourcePayload))}">基于已采纳证据继续学习</button>`
          : "";
        const dossierButton = sourcePackage.selectedDossierId
          ? `<button class="small-action" type="button" data-topic-evidence-dossier="${escapeAttribute(sourcePackage.selectedDossierId)}">${sourcePackage.status === "needs_adoption" ? "打开档案确认来源" : "打开来源档案"}</button>`
          : "";
        const roomButton = group.id
          ? `<button class="small-action" type="button" data-topic-room-open="${escapeAttribute(group.id)}">打开来源阅读室</button>`
          : "";
        return `<section class="source-package" data-status="${escapeAttribute(sourcePackage.status || "")}" aria-label="主题来源包">
          <header>
            <strong>${escapeHtml(sourcePackage.title || "主题来源包")}</strong>
            <span>${escapeHtml(statusLabel)}</span>
          </header>
          <p>${escapeHtml(sourcePackage.summary || "")}</p>
          <div class="source-package-grid">
            ${renderSourcePackageColumn("已采纳证据", accepted, "accepted")}
            ${renderSourcePackageColumn("候选来源", candidates, "candidate")}
            ${renderSourcePackageColumn("已排除来源", excluded, "excluded")}
          </div>
          <div class="workbench-actions">${roomButton}${promptButton}${dossierButton}</div>
          <p>${escapeHtml(sourcePackage.boundary || "来源包只整理作者来源，不写入原始知识库；候选来源未被采纳前不能当成结论依据。")}</p>
        </section>`;
      }

      function renderSourcePackageColumn(title, items, kind) {
        const safeItems = Array.isArray(items) ? items.filter(Boolean).slice(0, 4) : [];
        const empty = kind === "accepted"
          ? "还没有已采纳原文证据。"
          : kind === "candidate"
            ? "暂无候选来源。"
            : "暂无已排除来源。";
        return `<div class="source-package-column" data-kind="${escapeAttribute(kind)}">
          <strong>${escapeHtml(title)}</strong>
          ${safeItems.length ? safeItems.map((item) => renderSourcePackageItem(item, kind)).join("") : `<span>${escapeHtml(empty)}</span>`}
        </div>`;
      }

      function renderSourcePackageItem(item, kind) {
        const title = item.title || item.label || item.sourceKey || "未命名来源";
        const meta = [item.author, item.date, item.dossierTitle].filter(Boolean).join(" · ");
        const text = item.quote || item.excerpt || item.label || "";
        const safeUrl = safeSourceUrl(item.sourceUrl);
        const link = safeUrl ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">原文</a>` : "";
        const openButton = !item.dossierId
          ? ""
          : kind === "candidate"
            ? `<button class="small-action" type="button" data-topic-evidence-dossier="${escapeAttribute(item.dossierId)}">打开原文并确认是否有用</button>`
            : `<button class="small-action" type="button" data-topic-dossier-id="${escapeAttribute(item.dossierId)}">打开档案</button>`;
        return `<div class="source-package-item">
          <strong>${escapeHtml(title)}</strong>
          ${meta ? `<span>${escapeHtml(meta)}</span>` : ""}
          ${text ? `<p>${escapeHtml(text)}</p>` : ""}
          <div class="workbench-actions">${openButton}${link}</div>
        </div>`;
      }

      function topicGroupById(topicId) {
        const groups = Array.isArray(latestOverview?.topicGroups) ? latestOverview.topicGroups : [];
        return groups.find((group) => group?.id === topicId) || null;
      }

      function openTopicReadingRoom(topicId) {
        const group = topicGroupById(topicId);
        if (!group) return;
        selectedTopicId = topicId;
        selectedTopicRoomId = topicId;
        ensureTopicReadingSelection(group);
        renderLearningOverview(latestOverview);
        renderTopicReadingRoom();
        if (topicReadingRoomEl) topicReadingRoomEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function renderTopicReadingRoom() {
        if (!topicReadingRoomEl) return;
        const group = topicGroupById(selectedTopicRoomId);
        const sourcePackage = group?.sourcePackage || null;
        if (!group || !sourcePackage) {
          topicReadingRoomEl.hidden = true;
          topicReadingRoomEl.innerHTML = "";
          return;
        }
        ensureTopicReadingSelection(group);
        const accepted = Array.isArray(sourcePackage.accepted) ? sourcePackage.accepted.slice(0, 6) : [];
        const candidates = Array.isArray(sourcePackage.candidates) ? sourcePackage.candidates.slice(0, 6) : [];
        const excluded = Array.isArray(sourcePackage.excluded) ? sourcePackage.excluded.slice(0, 6) : [];
        const selectedKeys = topicReadingSelections.get(group.id) || new Set();
        const selectedItems = [...accepted, ...candidates].filter((item) => sourceKeysForTopicSource(item).some((key) => selectedKeys.has(key)));
        const selectedCount = selectedItems.length;
        const candidateSelectedCount = selectedItems.filter((item) => item.kind === "candidate").length;
        const continueDisabled = selectedCount === 0;
        const continueText = selectedCount
          ? `基于已选来源继续核对：当前主题 · ${selectedCount} 个已选来源`
          : "先选择来源再继续学习";
        const selectedMeta = selectedCount
          ? `本次只带入「${group.label || "研究主题"}」下已选择的 ${selectedCount} 个来源${candidateSelectedCount ? `，其中 ${candidateSelectedCount} 个仍是候选/待确认` : ""}。`
          : "候选来源默认不会被采纳，也不会自动进入下一轮回答。";
        topicReadingRoomEl.hidden = false;
        topicReadingRoomEl.innerHTML = `<header>
          <div class="topic-reading-title">
            <strong>${escapeHtml(group.label || "研究主题")}来源阅读室</strong>
            <span>${escapeHtml(sourcePackage.summary || "围绕这个主题核对来源。")}</span>
          </div>
          <button class="small-action" type="button" data-topic-room-close>关闭</button>
        </header>
        <div class="topic-reading-grid">
          <section class="topic-reading-panel">
            <strong>阅读顺序</strong>
            ${renderTopicReadingSteps(sourcePackage, selectedCount)}
            <p class="topic-reading-note">阅读室只用于读来源和选择范围；候选来源未确认前不是证据，不会写入原始知识库。</p>
          </section>
          <section class="topic-reading-panel">
            <strong>来源范围</strong>
            <p>${escapeHtml(selectedMeta)}</p>
            <div class="topic-reading-sources">
              ${renderTopicReadingSourceGroup("已采纳证据", accepted, "accepted", selectedKeys)}
              ${renderTopicReadingSourceGroup("候选/待确认来源", candidates, "candidate", selectedKeys)}
              ${renderTopicReadingSourceGroup("已排除来源", excluded, "excluded", selectedKeys)}
            </div>
          </section>
        </div>
        <div class="topic-reading-actions">
          <button class="small-action" type="button" data-topic-reading-continue="${escapeAttribute(group.id || "")}"${continueDisabled ? " disabled" : ""}>${escapeHtml(continueText)}</button>
          ${sourcePackage.selectedDossierId ? `<button class="small-action" type="button" data-topic-reading-dossier="${escapeAttribute(sourcePackage.selectedDossierId)}">打开档案确认来源</button>` : ""}
        </div>`;
        bindTopicReadingRoomEvents();
      }

      function renderTopicReadingSteps(sourcePackage, selectedCount) {
        const hasAccepted = Array.isArray(sourcePackage.accepted) && sourcePackage.accepted.length > 0;
        const hasCandidates = Array.isArray(sourcePackage.candidates) && sourcePackage.candidates.length > 0;
        const steps = hasAccepted
          ? [
              { status: "current", label: "回看已采纳证据", text: "先读已经人工标记有用的原文证据。" },
              { status: selectedCount ? "current" : "todo", label: "限定来源继续追问", text: "只把已选来源带入下一轮，不把候选列表整体当成结论。" },
              { status: "todo", label: "补产品材料验证", text: "再把自己的产品数据放进来验证是否适用。" },
            ]
          : hasCandidates
            ? [
                { status: "current", label: "先确认候选来源", text: "逐条打开候选来源，选择你要核对的材料。" },
                { status: selectedCount ? "current" : "blocked", label: "再继续追问", text: "没有选择来源前，不会默认学习全部候选来源。" },
                { status: "todo", label: "采纳后再形成结论", text: "正式结论必须回到档案里采纳证据。" },
              ]
            : [
                { status: "current", label: "先补来源", text: "这个主题缺少可读来源，继续前先重新检索。" },
                { status: "blocked", label: "暂不生成结论", text: "没有来源支撑时只保留问题，不产出正式学习结论。" },
              ];
        return `<div class="topic-reading-steps">${steps.map((step) => `<div class="topic-reading-step" data-status="${escapeAttribute(step.status)}"><strong>${escapeHtml(step.label)}</strong><span>${escapeHtml(step.text)}</span></div>`).join("")}</div>`;
      }

      function renderTopicReadingSourceGroup(title, items, kind, selectedKeys) {
        const safeItems = Array.isArray(items) ? items.filter(Boolean).slice(0, 6) : [];
        if (!safeItems.length) return `<div class="topic-reading-source" data-kind="${escapeAttribute(kind)}"><strong>${escapeHtml(title)}</strong><span>${kind === "accepted" ? "暂无已采纳证据。" : kind === "candidate" ? "暂无候选来源。" : "暂无已排除来源。"}</span></div>`;
        return `<div class="topic-reading-sources" data-kind="${escapeAttribute(kind)}">
          <strong>${escapeHtml(title)}</strong>
          ${safeItems.map((item) => renderTopicReadingSource(item, kind, selectedKeys)).join("")}
        </div>`;
      }

      function renderTopicReadingSource(item, kind, selectedKeys) {
        const keys = sourceKeysForTopicSource(item);
        const selected = kind !== "excluded" && keys.some((key) => selectedKeys.has(key));
        const title = item.title || item.label || item.sourceKey || "未命名来源";
        const meta = [item.author, item.date, item.dossierTitle, kind === "candidate" ? "候选/待确认" : kind === "accepted" ? "已采纳" : "已排除"].filter(Boolean).join(" · ");
        const text = item.quote || item.excerpt || item.label || "";
        const safeUrl = safeSourceUrl(item.sourceUrl);
        const link = safeUrl ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">原文</a>` : "";
        const openButton = item.dossierId ? `<button class="small-action" type="button" data-topic-reading-dossier="${escapeAttribute(item.dossierId)}">查看档案</button>` : "";
        const contextButton = `<button class="small-action" type="button" data-source-context-payload="${escapeAttribute(JSON.stringify(sourceContextPayload(item)))}" data-source-context-quote="${escapeAttribute(text)}">原文上下文</button>`;
        const checkbox = kind === "excluded"
          ? ""
          : `<input type="checkbox" data-topic-source-toggle="${escapeAttribute(keys[0] || "")}" ${selected ? "checked" : ""} aria-label="${escapeAttribute(title)}">`;
        const body = `<div>
          <strong>${escapeHtml(title)}</strong>
          ${meta ? `<span>${escapeHtml(meta)}</span>` : ""}
          ${text ? `<p>${escapeHtml(text)}</p>` : ""}
          <div class="workbench-actions">${contextButton}${openButton}${link}</div>
          <div class="source-context-slot"></div>
        </div>`;
        return `<article class="topic-reading-source" data-kind="${escapeAttribute(kind)}">
          ${checkbox ? `<label>${checkbox}${body}</label>` : body}
        </article>`;
      }

      function bindTopicReadingRoomEvents() {
        if (!topicReadingRoomEl) return;
        bindSourceContextEvents(topicReadingRoomEl);
        topicReadingRoomEl.querySelectorAll("[data-topic-room-close]").forEach((button) => {
          button.addEventListener("click", () => {
            selectedTopicRoomId = "";
            renderTopicReadingRoom();
          });
        });
        topicReadingRoomEl.querySelectorAll("[data-topic-source-toggle]").forEach((input) => {
          input.addEventListener("change", () => {
            setTopicSourceSelected(selectedTopicRoomId, input.dataset.topicSourceToggle || "", input.checked);
          });
        });
        topicReadingRoomEl.querySelectorAll("[data-topic-reading-continue]").forEach((button) => {
          button.addEventListener("click", () => continueTopicReading(button.dataset.topicReadingContinue || ""));
        });
        topicReadingRoomEl.querySelectorAll("[data-topic-reading-dossier]").forEach((button) => {
          button.addEventListener("click", () => openTopicReadingDossier(button.dataset.topicReadingDossier || ""));
        });
      }

      function ensureTopicReadingSelection(group) {
        if (!group?.id) return new Set();
        const packageSources = group.sourcePackage || {};
        const accepted = Array.isArray(packageSources.accepted) ? packageSources.accepted : [];
        const candidates = Array.isArray(packageSources.candidates) ? packageSources.candidates : [];
        const validKeys = new Set(uniqueSourceKeysForTopicSources([...accepted, ...candidates]));
        if (!topicReadingSelections.has(group.id)) {
          topicReadingSelections.set(group.id, new Set(uniqueSourceKeysForTopicSources(accepted)));
          return topicReadingSelections.get(group.id);
        }
        const current = topicReadingSelections.get(group.id) || new Set();
        for (const key of [...current]) {
          if (!validKeys.has(key)) current.delete(key);
        }
        return current;
      }

      function setTopicSourceSelected(topicId, sourceKey, selected) {
        const group = topicGroupById(topicId);
        if (!group || !sourceKey) return;
        const current = ensureTopicReadingSelection(group);
        const source = topicSourcesForGroup(group).find((item) => sourceKeysForTopicSource(item).includes(sourceKey));
        const keys = sourceKeysForTopicSource(source || { sourceKey });
        keys.forEach((key) => {
          if (selected) current.add(key);
          else current.delete(key);
        });
        renderTopicReadingRoom();
      }

      function continueTopicReading(topicId) {
        const group = topicGroupById(topicId);
        if (!group?.sourcePackage) return;
        const selectedKeys = [...ensureTopicReadingSelection(group)];
        if (!selectedKeys.length) return;
        const sources = topicSourcesForGroup(group).filter((item) => sourceKeysForTopicSource(item).some((key) => selectedKeys.includes(key)));
        const packageControls = group.sourcePackage.sourceControls || {};
        sourceControls = normalizeSourceControls({
          excludedSourceKeys: [...(sourceControls.excludedSourceKeys || []), ...(packageControls.excludedSourceKeys || [])],
          allowedAuthors: packageControls.allowedAuthors || [],
          allowedSourceKeys: selectedKeys,
          selectedSources: sources,
        });
        saveSourceControls();
        renderSourceScopeControls();
        fillDossierPrompt(buildTopicReadingPrompt(group, sources));
      }

      function buildTopicReadingPrompt(group, sources) {
        const safeSources = Array.isArray(sources) ? sources.filter(Boolean).slice(0, 6) : [];
        const sourceLines = safeSources.map((source, index) => `${index + 1}. ${source.author || "未知作者"}《${source.title || source.label || "未命名来源"}》${source.kind === "candidate" ? "（候选，先核对）" : "（已采纳）"}`);
        return [
          `请围绕「${group.label || "这个主题"}」继续学习。`,
          `本次只使用我在来源阅读室选择的 ${safeSources.length} 个来源；候选来源先核对，不能直接当成已采纳证据。`,
          sourceLines.length ? "已选来源：" : "",
          ...sourceLines,
          "请区分作者原文、系统整理和我的业务验证，最后给出下一步该读哪篇或该补什么材料。",
        ].filter(Boolean).join("\n");
      }

      function openTopicReadingDossier(id) {
        openDossierSourceSection(id).catch((error) => {
          notesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        });
      }

      function topicSourcesForGroup(group) {
        const sourcePackage = group?.sourcePackage || {};
        return [
          ...(Array.isArray(sourcePackage.accepted) ? sourcePackage.accepted : []),
          ...(Array.isArray(sourcePackage.candidates) ? sourcePackage.candidates : []),
        ];
      }

      function sourceKeysForTopicSource(source) {
        if (!source || typeof source !== "object") return [];
        return [...new Set([
          source.sourceKey,
          source.sourcePath,
          source.sourceUrl,
          [source.author, source.date, source.title].filter(Boolean).join("|"),
        ].filter((key) => typeof key === "string" && key.trim()).map((key) => key.trim()))];
      }

      function uniqueSourceKeysForTopicSources(sources) {
        const keys = [];
        (Array.isArray(sources) ? sources : []).forEach((source) => {
          sourceKeysForTopicSource(source).forEach((key) => {
            if (!keys.includes(key)) keys.push(key);
          });
        });
        return keys.slice(0, 50);
      }

      function renderClaimSupportBlock(claims, fallbackItems) {
        const safeClaims = Array.isArray(claims) ? claims.filter((item) => item && item.claim).slice(0, 3) : [];
        if (!safeClaims.length) {
          return renderTopicBlock("已证据支撑", Array.isArray(fallbackItems) && fallbackItems.length ? fallbackItems : ["还没有能明确归入“已证据支撑”的主题结论。"]);
        }
        return `<section class="topic-block">
          <strong>已证据支撑</strong>
          <div class="claim-support-list">
            ${safeClaims.map((item) => renderClaimSupportItem(item)).join("")}
          </div>
        </section>`;
      }

      function renderClaimSupportItem(item) {
        const evidence = Array.isArray(item.evidence) ? item.evidence.slice(0, 3) : [];
        const evidenceRows = evidence.length
          ? evidence.map((source) => {
              const safeUrl = safeSourceUrl(source.sourceUrl);
              const link = safeUrl ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">原文链接</a>` : "";
              return `<p class="claim-support-evidence"><span>${escapeHtml(source.label || source.title || "来源")}</span>${escapeHtml(source.quote || "暂无摘录")}${link ? `<br>${link}` : ""}</p>`;
            }).join("")
          : "<p>暂无可展开摘录。</p>";
        return `<div class="claim-support-item">
          <details>
            <summary>${escapeHtml(item.supportLabel || "已采纳原文支撑")} · ${escapeHtml(item.claim || "")}</summary>
            <p>证据 ${Number(item.evidenceCount || evidence.length)} 条 · ${escapeHtml(item.dossierTitle || "学习档案")}</p>
            ${evidenceRows}
            ${item.boundary ? `<p>${escapeHtml(item.boundary)}</p>` : ""}
            ${item.dossierId ? `<button class="small-action" type="button" data-topic-dossier-id="${escapeAttribute(item.dossierId)}">打开对应档案</button>` : ""}
          </details>
        </div>`;
      }

      function renderTopicActionBlock(actions) {
        const safeActions = Array.isArray(actions) ? actions.filter(Boolean).slice(0, 4) : [];
        return `<section class="topic-block">
          <strong>下一步追问</strong>
          ${safeActions.length ? safeActions.map((item) => `<button class="small-action" type="button" data-overview-prompt="${escapeAttribute(item)}">${escapeHtml(item)}</button>`).join("") : "<span>暂无下一步，先保存一次相关问答。</span>"}
        </section>`;
      }

      function renderTopicDossierBlock(dossiersForTopic) {
        const safeDossiers = Array.isArray(dossiersForTopic) ? dossiersForTopic.filter((item) => item && item.id).slice(0, 4) : [];
        return `<section class="topic-block">
          <strong>档案入口</strong>
          ${safeDossiers.length ? safeDossiers.map((item) => `<button class="small-action" type="button" data-overview-view="${escapeAttribute(item.id)}">${escapeHtml(item.title || item.question || "打开档案")}</button>`).join("") : "<span>暂无档案入口。</span>"}
        </section>`;
      }

      function renderTopicProductBlock(products) {
        const safeProducts = Array.isArray(products) ? products.filter((item) => item && item.title).slice(0, 4) : [];
        return `<section class="topic-block">
          <strong>相关产物</strong>
          ${safeProducts.length ? `<ul>${safeProducts.map((item) => `<li>${escapeHtml(item.title)} · ${escapeHtml(learningProductTypeLabel(item.type))}</li>`).join("")}</ul>` : "<span>暂无相关学习产物。</span>"}
        </section>`;
      }

      function renderLearningProduct(product) {
        const body = product.body ? `<p>${escapeHtml(product.body)}</p>` : "";
        const boundary = product.boundary ? `<p>${escapeHtml(product.boundary)}</p>` : "";
        return `<article class="learning-product" data-product-type="${escapeAttribute(product.type || "item")}">
          <header>
            <strong>${escapeHtml(product.title || "学习产物")}</strong>
            <span>${escapeHtml(learningProductTypeLabel(product.type))}</span>
          </header>
          ${body}
          ${renderLearningProductBody(product)}
          ${boundary}
        </article>`;
      }

      function renderLearningProductBody(product) {
        if (product.type === "study_guide") return renderStudyGuideProduct(product);
        if (product.type === "evidence_report") return renderEvidenceReportProduct(product);
        if (product.type === "evidence_needed") return renderEvidenceNeededProduct(product);
        if (Array.isArray(product.sections) && product.sections.length) {
          return product.sections.slice(0, 3).map((section) => {
            const items = Array.isArray(section.items) ? section.items.slice(0, 4) : [];
            return `<div><strong>${escapeHtml(section.title || "段落")}</strong>${items.length ? `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}</div>`;
          }).join("");
        }
        if (Array.isArray(product.questions) && product.questions.length) {
          return `<ul>${product.questions.slice(0, 5).map((item) => `<li>${escapeHtml(item.question || "")}${item.answerHint ? `：${escapeHtml(item.answerHint)}` : ""}</li>`).join("")}</ul>`;
        }
        if (Array.isArray(product.cards) && product.cards.length) {
          return `<ul>${product.cards.slice(0, 5).map((card) => `<li>${escapeHtml(card.front || "")} ｜ ${escapeHtml(card.back || "")}</li>`).join("")}</ul>`;
        }
        if (Array.isArray(product.records) && product.records.length) {
          return `<ul>${product.records.slice(0, 4).map((record) => `<li>${escapeHtml(record.outcome || "记录")}：${escapeHtml(record.summary || "")}</li>`).join("")}</ul>`;
        }
        if (Array.isArray(product.actions) && product.actions.length) {
          return `<ul>${product.actions.slice(0, 4).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
        }
        return "";
      }

      function renderEvidenceNeededProduct(product) {
        const actions = Array.isArray(product.actions) ? product.actions.filter(Boolean).slice(0, 4) : [];
        const candidateCount = Number(product.candidateSourceCount || 0);
        const sourceSummary = product.sourceSummary || (candidateCount > 0
          ? `当前有 ${candidateCount} 条候选来源待确认。`
          : "当前还没有可直接确认的候选来源。");
        const dossierButton = product.selectedDossierId
          ? `<button class="small-action" type="button" data-evidence-needed-dossier="${escapeAttribute(product.selectedDossierId)}">打开档案确认来源</button>`
          : "";
        const roomButton = product.topicId
          ? `<button class="small-action" type="button" data-topic-room-open="${escapeAttribute(product.topicId)}">打开来源阅读室</button>`
          : "";
        const promptButton = product.nextPrompt
          ? `<button class="small-action" type="button" data-overview-prompt="${escapeAttribute(product.nextPrompt)}">用候选来源重新核对</button>`
          : "";
        return `<div class="evidence-needed-product">
          <p>${escapeHtml(sourceSummary)}</p>
          ${actions.length ? `<ul>${actions.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}
          <div class="workbench-actions">${dossierButton}${roomButton}${promptButton}</div>
          <p>候选来源不会自动成为证据；只有你在档案里确认有用的原文，才会进入正式讲义。</p>
        </div>`;
      }

      function renderStudyGuideProduct(product) {
        const claims = Array.isArray(product.sourceBackedClaims) ? product.sourceBackedClaims.slice(0, 4) : [];
        const authors = Array.isArray(product.authorPerspectives) ? product.authorPerspectives.slice(0, 4) : [];
        const checklist = Array.isArray(product.executionChecklist) ? product.executionChecklist.slice(0, 6) : [];
        const questions = Array.isArray(product.reviewQuestions) ? product.reviewQuestions.slice(0, 5) : [];
        const controls = product.sourceControls || {};
        const handoutMarkdown = product.handoutMarkdown || "";
        const handoutFilename = product.downloadFilename || `${product.topicLabel || "学习讲义"}.md`;
        const promptAttrs = [
          product.nextPrompt ? `data-learning-product-prompt="${escapeAttribute(product.nextPrompt)}"` : "",
          `data-source-package-excluded="${escapeAttribute(JSON.stringify(controls.excludedSourceKeys || []))}"`,
          `data-source-package-authors="${escapeAttribute(JSON.stringify(controls.allowedAuthors || []))}"`,
          `data-source-package-allowed="${escapeAttribute(JSON.stringify(controls.allowedSourceKeys || []))}"`,
          `data-source-package-selected="${escapeAttribute(JSON.stringify(controls.selectedSources || []))}"`,
        ].filter(Boolean).join(" ");
        const promptButton = product.nextPrompt
          ? `<button class="small-action" type="button" ${promptAttrs}>基于讲义追问并回到原文核对</button>`
          : "";
        const handoutButtons = handoutMarkdown
          ? `<button class="small-action" type="button" data-learning-product-copy="${escapeAttribute(handoutMarkdown)}">复制主题学习讲义</button>
            <button class="small-action" type="button" data-learning-product-download="${escapeAttribute(handoutMarkdown)}" data-learning-product-filename="${escapeAttribute(handoutFilename)}">导出 Markdown</button>`
          : "";
        return `<div class="study-guide-product">
          ${claims.length ? `<section class="source-backed-claims"><strong>来源支撑结论</strong>${claims.map(renderStudyGuideClaim).join("")}</section>` : ""}
          ${authors.length ? `<section class="study-guide-authors"><strong>作者视角</strong>${authors.map((item) => `<article class="overview-item"><strong>${escapeHtml(item.author || "未知作者")}</strong><span>${escapeHtml(item.summary || "")}</span><span>来源 ${Number(item.sourceCount || 0)} · 证据 ${Number(item.evidenceCount || 0)}</span></article>`).join("")}</section>` : ""}
          ${checklist.length ? `<section class="study-guide-checklist"><strong>执行清单</strong><ul>${checklist.map((item) => `<li>${escapeHtml(item.done ? "已完成" : "待处理")} · ${escapeHtml(item.label || "")}${item.reason ? `：${escapeHtml(item.reason)}` : ""}</li>`).join("")}</ul></section>` : ""}
          ${questions.length ? `<section class="study-guide-questions"><strong>复习追问</strong><ul>${questions.map((item) => `<li>${escapeHtml(item.question || "")}${item.sourceHint ? `｜${escapeHtml(item.sourceHint)}` : ""}${item.prompt ? ` <button class="small-action" type="button" data-learning-product-prompt="${escapeAttribute(item.prompt)}">填入追问</button>` : ""}</li>`).join("")}</ul></section>` : ""}
          ${handoutButtons || promptButton ? `<div class="workbench-actions">${handoutButtons}${promptButton}</div>` : ""}
          <p>${escapeHtml(product.boundary || "只有已采纳原文证据可以支撑结论；用户业务材料只用于验证。")}</p>
        </div>`;
      }

      function renderStudyGuideClaim(item) {
        const evidence = Array.isArray(item.evidence) ? item.evidence.slice(0, 2) : [];
        const evidenceRows = evidence.length
          ? `<div class="study-guide-evidence-list">${evidence.map((entry) => renderStudyGuideEvidence(entry, item)).join("")}</div>`
          : "";
        return `<article class="overview-item source-backed-claim">
          <div class="overview-item-head">
            <strong>${escapeHtml(item.claim || "来源支撑结论")}</strong>
            <span>${escapeHtml(item.supportLabel || "来源支撑")}</span>
          </div>
          ${evidenceRows}
          ${item.boundary ? `<span>${escapeHtml(item.boundary)}</span>` : ""}
        </article>`;
      }

      function renderStudyGuideEvidence(entry, claim = {}) {
        const payload = topicStudyGuideSourcePayload(entry, claim);
        const payloadJson = JSON.stringify(payload);
        const contextPayload = JSON.stringify(sourceContextPayload(entry));
        const safeUrl = safeSourceUrl(entry.sourceUrl);
        const link = safeUrl ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">原文链接</a>` : "";
        const focusButton = payload.dossierId
          ? `<button class="small-action" type="button" data-topic-source-focus="${escapeAttribute(payloadJson)}">定位来源</button>`
          : "";
        const contextButton = `<button class="small-action" type="button" data-source-context-payload="${escapeAttribute(contextPayload)}" data-source-context-quote="${escapeAttribute(entry.quote || "")}">原文上下文</button>`;
        return `<article class="study-guide-evidence">
          <strong>${escapeHtml(entry.label || entry.title || "来源")}</strong>
          <p>${escapeHtml(entry.quote || "")}</p>
          <div class="workbench-actions">${focusButton}${contextButton}${link}</div>
          <div class="source-context-slot"></div>
        </article>`;
      }

      function renderEvidenceReportProduct(product) {
        const claimAudits = Array.isArray(product.claimAudits) ? product.claimAudits.slice(0, 5) : [];
        const sourceLedger = Array.isArray(product.sourceLedger) ? product.sourceLedger.slice(0, 8) : [];
        const controls = product.sourceControls || {};
        const promptAttrs = [
          product.nextPrompt ? `data-learning-product-prompt="${escapeAttribute(product.nextPrompt)}"` : "",
          `data-source-package-excluded="${escapeAttribute(JSON.stringify(controls.excludedSourceKeys || []))}"`,
          `data-source-package-authors="${escapeAttribute(JSON.stringify(controls.allowedAuthors || []))}"`,
          `data-source-package-allowed="${escapeAttribute(JSON.stringify(controls.allowedSourceKeys || []))}"`,
          `data-source-package-selected="${escapeAttribute(JSON.stringify(controls.selectedSources || []))}"`,
        ].filter(Boolean).join(" ");
        const promptButton = product.nextPrompt
          ? `<button class="small-action" type="button" ${promptAttrs}>基于报告追问并回到原文核对</button>`
          : "";
        return `<div class="evidence-report">
          <strong>可审计学习报告</strong>
          ${claimAudits.length ? `<section class="claim-audit-list">${claimAudits.map(renderEvidenceReportClaim).join("")}</section>` : "<p>暂无可审计结论。</p>"}
          ${sourceLedger.length ? `<section class="source-ledger-list"><strong>来源总账</strong>${sourceLedger.map(renderSourceLedgerItem).join("")}</section>` : ""}
          ${promptButton ? `<div class="workbench-actions">${promptButton}</div>` : ""}
          <p>${escapeHtml(product.boundary || "系统报告不能替代原文；业务材料和实验复盘也不会变成作者证据。")}</p>
        </div>`;
      }

      function renderEvidenceReportClaim(item) {
        const evidence = Array.isArray(item.evidence) ? item.evidence.slice(0, 3) : [];
        const gaps = Array.isArray(item.gaps) ? item.gaps.slice(0, 4) : [];
        return `<article class="evidence-report-claim">
          <div class="overview-item-head">
            <strong>${escapeHtml(item.claim || "待审计结论")}</strong>
            <span>${escapeHtml(item.verdictLabel || "有原文支撑")}</span>
          </div>
          ${evidence.length ? `<div class="study-guide-evidence-list">${evidence.map((entry) => renderEvidenceReportEvidence(entry, item)).join("")}</div>` : ""}
          ${gaps.length ? `<div class="claim-audit-gaps"><strong>还不能证明</strong><ul>${gaps.map((gap) => `<li>${escapeHtml(gap)}</li>`).join("")}</ul></div>` : ""}
          ${item.nextPrompt ? `<button class="small-action" type="button" data-learning-product-prompt="${escapeAttribute(item.nextPrompt)}">围绕这条结论追问</button>` : ""}
          ${item.boundary ? `<p>${escapeHtml(item.boundary)}</p>` : ""}
        </article>`;
      }

      function renderEvidenceReportEvidence(entry, claim = {}) {
        const payload = topicStudyGuideSourcePayload(entry, claim);
        const payloadJson = JSON.stringify(payload);
        const contextPayload = JSON.stringify(sourceContextPayload(entry));
        const safeUrl = safeSourceUrl(entry.sourceUrl);
        const link = safeUrl ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">原文链接</a>` : "";
        const focusButton = payload.dossierId
          ? `<button class="small-action" type="button" data-evidence-report-source-focus="${escapeAttribute(payloadJson)}">定位来源</button>`
          : "";
        const contextButton = `<button class="small-action" type="button" data-source-context-payload="${escapeAttribute(contextPayload)}" data-source-context-quote="${escapeAttribute(entry.quote || "")}">原文上下文</button>`;
        return `<article class="evidence-report-evidence">
          <strong>${escapeHtml(entry.label || entry.title || "来源")}</strong>
          <p>${escapeHtml(entry.quote || "")}</p>
          <div class="workbench-actions">${focusButton}${contextButton}${link}</div>
          <div class="source-context-slot"></div>
        </article>`;
      }

      function renderSourceLedgerItem(item) {
        const payload = topicStudyGuideSourcePayload(item, item);
        const payloadJson = JSON.stringify(payload);
        const contextPayload = JSON.stringify(sourceContextPayload(item));
        const claims = Array.isArray(item.claims) ? item.claims.slice(0, 3) : [];
        const focusButton = payload.dossierId
          ? `<button class="small-action" type="button" data-evidence-report-source-focus="${escapeAttribute(payloadJson)}">定位来源</button>`
          : "";
        const contextButton = `<button class="small-action" type="button" data-source-context-payload="${escapeAttribute(contextPayload)}" data-source-context-quote="${escapeAttribute(item.quote || "")}">原文上下文</button>`;
        return `<article class="source-ledger-item">
          <strong>${escapeHtml(item.title || item.label || "来源")}</strong>
          <span>${escapeHtml([item.author, item.date, `${Number(item.claimCount || 0)} 条结论`].filter(Boolean).join(" · "))}</span>
          ${claims.length ? `<ul>${claims.map((claim) => `<li>${escapeHtml(claim)}</li>`).join("")}</ul>` : ""}
          <div class="workbench-actions">${focusButton}${contextButton}</div>
          <div class="source-context-slot"></div>
        </article>`;
      }

      function topicStudyGuideSourcePayload(entry = {}, claim = {}) {
        return {
          dossierId: entry.dossierId || claim.dossierId || "",
          sourceKey: entry.sourceKey || sourceKeyForSource(entry),
          sourcePath: entry.sourcePath || "",
          sourceUrl: entry.sourceUrl || "",
          author: entry.author || "",
          date: entry.date || "",
          title: entry.title || entry.label || "",
          quote: entry.quote || "",
        };
      }

      async function focusTopicStudyGuideSource(value) {
        const payload = parseJsonAttribute(value);
        if (!payload?.dossierId) return;
        await showDossierDetails(payload.dossierId);
        focusDossierSourceByIdentity(payload);
      }

      async function openDossierSourceSection(id) {
        if (!id) return;
        await showDossierDetails(id);
        const sourceSection = dossierDetailEl.querySelector("[data-dossier-source-section]");
        if (!sourceSection) return;
        sourceSection.scrollIntoView({ behavior: "smooth", block: "start" });
        sourceSection.classList.add("is-highlighted");
        window.setTimeout(() => sourceSection.classList.remove("is-highlighted"), 1800);
      }

      function focusDossierSourceByIdentity(identity = {}) {
        const sourceSection = dossierDetailEl.querySelector("[data-dossier-source-section]");
        const sources = [...dossierDetailEl.querySelectorAll("[data-dossier-source-key]")];
        const target = sources.find((source) => dossierSourceElementMatches(source, identity)) || sourceSection;
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("is-highlighted");
        window.setTimeout(() => target.classList.remove("is-highlighted"), 1800);
      }

      function dossierSourceElementMatches(element, identity = {}) {
        const keys = [identity.sourceKey, identity.sourcePath, identity.sourceUrl].filter(Boolean).map(String);
        return keys.some((key) =>
          key === element.dataset.dossierSourceKey ||
          key === element.dataset.dossierSourcePath ||
          key === element.dataset.dossierSourceUrl
        );
      }

      function handleLearningProductPrompt(button) {
        applySourcePackageControls(button);
        fillDossierPrompt(button.dataset.learningProductPrompt || "");
      }

      async function copyStudyHandout(button) {
        const markdown = button.dataset.learningProductCopy || "";
        if (!markdown) return;
        try {
          await writeClipboardText(markdown);
          notesEl.innerHTML = `<p class="status">主题学习讲义已复制。讲义里的作者证据、系统整理和用户材料已分区。</p>`;
        } catch (error) {
          notesEl.innerHTML = `<p class="error">复制失败：${escapeHtml(error.message || "浏览器暂时不允许写入剪贴板。")}</p>`;
        }
      }

      async function writeClipboardText(text) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        const ok = document.execCommand("copy");
        textarea.remove();
        if (!ok) throw new Error("复制命令被浏览器拒绝。");
      }

      function downloadStudyHandoutMarkdown(button) {
        const markdown = button.dataset.learningProductDownload || "";
        if (!markdown) return;
        const filename = sanitizeDownloadFilename(button.dataset.learningProductFilename || "学习讲义.md");
        const blob = new Blob([markdown], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 0);
        notesEl.innerHTML = `<p class="status">已导出 Markdown 讲义：${escapeHtml(filename)}。</p>`;
      }

      function sanitizeDownloadFilename(value) {
        const name = String(value || "学习讲义.md").replace(/[\\/:*?"<>|]+/g, "-").trim();
        return /\.(md|json|csv)$/i.test(name) ? name : `${name || "学习讲义"}.md`;
      }

      function learningProductTypeLabel(type) {
        if (type === "study_guide") return "指南";
        if (type === "evidence_report") return "报告";
        if (type === "evidence_needed") return "补证据";
        if (type === "faq_pack") return "追问包";
        if (type === "flashcards") return "复习卡";
        if (type === "research_brief") return "简报";
        if (type === "experiment_digest") return "实验";
        return "产物";
      }

      function topicPathStatusLabel(status) {
        if (status === "done") return "已完成";
        if (status === "current") return "当前";
        if (status === "blocked") return "等待";
        return "待处理";
      }

      function studyMaterialTypeLabel(type) {
        if (type === "brief") return "摘要";
        if (type === "evidence_notes") return "证据";
        if (type === "faq") return "问题";
        if (type === "review_cards") return "复习";
        return "辅助";
      }

      function renderResearchMission(mission) {
        const metrics = [
          `证据 ${Number(mission.evidenceCount || 0)}`,
          `材料 ${Number(mission.readyMaterialRecords || 0)}/${Number(mission.materialRecords || 0)}`,
          `实验 ${Number(mission.positiveExperimentResults || 0)}/${Number(mission.experimentResults || 0)}`,
          `复盘 ${Number(mission.reviewProgress?.completed || 0)}/${Number(mission.reviewProgress?.total || 0)}`,
        ];
        return `<article class="mission-card" data-stage="${escapeAttribute(mission.stage || "unknown")}">
          <div class="mission-head">
            <span class="mission-stage">${escapeHtml(mission.stageLabel || "研究任务")}</span>
            <strong>${escapeHtml(mission.title || mission.question || "学习档案")}</strong>
          </div>
          <p>${escapeHtml(mission.reason || "")}</p>
          ${mission.boundary ? `<p>${escapeHtml(mission.boundary)}</p>` : ""}
          <span>范围：${escapeHtml(mission.sourceScope || "全部作者")}</span>
          <div class="mission-metrics">${metrics.map((item) => `<span>${escapeHtml(item)}</span>`).join("")}</div>
          <div class="workbench-actions">
            <button class="small-action" type="button" data-overview-view="${escapeAttribute(mission.id || "")}">打开任务</button>
            ${mission.prompt ? `<button class="small-action" type="button" data-overview-prompt="${escapeAttribute(mission.prompt)}">${escapeHtml(mission.nextAction || "继续")}</button>` : ""}
          </div>
        </article>`;
      }

      function renderOverviewNextItem(item) {
        return `<article class="overview-item">
          <div class="overview-item-head">
            <strong>${escapeHtml(item.label || "下一步")}</strong>
            <span>${escapeHtml(reviewKindLabel(item.kind))}</span>
          </div>
          <span>${escapeHtml(item.dossierTitle || item.dossierQuestion || "")}</span>
          <div class="workbench-actions">
            <button class="small-action" type="button" data-overview-view="${escapeAttribute(item.dossierId || "")}">打开档案</button>
            ${item.prompt ? `<button class="small-action" type="button" data-overview-prompt="${escapeAttribute(item.prompt)}">填入追问</button>` : ""}
          </div>
        </article>`;
      }

      function renderOverviewGap(item) {
        return `<article class="overview-item">
          <div class="overview-item-head">
            <strong>${escapeHtml(item.title || "证据缺口")}</strong>
            <span>证据缺口</span>
          </div>
          <span>${escapeHtml(item.reason || "")}</span>
          <div class="workbench-actions">
            <button class="small-action" type="button" data-overview-view="${escapeAttribute(item.id || "")}">查看档案</button>
          </div>
        </article>`;
      }

      function renderDossierSynthesisGuide(synthesis, guide) {
        const data = guide || synthesis;
        if (!data || typeof data !== "object") return "";
        const status = data.status || synthesis?.status || "needs_source";
        const statusLabel = data.statusLabel || (status === "source_backed" ? "已有来源支撑" : status === "needs_review" ? "需要先复核" : "需要补来源");
        const coverage = data.coverage || synthesis?.sourceCoverage || {};
        const points = Array.isArray(data.points)
          ? data.points.slice(0, 6)
          : Array.isArray(synthesis?.points)
            ? synthesis.points.slice(0, 6).map((point) => ({
                id: point.id,
                label: point.label,
                text: point.text,
                basis: point.basis,
                supportCount: Array.isArray(point.support) ? point.support.length : 0,
                prompt: `请围绕这个综合要点继续学习：${point.label || point.text || ""}`,
              }))
            : [];
        const gaps = Array.isArray(data.gaps)
          ? data.gaps.slice(0, 6)
          : Array.isArray(synthesis?.gaps)
            ? synthesis.gaps.slice(0, 6)
            : [];
        const prompt = data.nextPrompt || points[0]?.prompt || gaps[0]?.prompt || "";
        const meta = [
          Number(coverage.evidenceCount || 0) ? `${Number(coverage.evidenceCount || 0)} 条证据` : "",
          Number(coverage.sourceCount || 0) ? `${Number(coverage.sourceCount || 0)} 个来源` : "",
          Number(coverage.authorCount || 0) ? `${Number(coverage.authorCount || 0)} 位作者` : "",
        ].filter(Boolean).join(" · ");
        const pointRows = points.length
          ? `<div class="synthesis-points">${points.map((point) => `<article class="synthesis-point">
              <strong>${escapeHtml(point.label || "综合要点")}</strong>
              ${point.text ? `<p>${escapeHtml(point.text)}</p>` : ""}
              <p class="synthesis-meta">${escapeHtml(point.basis || "系统综合不是作者原文证据。")} · 绑定来源 ${Number(point.supportCount || 0)} 条</p>
              ${point.prompt ? `<button class="evidence-button" type="button" data-dossier-synthesis-prompt="${escapeAttribute(point.prompt)}">围绕这点继续问</button>` : ""}
            </article>`).join("")}</div>`
          : `<p class="synthesis-meta">这份档案还没有可复习的综合要点。</p>`;
        const gapRows = gaps.length
          ? `<div class="synthesis-gaps">${gaps.map((item) => `<article class="synthesis-gap">
              <strong>${escapeHtml(item.label || "待补缺口")}</strong>
              <p>${escapeHtml(item.reason || "")}</p>
            </article>`).join("")}</div>`
          : "";
        const promptButton = prompt
          ? `<button class="dossier-fill-question" type="button" data-dossier-synthesis-prompt="${escapeAttribute(prompt)}">用综合讲义继续追问</button>`
          : "";
        return `<section class="synthesis-answer dossier-synthesis" data-status="${escapeAttribute(status)}" aria-label="档案综合讲义">
          <header>
            <div>
              <strong>综合讲义</strong>
              <p class="synthesis-meta">${escapeHtml(meta || "暂无可绑定原文证据")}</p>
            </div>
            <span class="synthesis-status">${escapeHtml(statusLabel)}</span>
          </header>
          ${data.summary ? `<p class="synthesis-summary">${escapeHtml(data.summary)}</p>` : ""}
          ${pointRows}
          ${gapRows}
          ${promptButton ? `<div class="synthesis-actions">${promptButton}</div>` : ""}
          <p class="synthesis-boundary">${escapeHtml(data.boundary || "系统综合不是作者原文证据；它只帮助复习和追问，不能替代已采纳来源摘录。")}</p>
        </section>`;
      }

      function renderDossierDiagnosisSnapshot(dossier) {
        const productSummary = dossier?.productInputSummary;
        const panel = dossier?.diagnosisPanel;
        if (!productSummary && !panel) return "";
        return `<section class="dossier-section dossier-diagnosis-snapshot">
          <strong>保存时的产品诊断快照</strong>
          ${renderDossierProductInputSnapshot(productSummary)}
          ${renderDossierPanelSnapshot(panel)}
        </section>`;
      }

      function renderDossierProductInputSnapshot(summary) {
        if (!summary || !Array.isArray(summary.facts)) return "";
        const facts = summary.facts.slice(0, 8);
        const sections = facts.length
          ? `<div class="product-summary-grid">${facts.map((section) => renderProductSummarySection(section)).join("")}</div>`
          : `<p>保存时没有识别到具体产品材料。</p>`;
        const missing = Array.isArray(summary.missing) ? summary.missing.filter(Boolean).slice(0, 8) : [];
        return `<div class="dossier-snapshot-block">
          <div class="dossier-snapshot-head">
            <strong>本轮产品输入</strong>
            <span>${escapeHtml(summary.summary || "用户提供的信息")}</span>
          </div>
          ${sections}
          ${missing.length ? `<p class="dossier-meta">仍缺材料：${escapeHtml(missing.join("、"))}</p>` : ""}
          <p class="dossier-meta">${escapeHtml(summary.caution || "这些是用户输入，不是资料证据。")}</p>
        </div>`;
      }

      function renderDossierPanelSnapshot(panel) {
        if (!panel || !Array.isArray(panel.tracks) || panel.tracks.length === 0) return "";
        const checked = panel.checked || {};
        const counts = diagnosisPanelCounts(panel);
        const tracks = panel.tracks
          .slice(0, 6)
          .map((track) => renderDossierDiagnosisTrack(track, checked))
          .join("");
        return `<div class="dossier-snapshot-block">
          <div class="dossier-snapshot-head">
            <strong>诊断排查面板</strong>
            <span>保存时排查记录 ${counts.checked}/${counts.total} 项，不是证据</span>
          </div>
          <div class="diagnosis-priority">
            <strong>${escapeHtml(panel.priority || "先确认最关键的问题入口")}</strong>
            <p>${escapeHtml(panel.reason || "")}</p>
          </div>
          <div class="diagnosis-tracks">${tracks}</div>
          ${panel.caution ? `<p class="dossier-meta">${escapeHtml(panel.caution)}</p>` : ""}
        </div>`;
      }

      function renderDossierDiagnosisTrack(track, checked = {}) {
        const checks = Array.isArray(track.checks) ? track.checks.slice(0, 6) : [];
        const checkRows = checks
          .map((check) => {
            const key = diagnosisCheckKey(track.id, check.id);
            const isChecked = checked[key] === true;
            return `<label>
              <input type="checkbox" disabled ${isChecked ? "checked" : ""} aria-label="${escapeAttribute(check.label || "检查项")}" />
              <span>${escapeHtml(check.label || "")}</span>
            </label>`;
          })
          .join("");
        const prompt = track.prompt
          ? `<button class="diagnosis-prompt" type="button" data-dossier-prompt="${escapeAttribute(track.prompt)}">用这项继续追问</button>`
          : "";
        return `<article class="diagnosis-track">
          <div class="diagnosis-track-head">
            <strong>${escapeHtml(track.label || "检查项")}</strong>
            ${track.level ? `<span class="diagnosis-level">${escapeHtml(track.level)}</span>` : ""}
          </div>
          ${track.why ? `<p>${escapeHtml(track.why)}</p>` : ""}
          <div class="diagnosis-checks">${checkRows}</div>
          ${prompt}
        </article>`;
      }

      function diagnosisPanelCounts(panel) {
        const total = (panel?.tracks || []).reduce((count, track) => count + (Array.isArray(track.checks) ? track.checks.length : 0), 0);
        const checked = Object.values(panel?.checked || {}).filter((value) => value === true).length;
        return { total, checked };
      }

      function renderDossierWorkbench(workbench, productIntake = null) {
        if (!workbench || !Array.isArray(workbench.checklist) || !Array.isArray(workbench.questionPack)) return "";
        const checklist = workbench.checklist.length
          ? `<div class="dossier-check-list">${workbench.checklist.map((item) => renderDossierCheckItem(item)).join("")}</div>`
          : `<p>这个档案还没有足够信息生成检查清单，先补充具体产品、页面或广告数据。</p>`;
        const questionPack = workbench.questionPack.length
          ? `<div class="dossier-question-pack">${workbench.questionPack.map((item) => renderDossierQuestion(item)).join("")}</div>`
          : `<p>暂无追问包。</p>`;
        const policy = workbench.evidencePolicy?.message || "检查清单只来自学习档案，不写入原始知识库。";
        return `<section class="dossier-workbench">
          <header>
            <strong>档案排查包</strong>
            <span>把已保存档案转成下一步操作；检查状态只在当前页面使用，不写入原始知识库。</span>
          </header>
          <p>${escapeHtml(workbench.summary || "")}</p>
          <p class="dossier-meta">${escapeHtml(policy)}</p>
          ${renderDossierValidationPack(workbench.validationPack)}
          <div class="dossier-grid">
            <section class="dossier-section">
              <strong>检查清单</strong>
              ${checklist}
            </section>
            <section class="dossier-section">
              <strong>下一轮追问包</strong>
              ${questionPack}
            </section>
          </div>
          ${renderBusinessVerificationRecords(workbench.businessVerification)}
          <section class="product-intake" data-product-material-section>
            <strong>粘贴你的产品信息</strong>
            <p>只做本地归类：识别你提供了哪些材料、还缺什么，并生成一条更精准的诊断追问。这些是你的产品材料，不是作者原文证据。</p>
            <textarea id="productIntakeText" placeholder="例如：主图是白底图，CTR 0.25%，CVR 5%，SP 广告 ACOS 45%，核心关键词 garlic press，竞品 ASIN B0XXXX...">${escapeHtml(selectedProductText)}</textarea>
            <button class="secondary" type="button" data-product-intake>整理产品信息</button>
            ${renderProductIntakeResult(productIntake)}
          </section>
        </section>`;
      }

      function renderDossierValidationPack(pack) {
        if (!pack || typeof pack !== "object") return "";
        const counts = pack.counts || {};
        const hypotheses = Array.isArray(pack.hypotheses) ? pack.hypotheses.slice(0, 3) : [];
        const dataRequests = Array.isArray(pack.dataRequests) ? pack.dataRequests.slice(0, 6) : [];
        const experiments = Array.isArray(pack.experiments) ? pack.experiments.slice(0, 3) : [];
        const decisionRules = Array.isArray(pack.decisionRules) ? pack.decisionRules.slice(0, 5) : [];
        const hypothesisRows = hypotheses.length
          ? `<ol>${hypotheses.map((item) => `<li>${escapeHtml(item.label || item.quote || "")}${item.sourceTitle ? ` <span class="dossier-meta">《${escapeHtml(item.sourceTitle)}》</span>` : ""}</li>`).join("")}</ol>`
          : `<p class="dossier-meta">暂无来源假设，先补作者来源。</p>`;
        const dataRows = dataRequests.length
          ? `<ul>${dataRequests.map((item) => `<li><strong>${escapeHtml(item.label || "")}</strong>${item.why ? `：${escapeHtml(item.why)}` : ""}</li>`).join("")}</ul>`
          : `<p class="dossier-meta">暂无待补数据。</p>`;
        const experimentRows = experiments.length
          ? `<ol>${experiments.map((item) => `<li><strong>${escapeHtml(item.title || "")}</strong>${Array.isArray(item.steps) && item.steps.length ? `：${escapeHtml(item.steps.join(" / "))}` : ""}</li>`).join("")}</ol>`
          : `<p class="dossier-meta">暂无小实验。</p>`;
        const ruleRows = decisionRules.length
          ? `<ul>${decisionRules.map((item) => `<li>如果 ${escapeHtml(item.if || "")}，则 ${escapeHtml(item.then || "")}</li>`).join("")}</ul>`
          : `<p class="dossier-meta">暂无判断规则。</p>`;
        const promptButton = pack.nextPrompt
          ? `<button class="dossier-fill-question" type="button" data-dossier-validation-prompt="${escapeAttribute(pack.nextPrompt)}">用任务包继续追问</button>`
          : "";
        const meta = [
          `来源：${pack.sourceStatusLabel || ""}`,
          `假设 ${Number(counts.hypotheses || hypotheses.length)}`,
          `数据 ${Number(counts.dataRequests || dataRequests.length)}`,
          `实验 ${Number(counts.experiments || experiments.length)}`,
          `材料 ${Number(counts.materialRecords || 0)}`,
          `复盘 ${Number(counts.experimentResults || 0)}`,
        ].filter((item) => !item.endsWith("：")).join(" · ");
        return `<section class="validation-pack dossier-validation-pack" data-status="${escapeAttribute(pack.status || "")}" aria-label="档案验证任务包">
          <header>
            <strong>验证任务包</strong>
            <span>验证进度：${escapeHtml(pack.statusLabel || "待验证")} · ${escapeHtml(meta)}</span>
          </header>
          <p>${escapeHtml(pack.summary || "把这个档案的回答推进成可验证的业务动作。")}</p>
          <div class="validation-grid">
            <div class="validation-block"><strong>待验证假设</strong>${hypothesisRows}</div>
            <div class="validation-block"><strong>要补的数据</strong>${dataRows}</div>
            <div class="validation-block"><strong>小实验</strong>${experimentRows}</div>
            <div class="validation-block"><strong>判断规则</strong>${ruleRows}</div>
          </div>
          ${promptButton ? `<div class="validation-actions">${promptButton}</div>` : ""}
          <p class="validation-boundary">${escapeHtml(pack.boundary || "任务包不是作者原文证据；只用于验证你的产品。")}</p>
        </section>`;
      }

      async function summarizeProductIntake() {
        if (!selectedDossier?.id) return;
        const input = dossierDetailEl.querySelector("#productIntakeText");
        selectedProductText = input?.value || "";
        const payload = await fetchJson(`/api/dossiers/${encodeURIComponent(selectedDossier.id)}/intake`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text: selectedProductText }),
        });
        selectedProductIntake = payload.intake || null;
        renderDossierDetail();
        dossierDetailEl.querySelector(".product-intake-result")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      async function saveBusinessVerification() {
        if (!selectedDossier?.id) return;
        const input = dossierDetailEl.querySelector("#productIntakeText");
        selectedProductText = input?.value || selectedProductText || "";
        if (selectedProductText.trim().length < 2) {
          selectedProductIntake = { error: "请先填写产品材料，再保存业务验证记录。" };
          renderDossierDetail();
          return;
        }
        const payload = await fetchJson(`/api/dossiers/${encodeURIComponent(selectedDossier.id)}/business-verification`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text: selectedProductText }),
        });
        selectedDossier = payload.dossier || selectedDossier;
        selectedDossierWorkbench = payload.workbench || selectedDossierWorkbench;
        selectedProductIntake = selectedDossierWorkbench?.businessVerification?.records?.[0] || selectedProductIntake;
        renderDossierDetail();
        await loadDossiers();
      }

      async function saveExperimentResult() {
        if (!selectedDossier?.id) return;
        if (selectedExperimentResultSaving) return;
        const input = dossierDetailEl.querySelector("#experimentResultText");
        selectedExperimentResultText = input?.value || selectedExperimentResultText || "";
        if (selectedExperimentResultText.trim().length < 2) {
          selectedExperimentResultError = "请先填写实验结果，再保存复盘记录。";
          renderDossierDetail();
          return;
        }
        selectedExperimentResultError = "";
        selectedExperimentResultSaving = true;
        renderDossierDetail();
        let payload;
        try {
          payload = await fetchJson(`/api/dossiers/${encodeURIComponent(selectedDossier.id)}/experiment-result`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text: selectedExperimentResultText }),
          });
        } catch (error) {
          selectedExperimentResultSaving = false;
          selectedExperimentResultError = error.message;
          renderDossierDetail();
          return;
        }
        selectedDossier = payload.dossier || selectedDossier;
        selectedDossierWorkbench = payload.workbench || selectedDossierWorkbench;
        selectedExperimentResultText = "";
        selectedExperimentResultError = "";
        selectedExperimentResultSaving = false;
        renderDossierDetail();
        await loadDossiers();
      }

      function renderProductIntakeResult(intake) {
        if (!intake) return "";
        if (intake.error) return `<p class="error">${escapeHtml(intake.error)}</p>`;
        const sections = (intake.sections || [])
          .map((section) => renderProductIntakeSection(section))
          .join("");
        const missing = (intake.missing || []).length
          ? `<p class="dossier-meta">仍缺：${escapeHtml((intake.missing || []).slice(0, 8).join("、"))}</p>`
          : "";
        return `<div class="product-intake-result">
          <p>${escapeHtml(intake.summary || "")}</p>
          <p class="dossier-meta">${escapeHtml(intake.caution || "")}</p>
          ${sections}
          ${missing}
          <div class="workbench-actions">
            <button class="dossier-fill-question" type="button" data-dossier-prompt="${escapeAttribute(intake.diagnosticPrompt || "")}">只填入问题</button>
            <button class="dossier-fill-question" type="button" data-dossier-context-prompt="${escapeAttribute(intake.diagnosticPrompt || "")}">带入档案和产品信息提问</button>
            <button class="dossier-fill-question" type="button" data-business-verification-save>保存为业务验证记录</button>
          </div>
        </div>`;
      }

      function renderBusinessVerificationRecords(verification) {
        if (!verification || !Array.isArray(verification.records)) return "";
        const records = verification.records.slice(0, 6);
        const coverage = renderBusinessVerificationCoverage(verification);
        const body = records.length
          ? records.map((record) => renderBusinessVerificationRecord(record)).join("")
          : `<p class="dossier-meta">还没有业务验证记录。这里保存的是你提供的产品材料，不是作者原文证据。</p>`;
        return `<section class="business-verification-records" aria-label="业务验证记录">
          <strong>业务验证记录</strong>
          <p class="dossier-meta">${escapeHtml(verification.summary || "把你的真实产品材料和学习档案分开保存。")}</p>
          ${records.length ? `<p class="dossier-meta">保存材料不代表已验证；下一步要看验证方案、补缺口或回填小实验结果。</p>` : ""}
          ${coverage}
          ${renderExperimentResults(verification.experimentResults)}
          ${body}
        </section>`;
      }

      function renderExperimentResults(results) {
        if (!results || !results.summary) return "";
        const records = Array.isArray(results.records) ? results.records.slice(0, 8) : [];
        return `<section class="experiment-result-panel" data-experiment-result-section aria-label="实验复盘">
          <strong>实验复盘</strong>
          <p class="dossier-meta">${escapeHtml(results.summary.message || "执行小实验后，把结果贴回来。")}</p>
          <div class="experiment-result-input">
            <textarea id="experimentResultText" placeholder="例如：主图 A/B 小实验 7 天，CTR 从 0.25% 到 0.42%，CVR 从 5% 到 5.2%，ACOS 从 45% 到 38%">${escapeHtml(selectedExperimentResultText)}</textarea>
            <button class="secondary" type="button" data-experiment-result-save ${selectedExperimentResultSaving ? "disabled" : ""}>${selectedExperimentResultSaving ? "保存中..." : "保存实验复盘"}</button>
          </div>
          ${selectedExperimentResultError ? `<p class="error">${escapeHtml(selectedExperimentResultError)}</p>` : ""}
          ${records.length ? `<div class="experiment-result-list">${records.map((record) => renderExperimentResultRecord(record)).join("")}</div>` : `<p class="dossier-meta">还没有实验复盘记录。</p>`}
          ${results.caution ? `<p class="dossier-meta">${escapeHtml(results.caution)}</p>` : ""}
        </section>`;
      }

      function renderExperimentResultRecord(record) {
        const metrics = Array.isArray(record.metrics) && record.metrics.length
          ? `<ul>${record.metrics.map((metric) => `<li>${escapeHtml(metric.label || `${metric.name}: ${metric.before} -> ${metric.after}`)}</li>`).join("")}</ul>`
          : `<p class="dossier-meta">缺少可识别的前后指标。</p>`;
        const missing = Array.isArray(record.missing) && record.missing.length
          ? `<p class="dossier-meta">仍缺：${escapeHtml(record.missing.slice(0, 6).join("、"))}</p>`
          : "";
        return `<article class="experiment-result-record" data-outcome="${escapeAttribute(record.outcome || "inconclusive")}">
          <strong>${escapeHtml(record.summary || "实验复盘")}</strong>
          ${metrics}
          ${missing}
          <p>${escapeHtml(record.nextAction || "")}</p>
          <p class="dossier-meta">${escapeHtml(record.caution || "这是用户回填的实验复盘，不是作者原文证据。")}</p>
        </article>`;
      }

      function renderBusinessVerificationCoverage(verification) {
        const coverage = verification.coverage || {};
        const dimensions = Array.isArray(verification.dimensions) ? verification.dimensions : [];
        if (dimensions.length === 0) return "";
        const nextPrompt = verification.nextDimension?.prompt
          ? `<button class="dossier-fill-question" type="button" data-dossier-context-prompt="${escapeAttribute(verification.nextDimension.prompt)}" data-dossier-product-text="${escapeAttribute(verification.nextDimension.productText || "")}">补最缺的一项</button>`
          : "";
        return `<div class="business-verification-coverage">
          <header>
            <strong>产品材料线索</strong>
            <span>${escapeHtml(String(coverage.ready || 0))}/${escapeHtml(String(coverage.total || dimensions.length))} 类 · 完整 ${escapeHtml(String(coverage.complete || 0))}/${escapeHtml(String(coverage.total || dimensions.length))}</span>
          </header>
          <div class="business-dimension-grid">
            ${dimensions.map((dimension) => renderBusinessDimensionCard(dimension)).join("")}
          </div>
          ${renderValidationPlan(verification.validationPlan)}
          ${verification.caution ? `<p class="dossier-meta">${escapeHtml(verification.caution)}</p>` : ""}
          ${nextPrompt ? `<div class="workbench-actions">${nextPrompt}</div>` : ""}
        </div>`;
      }

      function renderValidationPlan(plan) {
        if (!plan || !plan.priorityDimension) return "";
        const checklist = Array.isArray(plan.materialChecklist) ? plan.materialChecklist.slice(0, 5) : [];
        const gates = Array.isArray(plan.decisionGates) ? plan.decisionGates.slice(0, 4) : [];
        const experiments = Array.isArray(plan.experiments) ? plan.experiments.slice(0, 3) : [];
        return `<section class="validation-plan" data-validation-plan-section aria-label="下一步验证方案">
          <header>
            <strong>下一步验证方案</strong>
            <span>${escapeHtml(plan.summary || "")}</span>
          </header>
          <div class="validation-grid">
            <section class="validation-section">
              <strong>先补材料</strong>
              ${checklist.length ? checklist.map((item) => renderValidationItem(item, item.label, item.reason, "怎么补")).join("") : `<span>暂无补料清单。</span>`}
            </section>
            <section class="validation-section">
              <strong>判断门槛</strong>
              ${gates.length ? gates.map((gate) => renderValidationGate(gate)).join("") : `<span>暂无判断门槛。</span>`}
            </section>
            <section class="validation-section">
              <strong>小实验</strong>
              ${experiments.length ? experiments.map((experiment) => renderValidationExperiment(experiment)).join("") : `<span>暂无小实验。</span>`}
            </section>
          </div>
          ${plan.caution ? `<p class="dossier-meta">${escapeHtml(plan.caution)}</p>` : ""}
        </section>`;
      }

      function renderValidationItem(item, title, body, buttonText) {
        return `<article class="validation-item">
          <strong>${escapeHtml(title || "补充材料")}</strong>
          ${body ? `<p>${escapeHtml(body)}</p>` : ""}
          ${item.prompt ? `<button class="dossier-fill-question" type="button" data-dossier-context-prompt="${escapeAttribute(item.prompt)}">${escapeHtml(buttonText || "继续")}</button>` : ""}
        </article>`;
      }

      function renderValidationGate(gate) {
        const body = `观察信号：${gate.pass || ""}；警惕信号：${gate.fail || ""}`;
        const source = gate.boundary || (gate.source ? `来源性质：${gate.source}，需要用你的真实数据验证。` : "");
        return renderValidationItem(gate, gate.metric || "判断信号", `${body} ${source}`, "");
      }

      function renderValidationExperiment(experiment) {
        const body = [
          experiment.hypothesis ? `假设：${experiment.hypothesis}` : "",
          Array.isArray(experiment.steps) && experiment.steps.length ? `步骤：${experiment.steps.slice(0, 3).join(" / ")}` : "",
          experiment.successSignal ? `看什么：${experiment.successSignal}` : "",
        ].filter(Boolean).join(" ");
        return renderValidationItem(experiment, experiment.title || "小实验", body, "做这个实验");
      }

      function renderBusinessDimensionCard(dimension) {
        const ready = dimension.status === "ready";
        const complete = dimension.completeness === "complete";
        const items = Array.isArray(dimension.latestItems) ? dimension.latestItems : [];
        const missing = Array.isArray(dimension.missing) ? dimension.missing : [];
        const body = ready && items.length
          ? `${complete ? "已补齐：" : "已有线索："}${items.slice(0, 2).join("；")}${!complete && missing.length ? `；仍缺：${missing.slice(0, 2).join("、")}` : ""}`
          : `还缺：${missing.slice(0, 3).join("、") || "具体材料"}`;
        const promptButton = dimension.prompt
          ? `<button class="dossier-fill-question" type="button" data-dossier-context-prompt="${escapeAttribute(dimension.prompt)}" data-dossier-product-text="${escapeAttribute(dimension.productText || "")}">${ready ? "继续验证" : "怎么补"}</button>`
          : "";
        return `<article class="business-dimension-card" data-status="${ready ? "ready" : "missing"}">
          <strong>${escapeHtml(dimension.label || "验证维度")}</strong>
          <span>${complete ? "材料较完整" : ready ? "已有线索" : "待补材料"} · ${escapeHtml(String(dimension.records || 0))} 条记录</span>
          <p>${escapeHtml(compactText(body, 120))}</p>
          ${promptButton}
        </article>`;
      }

      function renderBusinessVerificationRecord(record) {
        const sections = (record.sections || [])
          .filter((section) => Array.isArray(section.items) && section.items.length > 0)
          .slice(0, 5)
          .map((section) => renderProductIntakeSection(section))
          .join("");
        const missing = (record.missing || []).length
          ? `<p class="dossier-meta">仍缺：${escapeHtml((record.missing || []).slice(0, 8).join("、"))}</p>`
          : "";
        const status = record.status === "ready" ? "可用于追问" : "材料不足";
        return `<article class="business-verification-record">
          <header>
            <strong>${escapeHtml(status)}</strong>
            <span>${escapeHtml(record.createdAt || "")}</span>
          </header>
          <blockquote>${escapeHtml(compactText(record.rawText || "", 260))}</blockquote>
          ${sections}
          ${missing}
          <p class="dossier-meta">${escapeHtml(record.caution || "这是用户提供的业务验证材料，不是本地资料证据。")}</p>
          ${record.diagnosticPrompt ? `<div class="workbench-actions">
            <button class="dossier-fill-question" type="button" data-business-record-prompt="${escapeAttribute(record.id || "")}">带这次材料继续问</button>
          </div>` : ""}
        </article>`;
      }

      function renderProductIntakeSection(section) {
        const items = Array.isArray(section.items) ? section.items : [];
        const missing = Array.isArray(section.missing) ? section.missing : [];
        return `<article class="product-intake-section">
          <strong>可能属于：${escapeHtml(section.label || "未分类")}</strong>
          ${
            items.length
              ? `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
              : `<p class="dossier-meta">未识别到具体材料。</p>`
          }
          ${missing.length ? `<p class="dossier-meta">还缺：${escapeHtml(missing.join("、"))}</p>` : ""}
        </article>`;
      }

      function renderDossierCheckItem(item) {
        const prompt = item.prompt || item.label || "";
        return `<article class="dossier-check">
          <label>
            <input type="checkbox" aria-label="${escapeAttribute(item.label || "检查项")}" />
            <span>
              <strong>${escapeHtml(item.label || "检查项")}</strong>
              ${item.reason ? `<span>${escapeHtml(item.reason)}</span>` : ""}
            </span>
          </label>
          ${prompt ? `<button class="dossier-fill-question" type="button" data-dossier-prompt="${escapeAttribute(prompt)}">填入追问</button>` : ""}
        </article>`;
      }

      function renderDossierQuestion(item) {
        return `<article class="dossier-question">
          <strong>${escapeHtml(item.label || "追问")}</strong>
          <span>${escapeHtml(item.question || "")}</span>
          <button class="dossier-fill-question" type="button" data-dossier-prompt="${escapeAttribute(item.question || "")}">填入问题</button>
        </article>`;
      }

      function fillDossierPrompt(prompt) {
        const text = String(prompt || "").trim();
        if (!text) return;
        pendingProductInput = null;
        questionEl.value = text;
        questionEl.focus();
      }

      function applySourcePackageControls(button) {
        const excluded = parseJsonArray(button?.dataset?.sourcePackageExcluded);
        const authors = parseJsonArray(button?.dataset?.sourcePackageAuthors);
        const allowed = parseJsonArray(button?.dataset?.sourcePackageAllowed);
        const selected = parseSelectedSources(button?.dataset?.sourcePackageSelected);
        if (excluded.length === 0 && authors.length === 0 && allowed.length === 0 && selected.length === 0) return;
        sourceControls = normalizeSourceControls({
          excludedSourceKeys: [...(sourceControls.excludedSourceKeys || []), ...excluded],
          allowedAuthors: authors.length ? authors : sourceControls.allowedAuthors || [],
          allowedSourceKeys: allowed.length ? allowed : sourceControls.allowedSourceKeys || [],
          selectedSources: selected.length ? selected : sourceControls.selectedSources || [],
        });
        saveSourceControls();
        renderSourceScopeControls();
      }

      function parseSelectedSources(value) {
        try {
          const parsed = JSON.parse(String(value || "[]"));
          return Array.isArray(parsed) ? parsed.map(normalizeSelectedSourceForControl).filter(Boolean).slice(0, 12) : [];
        } catch {
          return [];
        }
      }

      function parseJsonAttribute(value) {
        try {
          const parsed = JSON.parse(String(value || "{}"));
