      function focusGraphNode(graphEl, nodeId) {
        const connected = new Set([nodeId]);
        graphEl.querySelectorAll(".graph-edge").forEach((edge) => {
          if (edge.dataset.from === nodeId || edge.dataset.to === nodeId) {
            connected.add(edge.dataset.from);
            connected.add(edge.dataset.to);
          }
        });
        graphEl.classList.add("has-focus");
        markGraphFocus(graphEl, connected);
      }

      function markGraphFocus(graphEl, activeNodeIds, activeEdge = null) {
        const active = new Set(activeNodeIds);
        graphEl.querySelectorAll(".graph-node").forEach((node) => {
          const isActive = active.has(node.dataset.nodeId);
          node.classList.toggle("is-active", isActive);
          node.classList.toggle("is-muted", !isActive);
        });
        graphEl.querySelectorAll(".graph-edge").forEach((edge) => {
          const isActive = edge === activeEdge || (active.has(edge.dataset.from) && active.has(edge.dataset.to));
          edge.classList.toggle("is-active", isActive);
          edge.classList.toggle("is-muted", !isActive);
        });
      }

      function clearGraphFocus(graphEl) {
        graphEl.classList.remove("has-focus");
        graphEl.querySelectorAll(".is-active, .is-muted").forEach((item) => {
          item.classList.remove("is-active", "is-muted");
        });
      }

      function activateGraphNode(node) {
        const claimTarget = node.dataset.claimTarget;
        if (claimTarget) {
          focusClaimByKey(claimTarget);
          return;
        }
        const sourceTarget = node.dataset.sourceTarget;
        if (sourceTarget) {
          focusSourceByKey(sourceTarget);
          return;
        }
        const graphPrompt = node.dataset.graphPrompt;
        if (graphPrompt) fillQuestionFromWorkflowPrompt(graphPrompt);
      }

      function focusSourceByKey(target, options = {}) {
        document.querySelectorAll(".source.is-focused").forEach((source) => source.classList.remove("is-focused"));
        const source = document.querySelector(`[data-source-key="${cssEscape(target)}"]`);
        if (!source) {
          notesEl.innerHTML = `<p class="error">这条来源当前不可定位，可能来自旧记录或已被过滤。</p>`;
          return;
        }
        source.classList.add("is-focused");
        source.scrollIntoView({ behavior: "smooth", block: "center" });
        if (options.openContext !== false) openSourceContext({ target, anchor: source });
      }

      function bindSourceContextEvents(root = document) {
        root.querySelectorAll("[data-source-context-target]").forEach((button) => {
          button.addEventListener("click", () => {
            openSourceContext({
              target: button.dataset.sourceContextTarget,
              quote: button.dataset.sourceContextQuote || "",
              anchor: button,
            });
          });
        });
        root.querySelectorAll("[data-source-context-payload]").forEach((button) => {
          button.addEventListener("click", () => {
            openSourceContext({
              source: parseJsonAttribute(button.dataset.sourceContextPayload),
              quote: button.dataset.sourceContextQuote || "",
              anchor: button,
            });
          });
        });
      }

      async function openSourceContext(input = {}) {
        const target = String(input.target || "").trim();
        const { messageIndex, sourceIndex } = sourceTargetParts(target);
        const source = input.source || sourceForContextTarget(messageIndex, sourceIndex);
        const slot = sourceContextSlot(target, input.anchor);
        if (!slot || !source) return;
        slot.innerHTML = `<section class="source-context" data-status="loading"><header><strong>原文上下文</strong><span>读取中</span></header><p class="source-context-warning">正在从本地原文里定位这段引用...</p></section>`;
        try {
          const payload = await fetchJson("/api/source-context", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              sessionId,
              messageIndex,
              sourceIndex,
              source,
              quote: input.quote || source.excerpt || "",
            }),
          });
          slot.innerHTML = renderSourceContextPanel(payload.sourceContext || {});
          slot.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } catch (error) {
          slot.innerHTML = `<section class="source-context" data-status="not_located"><header><strong>原文上下文</strong><span>读取失败</span></header><p class="source-context-warning">${escapeHtml(error.message || "暂时无法读取本地原文上下文。")}</p></section>`;
        }
      }

      function sourceTargetParts(target) {
        const parts = String(target || "").split("-");
        return {
          messageIndex: Number(parts[0]),
          sourceIndex: Number(parts[1]),
        };
      }

      function sourceForContextTarget(messageIndex, sourceIndex) {
        if (!Number.isInteger(messageIndex) || !Number.isInteger(sourceIndex)) return null;
        return messages[messageIndex]?.sources?.[sourceIndex] || null;
      }

      function sourceContextSlot(target, anchor) {
        const host = anchor?.closest?.(".source, .source-trust-item, .topic-reading-source, .study-guide-evidence, .evidence-report-evidence, .source-ledger-item");
        if (host) {
          let slot = host.querySelector(".source-context-slot");
          if (!slot) {
            slot = document.createElement("div");
            slot.className = "source-context-slot";
            host.appendChild(slot);
          }
          return slot;
        }
        if (target) {
          const direct = document.querySelector(`[data-source-context-slot="${cssEscape(target)}"]`);
          if (direct) return direct;
        }
        return null;
      }

      function renderSourceContextPanel(context) {
        const status = context.status || "not_located";
        const safeUrl = safeSourceUrl(context.sourceUrl);
        const link = safeUrl ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">打开原文链接</a>` : "";
        const meta = [context.author, context.date, context.identity || "作者原文"].filter(Boolean).join(" · ");
        const body = status === "located"
          ? `<div class="source-context-window">
              ${context.before ? `<p class="source-context-fragment">${escapeHtml(context.before)}</p>` : ""}
              <p class="source-context-fragment is-match">${escapeHtml(context.match || context.quote || "")}</p>
              ${context.after ? `<p class="source-context-fragment">${escapeHtml(context.after)}</p>` : ""}
            </div>`
          : `<p class="source-context-warning">${escapeHtml(context.reason || "未定位到原文上下文。")}</p>
             ${context.quote ? `<p class="source-context-fragment is-match">${escapeHtml(context.quote)}</p>` : ""}
             ${context.contextText ? `<p class="source-context-fragment">${escapeHtml(context.contextText)}</p>` : ""}`;
        return `<section class="source-context" data-status="${escapeAttribute(status)}" aria-label="原文上下文">
          <header>
            <strong>原文上下文</strong>
            <span>${escapeHtml(status === "located" ? "已定位引用位置" : "未定位到原文上下文")}</span>
          </header>
          <div class="source-context-title">
            <strong>${escapeHtml(context.title || "未命名来源")}</strong>
            <span class="source-context-meta">${escapeHtml(meta)}</span>
            ${context.sourcePath ? `<span class="source-context-path">${escapeHtml(context.sourcePath)}</span>` : ""}
            ${link}
          </div>
          ${body}
          ${status === "located" ? `<p class="source-context-warning">请核对上下文是否支持该结论；定位到原文不等于结论已确认。</p>` : ""}
        </section>`;
      }

      function focusClaimByKey(target) {
        document.querySelectorAll(".claim.is-focused").forEach((claim) => claim.classList.remove("is-focused"));
        const claim = document.querySelector(`[data-claim-key="${cssEscape(target)}"]`);
        if (!claim) {
          const fallbackTarget = fallbackSourceEvidenceClaimTarget(target);
          if (fallbackTarget) focusClaimByKey(fallbackTarget);
          return;
        }
        focusClaimElement(claim);
      }

      function focusClaimElement(claim) {
        claim.classList.add("is-focused");
        claim.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function fallbackSourceEvidenceClaimTarget(target) {
        const match = String(target || "").match(/^(\d+):source-evidence:(\d+)$/);
        if (!match) return "";
        const messageIndex = match[1];
        const ordinal = Number(match[2]);
        if (!Number.isInteger(ordinal) || ordinal < 0) return "";
        const prefix = `${messageIndex}:source-evidence:`;
        const claims = [...document.querySelectorAll(`[data-claim-key^="${cssEscape(prefix)}"]`)];
        return claims[ordinal]?.dataset.claimKey || "";
      }

      function renderSources(sources, messageIndex) {
        if (!sources.length) return "";
        return `<div class="sources">${sources
          .map((source, index) => {
            const controlKey = sourceKeyForSource(source);
            const excluded = isSourceExcluded(controlKey);
            const safeUrl = safeSourceUrl(source.sourceUrl);
            const link = safeUrl
              ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">原文</a>`
              : "";
            const target = `${messageIndex}-${index}`;
            return `<article class="source${excluded ? " is-excluded" : ""}" data-source-key="${escapeAttribute(`${messageIndex}-${index}`)}" data-source-control-key="${escapeAttribute(controlKey)}">
              <div class="source-head">
                <h3>${escapeHtml(source.title)}</h3>
                <div class="source-actions">
                  <button class="source-context-button" type="button" data-source-context-target="${escapeAttribute(target)}">原文上下文</button>
                  <button class="source-control-button${excluded ? " is-excluded" : ""}" type="button" data-source-control-key="${escapeAttribute(controlKey)}">${excluded ? "恢复来源" : "排除来源"}</button>
                </div>
              </div>
              <p>${escapeHtml(source.author)} · ${escapeHtml(source.date)} ${link}</p>
              <p>${escapeHtml(source.excerpt || "")}</p>
              <div class="source-context-slot" data-source-context-slot="${escapeAttribute(target)}"></div>
            </article>`;
          })
          .join("")}</div>`;
      }

      function readSourceControls() {
        try {
          const parsed = JSON.parse(localStorage.getItem(SOURCE_CONTROLS_KEY) || "{}");
          return normalizeSourceControls(parsed);
        } catch {
          return { excludedSourceKeys: [], allowedAuthors: [], allowedSourceKeys: [], selectedSources: [] };
        }
      }

      function saveSourceControls() {
        sourceControls = normalizeSourceControls(sourceControls);
        safeLocalSet(SOURCE_CONTROLS_KEY, JSON.stringify(sourceControls));
      }

      function readUserSourceControls() {
        try {
          return normalizeUserSourceControls(JSON.parse(localStorage.getItem(USER_SOURCE_CONTROLS_KEY) || "{}"));
        } catch {
          return { enabledIds: [], mode: "blend" };
        }
      }

      function saveUserSourceControls() {
        userSourceControls = normalizeUserSourceControls(userSourceControls);
        safeLocalSet(USER_SOURCE_CONTROLS_KEY, JSON.stringify(userSourceControls));
      }

      function normalizeUserSourceControls(value = {}) {
        const enabledIds = Array.isArray(value.enabledIds)
          ? [...new Set(value.enabledIds.filter((id) => typeof id === "string" && id.trim()).map((id) => id.trim()).slice(0, 20))]
          : [];
        return { enabledIds, mode: value.mode === "only" ? "only" : "blend" };
      }

      function normalizeSourceControls(value = {}) {
        const excludedSourceKeys = Array.isArray(value.excludedSourceKeys)
          ? [...new Set(value.excludedSourceKeys.filter((key) => typeof key === "string" && key.trim()).map((key) => key.trim()).slice(0, 100))]
          : [];
        const allowedSourceKeys = Array.isArray(value.allowedSourceKeys)
          ? [...new Set(value.allowedSourceKeys.filter((key) => typeof key === "string" && key.trim()).map((key) => key.trim()).slice(0, 50))]
          : [];
        const allowedAuthors = Array.isArray(value.allowedAuthors)
          ? [...new Set(value.allowedAuthors.filter((author) => typeof author === "string" && author.trim()).map((author) => author.trim()).slice(0, 20))]
          : [];
        const allowedSourceKeySet = new Set(allowedSourceKeys);
        const selectedSources = Array.isArray(value.selectedSources)
          ? value.selectedSources
              .map(normalizeSelectedSourceForControl)
              .filter(Boolean)
              .filter((source) => allowedSourceKeySet.size === 0 || sourceKeysForTopicSource(source).some((key) => allowedSourceKeySet.has(key)))
              .slice(0, 12)
          : [];
        return { excludedSourceKeys, allowedAuthors, allowedSourceKeys, selectedSources };
      }

      function normalizeSelectedSourceForControl(source) {
        if (!source || typeof source !== "object") return null;
        const text = (value, maxLength) => String(value || "").trim().slice(0, maxLength);
        const normalized = {
          kind: text(source.kind, 40),
          author: text(source.author, 80),
          date: text(source.date, 32),
          title: text(source.title || source.label, 180),
          excerpt: text(source.excerpt || source.quote || source.text || source.label, 700),
          sourceUrl: text(source.sourceUrl, 360),
          sourcePath: text(source.sourcePath, 360),
          sourceKey: text(source.sourceKey, 360),
        };
        return normalized.title || normalized.excerpt ? normalized : null;
      }

      function sourceContextPayload(source) {
        return normalizeSelectedSourceForControl(source) || {};
      }

      function renderSourceScopeControls() {
        if (!sourceScopeControlsEl || !sourceScopeMetaEl) return;
        const entries = Object.entries(authorCounts || {});
        const knownAuthors = new Set(entries.map(([author]) => author));
        const selected = new Set((sourceControls.allowedAuthors || []).filter((author) => knownAuthors.has(author)));
        if ((sourceControls.allowedAuthors || []).length !== selected.size) {
          sourceControls = { ...(sourceControls || {}), allowedAuthors: [...selected] };
          saveSourceControls();
        }
        const hasScope = selected.size > 0;
        const selectedSourceCount = (sourceControls.selectedSources || []).length || (sourceControls.allowedSourceKeys || []).length;
        if (entries.length === 0) {
          sourceScopeControlsEl.innerHTML = `<p class="scope-meta">作者统计还在读取中。</p>`;
          sourceScopeMetaEl.textContent = "默认使用全部作者资料。";
          return;
        }
        sourceScopeControlsEl.innerHTML = entries
          .map(([author, count]) => {
            const active = !hasScope || selected.has(author);
            const selectedClass = hasScope && selected.has(author) ? " is-selected" : "";
            return `<button class="scope-author-button${active ? " is-active" : ""}${selectedClass}" type="button" data-author-scope="${escapeAttribute(author)}" aria-pressed="${selected.has(author) ? "true" : "false"}">
              <strong>${escapeHtml(author)}</strong>
              <span>${Number(count || 0)} 篇</span>
            </button>`;
          })
          .join("");
        sourceScopeMetaEl.textContent = selectedSourceCount
          ? `当前范围：只看来源阅读室选择的 ${selectedSourceCount} 个来源。恢复全部作者会清空这个限制。`
          : hasScope
          ? `当前范围：只看 ${[...selected].join("、")}。只影响后续回答，不改知识库。`
          : "当前范围：全部作者。点击作者即可锁定后续回答范围。";
        sourceScopeControlsEl.querySelectorAll("[data-author-scope]").forEach((button) => {
          button.addEventListener("click", () => toggleAuthorScope(button.dataset.authorScope));
        });
      }

      function toggleAuthorScope(author) {
        if (!author) return;
        const current = new Set(sourceControls.allowedAuthors || []);
        if (current.has(author)) current.delete(author);
        else current.add(author);
        sourceControls = { ...(sourceControls || {}), allowedAuthors: [...current], allowedSourceKeys: [], selectedSources: [] };
        saveSourceControls();
        renderSourceScopeControls();
        renderMessages({ scrollToBottom: false });
      }

      async function inspectQuestionSourceSelection() {
        const question = questionEl.value.trim();
        if (!question) {
          renderQuestionSourceSelectionError(new Error("先输入一个问题，再判断本轮资料范围。"));
          return;
        }
        sourceSelectionButton.disabled = true;
        sourceSelectionButton.textContent = "选择中";
        try {
          const payload = await fetchJson("/api/source-selection", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              question,
              history: messages.filter((item) => !item.loading),
              sourceControls,
              userSourceControls,
            }),
          });
          currentSourceSelection = normalizeQuestionSourceSelection(payload.sourceSelection || null);
          renderQuestionSourceSelection();
        } finally {
          sourceSelectionButton.disabled = false;
          sourceSelectionButton.textContent = "先选资料";
        }
      }

      function renderQuestionSourceSelectionError(error) {
        currentSourceSelection = {
          title: "问前资料选择",
          status: "needs_source",
          summary: error?.message || "暂时无法判断资料范围。",
          recommended: [],
          alternatives: [],
          criteria: [],
          boundary: "问前资料选择只决定下一轮先读哪些来源，不会写入知识库。",
        };
        renderQuestionSourceSelection();
      }

      function normalizeQuestionSourceSelection(selection) {
        if (!selection || typeof selection !== "object") return null;
        const intentChoices = Array.isArray(selection.intentChoices) ? selection.intentChoices.filter((item) => item?.type).slice(0, 4) : [];
        const primaryIntent = selection.intent?.type ? selection.intent : intentChoices.find((item) => item.recommended) || intentChoices[0] || null;
        return {
          ...selection,
          intentChoices,
          intent: primaryIntent,
          selectedIntent: selection.selectedIntent?.type ? selection.selectedIntent : primaryIntent,
        };
      }

      function renderQuestionSourceSelection() {
        if (!questionSourceSelectionEl) return;
        const selection = currentSourceSelection;
        if (!selection) {
          questionSourceSelectionEl.hidden = true;
          questionSourceSelectionEl.innerHTML = "";
          return;
        }
        const recommended = Array.isArray(selection.recommended) ? selection.recommended.filter((item) => item?.title || item?.label).slice(0, 3) : [];
        const alternatives = Array.isArray(selection.alternatives) ? selection.alternatives.filter((item) => item?.title || item?.label).slice(0, 3) : [];
        const criteria = Array.isArray(selection.criteria) ? selection.criteria.filter((item) => item?.label).slice(0, 3) : [];
        const intentChoices = Array.isArray(selection.intentChoices) ? selection.intentChoices.filter((item) => item?.type).slice(0, 4) : [];
        const hasRecommended = recommended.length > 0;
        questionSourceSelectionEl.hidden = false;
        questionSourceSelectionEl.innerHTML = `<header>
          <div>
            <strong>${escapeHtml(selection.title || "问前资料选择")}</strong>
            <p>${escapeHtml(selection.summary || "先判断本轮该读哪些资料，再提问。")}</p>
          </div>
          <span class="question-source-selection-status">${escapeHtml(questionSourceSelectionStatusLabel(selection.status))}</span>
        </header>
        ${criteria.length ? `<div class="question-source-selection-criteria">${criteria.map(renderQuestionSourceCriterion).join("")}</div>` : ""}
        ${intentChoices.length ? `<div class="question-source-intents" aria-label="问前意图确认">${intentChoices.map((intent) => renderQuestionIntentChoice(intent, selection.selectedIntent)).join("")}</div>` : ""}
        ${hasRecommended ? `<div class="question-source-selection-grid">${recommended.map((source, index) => renderQuestionSourceCard(source, index, true)).join("")}</div>` : ""}
        ${alternatives.length ? `<div class="question-source-selection-grid">${alternatives.map((source, index) => renderQuestionSourceCard(source, index, false)).join("")}</div>` : ""}
        <div class="question-source-selection-actions">
          <button class="small-action" type="button" data-question-source-apply${hasRecommended ? "" : " disabled"}>使用这些资料范围</button>
          <button class="primary" type="button" data-question-source-ask${hasRecommended ? "" : " disabled"}>用这些资料提问</button>
          <button class="small-action" type="button" data-question-source-close>继续使用当前范围</button>
        </div>
        <p class="question-source-selection-boundary">${escapeHtml(selection.boundary || "问前资料选择只决定下一轮先读哪些来源；候选理由是系统整理，不是新的作者原文证据。")}</p>`;
        bindQuestionSourceSelectionEvents();
      }

      function renderQuestionSourceCriterion(item) {
        return `<article class="question-source-selection-criterion" data-status="${escapeAttribute(item.status || "")}">
          <strong>${escapeHtml(item.label || "")}</strong>
          <span>${escapeHtml(item.detail || "")}</span>
        </article>`;
      }

      function renderQuestionIntentChoice(intent, selectedIntent) {
        const selected = (selectedIntent?.type || "") === intent.type;
        const confidence = intent.confidence === "user_confirmed"
          ? "你已确认"
          : intent.recommended
            ? "系统建议"
            : "可切换";
        return `<button class="question-source-intent-button${selected ? " is-selected" : ""}" type="button" data-question-intent="${escapeAttribute(intent.type || "")}" aria-pressed="${selected ? "true" : "false"}">
          <strong>${escapeHtml(intent.label || WORKFLOW_INTENT_LABELS[intent.type] || "意图")}</strong>
          <span>${escapeHtml(confidence)} · ${escapeHtml(intent.primaryAction || intent.goal || "")}</span>
        </button>`;
      }

      function renderQuestionSourceCard(source, index, primary) {
        const title = source.title || source.label || `来源 ${index + 1}`;
        const meta = [source.author, source.date].filter(Boolean).join(" · ");
        const excerpt = source.excerpt || source.quote || "";
        return `<article class="question-source-selection-card" data-primary="${primary ? "true" : "false"}">
          <strong>${escapeHtml(primary ? `${index + 1}. ${title}` : `备选：${title}`)}</strong>
          ${meta ? `<p>${escapeHtml(meta)}</p>` : ""}
          ${excerpt ? `<p>${escapeHtml(compactText(excerpt, 150))}</p>` : ""}
          <p>${escapeHtml(source.reason || "候选来源只用于限定下一轮检索，回答仍必须回到原文引用。")}</p>
        </article>`;
      }

      function questionSourceSelectionStatusLabel(status) {
        if (status === "ready") return "可限定范围";
        if (status === "needs_source") return "先补来源";
        return "待复核";
      }

      function bindQuestionSourceSelectionEvents() {
        questionSourceSelectionEl.querySelectorAll("[data-question-intent]").forEach((button) => {
          button.addEventListener("click", () => selectQuestionIntent(button.dataset.questionIntent || ""));
        });
        questionSourceSelectionEl.querySelectorAll("[data-question-source-apply]").forEach((button) => {
          button.addEventListener("click", () => applyQuestionSourceSelection(false));
        });
        questionSourceSelectionEl.querySelectorAll("[data-question-source-ask]").forEach((button) => {
          button.addEventListener("click", () => applyQuestionSourceSelection(true));
        });
        questionSourceSelectionEl.querySelectorAll("[data-question-source-close]").forEach((button) => {
          button.addEventListener("click", () => {
            currentSourceSelection = null;
            renderQuestionSourceSelection();
          });
        });
      }

      function selectQuestionIntent(type) {
        if (!currentSourceSelection || !type) return;
        const choice = (currentSourceSelection.intentChoices || []).find((item) => item.type === type);
        if (!choice) return;
        currentSourceSelection = {
          ...currentSourceSelection,
          selectedIntent: { ...choice, confidence: "user_confirmed" },
        };
        renderQuestionSourceSelection();
      }

      function applyQuestionSourceSelection(askAfterApply) {
        const selection = currentSourceSelection;
        if (!selection?.sourceControls) return;
        const question = questionEl.value.trim();
        sourceControls = normalizeSourceControls(selection.sourceControls);
        saveSourceControls();
        renderSourceScopeControls();
        currentSourceSelection = {
          ...selection,
          summary: "已把这些来源设为下一轮回答范围。这个范围可随时在左侧清空或重选。",
        };
        renderQuestionSourceSelection();
        if (askAfterApply && question) ask(question);
      }

      async function loadUserSources() {
        try {
          const payload = await fetchJson("/api/user-sources");
          userSources = Array.isArray(payload.userSources) ? payload.userSources : [];
          const available = new Set(userSources.map((source) => source.id));
          userSourceControls = normalizeUserSourceControls({
            ...userSourceControls,
            enabledIds: (userSourceControls.enabledIds || []).filter((id) => available.has(id)),
          });
          saveUserSourceControls();
          renderUserSources();
        } catch (error) {
          userSourcesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
      }

      async function addUserSource() {
        const title = userSourceTitleEl.value.trim();
        const content = userSourceContentEl.value.trim();
        if (!title || !content) {
          userSourcesEl.innerHTML = `<p class="error">请先填写资料标题和内容。</p>`;
          return;
        }
        const payload = await fetchJson("/api/user-sources", {
          method: "POST",
          body: JSON.stringify({ title, content }),
        });
        const source = payload.userSource;
        if (source?.id) {
          userSourceControls = normalizeUserSourceControls({
            ...userSourceControls,
            enabledIds: [...(userSourceControls.enabledIds || []), source.id],
          });
          saveUserSourceControls();
        }
        userSourceTitleEl.value = "";
        userSourceContentEl.value = "";
        await loadUserSources();
      }

      function renderUserSources() {
        if (!userSourcesEl) return;
        userSourceControls = normalizeUserSourceControls(userSourceControls);
        userSourceOnlyModeEl.checked = userSourceControls.mode === "only";
        const enabled = new Set(userSourceControls.enabledIds || []);
        if (!userSources.length) {
          userSourcesEl.innerHTML = `<p class="scope-meta">还没有添加自己的资料。粘贴资料后，可以只围绕它提问。</p>`;
          return;
        }
        userSourcesEl.innerHTML = userSources.slice(0, 12).map((source) => `<article class="user-source-item">
          <label>
            <input type="checkbox" data-user-source-toggle="${escapeAttribute(source.id)}" ${enabled.has(source.id) ? "checked" : ""} />
            <span><strong>${escapeHtml(source.title || "我的资料")}</strong><br />${Number(source.charCount || 0)} 字 · ${escapeHtml(source.updatedAt ? new Date(source.updatedAt).toLocaleString("zh-CN") : "")}</span>
          </label>
          <p>${escapeHtml(source.excerpt || "")}</p>
          <button class="small-action" type="button" data-user-source-delete="${escapeAttribute(source.id)}">删除资料</button>
        </article>`).join("");
        userSourcesEl.querySelectorAll("[data-user-source-toggle]").forEach((input) => {
          input.addEventListener("change", () => {
            const current = new Set(userSourceControls.enabledIds || []);
            if (input.checked) current.add(input.dataset.userSourceToggle);
            else current.delete(input.dataset.userSourceToggle);
            userSourceControls = normalizeUserSourceControls({ ...userSourceControls, enabledIds: [...current] });
            saveUserSourceControls();
            renderUserSources();
          });
        });
        userSourcesEl.querySelectorAll("[data-user-source-delete]").forEach((button) => {
          button.addEventListener("click", () => deleteUserSource(button.dataset.userSourceDelete));
        });
      }

      async function deleteUserSource(id) {
        if (!id) return;
        await fetchJson(`/api/user-sources/${encodeURIComponent(id)}`, { method: "DELETE" });
        userSourceControls = normalizeUserSourceControls({
          ...userSourceControls,
          enabledIds: (userSourceControls.enabledIds || []).filter((item) => item !== id),
        });
        saveUserSourceControls();
        await loadUserSources();
      }

      async function loadLearningNotes() {
        try {
          const payload = await fetchJson("/api/notes");
          learningNotes = Array.isArray(payload.notes) ? payload.notes : [];
          renderLearningNotes();
        } catch (error) {
          learningNotesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
      }

      async function saveManualLearningNote() {
        const title = learningNoteTitleEl.value.trim();
        const content = learningNoteContentEl.value.trim();
        if (!title || !content) {
          learningNotesEl.innerHTML = `<p class="error">请先填写笔记标题和内容。</p>`;
          return;
        }
        await fetchJson("/api/notes", {
          method: "POST",
          body: JSON.stringify({ title, content, origin: "manual" }),
        });
        learningNoteTitleEl.value = "";
        learningNoteContentEl.value = "";
        await loadLearningNotes();
        await loadStatus();
      }

      async function saveAnswerAsLearningNote(messageIndex) {
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant" || !String(message.content || "").trim()) return;
        const question = questionForMessage(messageIndex);
        const title = compactText(question || message.content || "问答笔记", 64);
        await fetchJson("/api/notes", {
          method: "POST",
          body: JSON.stringify({
            title,
            content: answerLearningNoteContent(message, messageIndex),
            origin: "answer",
            source: { sessionId, messageIndex, question },
          }),
        });
        await loadLearningNotes();
        await loadStatus();
        learningNotesEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function answerLearningNoteContent(message, messageIndex) {
        const question = questionForMessage(messageIndex);
        const sources = Array.isArray(message.sources) ? message.sources.slice(0, 6) : [];
        const sourceLines = sources.map((source, index) => {
          const meta = [source.author, source.date, source.title].filter(Boolean).join(" · ");
          return `${index + 1}. ${meta}${source.excerpt ? `\n   摘录：${compactText(source.excerpt, 180)}` : ""}`;
        });
        return [
          question ? `问题：${question}` : "",
          "回答摘录：",
          String(message.content || "").trim(),
          sourceLines.length ? "\n引用来源：" : "",
          ...sourceLines,
          "\n边界：这是学习笔记，不是作者原文证据；如需进入后续问答，请手动转成“我的资料”。",
        ].filter(Boolean).join("\n");
      }

      function renderLearningNotes() {
        if (!learningNotesEl) return;
        if (!learningNotes.length) {
          learningNotesEl.innerHTML = `<p class="scope-meta">还没有学习笔记。你可以手写，也可以把某次回答保存为笔记。</p>`;
          return;
        }
        learningNotesEl.innerHTML = learningNotes.slice(0, 16).map((note) => {
          const time = note.updatedAt ? new Date(note.updatedAt).toLocaleString("zh-CN") : "";
          const origin = note.origin === "answer" ? "回答摘录" : "手写笔记";
          return `<article class="note-item learning-note-item">
            <strong>${escapeHtml(note.title || "学习笔记")}</strong>
            <p>${escapeHtml(note.excerpt || "")}</p>
            <p>${escapeHtml([origin, `${Number(note.charCount || 0)} 字`, time].filter(Boolean).join(" · "))}</p>
            <p>${escapeHtml(note.boundary || "学习笔记不是作者原文证据。")}</p>
            <div class="workbench-actions">
              <button class="small-action" type="button" data-note-to-user-source="${escapeAttribute(note.id)}">转成我的资料</button>
              <button class="small-action" type="button" data-note-delete="${escapeAttribute(note.id)}">删除笔记</button>
            </div>
          </article>`;
        }).join("");
        learningNotesEl.querySelectorAll("[data-note-to-user-source]").forEach((button) => {
          button.addEventListener("click", () => convertLearningNoteToUserSource(button.dataset.noteToUserSource).catch((error) => {
            learningNotesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
          }));
        });
        learningNotesEl.querySelectorAll("[data-note-delete]").forEach((button) => {
          button.addEventListener("click", () => deleteLearningNote(button.dataset.noteDelete).catch((error) => {
            learningNotesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
          }));
        });
      }

      async function convertLearningNoteToUserSource(id) {
        if (!id) return;
        const payload = await fetchJson(`/api/notes/${encodeURIComponent(id)}/user-source`, { method: "POST" });
        const source = payload.userSource;
        if (source?.id) {
          userSourceControls = normalizeUserSourceControls({
            ...userSourceControls,
            enabledIds: [...(userSourceControls.enabledIds || []), source.id],
          });
          saveUserSourceControls();
        }
        await loadUserSources();
        await loadStatus();
      }

      async function deleteLearningNote(id) {
        if (!id) return;
        await fetchJson(`/api/notes/${encodeURIComponent(id)}`, { method: "DELETE" });
        await loadLearningNotes();
        await loadStatus();
      }

      function bindLearningNoteEvents() {
        document.querySelectorAll("[data-answer-note-save]").forEach((button) => {
          button.addEventListener("click", () => {
            saveAnswerAsLearningNote(Number(button.dataset.answerNoteSave)).catch((error) => {
              learningNotesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });
        });
      }

      function sourceKeyForSource(source) {
        const direct = source?.sourcePath || source?.sourceUrl;
        if (direct) return String(direct);
        return [source?.author, source?.date, source?.title].filter(Boolean).join("|");
      }

      function safeSourceUrl(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        try {
          const url = new URL(text, window.location.href);
          if (url.protocol !== "http:" && url.protocol !== "https:") return "";
          return url.href;
        } catch {
          return "";
        }
      }

      function isSourceExcluded(sourceKey) {
        return !!sourceKey && (sourceControls.excludedSourceKeys || []).includes(sourceKey);
      }

      function toggleSourceExclusion(sourceKey) {
        if (!sourceKey) return;
        setSourceExcluded(sourceKey, !isSourceExcluded(sourceKey));
      }

      async function setSourceExcluded(sourceKey, excluded) {
        if (!sourceKey) return;
        const current = new Set(sourceControls.excludedSourceKeys || []);
        if (excluded) current.add(sourceKey);
        else current.delete(sourceKey);
        sourceControls = { ...(sourceControls || {}), excludedSourceKeys: [...current].slice(0, 100) };
        saveSourceControls();
        if (excluded) {
          for (const message of messages) {
            if (message?.role === "assistant" && message.savedDossierId && learningDossierSaveGate(message).locked) {
              await invalidateSavedDossierForMessage(message);
            }
          }
          saveMessages();
        }
        renderMessages({ scrollToBottom: false });
        renderEvidenceWorkbench();
      }

      function renderEvidenceWorkbench() {
        const workspace = collectEvidenceWorkspace();
        evidenceWorkbenchEl.innerHTML = [
          renderWorkbenchEvidenceSection("已采纳证据", workspace.useful, "点某条资料证据的“有用”，它会出现在这里。"),
          renderWorkbenchEvidenceSection("已排除证据", workspace.irrelevant, "点某条资料证据的“不相关”，它会出现在这里。"),
          renderExcludedSourcesSection(workspace.excludedSources),
        ].join("");
        bindWorkbenchEvents();
      }

      function collectEvidenceWorkspace() {
        const useful = [];
        const irrelevant = [];
        const sourceLabels = new Map();

        messages.forEach((message, messageIndex) => {
          (message.sources || []).forEach((source) => {
            for (const key of sourceIdentityKeys(source)) {
              sourceLabels.set(key, sourceLabel(source));
            }
          });
          const feedback = message.evidenceFeedback || {};
          const claims = Array.isArray(message.evidenceChain?.claims) ? message.evidenceChain.claims : [];
          claims
            .filter((claim) => claim?.type === "source_evidence")
            .forEach((claim) => {
              const value = feedback[claim.id];
              if (value !== "useful" && value !== "irrelevant") return;
              const source = Number.isInteger(claim.sourceIndex) ? message.sources?.[claim.sourceIndex] || claim : claim;
              const item = {
                claimKey: `${messageIndex}:${claim.id}`,
                sourceKey: sourceKeyForSource(source),
                title: claim.title || "资料证据",
                label: [claim.author, claim.date].filter(Boolean).join(" · "),
                quote: claim.quote || claim.text || "",
              };
              if (value === "useful") useful.push(item);
              if (value === "irrelevant") irrelevant.push(item);
            });
        });

        return {
          useful: useful.slice(-6).reverse(),
          irrelevant: irrelevant.slice(-6).reverse(),
          excludedSources: (sourceControls.excludedSourceKeys || []).map((key) => ({
            key,
            label: sourceLabels.get(key) || compactSourceKey(key),
          })),
        };
      }

        return [source?.sourcePath, source?.sourceUrl, sourceKeyForSource(source)].filter(Boolean).map(String);

        const text = String(key || "");
        if (text.includes("|")) return text.split("|").filter(Boolean).slice(-1)[0] || text;
        const parts = text.split("/");
        return parts[parts.length - 1] || text;
      }

              })).filter((item) => item.label || item.excerpt).slice(0, 4)
            : [],
        };
      }

      function compactSupportingConflictReasons(items) {
        return Array.isArray(items)
          ? items
              .map((item) => ({
                concept: compactText(item?.concept, 40),
                relatedConcepts: Array.isArray(item?.relatedConcepts) ? item.relatedConcepts.filter(Boolean).slice(0, 6) : [],
                sourceIndexes: Array.isArray(item?.sourceIndexes) ? item.sourceIndexes.filter(Number.isInteger).slice(0, 4) : [],
                summary: compactText(item?.summary, 200),
                suggestedCheck: compactText(item?.suggestedCheck, 220),
              }))
              .filter((item) => item.concept)
              .slice(0, 4)
          : [];
      }

      function compactConflictComparison(comparison) {
        if (!comparison || typeof comparison !== "object") return undefined;
        return {
          summary: compactText(comparison.summary, 220),
          differenceFocus: compactText(comparison.differenceFocus, 220),
          supportLabel: compactText(comparison.supportLabel, 60),
          supportQuote: compactText(comparison.supportQuote, 180),
          supportSource: compactConflictSource(comparison.supportSource),
          cautionLabel: compactText(comparison.cautionLabel, 60),
          cautionQuote: compactText(comparison.cautionQuote, 180),
          cautionSource: compactConflictSource(comparison.cautionSource),
          suggestedCheck: compactText(comparison.suggestedCheck, 220),
          nextQuestion: compactConflictNextQuestion(comparison.nextQuestion),
        };
      }

      function compactConflictSource(source) {
        if (!source || typeof source !== "object") return undefined;
        return {
          sourceIndex: Number.isInteger(source.sourceIndex) ? source.sourceIndex : undefined,
          author: compactText(source.author, 80),
          date: compactText(source.date, 32),
          title: compactText(source.title, 120),
          sourceUrl: safeSourceUrl(source.sourceUrl),
          sourcePath: compactText(source.sourcePath, 220),
        };
      }

      function compactConflictNextQuestion(nextQuestion) {
        if (!nextQuestion || typeof nextQuestion !== "object") return undefined;
        const question = compactText(nextQuestion.question, 1100);
        const requiredData = Array.isArray(nextQuestion.requiredData)
          ? nextQuestion.requiredData
              .map((item) => ({
                id: compactText(item?.id, 40),
                label: compactText(item?.label, 80),
                reason: compactText(item?.reason, 120),
                targetRole: compactText(item?.targetRole || "primary", 40),
                verifies: compactText(item?.verifies, 200),
              }))
              .filter((item) => item.label)
              .slice(0, 7)
          : [];
        if (!question && requiredData.length === 0) return undefined;
        return {
          intent: compactText(nextQuestion.intent || "resolve_conflict", 60),
          question,
          requiredData,
          evidenceRefs: nextQuestion.evidenceRefs,
          boundary: compactText(nextQuestion.boundary, 180),
        };
      }

      function safeLocalSet(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch {
          return false;
        }
      }

      function safeLocalRemove(key) {
        try {
          localStorage.removeItem(key);
        } catch {
          // Ignore storage restrictions; they should not break a successful answer.
        }
      }

      function compactText(value, maxLength) {
        const text = String(value || "").replace(/\s+/g, " ").trim();
        return text.length > maxLength ? `${text.slice(0, maxLength)}...` : text;
      }

      function currentProductText() {
        const input = dossierDetailEl?.querySelector("#productIntakeText");
        return input ? input.value || "" : selectedProductText || "";
      }

      function focusProductMaterialEntry(template = "") {
        const input = dossierDetailEl?.querySelector("#productIntakeText");
        const section = dossierDetailEl?.querySelector("[data-product-material-section]");
        if (!input) return;
        if (!input.value.trim() && template) {
          input.value = template;
          selectedProductText = template;
        }
        const target = section || input;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        input.focus({ preventScroll: true });
      }

      function focusValidationPlanEntry(template = "") {
        const plan = dossierDetailEl?.querySelector("[data-validation-plan-section]");
        const experiment = dossierDetailEl?.querySelector("[data-experiment-result-section]");
        const input = dossierDetailEl?.querySelector("#experimentResultText");
        if (input && !input.value.trim() && template) {
          input.value = template;
          selectedExperimentResultText = template;
        }
        const target = plan || experiment || input;
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        if (!plan && input) input.focus({ preventScroll: true });
      }

      function productInputForQuestion(question) {
        const text = String(question || "").trim();
        const candidates = [pendingProductInput].filter(Boolean);
        const match = candidates.find((candidate) => {
          if (candidate?.allowEditedQuestion) return true;
          const prompt = String(candidate?.intake?.diagnosticPrompt || "").trim();
          return prompt && prompt === text;
        });
        return match || null;
      }

      function queueProductInputForPrompt(prompt, productText = currentProductText(), productIntake = selectedProductIntake, options = {}) {
        const text = String(prompt || "").trim();
        const productTextValue = String(productText || "");
        const diagnosticPrompt = String(productIntake?.diagnosticPrompt || "").trim();
        const requirePromptMatch = options.requirePromptMatch !== false;
        if (!text || productIntake?.error) return;
        if (requirePromptMatch && (!diagnosticPrompt || text !== diagnosticPrompt)) return;
        const intake = productIntake && !options.rebuildFromText
          ? productIntake
          : {
              diagnosticPrompt: text,
              summary: productTextValue ? "使用当前产品材料继续追问。" : "",
              caution: "这是用户提供的业务验证材料，不是本地资料证据。",
            };
        pendingProductInput = {
          text: productTextValue,
          intake,
          allowEditedQuestion: options.allowEditedQuestion === true,
        };
      }

      async function saveLearningNote(messageIndex) {
        const message = messages[messageIndex];
        const card = message?.learningCard;
        if (!card) return;
        const saveGate = learningDossierSaveGate(message);
        if (saveGate.locked) {
          const gateClaimId = message.learningQueue?.items?.find((item) => item.id === "queue:evidence")?.claimId || "";
          if (gateClaimId) focusClaimByKey(`${messageIndex}:${gateClaimId}`);
          return;
        }
        message.openhumanMemory = { status: "pending" };
        renderMessages({ scrollToBottom: false });
        try {
          const payload = await fetchJson("/api/dossiers", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              question: questionForMessage(messageIndex),
              message,
              sourceControls: sourceControlsForMessage(message),
            }),
          });
          message.savedDossierId = payload.dossier?.id || payload.summary?.id || "";
          message.openhumanMemory = payload.dossier?.openhumanMemory || payload.summary?.openhumanMemory || {};
          message.dossierPersistence = payload.persistence || null;
          setLearningQueueItemDone(messageIndex, "queue:dossier", true);
          saveMessages();
          renderMessages({ scrollToBottom: false });
          await loadDossiers();
        } catch (error) {
          message.openhumanMemory = { status: "failed", error: error.message };
          saveMessages();
          renderMessages({ scrollToBottom: false });
          notesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
      }

      function sourceControlsForMessage(message) {
        const controls = normalizeSourceControls(sourceControls);
        const messageAuthors = message?.sourceScope?.active && Array.isArray(message.sourceScope.allowedAuthors)
          ? message.sourceScope.allowedAuthors.filter((author) => typeof author === "string" && author.trim()).map((author) => author.trim())
          : [];
        return {
          ...controls,
          allowedAuthors: messageAuthors.length > 0 ? [...new Set(messageAuthors)].slice(0, 20) : [],
          allowedSourceKeys: Array.isArray(message?.sourceScope?.allowedSourceKeys) && message.sourceScope.allowedSourceKeys.length > 0
            ? [...new Set(message.sourceScope.allowedSourceKeys)].slice(0, 50)
            : controls.allowedSourceKeys || [],
          selectedSources: controls.selectedSources || [],
        };
      }

      function questionForMessage(messageIndex) {
        for (let index = messageIndex - 1; index >= 0; index -= 1) {
          if (messages[index]?.role === "user" && messages[index].content) return messages[index].content;
        }
        return "";
      }

      async function loadDossiers() {
        try {
          const payload = await fetchJson("/api/dossiers");
          dossiers = Array.isArray(payload.dossiers) ? payload.dossiers : [];
          const overviewPayload = await fetchJson("/api/dossiers/overview");
          latestOverview = overviewPayload.overview || null;
          syncMessageMemoryFromDossiers();
          renderLearningOverview(latestOverview);
          renderTopicReadingRoom();
          renderNotes();
          renderMessages({ scrollToBottom: false });
        } catch (error) {
          notesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
      }

      function syncMessageMemoryFromDossiers() {
        const memoryByDossierId = new Map(
          dossiers
            .filter((dossier) => dossier.id && dossier.openhumanMemory)
            .map((dossier) => [dossier.id, dossier.openhumanMemory]),
        );
        let changed = false;
        messages = messages.map((message) => {
          if (!message?.savedDossierId || !memoryByDossierId.has(message.savedDossierId)) return message;
          const nextMemory = memoryByDossierId.get(message.savedDossierId);
          if (JSON.stringify(message.openhumanMemory || {}) === JSON.stringify(nextMemory || {})) return message;
          changed = true;
          return { ...message, openhumanMemory: nextMemory };
        });
        if (changed) saveMessages();
      }

      async function deleteDossier(id) {
        if (!id) return;
        await fetchJson(`/api/dossiers/${encodeURIComponent(id)}`, { method: "DELETE" });
        if (selectedDossier?.id === id) {
          selectedDossier = null;
          selectedDossierWorkbench = null;
          selectedProductText = "";
          selectedProductIntake = null;
          selectedExperimentResultText = "";
          selectedExperimentResultError = "";
          selectedExperimentResultSaving = false;
          pendingProductInput = null;
          renderDossierDetail();
        }
        await loadDossiers();
      }

      async function showDossierDetails(id) {
        if (!id) return;
        const payload = await fetchJson(`/api/dossiers/${encodeURIComponent(id)}`);
        selectedDossier = payload.dossier || null;
        selectedDossierWorkbench = payload.workbench || null;
        selectedProductText = "";
        selectedProductIntake = null;
        selectedExperimentResultText = "";
        selectedExperimentResultError = "";
        selectedExperimentResultSaving = false;
        pendingProductInput = null;
        renderDossierDetail();
        if (selectedDossier) {
          dossierDetailEl.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      function renderDossierDetail() {
        if (!selectedDossier) {
          dossierDetailEl.hidden = true;
          dossierDetailEl.innerHTML = "";
          selectedDossierWorkbench = null;
          selectedProductText = "";
          selectedProductIntake = null;
          selectedExperimentResultText = "";
          selectedExperimentResultError = "";
          selectedExperimentResultSaving = false;
          pendingProductInput = null;
          return;
        }

        const dossier = selectedDossier;
        const workbench = selectedDossierWorkbench;
        const synthesisGuide = workbench && workbench.synthesisGuide ? workbench.synthesisGuide : null;
        const excludedKeys = new Set((dossier.excludedSources || []).map((item) => item.key).filter(Boolean));
        const acceptedFromExcluded = (dossier.acceptedEvidence || []).some((item) => excludedKeys.has(item.sourceKey));
        const dossierGate = dossierAdvanceGate(dossier);
        const sourcePolicy = acceptedFromExcluded
          ? "保存时存在“采纳证据”和“排除来源”的交叉：继续追问会保留已采纳证据，同时避开被排除的整篇来源。"
          : "继续追问会优先带上已采纳证据，并避开已排除来源。";
        dossierDetailEl.hidden = false;
        dossierDetailEl.innerHTML = `<header>
          <div class="dossier-title">
            <strong>${escapeHtml(dossier.title || "亚马逊学习档案")}</strong>
            <span>${escapeHtml(dossier.createdAt || "")}</span>
            <span>原问题：${escapeHtml(dossier.question || "")}</span>
            ${renderOpenHumanMemoryStatus(dossier.openhumanMemory)}
          </div>
          <div class="dossier-actions">
            <button class="secondary" type="button" data-dossier-close>关闭详情</button>
            <button class="primary" type="button" data-dossier-continue="${escapeAttribute(dossier.id)}" ${dossierGate.locked ? "disabled" : ""} title="${escapeAttribute(dossierGate.reason || "")}">${escapeHtml(dossierGate.locked ? dossierGate.label : "从此档案继续追问")}</button>
          </div>
        </header>
        ${renderDossierAdvanceGateNotice(dossierGate)}
        <section class="dossier-section">
          <strong>一句话结论</strong>
          <p>${escapeHtml(dossier.takeaway || "暂无")}</p>
          <p class="dossier-meta">${escapeHtml(sourcePolicy)}</p>
        </section>
        ${dossier.answerPreview ? `<section class="dossier-section">
          <strong>原答案快照</strong>
          <p>${escapeHtml(compactText(dossier.answerPreview, 220))}</p>
          <details><summary>展开完整快照</summary><p>${escapeHtml(dossier.answerPreview)}</p></details>
        </section>` : ""}
        ${renderDossierSynthesisGuide(dossier.synthesisAnswer, synthesisGuide)}
        ${renderDossierDiagnosisSnapshot(dossier)}
        ${renderDossierReviewQueue(workbench?.reviewQueue)}
        ${renderDossierSelfTest(workbench?.selfTest, dossier)}
        ${renderDossierWorkbench(workbench, selectedProductIntake)}
        <div class="dossier-grid">
          <section class="dossier-section">
            <strong>结论清单</strong>
            ${renderDossierList(dossier.conclusions || [])}
          </section>
          <section class="dossier-section">
            <strong>行动顺序</strong>
            ${renderDossierList(dossier.nextActions || [])}
          </section>
          <section class="dossier-section">
            <strong>还缺什么</strong>
            ${renderDossierList(dossier.missingInputs || [])}
          </section>
          <section class="dossier-section">
            <strong>继续追问</strong>
            ${renderDossierList(dossier.followUps || [])}
          </section>
        </div>
        <section class="dossier-section">
          <strong>已采纳证据</strong>
          ${renderDossierEvidenceList(dossier.acceptedEvidence || [], "accepted")}
        </section>
        <section class="dossier-section">
          <strong>已排除证据</strong>
          ${renderDossierEvidenceList(dossier.rejectedEvidence || [], "rejected")}
        </section>
        <section class="dossier-section">
          <strong>已排除来源</strong>
          ${renderExcludedDossierSources(dossier.excludedSources || [])}
        </section>
        <section class="dossier-section" data-dossier-source-section>
          <strong>原始来源身份</strong>
          ${renderDossierSources(dossier.sources || [], dossier)}
        </section>`;

        lockDossierDetailActions(dossierGate);
        dossierDetailEl.querySelector("[data-dossier-close]")?.addEventListener("click", () => {
          selectedDossier = null;
          renderDossierDetail();
        });
        dossierDetailEl.querySelector("[data-dossier-continue]")?.addEventListener("click", (event) => {
          openDossier(event.currentTarget.dataset.dossierContinue).catch((error) => {
            dossierDetailEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
          });
        });
        dossierDetailEl.querySelectorAll("[data-dossier-prompt]").forEach((button) => {
          button.addEventListener("click", () => fillDossierPrompt(button.dataset.dossierPrompt || ""));
        });
        dossierDetailEl.querySelectorAll("[data-dossier-validation-prompt]").forEach((button) => {
          button.addEventListener("click", () => fillDossierPrompt(button.dataset.dossierValidationPrompt || ""));
        });
        dossierDetailEl.querySelectorAll("[data-dossier-synthesis-prompt]").forEach((button) => {
          button.addEventListener("click", () => fillDossierPrompt(button.dataset.dossierSynthesisPrompt || ""));
        });
        dossierDetailEl.querySelectorAll("[data-review-check]").forEach((input) => {
          input.addEventListener("change", () => {
            updateDossierReview(input.dataset.reviewCheck || "", input.checked).catch((error) => {
              dossierDetailEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });
        });
        dossierDetailEl.querySelectorAll("[data-self-test-check]").forEach((input) => {
          input.addEventListener("change", () => {
            updateDossierSelfTest(input.dataset.selfTestCheck || "", input.checked).catch((error) => {
              dossierDetailEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });
        });
        dossierDetailEl.querySelectorAll("[data-dossier-context-prompt]").forEach((button) => {
          button.addEventListener("click", () => {
            fillDossierPromptWithContext(button.dataset.dossierContextPrompt || "", button.dataset.dossierProductText).catch((error) => {
              dossierDetailEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });
        });
        dossierDetailEl.querySelectorAll("[data-business-record-prompt]").forEach((button) => {
          button.addEventListener("click", () => {
            fillBusinessVerificationPrompt(button.dataset.businessRecordPrompt || "").catch((error) => {
              dossierDetailEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });
        });
        dossierDetailEl.querySelectorAll("[data-dossier-source-decision]").forEach((button) => {
          button.addEventListener("click", () => {
            saveDossierSourceDecision(Number(button.dataset.dossierSourceIndex), button.dataset.dossierSourceDecision).catch((error) => {
              dossierDetailEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });
        });
        dossierDetailEl.querySelector("[data-product-intake]")?.addEventListener("click", () => {
          summarizeProductIntake().catch((error) => {
            selectedProductIntake = { error: error.message };
            renderDossierDetail();
          });
        });
        dossierDetailEl.querySelector("[data-business-verification-save]")?.addEventListener("click", () => {
          saveBusinessVerification().catch((error) => {
            selectedProductIntake = { error: error.message };
            renderDossierDetail();
          });
        });
        dossierDetailEl.querySelector("[data-experiment-result-save]")?.addEventListener("click", () => {
          saveExperimentResult().catch((error) => {
            selectedExperimentResultError = error.message;
            renderDossierDetail();
          });
        });
      }

      function dossierAdvanceGate(dossier) {
        const hasAcceptedEvidence = Array.isArray(dossier?.acceptedEvidence) && dossier.acceptedEvidence.length > 0;
        return hasAcceptedEvidence
          ? { locked: false, label: "", reason: "" }
          : {
              locked: true,
              label: "先确认来源",
              reason: "这个档案还没有已采纳的作者原文证据；先在原始来源身份里确认至少一段来源有用，再继续追问、补材料或记录实验。",
            };
      }

      function renderDossierAdvanceGateNotice(gate) {
        if (!gate?.locked) return "";
        return `<section class="source-scope is-stale-source" aria-label="档案证据门">
          <strong>${escapeHtml(gate.label)}</strong>
          <p>${escapeHtml(gate.reason)}</p>
        </section>`;
      }

      function lockDossierDetailActions(gate) {
        if (!gate?.locked) return;
        dossierDetailEl.querySelectorAll([
          "[data-dossier-continue]",
          "[data-dossier-prompt]",
          "[data-dossier-validation-prompt]",
          "[data-dossier-synthesis-prompt]",
          "[data-review-check]",
          "[data-self-test-check]",
          "[data-dossier-context-prompt]",
          "[data-business-record-prompt]",
          "[data-product-intake]",
          "[data-business-verification-save]",
          "[data-experiment-result-save]",
        ].join(",")).forEach((control) => {
          control.disabled = true;
          control.title = gate.reason;
          if (control.tagName === "BUTTON") control.textContent = gate.label;
        });
      }

      function renderDossierReviewQueue(queue) {
        if (!queue || !queue.progress || !Array.isArray(queue.items) || queue.progress.total === 0) return "";
        const progress = queue.progress;
        const percent = Math.max(0, Math.min(100, Number(progress.percent) || 0));
        const stages = Array.isArray(queue.stages) && queue.stages.length
          ? `<div class="review-stages">${queue.stages.map((stage) => `<span class="review-stage">${escapeHtml(reviewKindLabel(stage.kind))} ${stage.completed}/${stage.total}</span>`).join("")}</div>`
          : "";
        const next = queue.nextItem
          ? `<p class="dossier-meta">下一步：${escapeHtml(queue.nextItem.label || "")}</p>`
          : `<p class="dossier-meta">这个档案的推进项已经全部处理。</p>`;
        const items = queue.items
          .slice(0, 24)
          .map((item) => renderDossierReviewItem(item))
          .join("");
        return `<section class="review-queue" aria-label="学习路径与推进队列">
          <header>
            <strong>学习路径与推进队列</strong>
            <span>${escapeHtml(queue.summary || "把档案转成可持续推进项。")}</span>
          </header>
          <div class="review-progress">
            <div class="review-progress-track" aria-label="推进进度">
              <div class="review-progress-bar" style="width: ${percent}%"></div>
            </div>
            <p class="dossier-meta">已处理 ${progress.completed || 0}/${progress.total || 0} 项 · ${percent}%</p>
            ${stages}
            ${next}
          </div>
          <div class="review-items">${items}</div>
        </section>`;
      }

      function renderDossierReviewItem(item) {
        const done = item.done === true;
        const canManualComplete = item.canManualComplete !== false;
        const prompt = item.prompt
          ? `<button class="dossier-fill-question" type="button" data-dossier-prompt="${escapeAttribute(item.prompt)}">填入追问</button>`
          : "";
        const status = item.completionLabel
          ? `<p>${escapeHtml(item.completionLabel)}${item.completionReason ? `：${escapeHtml(item.completionReason)}` : ""}</p>`
          : "";
        return `<article class="review-item${done ? " is-done" : ""}${canManualComplete ? "" : " is-locked"}">
          <label>
            <input type="checkbox" data-review-check="${escapeAttribute(item.id || "")}" ${done ? "checked" : ""} ${canManualComplete ? "" : "disabled"} />
            <span>
              <strong>${escapeHtml(item.label || "推进项")}</strong>
              <span>${escapeHtml(reviewKindLabel(item.kind))}</span>
              ${item.reason ? `<p>${escapeHtml(item.reason)}</p>` : ""}
              ${status}
            </span>
          </label>
          ${prompt}
        </article>`;
      }

      function renderDossierSelfTest(selfTest, dossier) {
        if (!selfTest || !selfTest.progress || !Array.isArray(selfTest.items) || selfTest.progress.total === 0) return "";
        const progress = selfTest.progress;
        const percent = Math.max(0, Math.min(100, Number(progress.percent) || 0));
        const hasAcceptedEvidence = Array.isArray(dossier?.acceptedEvidence) && dossier.acceptedEvidence.length > 0;
        const noEvidenceWarning = hasAcceptedEvidence
          ? ""
          : `<p class="self-test-warning">这个档案还没有已采纳原文证据；下面内容只来自保存时回答快照。</p>`;
        const items = selfTest.items
          .slice(0, 10)
          .map((item) => renderDossierSelfTestCard(item))
          .join("");
        return `<section class="self-test" aria-label="理解自测">
          <header>
            <strong>理解自测</strong>
            <span>${escapeHtml(selfTest.summary || "用几个问题复习保存档案。")}</span>
          </header>
          <p class="self-test-caution">自测只帮助你复习保存档案，不产生新证据，也不代表产品验证完成。</p>
          ${noEvidenceWarning}
          <div class="review-progress">
            <div class="review-progress-track" aria-label="理解进度">
              <div class="review-progress-bar" style="width: ${percent}%"></div>
            </div>
            <p class="dossier-meta">已理解 ${progress.mastered || 0}/${progress.total || 0} 张 · ${percent}%</p>
          </div>
          <div class="self-test-items">${items}</div>
        </section>`;
      }

      function renderDossierSelfTestCard(item) {
        const mastered = item.mastered === true;
        return `<article class="self-test-card${mastered ? " is-mastered" : ""}">
          <div>
            <strong>${escapeHtml(item.question || "自测问题")}</strong>
            <details>
              <summary>查看保存时内容</summary>
              <p>${escapeHtml(item.answer || "")}</p>
              ${item.explanation ? `<p>${escapeHtml(item.explanation)}</p>` : ""}
            </details>
          </div>
          <label>
            <input type="checkbox" data-self-test-check="${escapeAttribute(item.id || "")}" ${mastered ? "checked" : ""} />
            我已理解这条档案内容
          </label>
        </article>`;
      }

      function reviewKindLabel(kind) {
        if (kind === "diagnosis") return "诊断排查";
        if (kind === "action") return "行动复盘";
        if (kind === "input") return "补充材料";
        if (kind === "evidence") return "证据复核";
        if (kind === "question") return "继续追问";
        return "复盘";
      }

      async function updateDossierReview(itemId, checked) {
        if (!selectedDossier?.id || !itemId) return;
        const payload = await fetchJson(`/api/dossiers/${encodeURIComponent(selectedDossier.id)}/review`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ checked: { [itemId]: checked === true } }),
        });
        selectedDossier = payload.dossier || selectedDossier;
        selectedDossierWorkbench = payload.workbench || selectedDossierWorkbench;
        renderDossierDetail();
        await loadDossiers();
      }

      async function updateDossierSelfTest(itemId, mastered) {
        if (!selectedDossier?.id || !itemId) return;
        const payload = await fetchJson(`/api/dossiers/${encodeURIComponent(selectedDossier.id)}/self-test`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ mastered: { [itemId]: mastered === true } }),
        });
        selectedDossier = payload.dossier || selectedDossier;
        selectedDossierWorkbench = payload.workbench || selectedDossierWorkbench;
        renderDossierDetail();
        await loadDossiers();
      }

      function renderLearningOverview(overview) {
        if (!learningOverviewEl) return;
        if (!overview || !overview.totals || overview.totals.dossiers === 0) {
          learningOverviewEl.innerHTML = `<div class="overview-card"><strong>今日继续</strong><p>保存一次知识库回答后，这里会显示下一步学习路径。</p></div>`;
          return;
        }
        const totals = overview.totals || {};
        const percent = Math.max(0, Math.min(100, Number(totals.reviewPercent) || 0));
        const nextItems = Array.isArray(overview.nextItems) ? overview.nextItems.slice(0, 3) : [];
        const gaps = Array.isArray(overview.evidenceGaps) ? overview.evidenceGaps.slice(0, 2) : [];
        const missions = Array.isArray(overview.researchMissions) ? overview.researchMissions.slice(0, 4) : [];
        const studyMaterials = Array.isArray(overview.studyMaterials) ? overview.studyMaterials.slice(0, 4) : [];
        const mastery = overview.mastery && typeof overview.mastery === "object" ? overview.mastery : null;
        const learningProducts = Array.isArray(overview.learningProducts) ? overview.learningProducts.slice(0, 5) : [];
        const learningPaths = Array.isArray(overview.learningPaths) ? overview.learningPaths.slice(0, 4) : [];
        const allTopicGroups = Array.isArray(overview.topicGroups) ? overview.topicGroups : [];
        let topicGroups = allTopicGroups.slice(0, 3);
        if (selectedTopicId && !topicGroups.some((group) => group.id === selectedTopicId)) {
          const selectedFromAll = allTopicGroups.find((group) => group.id === selectedTopicId);
          if (selectedFromAll) topicGroups = [...topicGroups, selectedFromAll];
        }
        if (selectedTopicId && !allTopicGroups.some((group) => group.id === selectedTopicId)) selectedTopicId = "";
        const selectedTopic = topicGroups.find((group) => group.id === selectedTopicId);
        const verificationDimensionMeta = totals.businessVerificationDimensionsTotal
          ? ` · 验证覆盖 ${totals.businessVerificationDimensionsReady || 0}/${totals.businessVerificationDimensionsTotal}`
          : "";
        const experimentMeta = totals.experimentResults
          ? ` · 实验复盘 ${totals.experimentResultsPositive || 0}/${totals.experimentResults} 条正向`
          : "";
        learningOverviewEl.innerHTML = `<section class="overview-card" aria-label="跨档案学习总览">
          <strong>今日继续</strong>
          <p>${escapeHtml(overview.summary || "")}</p>
          <div class="overview-progress" aria-label="总推进进度"><span style="width: ${percent}%"></span></div>
          <p>已处理 ${totals.reviewCompleted || 0}/${totals.reviewTotal || 0} 个推进项 · 自测理解 ${totals.selfTestMastered || 0}/${totals.selfTestTotal || 0} 张 · 已保存业务材料 ${totals.businessVerificationRecords || 0} 条 · 未补产品材料档案 ${totals.businessVerificationOpen || 0} 个${verificationDimensionMeta}${experimentMeta} · 缺证据档案 ${totals.dossiersWithoutAcceptedEvidence || 0} 个</p>
          ${mastery ? renderMasteryPanel(mastery) : ""}
          ${learningPaths.length ? renderLearningPathOverview(learningPaths) : ""}
          ${topicGroups.length ? `<section class="study-materials" aria-label="研究主题"><strong>研究主题</strong>${topicGroups.map((group) => renderTopicGroup(group, group.id === selectedTopicId)).join("")}${selectedTopic ? renderTopicWorkbench(selectedTopic, learningProducts) : ""}</section>` : ""}
          ${learningProducts.length ? `<section class="learning-products" aria-label="学习产物"><strong>学习产物</strong><p>这些产物是从本地学习档案临时生成的，不写入原始知识库。</p>${learningProducts.map((product) => renderLearningProduct(product)).join("")}</section>` : ""}
          ${missions.length ? `<section class="mission-board" aria-label="研究推进清单"><strong>研究推进清单</strong><p>顺序：固化证据 → 补产品材料 → 补验证缺口 → 跑小实验 → 复盘执行 → 自测理解。</p>${missions.map((mission) => renderResearchMission(mission)).join("")}</section>` : ""}
          ${studyMaterials.length ? `<section class="study-materials" aria-label="学习摘要与追问"><strong>学习摘要与追问</strong><p>这里是已保存档案的摘要、已采纳证据和下一轮问题，不等同于完整讲义。</p>${studyMaterials.map((material) => renderStudyMaterial(material)).join("")}</section>` : ""}
          ${nextItems.length ? `<div class="overview-item-list">${nextItems.map((item) => renderOverviewNextItem(item)).join("")}</div>` : "<p>当前没有待处理推进项。</p>"}

        </section>`;
        learningOverviewEl.querySelectorAll("[data-overview-view]").forEach((button) => {

        learningOverviewEl.querySelectorAll("[data-overview-prompt]").forEach((button) => {

        learningOverviewEl.querySelectorAll("[data-learning-product-prompt]").forEach((button) => {

        learningOverviewEl.querySelectorAll("[data-learning-product-copy]").forEach((button) => {

        learningOverviewEl.querySelectorAll("[data-learning-product-download]").forEach((button) => {

        learningOverviewEl.querySelectorAll("[data-topic-source-focus]").forEach((button) => {

        learningOverviewEl.querySelectorAll("[data-evidence-report-source-focus]").forEach((button) => {

        learningOverviewEl.querySelectorAll("[data-topic-open]").forEach((button) => {

        learningOverviewEl.querySelectorAll("[data-learning-path-evidence]").forEach((button) => {

              notesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });

        learningOverviewEl.querySelectorAll("[data-evidence-needed-dossier]").forEach((button) => {

            showDossierDetails(button.dataset.topicDossierId || "").catch((error) => {
              notesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;

      function renderMasteryPanel(mastery) {
        const score = Math.max(0, Math.min(100, Number(mastery.score || 0)));
        const stages = Array.isArray(mastery.stages) ? mastery.stages.slice(0, 4) : [];
        const topics = Array.isArray(mastery.topics) ? mastery.topics.slice(0, 5) : [];
        return `<section class="mastery-panel" data-status="${escapeAttribute(mastery.status || "")}" aria-label="亚马逊学习掌握面板">
          <div class="mastery-head">
            <strong>${escapeHtml(mastery.title || "亚马逊学习掌握面板")}</strong>
            <span>${escapeHtml(mastery.label || "")} · ${score}%</span>
          </div>
          <div class="overview-progress" aria-label="掌握度"><span style="width: ${score}%"></span></div>
          <p>${escapeHtml(mastery.summary || "")}</p>
          <p>下一步：${escapeHtml(mastery.nextAction || "")}</p>
          <div class="mastery-grid">${stages.map(renderMasteryStage).join("")}</div>
          ${topics.length ? `<div class="mastery-topic-grid">${topics.map(renderMasteryTopic).join("")}</div>` : ""}
          <p>${escapeHtml(mastery.boundary || "掌握面板只整理学习进度，不写入原始知识库。")}</p>
        </section>`;
      }

      function renderMasteryStage(stage) {
        const percent = Math.max(0, Math.min(100, Number(stage.percent || 0)));
        return `<article class="mastery-stage" data-status="${escapeAttribute(stage.status || "")}">
          <strong>${escapeHtml(stage.label || "")}</strong>
          <span>${formatNumber(stage.done || 0)}/${formatNumber(stage.total || 0)} · ${percent}%</span>
          <div class="overview-progress" aria-label="${escapeAttribute(stage.label || "阶段")}进度"><span style="width: ${percent}%"></span></div>
          <span>${escapeHtml(stage.detail || "")}</span>
        </article>`;
      }

      function renderMasteryTopic(topic) {
        const percent = Math.max(0, Math.min(100, Number(topic.percent || 0)));
        return `<article class="mastery-topic" data-status="${escapeAttribute(topic.status || "")}">
          <strong>${escapeHtml(topic.label || "研究主题")}</strong>
          <span>${escapeHtml(topic.statusLabel || "")} · ${percent}%</span>
          <div class="overview-progress" aria-label="${escapeAttribute(topic.label || "研究主题")}掌握度"><span style="width: ${percent}%"></span></div>
          <span>${escapeHtml(topic.currentStep || "继续学习")}：${escapeHtml(topic.nextAction || "")}</span>
        </article>`;
      }

      function renderLearningPathOverview(paths) {
        const safePaths = Array.isArray(paths) ? paths.filter((path) => path && path.topicId).slice(0, 4) : [];
        if (!safePaths.length) return "";
        return `<section class="learning-path-overview" aria-label="主题学习路径">
          <header>
            <strong>主题学习路径</strong>
            <span>不写入原始知识库</span>
          </header>
          <p>按主题把来源证据、产品材料、小实验和复盘串起来；业务材料和实验结果不会当成作者原文证据。</p>
          <div class="learning-path-list">
            ${safePaths.map((path) => renderLearningPathCard(path)).join("")}
          </div>
        </section>`;
      }

      function renderLearningPathCard(path) {
        const progress = path.progress || {};
        const percent = Math.max(0, Math.min(100, Number(progress.percent) || 0));
        const metrics = path.metrics || {};
        const currentStep = path.currentStep || {};
        const relatedDossiers = Array.isArray(path.relatedDossiers) ? path.relatedDossiers.slice(0, 2) : [];
        const materialTemplate = path.materialTemplate || {};
        const experimentTemplate = path.experimentTemplate || {};
        const relatedText = relatedDossiers.length
          ? `相关档案：${relatedDossiers.map((item) => item.title || item.question || "学习档案").join("、")}`
          : "相关档案：暂无";
        const materialButton = path.status === "source_backed" && relatedDossiers[0]?.id
          ? `<button class="small-action" type="button" data-learning-path-materials="${escapeAttribute(relatedDossiers[0].id)}" data-material-template="${escapeAttribute(materialTemplate.text || DEFAULT_PRODUCT_MATERIAL_TEMPLATE)}">补产品材料</button>`
          : "";
        const validationButton = path.status === "needs_experiment" && relatedDossiers[0]?.id
          ? `<button class="small-action" type="button" data-learning-path-validation="${escapeAttribute(relatedDossiers[0].id)}" data-experiment-template="${escapeAttribute(experimentTemplate.text || DEFAULT_EXPERIMENT_RESULT_TEMPLATE)}">看验证方案</button>`
          : "";
        return `<article class="learning-path-card" data-status="${escapeAttribute(path.status || "")}">
          <div class="learning-path-head">
            <strong>${escapeHtml(path.topicLabel || "研究主题")}</strong>
            <span>${escapeHtml(path.statusLabel || "待推进")}</span>
          </div>
          <div class="overview-progress" aria-label="${escapeAttribute(path.topicLabel || "研究主题")}进度"><span style="width: ${percent}%"></span></div>
          <p>当前：${escapeHtml(currentStep.label || "继续学习")} · ${escapeHtml(path.nextAction || currentStep.reason || "")}</p>
          <div class="learning-path-meta">
            <span>进度 ${Number(progress.done || 0)}/${Number(progress.total || 0)}</span>
            <span>档案 ${Number(metrics.dossiers || 0)}</span>
            <span>证据 ${Number(metrics.evidence || 0)}</span>
            <span>材料 ${Number(metrics.materials || 0)}</span>
            <span>实验 ${Number(metrics.experiments || 0)}</span>
          </div>
          <p>${escapeHtml(relatedText)}</p>
          <div class="workbench-actions">
            <button class="small-action" type="button" data-learning-path-open="${escapeAttribute(path.topicId || "")}">打开主题</button>
            ${path.status === "needs_evidence" && relatedDossiers[0]?.id ? `<button class="small-action" type="button" data-learning-path-evidence="${escapeAttribute(relatedDossiers[0].id)}">补来源证据</button>` : ""}
            ${materialButton}
            ${validationButton}
            ${path.nextPrompt ? `<button class="small-action" type="button" data-overview-prompt="${escapeAttribute(path.nextPrompt)}">填入下一问</button>` : ""}
          </div>
          <p>${escapeHtml(path.boundary || "主题学习路径只整理学习档案，不写入原始知识库。")}</p>
        </article>`;
      }

      function renderStudyMaterial(material) {
        const items = Array.isArray(material.items) ? material.items.filter(Boolean).slice(0, 5) : [];
        return `<article class="study-material">
          <div class="overview-item-head">
            <strong>${escapeHtml(material.title || "学习材料")}</strong>
            <span>${escapeHtml(studyMaterialTypeLabel(material.type))}</span>
          </div>
          <p>${escapeHtml(material.body || "")}</p>
