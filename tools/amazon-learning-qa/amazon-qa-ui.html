<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>亚马逊学习问答</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #171717;
        --muted: #626262;
        --line: #d9d5cc;
        --paper: #fbfaf7;
        --panel: #ffffff;
        --accent: #0e6b60;
        --accent-2: #b04724;
        --soft: #eef5f2;
        --warn: #fff2db;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      button,
      textarea {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      }

      .side {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.15;
        font-weight: 760;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .health {
        border-left: 4px solid var(--accent);
        background: var(--soft);
        padding: 10px 12px;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.65;
      }

      .health.needs_index,
      .health.partial_index {
        border-left-color: var(--accent-2);
        background: var(--warn);
      }

      .knowledge-readiness {
        border: 1px solid rgba(14, 107, 96, 0.16);
        background: #fbfffd;
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      .knowledge-readiness-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
      }

      .knowledge-readiness-title strong {
        font-size: 14px;
      }

      .knowledge-readiness-title span {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      .knowledge-readiness-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .knowledge-readiness-item {
        border: 1px solid rgba(23, 23, 23, 0.08);
        background: #fff;
        padding: 9px 10px;
        min-height: 62px;
      }

      .knowledge-readiness-item strong {
        display: block;
        font-size: 18px;
        line-height: 1.15;
      }

      .knowledge-readiness-item span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 5px;
        line-height: 1.35;
      }

      .knowledge-readiness-note {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .readiness-stages {
        display: grid;
        gap: 8px;
      }

      .readiness-stage {
        border: 1px solid rgba(23, 23, 23, 0.08);
        background: #fff;
        padding: 9px 10px;
        display: grid;
        gap: 5px;
      }

      .readiness-stage[data-status="ready"] {
        border-color: rgba(14, 107, 96, 0.2);
        background: var(--soft);
      }

      .readiness-stage[data-status="processing"],
      .readiness-stage[data-status="partial"] {
        border-color: rgba(176, 71, 36, 0.22);
        background: #fffaf2;
      }

      .readiness-stage strong {
        font-size: 13px;
        line-height: 1.35;
      }

      .readiness-stage span {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .source-tree-note {
        border-top: 1px solid rgba(23, 23, 23, 0.08);
        padding-top: 8px;
      }

      .source-tree-drain {
        border: 1px solid rgba(23, 23, 23, 0.08);
        background: #fff;
        padding: 10px;
        display: grid;
        gap: 8px;
      }

      .source-tree-drain[data-level="running"] {
        border-color: rgba(14, 107, 96, 0.24);
        background: var(--soft);
      }

      .source-tree-drain[data-level="stopping"],
      .source-tree-drain[data-level="needs_attention"],
      .source-tree-drain[data-level="stale"] {
        border-color: rgba(176, 71, 36, 0.28);
        background: #fffaf2;
      }

      .source-tree-drain-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .source-tree-drain-head strong {
        font-size: 13px;
      }

      .source-tree-drain-head span,
      .source-tree-drain p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .source-tree-drain p {
        margin: 0;
      }

      .source-tree-drain-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .source-tree-drain-action-note {
        flex-basis: 100%;
      }

      .counts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        border: 1px solid var(--line);
        background: #fff;
        padding: 10px 12px;
        min-height: 72px;
      }

      .metric strong {
        display: block;
        font-size: 20px;
        line-height: 1.1;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }

      .ask {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      textarea {
        width: 100%;
        min-height: 128px;
        resize: vertical;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 14px;
        line-height: 1.65;
        outline: none;
      }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(14, 107, 96, 0.12);
      }

      .primary {
        border: 0;
        background: var(--accent);
        color: white;
        min-height: 44px;
        padding: 0 16px;
        cursor: pointer;
        font-weight: 720;
      }

      .primary:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .secondary {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        min-height: 40px;
        padding: 0 12px;
        cursor: pointer;
        font-weight: 680;
      }

      .secondary:hover {
        border-color: var(--accent);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--ink);
        padding: 8px 10px;
        cursor: pointer;
        text-align: left;
        line-height: 1.35;
        max-width: 100%;
      }

      .chip:hover {
        border-color: var(--accent);
      }

      .main {
        height: 100vh;
        padding: 34px clamp(24px, 4vw, 56px);
        display: grid;
        grid-template-rows: auto auto auto minmax(260px, 1fr) auto;
        gap: 24px;
        overflow-y: auto;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 20px;
      }

      .namespace {
        color: var(--muted);
        font-size: 13px;
      }

      .conversation {
        overflow-y: auto;
        padding-right: 8px;
        display: grid;
        align-content: start;
        gap: 18px;
      }

      .message {
        max-width: 980px;
        display: grid;
        gap: 8px;
      }

      .message.user {
        margin-left: auto;
        width: min(760px, 92%);
      }

      .message.assistant {
        width: min(980px, 100%);
      }

      .answer-panel-group {
        border: 1px solid rgba(23, 23, 23, 0.1);
        background: #fff;
        padding: 0;
      }

      .answer-panel-group summary {
        cursor: pointer;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        color: var(--ink);
        font-weight: 760;
        list-style-position: inside;
      }

      .answer-panel-group summary span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        text-align: right;
      }

      .answer-panel-group-body {
        border-top: 1px solid rgba(23, 23, 23, 0.08);
        padding: 12px;
        display: grid;
        gap: 12px;
      }

      .role {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .bubble {
        border: 1px solid var(--line);
        background: #fff;
        padding: 16px 18px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.85;
        font-size: 16px;
      }

      .message.user .bubble {
        background: var(--soft);
        border-color: rgba(14, 107, 96, 0.22);
      }

      .answer-studio {
        border: 1px solid rgba(14, 107, 96, 0.2);
        background: #fbfffd;
        padding: 14px 16px;
        display: grid;
        gap: 12px;
      }

      .answer-studio header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .answer-studio-title {
        display: grid;
        gap: 4px;
      }

      .answer-studio-title strong {
        font-size: 15px;
      }

      .answer-studio-title span,
      .answer-studio-boundary,
      .answer-studio-card p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        margin: 0;
      }

      .answer-studio-count {
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .answer-brief {
        border: 1px solid rgba(14, 107, 96, 0.22);
        background: linear-gradient(180deg, #ffffff 0%, #f8fcfa 100%);
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      .answer-brief-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .answer-brief-head strong {
        font-size: 14px;
      }

      .answer-brief-head span {
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .answer-brief-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .answer-brief-block {
        border: 1px solid rgba(23, 23, 23, 0.08);
        background: #fff;
        padding: 10px;
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      .answer-brief-block[data-kind="gap"] {
        border-color: rgba(176, 71, 36, 0.18);
        background: #fffaf2;
      }

      .answer-brief-block strong {
        font-size: 12px;
        color: var(--muted);
      }

      .answer-brief-block p {
        margin: 0;
        font-size: 13px;
        line-height: 1.55;
      }

      .answer-brief-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .answer-studio-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .answer-studio-card {
        border: 1px solid rgba(23, 23, 23, 0.09);
        background: #fff;
        padding: 10px;
        display: grid;
        gap: 8px;
        min-width: 0;
      }

        .answer-studio-card strong {
          font-size: 13px;
          line-height: 1.35;
        }

      .answer-studio-status {
        color: var(--accent-2);
        font-size: 12px;
        font-weight: 800;
      }

      .answer-studio-card[data-kind="source"],
      .answer-studio-card[data-kind="evidence"] {
        border-color: rgba(176, 71, 36, 0.2);
        background: #fffaf2;
      }

      .answer-studio-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .answer-studio-button {
        border: 1px solid rgba(14, 107, 96, 0.2);
        background: #fff;
        color: var(--accent);
        min-height: 30px;
        padding: 4px 9px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 760;
      }

      .answer-studio-button:hover {
        border-color: var(--accent);
        background: var(--soft);
      }

      .answer-studio-button[disabled] {
        color: var(--muted);
        cursor: not-allowed;
        opacity: 0.72;
      }

      .is-studio-focused {
        outline: 2px solid rgba(14, 107, 96, 0.35);
        outline-offset: 2px;
      }

      .inline-ref {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(176, 71, 36, 0.26);
        background: #fffaf2;
        color: var(--accent-2);
        font-size: 12px;
        line-height: 1.2;
        min-height: 24px;
        padding: 2px 6px;
        margin-left: 4px;
        cursor: pointer;
        vertical-align: baseline;
      }

      .inline-ref.inference {
        border-color: rgba(14, 107, 96, 0.24);
        background: var(--soft);
        color: var(--accent);
      }

      .inline-ref.evidence {
        border-color: rgba(176, 71, 36, 0.3);
        background: #fffaf2;
        color: var(--accent-2);
      }

      .inline-ref.action {
        border-color: rgba(23, 23, 23, 0.16);
        background: #fff;
        color: var(--ink);
      }

      .inline-ref.missing {
        border-color: var(--line);
        background: #fff;
        color: var(--muted);
        cursor: default;
      }

      .inline-ref:hover {
        border-color: currentColor;
      }

      .empty {
        max-width: 680px;
        color: var(--muted);
        border-left: 4px solid var(--accent);
        padding-left: 16px;
        line-height: 1.8;
      }

      .sources {
        display: grid;
        gap: 12px;
      }

      .source-trust {
        border: 1px solid rgba(14, 107, 96, 0.18);
        background: #fbfffd;
        padding: 14px 16px;
        display: grid;
        gap: 12px;
      }

      .source-trust[data-status="needs_source"] {
        border-color: rgba(176, 71, 36, 0.24);
        background: #fffaf2;
      }

      .source-trust header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .source-trust header strong {
        font-size: 15px;
      }

      .source-trust-status {
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        text-align: right;
      }

      .source-trust[data-status="needs_source"] .source-trust-status {
        color: var(--accent-2);
      }

      .source-trust-summary,
      .source-trust-boundary,
      .source-trust-item p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        margin: 0;
      }

      .source-trust-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .source-trust-item {
        border: 1px solid rgba(23, 23, 23, 0.09);
        background: #fff;
        padding: 10px;
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      .source-trust-item[data-state="missing"] {
        background: #fffaf2;
        border-color: rgba(176, 71, 36, 0.18);
      }

      .source-trust-item strong {
        font-size: 13px;
        line-height: 1.35;
      }

      .source-trust-count {
        color: var(--accent);
        font-weight: 800;
        font-size: 12px;
      }

      .source-trust-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .source-trust-route {
        border: 1px solid rgba(14, 107, 96, 0.14);
        background: #f7fbf9;
        padding: 10px 12px;
        display: grid;
        gap: 5px;
      }

      .source-trust-route strong {
        font-size: 13px;
      }

      .source-trust-route p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        margin: 0;
      }

      .knowledge-gap-radar {
        border: 1px solid rgba(51, 88, 132, 0.18);
        background: #fbfcff;
        padding: 14px 16px;
        display: grid;
        gap: 12px;
      }

      .knowledge-gap-radar[data-status="needs_source"],
      .knowledge-gap-radar[data-status="needs_review"] {
        border-color: rgba(176, 71, 36, 0.22);
        background: #fffaf2;
      }

      .knowledge-gap-radar header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .knowledge-gap-radar header strong {
        font-size: 15px;
      }

      .knowledge-gap-radar header p,
      .knowledge-gap-item p,
      .knowledge-gap-priority p,
      .knowledge-gap-boundary {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .knowledge-gap-status {
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .knowledge-gap-radar[data-status="needs_source"] .knowledge-gap-status,
      .knowledge-gap-radar[data-status="needs_review"] .knowledge-gap-status {
        color: var(--accent-2);
      }

      .knowledge-gap-metrics {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .knowledge-gap-metrics span {
        border: 1px solid rgba(23, 23, 23, 0.08);
        background: #fff;
        padding: 8px 9px;
        display: grid;
        gap: 2px;
        min-width: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .knowledge-gap-metrics strong {
        color: var(--ink);
        font-size: 16px;
      }

      .knowledge-gap-priority,
      .knowledge-gap-item {
        border: 1px solid rgba(23, 23, 23, 0.09);
        background: #fff;
        padding: 10px;
        display: grid;
        gap: 7px;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .knowledge-gap-priority {
        border-color: rgba(176, 71, 36, 0.22);
      }

      .knowledge-gap-priority > span,
      .knowledge-gap-item > span {
        color: var(--muted);
        font-size: 11px;
      }

      .knowledge-gap-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .knowledge-gap-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .answer-effectiveness {
        border: 1px solid rgba(14, 107, 96, 0.16);
        background: #fbfffd;
        padding: 12px 14px;
        display: grid;
        gap: 10px;
      }

      .answer-effectiveness header {
        display: grid;
        gap: 4px;
      }

      .answer-effectiveness strong {
        font-size: 14px;
      }

      .answer-effectiveness p,
      .answer-effectiveness-status,
      .answer-effectiveness-boundary {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .answer-effectiveness-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .answer-effectiveness-button {
        border: 1px solid rgba(23, 23, 23, 0.12);
        background: #fff;
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .answer-effectiveness-button.is-active {
        border-color: rgba(14, 107, 96, 0.42);
        background: var(--soft);
        color: var(--accent);
      }

      .usage-footprint {
        border: 1px solid rgba(14, 107, 96, 0.18);
        background: #f8fbf9;
        padding: 12px 14px;
        display: grid;
        gap: 9px;
        overflow-wrap: anywhere;
      }

      .usage-footprint header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: start;
      }

      .usage-footprint strong {
        font-size: 13px;
      }

      .usage-footprint p,
      .usage-footprint span {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .usage-footprint-metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .usage-footprint-metrics span {
        border: 1px solid rgba(14, 107, 96, 0.14);
        background: #fff;
        padding: 8px;
      }

      .usage-footprint-metrics b {
        display: block;
        color: var(--ink);
        font-size: 15px;
      }

      .answer-generation {
        border: 1px solid rgba(23, 23, 23, 0.1);
        background: #fff;
        padding: 10px 12px;
        display: grid;
        gap: 6px;
        overflow-wrap: anywhere;
      }

      .answer-generation[data-mode="local_ollama"] {
        border-color: rgba(14, 107, 96, 0.2);
        background: #fbfffd;
      }

      .answer-generation strong {
        font-size: 13px;
      }

      .answer-generation p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .learning-effectiveness-summary {
        border: 1px solid rgba(14, 107, 96, 0.16);
        background: #fbfffd;
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      .learning-effectiveness-summary[data-status="needs_action"] {
        border-color: rgba(176, 71, 36, 0.22);
        background: #fffaf2;
      }

      .learning-effectiveness-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .learning-effectiveness-head strong,
      .learning-effectiveness-summary strong {
        font-size: 13px;

    <main class="app">
      <section class="side">
        <div class="brand">

        <section class="source-scope-panel">

            <strong>我的资料</strong>
            <button class="small-action" id="refreshUserSourcesButton" type="button">刷新</button>
          </div>
          <div class="user-source-form">
            <input id="userSourceTitle" type="text" maxlength="120" placeholder="资料标题，例如：我的竞品调研" />
            <textarea id="userSourceContent" placeholder="粘贴你自己的资料、笔记或调研内容。启用后可以只围绕这些资料问答。"></textarea>
            <label class="user-source-mode"><input id="userSourceOnlyMode" type="checkbox" /> 本轮只问已勾选的我的资料</label>

          </div>

        <section class="source-scope-panel">

            <button class="workbench-button" id="saveLearningNoteButton" type="button">保存笔记</button>

      async function loadStatus() {
        try {
          const status = await fetchJson("/api/status");
          namespaceEl.textContent = status.namespace;
          const userSourcePart = Number(status.userSourceCount || 0) > 0 ? `，我的资料 ${status.userSourceCount} 份` : "";
          const notePart = Number(status.learningNoteCount || 0) > 0 ? `，学习笔记 ${status.learningNoteCount} 条` : "";
          statusEl.textContent = `已连接本地知识库，共 ${status.storedDocuments} 篇资料${userSourcePart}${notePart}。`;
          renderHealth(status.health || {});
          renderKnowledgeReadiness(status);
          authorCounts = status.byAuthor || {};
          countsEl.innerHTML = Object.entries(status.byAuthor || {})
            .map(([author, count]) => `<div class="metric"><strong>${count}</strong><span>${escapeHtml(author)}</span></div>`)
            .join("");
          renderSourceScopeControls();
          chipsEl.innerHTML = (status.suggestedQuestions || [])
            .map((item) => `<button class="chip" type="button">${escapeHtml(item)}</button>`)
            .join("");
          chipsEl.querySelectorAll("button").forEach((button) => {
            button.addEventListener("click", () => {
              questionEl.value = button.textContent;
              ask(button.textContent);
            });
          });
        } catch (error) {
          statusEl.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
          healthEl.textContent = "索引状态读取失败。";
          knowledgeReadinessEl.innerHTML = `<div class="knowledge-readiness-title"><strong>可问答就绪状态</strong><span>读取失败</span></div><p class="knowledge-readiness-note">请确认本地问答服务和 OpenHuman 核心服务正在运行。</p>`;
        }
      }

      function renderHealth(health) {
        healthEl.className = `health ${health.level || ""}`;
        healthEl.textContent = `片段 ${health.chunks || 0} 个，语义索引 ${health.embeddedChunks || 0} 个，覆盖率 ${health.vectorCoveragePercent || 0}%。${health.message || ""}`;
      }

      function formatNumber(value) {
        const number = Number(value || 0);
        return Number.isFinite(number) ? number.toLocaleString("zh-CN") : "0";
      }

      function renderKnowledgeReadiness(status) {
        const health = status.health || {};
        const readiness = status.readiness || {};
        const sourceTree = health.sourceTree || {};
        const documents = Number(status.storedDocuments || status.manifestDocuments || 0);
        const chunks = Number(health.chunks || 0);
        const embeddedChunks = Number(health.embeddedChunks || 0);
        const answerableEvidence = Math.min(chunks, embeddedChunks);
        const coverage = Number(health.vectorCoveragePercent || 0);
        const sourceTreeCoverage = Number(sourceTree.coveragePercent || 0);
        const graphRelations = Number(health.graphRelations || 0);
        const indexLabel = readiness.message || (coverage >= 99 ? "可连续问答" : coverage > 0 ? "索引未满" : "等待索引");
        const graphNote =
          graphRelations >= 50
            ? `全库关系 ${formatNumber(graphRelations)} 条，可辅助浏览。`
            : `全库图谱很薄，仅 ${formatNumber(graphRelations)} 条；当前图谱以本轮问答证据为准。`;
        const sourceTreeNote =
          sourceTree.message ||
          "OpenHuman 来源树状态未知；当前只确认语义片段索引，不代表来源树已建立。";
        knowledgeReadinessEl.innerHTML = `
          <div class="knowledge-readiness-title">
            <strong>可问答就绪状态</strong>
            <span>${escapeHtml(readinessStageLabel(readiness.level || ""))}</span>
          </div>
          <p class="knowledge-readiness-note">${escapeHtml(indexLabel)}</p>
          ${renderReadinessStages(readiness.stages)}
          ${renderSourceTreeDrainControls(status.sourceTreeDrain)}
          <div class="knowledge-readiness-grid">
            <div class="knowledge-readiness-item"><strong>${formatNumber(documents)}</strong><span>已收集资料</span></div>
            <div class="knowledge-readiness-item"><strong>${formatNumber(answerableEvidence)}</strong><span>可回答证据</span></div>
            <div class="knowledge-readiness-item"><strong>${formatNumber(embeddedChunks)}</strong><span>本地语义索引</span></div>
            <div class="knowledge-readiness-item"><strong>${coverage}%</strong><span>索引覆盖率</span></div>
            <div class="knowledge-readiness-item"><strong>${sourceTreeCoverage}%</strong><span>来源树原文覆盖</span></div>
          </div>
          <p class="knowledge-readiness-note source-tree-note">OpenHuman 来源树：${escapeHtml(sourceTreeNote)}</p>
          <p class="knowledge-readiness-note">${escapeHtml(graphNote)}</p>
        `;
        knowledgeReadinessEl.querySelectorAll("[data-source-tree-drain-start]").forEach((button) => {
          button.addEventListener("click", () => startSourceTreeDrain(button));
        });
        knowledgeReadinessEl.querySelector("[data-source-tree-drain-stop]")?.addEventListener("click", stopSourceTreeDrain);
      }

      function renderSourceTreeDrainControls(drain) {
        if (!drain || typeof drain !== "object") return "";
        const level = drain.level || "idle";
        const stateLabel = sourceTreeDrainStateLabel(drain);
        const processed = formatNumber(drain.processedJobs || 0);
        const queued = formatNumber(drain.queuedJobs || 0);
        const failed = formatNumber(drain.failedJobs || 0);
        const ready = formatNumber(drain.readyJobs || 0);
        const runningJobs = formatNumber(drain.runningJobs || 0);
        const done = formatNumber(drain.doneJobs || 0);
        const lastBatch = drain.lastBatch && typeof drain.lastBatch === "object" ? drain.lastBatch : null;
        const batchNote = lastBatch
          ? `上一批实际处理 ${formatNumber(lastBatch.processed || 0)} 个，${formatBatchQueueDelta(Number(lastBatch.queuedDelta || 0))}，完成增加 ${formatNumber(Math.max(0, Number(lastBatch.doneDelta || 0)))} 个；当前等待数以实时数据库为准。`
          : "";
        const speed = Number(drain.jobsPerMinute || 0) > 0 ? `${formatNumber(drain.jobsPerMinute)} 个/分钟` : "";
        const eta = Number(drain.estimatedMinutesRemaining || 0) > 0 ? formatDurationMinutes(drain.estimatedMinutesRemaining) : "";
        const elapsed = Number(drain.elapsedSeconds || 0) > 0 ? formatDurationSeconds(drain.elapsedSeconds) : "";
        const logPath = compactText(drain.logPath || "", 72);
        const disabled = !drain.canStart || drain.running;
        const batchOptions = [
          { jobs: 10, batchSize: 2, sleepMs: 250, label: "跑 10 个" },
          { jobs: 50, batchSize: 5, sleepMs: 250, label: "跑 50 个" },
          { jobs: 250, batchSize: 25, sleepMs: 500, label: "跑 250 个" },
        ];
        const batchButtons = level === "complete"
          ? `<button class="small-action" type="button" data-source-tree-drain-start disabled>已完成</button>`
          : batchOptions.map((option) => `<button class="small-action" type="button" data-source-tree-drain-start data-source-tree-drain-jobs="${option.jobs}" data-source-tree-drain-batch-size="${option.batchSize}" data-source-tree-drain-sleep-ms="${option.sleepMs}" ${disabled ? "disabled" : ""}>${escapeHtml(drain.running ? "正在处理" : option.label)}</button>`).join("");
        const stopButton = drain.canStop
          ? `<button class="small-action" type="button" data-source-tree-drain-stop>${escapeHtml(drain.stopRequested ? "暂停中" : "暂停批次")}</button>`
          : "";
        const actionNote = drain.running
          ? "后台有限批次运行中，状态会随刷新更新。"
          : "每次只跑一个有限批次，跑完自动暂停；需要继续时再点下一批。";
        return `<div class="source-tree-drain" data-level="${escapeAttribute(level)}" aria-label="来源树深加工状态">
          <div class="source-tree-drain-head">
            <strong>来源树深加工</strong>
            <span>${escapeHtml(stateLabel)}</span>
          </div>
          <p>${escapeHtml(drain.message || "")}</p>
          <p>本轮已处理 ${processed} 个 · 等待 ${queued} 个 · 失败 ${failed} 个</p>
          <p>队列：可处理 ${ready} 个 · 正在处理 ${runningJobs} 个 · 已完成 ${done} 个</p>
          ${batchNote ? `<p>${escapeHtml(batchNote)}</p>` : ""}
          ${speed || eta || elapsed ? `<p>${escapeHtml([elapsed ? `已运行 ${elapsed}` : "", speed ? `速度 ${speed}` : "", eta ? `预计剩余 ${eta}` : ""].filter(Boolean).join(" · "))}</p>` : ""}
          ${logPath ? `<p>日志：${escapeHtml(logPath)}</p>` : ""}
          <div class="source-tree-drain-actions">
            ${batchButtons}
            ${stopButton}
            <span class="source-tree-drain-action-note">${escapeHtml(actionNote)}</span>
          </div>
        </div>`;
      }

      function sourceTreeDrainStateLabel(drain) {
        const level = drain?.level || "";
        if (level === "running") return "运行中";
        if (level === "stopping") return "暂停中";
        if (level === "complete") return "已完成";
        if (level === "paused") return "批次暂停";
        if (level === "stale") return "可能中断";
        if (level === "needs_attention") return "需处理";
        return "未运行";
      }

      function formatDurationSeconds(seconds) {
        const value = Math.max(0, Math.round(Number(seconds || 0)));
        if (value < 60) return `${value} 秒`;
        return formatDurationMinutes(Math.max(1, Math.round(value / 60)));
      }

      function formatBatchQueueDelta(value) {
        const number = Number(value || 0);
        if (!Number.isFinite(number) || number === 0) return "等待未减少";
        if (number > 0) return `等待减少 ${formatNumber(number)} 个`;
        return `等待增加 ${formatNumber(Math.abs(number))} 个`;
      }

      function formatDurationMinutes(minutes) {
        const value = Math.max(1, Math.round(Number(minutes || 0)));
        if (value < 60) return `${formatNumber(value)} 分钟`;
        const hours = Math.floor(value / 60);
        const rest = value % 60;
        if (hours < 24) return rest ? `${formatNumber(hours)} 小时 ${formatNumber(rest)} 分钟` : `${formatNumber(hours)} 小时`;
        const days = Math.floor(hours / 24);
        const restHours = hours % 24;
        return restHours ? `${formatNumber(days)} 天 ${formatNumber(restHours)} 小时` : `${formatNumber(days)} 天`;
      }

      function renderReadinessStages(stages) {
        const safeStages = Array.isArray(stages) && stages.length
          ? stages
          : [
              { id: "search", label: "可搜索", status: "missing", detail: "状态未知。" },
              { id: "citation", label: "可引用", status: "missing", detail: "状态未知。" },
              { id: "learning", label: "可学习", status: "missing", detail: "状态未知。" },
            ];
        return `<div class="readiness-stages" aria-label="知识库能力分层">
          ${safeStages.map((stage) => `<div class="readiness-stage" data-status="${escapeAttribute(stage.status || "")}">
            <strong>${escapeHtml(stage.label || "")} · ${escapeHtml(readinessStatusText(stage.status))}</strong>
            <span>${escapeHtml(stage.detail || "")}</span>
          </div>`).join("")}
        </div>`;
      }

      function readinessStageLabel(level) {
        if (level === "ready") return "完整可学习";
        if (level === "answer_ready_learning_processing") return "可问答，增强中";
        if (level === "answer_ready_learning_attention") return "可问答，需处理";
        if (level === "learning_processing") return "来源树处理中";
        if (level === "searchable_citable") return "可问答，可引用";
        if (level === "searchable") return "可搜索";
        if (level === "learning_needs_attention") return "需要处理";
        return "未完全就绪";
      }

      function readinessStatusText(status) {
        if (status === "ready") return "就绪";
        if (status === "processing") return "处理中";
        if (status === "partial") return "部分完成";
        if (status === "needs_attention") return "需处理";
        return "未就绪";
      }

      async function startSourceTreeDrain(trigger) {
        const button = trigger || knowledgeReadinessEl.querySelector("[data-source-tree-drain-start]");
        const payload = sourceTreeDrainStartPayload(button);
        if (button) {
          button.disabled = true;
          button.textContent = "启动中";
        }
        try {
          await fetchJson("/api/source-tree-drain/start", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
          await loadStatus();
        } catch (error) {
          if (button) {
            button.disabled = false;
            button.textContent = "重试启动";
          }
          statusEl.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
        }
      }

      function sourceTreeDrainStartPayload(button) {
        const maxJobs = clampSourceTreeDrainNumber(button?.dataset?.sourceTreeDrainJobs, 10, 1, 250);
        const batchSize = clampSourceTreeDrainNumber(button?.dataset?.sourceTreeDrainBatchSize, Math.min(10, maxJobs), 1, 100);
        const sleepMs = clampSourceTreeDrainNumber(button?.dataset?.sourceTreeDrainSleepMs, 250, 0, 60000);
        return { maxJobs, batchSize, sleepMs };
      }

      function clampSourceTreeDrainNumber(value, fallback, min, max) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.min(max, Math.max(min, Math.round(number)));
      }

      async function stopSourceTreeDrain() {
        const button = knowledgeReadinessEl.querySelector("[data-source-tree-drain-stop]");
        if (button) {
          button.disabled = true;
          button.textContent = "暂停中";
        }
        try {
          await fetchJson("/api/source-tree-drain/stop", { method: "POST" });
          await loadStatus();
        } catch (error) {
          statusEl.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
          if (button) button.disabled = false;
        }
      }

      async function ask(question) {
        const intentPreference = currentSourceSelection?.selectedIntent || currentSourceSelection?.intent || null;
        askButton.disabled = true;
        askButton.textContent = "查询中";
        questionEl.value = "";
        currentSourceSelection = null;
        renderQuestionSourceSelection();
        safeLocalRemove(RETRY_QUESTION_KEY);
        const priorMessages = messages.filter((item) => !item.loading).slice(-12);
        const productInput = productInputForQuestion(question);
        messages = [
          ...messages,
          { role: "user", content: question, createdAt: new Date().toISOString() },
          { role: "assistant", content: "正在结合上文查询本地知识库...", loading: true },
        ];
        renderMessages();

        const askController = new AbortController();
        const askTimeout = window.setTimeout(() => askController.abort(), ASK_REQUEST_TIMEOUT_MS);
        try {
          const payload = await fetchJson("/api/ask", {
            method: "POST",
            headers: { "content-type": "application/json" },
            signal: askController.signal,
            body: JSON.stringify({ question, sessionId, history: priorMessages, sourceControls, userSourceControls, productInput, intentPreference }),
          });
          if (productInput) pendingProductInput = null;
          sessionId = payload.sessionId || sessionId;
          if (sessionId) safeLocalSet(SESSION_KEY, sessionId);
          updateSessionUrl(sessionId);
          messages = Array.isArray(payload.messages) ? payload.messages : [
            ...messages.filter((item) => !item.loading),
            {
              role: "assistant",
              content: payload.answer,
              sources: payload.sources || [],
              rankedEvidence: payload.rankedEvidence || [],
              sourceScope: payload.sourceScope,
              productInputSummary: payload.productInputSummary,
              diagnosisPanel: payload.diagnosisPanel,
              validationPack: payload.validationPack,
              evidenceChain: payload.evidenceChain,
              evidenceAudit: payload.evidenceAudit,
              answerGeneration: payload.answerGeneration,
              answerEffectiveness: payload.answerEffectiveness,
              sourceTrust: payload.sourceTrust,
              sourceTreeCalibration: payload.sourceTreeCalibration,
              synthesisAnswer: payload.synthesisAnswer,
              notebookGuide: payload.notebookGuide,
              sourceDecisionTable: payload.sourceDecisionTable,
              graph: payload.graph,
              topicSourceTree: payload.topicSourceTree,
              sourceStudyPack: payload.sourceStudyPack,
              authorPerspectiveRoom: payload.authorPerspectiveRoom,
              learningCard: payload.learningCard,
              workflowIntent: payload.workflowIntent,
              learningQueue: payload.learningQueue,
              knowledgeGapRadar: payload.knowledgeGapRadar,
              nextBestSource: payload.nextBestSource,
              usageFootprint: payload.usageFootprint,
              learningMemoryReminder: payload.learningMemoryReminder,
              sourceControls: payload.sourceControls || sourceControls,
              userSourceControls: payload.userSourceControls || userSourceControls,
            },
          ];
          userSourceControls = normalizeUserSourceControls(payload.userSourceControls || userSourceControls);
          saveUserSourceControls();
          renderUserSources();
          saveMessages();
          selectedStudyPack = null;
          renderNotebookStudyPack();
          if (payload.notebook) {
            upsertNotebook(payload.notebook);
          } else {
            loadNotebooks();
          }
          renderMessages();
        } catch (error) {
          messages = messages.filter((item) => !item.loading);
          const message = error?.name === "AbortError"
            ? "查询超过 75 秒已停止。你可以缩小问题范围后重试，服务端会优先用稳定模板回退，避免长时间卡住。"
            : error.message;
          messages.push({ role: "assistant", content: `查询失败：${message}`, error: true });
          renderMessages();
        } finally {
          window.clearTimeout(askTimeout);
          askButton.disabled = false;
          askButton.textContent = "发送";
          questionEl.focus();
        }
      }

      function renderMessages(options = {}) {
        renderLearningEffectivenessSummary();
        if (messages.length === 0) {
          messagesEl.innerHTML = `<div class="empty">等待提问。你可以先问一个完整问题，再继续追问“那应该先改哪一块？”这类上下文问题。</div>`;
          return;
        }

        messagesEl.innerHTML = messages.map((message, index) => renderMessage(message, index)).join("");
        bindInlineReferenceEvents();
        bindEvidenceChainEvents();
        bindEvidenceFeedbackEvents();
        bindAuditFeedbackEvents();
        bindAnswerEffectivenessEvents();
        bindSourceControlEvents();
        bindWorkbenchEvents();
        bindNextStepEvents();
        bindLearningQueueEvents();
        bindKnowledgeGapRadarEvents();
        bindNextBestSourceEvents();
        bindDiagnosisPanelEvents();
        bindValidationPackEvents();
        bindStructuredDataFormEvents();
        bindTopicSourceTreeEvents();
        bindSourceStudyPackEvents();
        bindNotebookGuideEvents();
        bindAuthorPerspectiveEvents();
        bindLearningCardEvents();
        bindLearningNoteEvents();
        bindWorkflowIntentEvents();
        bindAnswerStudioEvents();
        bindGraphEvents();
        bindSourceContextEvents();
        renderEvidenceWorkbench();
        if (options.scrollToBottom !== false) {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }

      function renderMessage(message, messageIndex) {
        const isUser = message.role === "user";
        const roleText = isUser ? "你" : "知识库";
        const errorClass = message.error ? " error" : "";
        const content = isUser ? escapeHtml(message.content || "") : renderAnswerContent(message.content || "", messageIndex);
        return `<article class="message ${isUser ? "user" : "assistant"}" data-message-index="${messageIndex}">
          <div class="role">${roleText}</div>
          <div class="bubble${errorClass}">${content}</div>
          ${isUser || message.loading || message.error ? "" : renderAnswerNoteActions(message, messageIndex)}
          ${isUser || message.loading || message.error ? "" : renderAnswerEffectiveness(message, messageIndex)}
          ${isUser ? "" : renderAnswerGeneration(message.answerGeneration)}
          ${isUser ? "" : renderUsageFootprint(message.usageFootprint)}
          ${isUser ? "" : renderKnowledgeGapRadar(message.knowledgeGapRadar, messageIndex)}
          ${isUser ? "" : renderNextBestSource(message.nextBestSource, messageIndex)}
          ${isUser || message.learningQueue ? "" : renderNextStepPanel(message, messageIndex)}
          ${isUser ? "" : renderAnswerGraph(message.graph, messageIndex)}
          ${isUser ? "" : renderSources(message.sources || [], messageIndex)}
          ${isUser ? "" : renderPrimaryLearningPack(message, messageIndex)}
          ${isUser ? "" : renderAdvancedLearningTools(message, messageIndex)}
        </article>`;
      }

      function renderAnswerNoteActions(message, messageIndex) {
        if (!message || message.role !== "assistant" || !String(message.content || "").trim()) return "";
        return `<section class="answer-note-actions" aria-label="学习笔记操作">
          <button class="small-action" type="button" data-answer-note-save="${messageIndex}">保存回答为笔记</button>
          <span>只保存为你的学习笔记，不会写入作者原文证据库。</span>
        </section>`;
      }

      function renderAnswerEffectiveness(message, messageIndex) {
        if (!message || message.role !== "assistant" || !String(message.content || "").trim()) return "";
        const status = answerEffectivenessStatus(message.answerEffectiveness);
        const actions = [
          ["resolved", "这次有效"],
          ["needs_source", "需要补来源"],
          ["switch_intent", "切换意图"],
          ["add_product_data", "补产品数据"],
        ];
        return `<section class="answer-effectiveness" data-answer-effectiveness-status="${escapeAttribute(status.value)}" aria-label="本轮结果确认">
          <header>
            <strong>本轮结果确认</strong>
            <p>用你的实际操作确认这次回答有没有解决问题，再决定下一步追问方向。</p>
          </header>
          <div class="answer-effectiveness-actions">${actions.map(([value, label]) => renderAnswerEffectivenessButton(messageIndex, value, label, status.value)).join("")}</div>
          <p class="answer-effectiveness-status">${escapeHtml(status.label)}</p>
          <p class="answer-effectiveness-boundary">这个确认只记录本轮学习判断，不会把回答自动变成作者原文证据。</p>
        </section>`;
      }

      function renderAnswerEffectivenessButton(messageIndex, value, label, activeValue) {
        const active = value === activeValue;
        return `<button class="answer-effectiveness-button${active ? " is-active" : ""}" type="button" data-message-index="${messageIndex}" data-answer-effectiveness="${escapeAttribute(value)}" aria-pressed="${active ? "true" : "false"}">${escapeHtml(label)}</button>`;
      }

      function answerEffectivenessStatus(effectiveness) {
        const value = ["resolved", "needs_source", "switch_intent", "add_product_data"].includes(effectiveness?.status)
          ? effectiveness.status
          : "";
        if (value === "resolved") return { value, label: "已标记有效。下一步可以保存笔记、进入专题复盘，或继续追问更具体的执行细节。" };
        if (value === "needs_source") return { value, label: "已标记需要补来源。我会优先帮你回到作者原文或补充候选资料后再判断。" };
        if (value === "switch_intent") return { value, label: "已标记需要切换意图。下一问会先重新确认你要做方法学习、产品诊断、实验复盘还是补来源检索。" };
        if (value === "add_product_data") return { value, label: "已标记需要补产品数据。下一问会把你的真实产品材料和作者原文分开处理。" };
        return { value: "", label: "还未确认这次回答是否解决问题。" };
      }

      function renderAnswerGeneration(generation) {
        if (!generation || typeof generation !== "object") return "";
        const mode = generation.mode === "local_ollama" ? "local_ollama" : "template_fallback";
        const model = generation.model ? ` · ${generation.model}` : "";
        return `<section class="answer-generation" data-mode="${escapeAttribute(mode)}" aria-label="回答生成方式">
          <strong>${escapeHtml(generation.label || (mode === "local_ollama" ? "本地模型来源回答" : "稳定模板回答"))}${escapeHtml(model)}</strong>
          ${generation.summary ? `<p>${escapeHtml(generation.summary)}</p>` : ""}
          <p>${escapeHtml(generation.boundary || "回答只能基于本轮检索到的来源和摘录；引用仍需回到来源卡片核对。")}</p>
        </section>`;
      }

      function renderUsageFootprint(footprint) {
        if (!footprint || typeof footprint !== "object") return "";
        const estimate = footprint.estimate && typeof footprint.estimate === "object" ? footprint.estimate : {};
        const metrics = [
          ["问题", estimate.questionTokens],
          ["检索", estimate.retrievalTokens],
          ["来源", estimate.sourceTokens],
          ["答案", estimate.answerTokens],
        ].map(([label, value]) => `<span><b>${escapeHtml(Number(value || 0))}</b>${escapeHtml(label)}</span>`).join("");
        return `<section class="usage-footprint" aria-label="本轮运行成本">
          <header>
            <strong>本轮运行成本</strong>
            <span>${escapeHtml(Number(footprint.cloudBillableTokens || 0))} 云端 token</span>
          </header>
          <p>${escapeHtml(footprint.summary || "当前本机运行，不产生云端 token 费用。")}</p>
          <div class="usage-footprint-metrics">${metrics}</div>
          <p>${escapeHtml(footprint.boundary || "这里只是按文本长度估算，实际云模型费用会随模型和上下文变化。")}</p>
        </section>`;
      }

      function renderLearningEffectivenessSummary() {
        const summary = buildLearningEffectivenessSummary(messages);
        const metrics = [
          ["回答", summary.total],
          ["有效", summary.resolved],
          ["待确认", summary.unconfirmed],
          ["待处理", summary.needsAction],
        ].map(([label, value]) => `<span><strong>${escapeHtml(value)}</strong>${escapeHtml(label)}</span>`).join("");
        const actionButtons = summary.actions.map((action) => {
          if (action.kind === "scroll") {
            return `<button class="small-action" type="button" data-learning-effectiveness-scroll="${escapeAttribute(action.messageIndex)}">${escapeHtml(action.label)}</button>`;
          }
          if (action.kind === "prompt") {
            return `<button class="small-action" type="button" data-learning-effectiveness-prompt="${escapeAttribute(action.prompt)}">${escapeHtml(action.label)}</button>`;
          }
          return "";
        }).join("");
        learningEffectivenessSummaryEl.dataset.status = summary.status;
        learningEffectivenessSummaryEl.innerHTML = `
          <div class="learning-effectiveness-head">
            <strong>学习闭环状态</strong>
            <span class="learning-effectiveness-status">${escapeHtml(summary.statusLabel)}</span>
          </div>
          <p>${escapeHtml(summary.summary)}</p>
          <div class="learning-effectiveness-metrics">${metrics}</div>
          ${actionButtons ? `<div class="learning-effectiveness-actions">${actionButtons}</div>` : ""}
          <p>这里记录的是你的学习确认和下一步动作，不会把回答自动变成作者原文证据。</p>
        `;
        bindLearningEffectivenessSummaryEvents();
      }

      function buildLearningEffectivenessSummary(messageList) {
        const assistantMessages = (Array.isArray(messageList) ? messageList : [])
          .map((message, index) => ({ message, index }))
          .filter((item) => item.message?.role === "assistant" && !item.message.loading && !item.message.error && String(item.message.content || "").trim());
        const total = assistantMessages.length;
        const counts = {
          resolved: 0,
          needs_source: 0,
          switch_intent: 0,
          add_product_data: 0,
          unconfirmed: 0,
        };
        assistantMessages.forEach(({ message }) => {
          const status = message.answerEffectiveness?.status || "";
          if (Object.prototype.hasOwnProperty.call(counts, status)) counts[status] += 1;
          else counts.unconfirmed += 1;
        });
        const needsAction = counts.needs_source + counts.switch_intent + counts.add_product_data;
        const latestUnconfirmed = [...assistantMessages].reverse().find(({ message }) => !message.answerEffectiveness?.status);
        const latestNeedsSource = [...assistantMessages].reverse().find(({ message }) => message.answerEffectiveness?.status === "needs_source");
        const latestSwitchIntent = [...assistantMessages].reverse().find(({ message }) => message.answerEffectiveness?.status === "switch_intent");
        const latestAddProductData = [...assistantMessages].reverse().find(({ message }) => message.answerEffectiveness?.status === "add_product_data");
        const actions = [];
        let status = "empty";
        let statusLabel = "等待回答";
        let summary = "先提一个问题，再用每条回答下方的确认按钮记录这次回答是否有效。";
        if (total > 0) {
          if (latestUnconfirmed) {
            status = "needs_action";
            statusLabel = "待确认";
            summary = `还有 ${counts.unconfirmed} 条回答没有确认。先确认最近一条，系统才能知道下一步该补来源、换意图还是补产品数据。`;
            actions.push({ kind: "scroll", label: "确认最近回答", messageIndex: latestUnconfirmed.index });
          } else if (latestNeedsSource) {
            status = "needs_action";
            statusLabel = "先补来源";
            summary = `有 ${counts.needs_source} 条回答被标记为需要补来源。下一步应回到作者原文或候选资料，不急着沉淀结论。`;
            actions.push({ kind: "scroll", label: "定位补来源回答", messageIndex: latestNeedsSource.index });
            const prompt = answerEffectivenessPrompt(latestNeedsSource.message, latestNeedsSource.index, "needs_source");
            if (prompt) actions.push({ kind: "prompt", label: "生成补来源追问", prompt });
          } else if (latestSwitchIntent) {
            status = "needs_action";
            statusLabel = "先换意图";
            summary = `有 ${counts.switch_intent} 条回答需要重新确认意图。下一步先判断你是在学习方法、诊断产品、复盘实验还是找来源。`;
            actions.push({ kind: "scroll", label: "定位切换意图回答", messageIndex: latestSwitchIntent.index });
            const prompt = answerEffectivenessPrompt(latestSwitchIntent.message, latestSwitchIntent.index, "switch_intent");
            if (prompt) actions.push({ kind: "prompt", label: "生成意图确认追问", prompt });
          } else if (latestAddProductData) {
            status = "needs_action";
            statusLabel = "先补数据";
            summary = `有 ${counts.add_product_data} 条回答需要补产品数据。下一步把真实页面、点击率、转化率或广告数据补进来，再和作者资料分开判断。`;
            actions.push({ kind: "scroll", label: "定位补数据回答", messageIndex: latestAddProductData.index });
            const prompt = answerEffectivenessPrompt(latestAddProductData.message, latestAddProductData.index, "add_product_data");
            if (prompt) actions.push({ kind: "prompt", label: "生成补数据模板", prompt });
          } else {
            status = "resolved";
            statusLabel = "已确认";
            summary = `本会话 ${total} 条回答都已确认，其中 ${counts.resolved} 条标记有效。可以继续追问更细执行步骤，或保存为学习笔记。`;
          }
        }
        return {
          total,
          resolved: counts.resolved,
          unconfirmed: counts.unconfirmed,
          needsAction,
          status,
          statusLabel,
          summary,
          actions,
        };
      }

      function bindLearningEffectivenessSummaryEvents() {
        learningEffectivenessSummaryEl.querySelectorAll("[data-learning-effectiveness-scroll]").forEach((button) => {
          button.addEventListener("click", () => {
            focusMessageSection(Number(button.dataset.learningEffectivenessScroll), ".answer-effectiveness");
          });
        });
        learningEffectivenessSummaryEl.querySelectorAll("[data-learning-effectiveness-prompt]").forEach((button) => {
          button.addEventListener("click", () => {
            fillQuestionFromWorkflowPrompt(button.dataset.learningEffectivenessPrompt || "");
          });
        });
      }

      function focusMessageSection(messageIndex, selector) {
        const messageEl = messagesEl.querySelector(`.message[data-message-index="${messageIndex}"]`);
        const target = selector && messageEl ? messageEl.querySelector(selector) : messageEl;
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("is-studio-focused");
        window.setTimeout(() => target.classList.remove("is-studio-focused"), 1600);
      }

      function renderKnowledgeGapRadar(radar, messageIndex) {
        if (!radar || typeof radar !== "object") return "";
        const gaps = Array.isArray(radar.gaps) ? radar.gaps.filter((item) => item?.label).slice(0, 6) : [];
        const priority = radar.priority?.label ? radar.priority : gaps[0];
        if (!priority && gaps.length === 0) return "";
        const status = radar.status || "needs_review";
        const metrics = radar.metrics && typeof radar.metrics === "object" ? radar.metrics : {};
        const metricItems = [
          ["来源", metrics.sourceCount],
          ["原文证据", metrics.evidenceCount],
          ["作者", metrics.authorCount],
          ["冲突", metrics.conflictCount],
          ["缺数据", metrics.missingDataCount],
        ].map(([label, value]) => `<span><strong>${escapeHtml(Number(value || 0))}</strong>${escapeHtml(label)}</span>`).join("");
        const priorityBlock = priority ? `<article class="knowledge-gap-priority">
          <span>优先处理</span>
          <strong>${escapeHtml(priority.label || "")}</strong>
          <p>${escapeHtml(priority.reason || "")}</p>
          ${renderKnowledgeGapActions(priority, messageIndex)}
        </article>` : "";
        return `<section class="knowledge-gap-radar" data-status="${escapeAttribute(status)}" aria-label="知识缺口雷达">
          <header>
            <div>
              <strong>${escapeHtml(radar.title || "知识缺口雷达")}</strong>
              <p>${escapeHtml(radar.summary || "先补最关键的资料或数据，再继续判断。")}</p>
            </div>
            <span class="knowledge-gap-status">${escapeHtml(knowledgeGapStatusLabel(status))}</span>
          </header>
          <div class="knowledge-gap-metrics">${metricItems}</div>
          ${priorityBlock}
          <div class="knowledge-gap-list">${gaps.map((gap, index) => renderKnowledgeGapItem(gap, index, messageIndex)).join("")}</div>
          <p class="knowledge-gap-boundary">${escapeHtml(radar.boundary || "知识缺口雷达只决定下一步补资料、补数据或复核路径，不改变作者原文证据边界。")}</p>
        </section>`;
      }

      function renderKnowledgeGapItem(gap, index, messageIndex) {
        return `<article class="knowledge-gap-item" data-kind="${escapeAttribute(gap.kind || "gap")}">
          <strong>${escapeHtml(index + 1)}. ${escapeHtml(gap.label || "")}</strong>
          <p>${escapeHtml(gap.reason || "")}</p>
          ${renderKnowledgeGapActions(gap, messageIndex)}
          <span>${escapeHtml(gap.canUseAsEvidence ? "可回到来源核对" : "学习提示，不作为新证据")}</span>
        </article>`;
      }

      function renderKnowledgeGapActions(gap, messageIndex) {
        const sourceButtons = Array.isArray(gap.sourceIndexes)
          ? gap.sourceIndexes
              .filter(Number.isInteger)
              .slice(0, 3)
              .map((sourceIndex) => `<button class="evidence-button" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${sourceIndex}`)}">看来源 ${sourceIndex + 1}</button>`)
              .join("")
          : "";
        const claimButtons = Array.isArray(gap.claimIds)
          ? gap.claimIds
              .filter(Boolean)
              .slice(0, 2)
              .map((claimId) => `<button class="evidence-button" type="button" data-claim-target="${escapeAttribute(`${messageIndex}:${claimId}`)}">定位证据</button>`)
              .join("")
          : "";
        const prompt = String(gap.prompt || "").trim();
        const promptButton = prompt
          ? `<button class="evidence-button knowledge-gap-prompt" type="button" data-knowledge-gap-prompt="${escapeAttribute(prompt)}">继续追问</button>`
          : "";
        return sourceButtons || claimButtons || promptButton
          ? `<div class="knowledge-gap-actions">${sourceButtons}${claimButtons}${promptButton}</div>`
          : "";
      }

      function knowledgeGapStatusLabel(status) {
        if (status === "needs_source") return "先补来源";
        if (status === "needs_data") return "先补数据";
        if (status === "ready_to_validate") return "可以验证";
        return "先复核";
      }

      function renderNextBestSource(route, messageIndex) {
        if (!route || typeof route !== "object" || !route.recommended?.label) return "";
        const status = route.status || "needs_review";
        const criteria = Array.isArray(route.criteria) ? route.criteria.filter((item) => item?.label).slice(0, 5) : [];
        const alternatives = Array.isArray(route.alternatives) ? route.alternatives.filter((item) => item?.label).slice(0, 4) : [];
        const criteriaRows = criteria.length
          ? `<div class="next-best-source-criteria">${criteria.map((item) => `<article class="next-best-source-criterion" data-status="${escapeAttribute(item.status || "")}">
              <strong>${escapeHtml(item.label || "")}</strong>
              <span>${escapeHtml(item.detail || "")}</span>
            </article>`).join("")}</div>`
          : "";
        const alternativeRows = alternatives.length
          ? `<div class="next-best-source-grid">${alternatives.map((item) => renderNextBestSourceCard(item, messageIndex, false)).join("")}</div>`
          : "";
        return `<section class="next-best-source" data-status="${escapeAttribute(status)}" aria-label="下一步资料选择">
          <header>
            <div>
              <strong>${escapeHtml(route.title || "下一步资料选择")}</strong>
              <p class="next-best-source-summary">${escapeHtml(route.summary || "先读最能证明本轮回答的资料，再补缺口。")}</p>
            </div>
            <span class="next-best-source-status">${escapeHtml(nextBestSourceStatusLabel(status))}</span>
          </header>
          ${criteriaRows}
          ${renderNextBestSourceCard(route.recommended, messageIndex, true)}
          ${alternativeRows}
          <p class="next-best-source-boundary">${escapeHtml(route.boundary || "下一步资料选择只安排阅读、复核和补材料顺序；推荐理由是系统整理，不是新的作者原文证据。")}</p>
        </section>`;
      }

      function renderNextBestSourceCard(item, messageIndex, primary) {
        const meta = [item.author, item.title].filter(Boolean).join(" · ");
        const quote = item.quote ? `<blockquote>${escapeHtml(item.quote)}</blockquote>` : "";
        const evidenceText = item.sourceCanUseAsEvidence
          ? "资料本身可回到来源核对；本推荐理由不是作者证据"
          : "学习导航，不是作者证据";
        return `<article class="next-best-source-card" data-kind="${escapeAttribute(item.kind || "source")}" data-primary="${primary ? "true" : "false"}">
          <strong>${escapeHtml(primary ? `优先：${item.label || ""}` : item.label || "")}</strong>
          ${meta ? `<p>${escapeHtml(meta)}</p>` : ""}
          ${item.reason ? `<p>${escapeHtml(item.reason)}</p>` : ""}
          ${quote}
          <p>${escapeHtml(evidenceText)}</p>
          ${renderNextBestSourceActions(item, messageIndex)}
        </article>`;
      }

      function renderNextBestSourceActions(item, messageIndex) {
        const sourceTarget = Number.isInteger(item?.sourceIndex) ? `${messageIndex}-${item.sourceIndex}` : "";
        const sourceButton = sourceTarget
          ? `<button class="evidence-button" type="button" data-source-target="${escapeAttribute(sourceTarget)}">定位来源 ${Number(item.sourceIndex) + 1}</button>`
          : "";
        const claimButton = item?.claimId
          ? `<button class="evidence-button" type="button" data-claim-target="${escapeAttribute(`${messageIndex}:${item.claimId}`)}">定位证据</button>`
          : "";
        const sourceIndexButtons = Array.isArray(item?.sourceIndexes)
          ? item.sourceIndexes.filter(Number.isInteger).slice(0, 2).map((sourceIndex) => `<button class="evidence-button" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${sourceIndex}`)}">看来源 ${sourceIndex + 1}</button>`).join("")
          : "";
        const claimIdButtons = Array.isArray(item?.claimIds)
          ? item.claimIds.filter(Boolean).slice(0, 2).map((claimId) => `<button class="evidence-button" type="button" data-claim-target="${escapeAttribute(`${messageIndex}:${claimId}`)}">看证据</button>`).join("")
          : "";
        const prompt = String(item?.prompt || "").trim();
        const promptButton = prompt
          ? `<button class="evidence-button" type="button" data-next-best-source-prompt="${escapeAttribute(prompt)}">继续追问</button>`
          : "";
        const buttons = `${sourceButton}${claimButton}${sourceIndexButtons}${claimIdButtons}${promptButton}`;
        return buttons ? `<div class="next-best-source-actions">${buttons}</div>` : "";
      }

      function nextBestSourceStatusLabel(status) {
        if (status === "needs_source") return "先补来源";
        if (status === "needs_data") return "先补数据";
        if (status === "ready_to_validate") return "可验证";
        return "先读资料";
      }

      function renderPrimaryLearningPack(message, messageIndex) {
        return [
          renderSynthesisAnswer(message.synthesisAnswer, messageIndex),
          renderSourceDecisionTable(message.sourceDecisionTable, messageIndex),
          renderNotebookGuide(message.notebookGuide, messageIndex),
        ].filter(Boolean).join("");
      }

      function renderAdvancedLearningTools(message, messageIndex) {
        const body = [
          renderAnswerStudio(message, messageIndex),
          renderExcludedSourceNotice(message),
          renderSourceScope(message.sourceScope),
          renderSourceTrustCard(message.sourceTrust, messageIndex),
          renderWorkflowIntent(message.workflowIntent, messageIndex),
          renderLearningQueue(message.learningQueue, messageIndex),
          renderLearningMemoryReminder(message.learningMemoryReminder),
          renderProductInputSummary(message.productInputSummary),
          renderDiagnosisPanel(message.diagnosisPanel, messageIndex),
          renderValidationPack(message.validationPack, messageIndex),
          renderEvidenceAudit(message.evidenceAudit, messageIndex),
          renderAuthorPerspectiveRoom(message.authorPerspectiveRoom, messageIndex),
          renderEvidenceChain(message.evidenceChain, messageIndex, message.evidenceFeedback || {}),
          renderTopicSourceTree(message.topicSourceTree, messageIndex),
          renderSourceStudyPack(message.sourceStudyPack, messageIndex),
          renderLearningCard(message.learningCard, messageIndex),
        ].filter(Boolean).join("");
        if (!body) return "";
        return `<details class="answer-panel-group">
          <summary>更多学习工具 <span>证据审计、作者视角、验证任务和学习队列</span></summary>
          <div class="answer-panel-group-body">${body}</div>
        </details>`;
      }

      function renderExcludedSourceNotice(message) {
        const excluded = excludedSourcesForMessage(message);
        if (excluded.length === 0) return "";
        const label = excluded.slice(0, 3).map(sourceLabel).filter(Boolean).join("；");
        return `<section class="source-scope is-stale-source" aria-label="旧回答来源提示">
          <strong>这条旧回答包含后来已排除的来源</strong>
          <p>${escapeHtml(label || "部分来源")} 已不再参与后续回答。旧回答仅作为记录；重新提问会避开这些来源。</p>
        </section>`;
      }

      function excludedSourcesForMessage(message) {
        const sources = Array.isArray(message?.sources) ? message.sources : [];
        return sources.filter((source) => sourceIdentityKeys(source).some((key) => isSourceExcluded(key)));
      }

      function renderSourceScope(scope) {
        if (!scope || typeof scope !== "object") return "";
        const allowedAuthors = Array.isArray(scope.allowedAuthors) ? scope.allowedAuthors.filter(Boolean) : [];
        const allowedSourceKeys = Array.isArray(scope.allowedSourceKeys) ? scope.allowedSourceKeys.filter(Boolean) : [];
        const allowedSourceCount = Number(scope.allowedSourceCount || 0) || allowedSourceKeys.length;
        const label = scope.active && allowedSourceKeys.length
          ? `已选来源 ${allowedSourceCount} 个`
          : scope.active && allowedAuthors.length
          ? `只看 ${allowedAuthors.join("、")}`
          : "全部作者";
        const countLine = Number.isFinite(Number(scope.totalRetrieved))
          ? `本轮检索候选 ${Number(scope.totalRetrieved || 0)} 篇，范围内 ${Number(scope.totalAfterScope || 0)} 篇。`
          : "";
        const summary = countLine
          ? `${countLine} 只影响这轮回答，不改知识库。`
          : scope.summary || "本轮使用全部作者资料。";
        return `<section class="source-scope" aria-label="本轮研究范围">
          <strong>本轮回答范围：${escapeHtml(label)}</strong>
          <p>${escapeHtml(summary)}</p>
        </section>`;
      }

      function renderAnswerStudio(message, messageIndex) {
        const items = buildAnswerStudioItems(message, messageIndex);
        if (items.length === 0) return "";
        const available = items.filter((item) => item.available !== false).length;
        return `<section class="answer-studio" data-answer-studio-index="${messageIndex}" aria-label="本轮学习工作台">
          <header>
            <span class="answer-studio-title">
              <strong>本轮学习入口</strong>
              <span>从来源核对开始，再进入图谱、验证和档案沉淀。</span>
            </span>
            <span class="answer-studio-count">${available} 个可用入口</span>
          </header>
          ${renderOnePageLearningBrief(message, messageIndex)}
          <div class="answer-studio-grid">${items.map((item) => renderAnswerStudioCard(item)).join("")}</div>
          <p class="answer-studio-boundary">先读来源并标记证据，再保存档案或做业务验证；系统整理不会自动变成作者原文证据。</p>
        </section>`;
      }

      function renderOnePageLearningBrief(message, messageIndex) {
        const blocks = buildOnePageLearningBriefBlocks(message, messageIndex);
        if (blocks.length === 0) return "";
        const coverage = message?.notebookGuide?.sourceCoverage || message?.synthesisAnswer?.sourceCoverage || {};
        const evidenceCount = Number(coverage.evidenceCount || 0);
        const sourceCount = Number(coverage.sourceCount || 0);
        const status = evidenceCount > 0
          ? `${evidenceCount} 条证据 · ${sourceCount || 1} 个来源`
          : "待补作者原文";
        return `<div class="answer-brief" aria-label="一页式学习简报">
          <div class="answer-brief-head">
            <strong>一页式学习简报</strong>
            <span>${escapeHtml(status)}</span>
          </div>
          <div class="answer-brief-grid">${blocks.map(renderAnswerBriefBlock).join("")}</div>
        </div>`;
      }

      function buildOnePageLearningBriefBlocks(message, messageIndex) {
        if (!message || message.role === "user" || message.error || message.loading) return [];
        const synthesisPoint = Array.isArray(message.synthesisAnswer?.points) ? message.synthesisAnswer.points[0] : null;
        const notebookPoint = Array.isArray(message.notebookGuide?.briefing) ? message.notebookGuide.briefing[0] : null;
        const sourceClaim = studioSourceEvidenceClaims(message, messageIndex)[0];
        const synthesisGap = Array.isArray(message.synthesisAnswer?.gaps) ? message.synthesisAnswer.gaps[0] : null;
        const notebookGap = Array.isArray(message.notebookGuide?.gaps) ? message.notebookGuide.gaps[0] : null;
        const nextQueueItem = Array.isArray(message.learningQueue?.items)
          ? message.learningQueue.items.find((item) => item && item.done !== true) || message.learningQueue.items[0]
          : null;
        const nextAction = buildNextStepAction(message, messageIndex);
        const blocks = [
          {
            kind: "conclusion",
            title: "本轮结论",
            text: synthesisPoint?.text || notebookPoint?.text || compactText(message.content || "先查看回答正文，再回到来源核对。", 150),
            actions: message.synthesisAnswer
              ? [{ action: "focus", target: ".synthesis-answer", label: "看综合讲义" }]
              : message.notebookGuide
                ? [{ action: "focus", target: ".notebook-guide", label: "看学习简报" }]
                : [],
          },
          {
            kind: "source",
            title: "关键证据",
            text: sourceClaim?.description || "这轮还没有可采纳的作者原文证据，先换一个更具体的问题重新检索。",
            actions: sourceClaim
              ? [{ action: "read-source", label: "定位证据", sourceTarget: sourceClaim.sourceTarget, claimTarget: sourceClaim.claimTarget }]
              : message.workflowIntent?.nextPrompt
                ? [{ action: "fill-prompt", label: "重查来源", prompt: message.workflowIntent.nextPrompt }]
                : [],
          },
          {
            kind: "gap",
            title: "不能确认",
            text: synthesisGap?.message || synthesisGap?.reason || notebookGap?.reason || message.evidenceAudit?.caution || "有来源不等于已经适用于你的产品，仍需要用真实页面和业务数据验证。",
            actions: message.evidenceAudit
              ? [{ action: "focus", target: ".evidence-audit", label: "看引用核对" }]
              : message.notebookGuide
                ? [{ action: "focus", target: ".notebook-guide", label: "看缺口" }]
                : [],
          },
          {
            kind: "next",
            title: "下一步动作",
            text: nextQueueItem?.reason || nextAction?.reason || message.workflowIntent?.primaryAction || "先核对来源，再决定是否保存档案或带产品数据继续问。",
            actions: nextQueueItem
              ? [{ action: "focus", target: ".learning-queue", label: "看学习队列" }]
              : nextAction
                ? [{ action: "focus", target: ".next-step-panel", label: nextAction.button || "继续" }]
                : [],
          },
        ];
        return blocks.filter((block) => block.text).slice(0, 4);
      }

      function renderAnswerBriefBlock(block) {
        const actions = Array.isArray(block.actions) && block.actions.length
          ? `<div class="answer-brief-actions">${block.actions.map(renderAnswerStudioAction).join("")}</div>`
          : "";
        return `<article class="answer-brief-block" data-kind="${escapeAttribute(block.kind || "item")}">
          <strong>${escapeHtml(block.title || "")}</strong>
          <p>${escapeHtml(compactText(block.text || "", 170))}</p>
          ${actions}
        </article>`;
      }

      function buildAnswerStudioItems(message, messageIndex) {
        if (!message || message.role === "user" || message.error || message.loading) return [];
        const items = [];
        const sourceClaims = studioSourceEvidenceClaims(message, messageIndex);
        const primaryClaim = sourceClaims[0];
        if (primaryClaim) {
          const feedback = primaryClaim.feedback;
          items.push({
            kind: "source",
            title: "来源阅读会话",
            status: studioStatusLabel(feedback),
            description: primaryClaim.description,
            actions: [
              {
                action: "read-source",
                label: feedback ? "继续看来源" : "开始读来源",
                sourceTarget: primaryClaim.sourceTarget,
                claimTarget: primaryClaim.claimTarget,
              },
              {
                label: feedback === "useful" ? "已采纳" : "采纳证据",
                feedback: "useful",
                claimId: primaryClaim.claim.id,
                disabled: feedback === "useful",
              },
              {
                label: feedback === "irrelevant" ? "已排除" : "排除证据",
                feedback: "irrelevant",
                claimId: primaryClaim.claim.id,
                disabled: feedback === "irrelevant",
              },
            ],
          });
        } else {
          const prompt = message.workflowIntent?.nextPrompt || "请换一个更具体的问题，重新检索作者原文来源。";
          items.push({
            kind: "source",
            title: "先补来源",
            status: "待检索",
            description: "这轮还没有可采纳的作者原文证据，先换问法或补产品材料再沉淀。",
            actions: [{ action: "fill-prompt", label: "填入重查问题", prompt }],
          });
        }

        if (message.graph?.nodes?.length) {
          items.push({
            kind: "map",
            title: "本轮图谱",
            status: `${message.graph.nodes.length} 个节点`,
            description: "看问题、概念、来源和执行步骤之间的关系。",
            actions: [{ action: "focus", label: "查看图谱", target: ".answer-graph" }],
          });
        }
        if (message.synthesisAnswer) {
          items.push({
            kind: "synthesis",
            title: "综合讲义",
            status: message.synthesisAnswer.label || "系统整理",
            description: "把本轮回答整理成可复习的讲义，但不替代原文。",
            actions: [{ action: "focus", label: "看讲义", target: ".synthesis-answer" }],
          });
        }
        if (message.validationPack) {
          items.push({
            kind: "validation",
            title: "业务验证",
            status: message.validationPack.status === "ready" ? "可执行" : "待补数据",
            description: "把结论拆成产品、页面、广告和数据检查任务。",
            actions: [{ action: "focus", label: "看验证任务", target: ".validation-pack" }],
          });
        }
        if (message.sourceStudyPack) {
          items.push({
            kind: "study",
            title: "来源研读包",
            status: message.sourceStudyPack.status === "ready" ? "可研读" : "受证据门槛保护",
            description: "围绕已采纳证据生成抽认卡、概念和缺口。",
            actions: [{ action: "focus", label: "看研读包", target: ".source-study" }],
          });
        }
        if (message.topicSourceTree) {
          items.push({
            kind: "map",
            title: "主题来源树",
            status: message.topicSourceTree.status === "ready" ? "本轮路径" : "待补来源",
            description: "看本轮主题如何连接作者、来源和下一步追问。",
            actions: [{ action: "focus", label: "看来源树", target: ".topic-source-tree" }],
          });
        }
        if (message.authorPerspectiveRoom?.status === "ready") {
          items.push({
            kind: "evidence",
            title: "作者对照",
            status: "需人工对比",
            description: "保留不同作者的观点差异，避免把冲突压成单一结论。",
            actions: [{ action: "focus", label: "看作者对照", target: ".author-perspective" }],
          });
        }
        if (message.learningCard) {
          const gate = learningDossierSaveGate(message);
          items.push({
            kind: "dossier",
            title: "保存学习档案",
            status: gate.locked ? gate.label : "可保存",
            description: gate.locked ? gate.reason : "把已核对证据和本轮学习结果沉淀到本地档案。",
            actions: [{ action: "save-dossier", label: gate.locked ? gate.label : "保存档案", disabled: gate.locked, title: gate.reason }],
          });
        }
        return items.slice(0, 9);
      }

      function renderAnswerStudioCard(item) {
        const actions = Array.isArray(item.actions) && item.actions.length
          ? `<div class="answer-studio-actions">${item.actions.map((action) => renderAnswerStudioAction(action)).join("")}</div>`
          : "";
        return `<article class="answer-studio-card" data-kind="${escapeAttribute(item.kind || "item")}">
          <strong>${escapeHtml(item.title || "")}</strong>
          ${item.status ? `<span class="answer-studio-status">${escapeHtml(item.status)}</span>` : ""}
          ${item.description ? `<p>${escapeHtml(compactText(item.description, 92))}</p>` : ""}
          ${actions}
        </article>`;
      }

      function renderAnswerStudioAction(action) {
        const attrs = [
          action.action ? `data-answer-studio-action="${escapeAttribute(action.action)}"` : "",
          action.target ? `data-answer-studio-target="${escapeAttribute(action.target)}"` : "",
          action.prompt ? `data-answer-studio-prompt="${escapeAttribute(action.prompt)}"` : "",
          action.sourceTarget ? `data-source-target="${escapeAttribute(action.sourceTarget)}"` : "",
          action.claimTarget ? `data-claim-target="${escapeAttribute(action.claimTarget)}"` : "",
          action.claimId ? `data-answer-studio-claim-id="${escapeAttribute(action.claimId)}"` : "",
          action.feedback ? `data-answer-studio-feedback="${escapeAttribute(action.feedback)}"` : "",
          action.title ? `title="${escapeAttribute(action.title)}"` : "",
        ].filter(Boolean).join(" ");
        return `<button class="answer-studio-button" type="button" ${attrs} ${action.disabled ? "disabled" : ""}>${escapeHtml(action.label || "继续")}</button>`;
      }

      function studioSourceEvidenceClaims(message, messageIndex) {
        const feedback = message?.evidenceFeedback || {};
        const claims = Array.isArray(message?.evidenceChain?.claims) ? message.evidenceChain.claims : [];
        const sources = Array.isArray(message?.sources) ? message.sources : [];
        return claims
          .filter((claim) => claim?.type === "source_evidence" && claim.id && Number.isInteger(claim.sourceIndex))
          .map((claim) => {
            const source = sources[claim.sourceIndex] || {};
            const sourceLine = sourceLabel(source) || [claim.author, claim.title].filter(Boolean).join(" · ");
            return {
              claim,
              feedback: feedback[claim.id] || "",
              sourceTarget: `${messageIndex}-${claim.sourceIndex}`,
