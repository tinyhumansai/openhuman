              claimTarget: `${messageIndex}:${claim.id}`,
              description: `${sourceLine ? `${sourceLine}：` : ""}${claim.text || claim.quote || "本轮关键来源"}`,
            };
          });
      }

      function studioStatusLabel(feedback) {
        if (feedback === "useful") return "已采纳";
        if (feedback === "irrelevant") return "已排除";
        return "待核对";
      }

      function renderWorkflowIntent(intent, messageIndex) {
        if (!intent || typeof intent !== "object") return "";
        const type = intent.type || "method_learning";
        const label = intent.label || WORKFLOW_INTENT_LABELS[type] || WORKFLOW_INTENT_LABELS.method_learning;
        const confidence = intent.confidence === "user_confirmed"
          ? "用户已确认"
          : intent.confidence === "high"
            ? "高置信"
            : "需结合上下文";
        const goal = intent.goal || "";
        const action = intent.primaryAction || "";
        const boundary = intent.boundary || "本轮意图只用于安排学习动作，不会改变作者原文和用户业务记录的边界。";
        const intentActions = buildWorkflowIntentActions(intent, messages[messageIndex], messageIndex);
        return `<section class="workflow-intent" data-workflow-intent="${escapeAttribute(type)}" aria-label="本轮意图">
          <header>
            <strong>本轮意图：${escapeHtml(label)}</strong>
            <span>${escapeHtml(confidence)}</span>
          </header>
          ${goal ? `<p>${escapeHtml(goal)}</p>` : ""}
          ${action ? `<p class="workflow-action"><strong>下一步：</strong>${escapeHtml(action)}</p>` : ""}
          ${intentActions.length ? `<div class="workflow-intent-actions">${intentActions.map(renderWorkflowIntentAction).join("")}</div>` : ""}
          <p>${escapeHtml(boundary)}</p>
        </section>`;
      }

      function buildWorkflowIntentActions(intent, message, messageIndex) {
        const type = intent?.type || "";
        const actions = [];
        const add = (action) => {
          if (!action || !action.action || actions.some((item) => item.action === action.action)) return;
          actions.push(action);
        };
        const sourceClaim = (message?.evidenceChain?.claims || []).find((claim) => claim?.type === "source_evidence" && claim.id);
        const hasDataForm = Array.isArray(message?.validationPack?.dataRequests) && message.validationPack.dataRequests.length > 0;
        const hasLearningForm = Array.isArray(message?.learningCard?.missingInputs) && message.learningCard.missingInputs.length > 0;
        if (type === "method_learning") {
          if (sourceClaim) add({ action: "review-evidence", label: "定位关键证据", claimTarget: `${messageIndex}:${sourceClaim.id}` });
          if (message?.learningCard) add({ action: "save-dossier", label: "保存学习档案" });
        } else if (type === "product_diagnosis") {
          if (hasDataForm || hasLearningForm) add({ action: "fill-data", label: "补产品数据" });
          if (message?.diagnosisPanel) add({ action: "review-diagnosis", label: "看诊断优先级" });
        } else if (type === "experiment_review") {
          if (message?.validationPack) add({ action: "review-validation", label: "看验证任务" });
          if (intent.nextPrompt) add({ action: "fill-intent-prompt", label: "填入复盘追问", prompt: intent.nextPrompt });
        } else if (type === "answer_retry") {
          add({ action: "mark-retry", label: "按上一问重查" });
        } else if (type === "source_search") {
          add({ action: "fill-intent-prompt", label: "换具体问法", prompt: intent.nextPrompt || "请换一种更具体的问法重新检索作者资料。" });
        }
        const gate = learningActionGate(message);
        return actions.slice(0, 3).map((action) => {
          const mayBypassGate = action.action === "review-evidence" ||
            action.action === "mark-retry" ||
            (type === "source_search" && action.action === "fill-intent-prompt");
          if (!gate.locked || mayBypassGate) return action;
          return { ...action, locked: true, lockedLabel: gate.label, lockedReason: gate.reason };
        });
      }

      function renderWorkflowIntentAction(action) {
        const attrs = [
          `data-workflow-action="${escapeAttribute(action.action)}"`,
          action.claimTarget ? `data-claim-target="${escapeAttribute(action.claimTarget)}"` : "",
          action.sourceTarget ? `data-source-target="${escapeAttribute(action.sourceTarget)}"` : "",
          action.prompt ? `data-workflow-prompt="${escapeAttribute(action.prompt)}"` : "",
        ].filter(Boolean).join(" ");
        return `<button class="workflow-intent-button" type="button" ${attrs} ${action.locked ? "disabled" : ""} title="${escapeAttribute(action.lockedReason || "")}">${escapeHtml(action.locked ? action.lockedLabel || "先核对证据" : action.label || "继续")}</button>`;
      }

      function renderLearningQueue(queue, messageIndex) {
        if (!queue || !Array.isArray(queue.items) || queue.items.length === 0) return "";
        const items = queue.items.slice(0, 6);
        const completed = items.filter((item) => item.done === true).length;
        const total = items.length;
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        const currentItem = items.find((item) => item.done !== true) || items[0];
        const allDone = total > 0 && completed === total;
        const currentLabel = allDone ? "本轮队列已全部标记" : currentItem?.label || "继续处理本轮学习动作";
        return `<section class="learning-queue" aria-label="本轮学习队列" data-learning-queue-index="${messageIndex}">
          <header>
            <div class="learning-queue-title">
              <strong>本轮学习队列</strong>
              <span>${completed}/${total} 已标记 · 当前：${escapeHtml(currentLabel)}</span>
            </div>
            <div class="learning-queue-progress" aria-label="学习队列进度" style="--queue-progress: ${percent}%"><span></span></div>
            <p>${escapeHtml(queue.summary || "把本轮回答推进成连续学习动作。")}</p>
          </header>
          <div class="learning-queue-items">
            ${items.map((item, index) => renderLearningQueueItem(item, index, allDone ? "" : currentItem?.id, messageIndex)).join("")}
          </div>
          ${queue.boundary ? `<p>${escapeHtml(queue.boundary)}</p>` : ""}
        </section>`;
      }

      function renderLearningQueueItem(item, index, currentItemId, messageIndex) {
        const isDone = item.done === true;
        const isCurrent = item.id === currentItemId && !isDone;
        const dynamicGate = item.requiresEvidenceGate === true ? learningActionGate(messages[messageIndex]) : { locked: false };
        const isLocked = (item.locked === true || dynamicGate.locked === true) && !isDone;
        const isFeedbackGated = item.completionMode === "evidence_feedback" && !isDone;
        const attrs = learningQueueActionAttrs(item, messageIndex);
        const lockedLabel = dynamicGate.locked ? dynamicGate.label : item.lockedLabel;
        const lockedReason = dynamicGate.locked ? dynamicGate.reason : item.lockedReason;
        const actionButton = item.action
          ? `<button class="learning-queue-action" type="button" ${attrs} ${isLocked ? "disabled" : ""}>${escapeHtml(isLocked ? lockedLabel || "先核对证据" : item.actionLabel || "继续")}</button>`
          : "";
        return `<article class="learning-queue-item${isCurrent ? " is-current" : ""}${isDone ? " is-done" : ""}${isLocked ? " is-locked" : ""}" data-learning-queue-item="${escapeAttribute(item.id || "")}">
          <span class="learning-queue-index">${isDone ? "✓" : index + 1}</span>
          <div class="learning-queue-body">
            <div class="learning-queue-head">
              <strong>${escapeHtml(item.label || "")}</strong>
              <span class="learning-queue-kind">${escapeHtml(learningQueueKindLabel(item.kind))}</span>
            </div>
            ${item.reason ? `<p>${escapeHtml(item.reason)}</p>` : ""}
            <div class="learning-queue-actions">
              ${actionButton}
              <button class="learning-queue-toggle${isDone ? " is-done" : ""}" type="button" data-learning-queue-toggle="${escapeAttribute(item.id || "")}" data-message-index="${messageIndex}" ${isLocked || isFeedbackGated ? "disabled" : ""}>${isDone ? "取消标记" : isFeedbackGated ? "用证据反馈完成" : "标记看过"}</button>
            </div>
            ${isLocked && lockedReason ? `<p>${escapeHtml(lockedReason)}</p>` : ""}
            ${item.boundary ? `<p>${escapeHtml(item.boundary)}</p>` : ""}
          </div>
        </article>`;
      }

      function learningQueueActionAttrs(item, messageIndex) {
        const attrs = [
          `data-learning-queue-action="${escapeAttribute(item.action || "")}"`,
          `data-message-index="${messageIndex}"`,
          `data-learning-queue-item-id="${escapeAttribute(item.id || "")}"`,
        ];
        if (item.claimId) attrs.push(`data-claim-target="${escapeAttribute(`${messageIndex}:${item.claimId}`)}"`);
        if (Number.isInteger(item.sourceIndex)) attrs.push(`data-source-target="${escapeAttribute(`${messageIndex}-${item.sourceIndex}`)}"`);
        if (item.prompt) attrs.push(`data-learning-queue-prompt="${escapeAttribute(item.prompt)}"`);
        if (item.section) attrs.push(`data-learning-queue-section="${escapeAttribute(item.section)}"`);
        return attrs.join(" ");
      }

      function learningQueueKindLabel(kind) {
        const labels = {
          conflict: "冲突",
          evidence: "证据",
          source_search: "补来源",
          study_check: "理解",
          data: "补材料",
          experiment: "验证",
          dossier: "档案",
          follow_up: "追问",
        };
        return labels[kind] || "学习";
      }

      function renderNextStepPanel(message, messageIndex) {
        if (!message || message.loading || message.error) return "";
        const action = buildNextStepAction(message, messageIndex);
        if (!action) return "";
        const attrs = [
          `data-next-step-action="${escapeAttribute(action.action)}"`,
          `data-message-index="${messageIndex}"`,
          action.sourceTarget ? `data-source-target="${escapeAttribute(action.sourceTarget)}"` : "",
          action.claimTarget ? `data-claim-target="${escapeAttribute(action.claimTarget)}"` : "",
          action.prompt ? `data-next-step-prompt="${escapeAttribute(action.prompt)}"` : "",
          action.section ? `data-next-step-section="${escapeAttribute(action.section)}"` : "",
        ].filter(Boolean).join(" ");
        return `<section class="next-step-panel" aria-label="本轮下一步">
          <header>
            <strong>本轮下一步</strong>
            <span>${escapeHtml(action.stage || "把这轮回答推进成可验证判断")}</span>
          </header>
          <div class="next-step-title">${escapeHtml(action.title)}</div>
          <p class="next-step-reason">${escapeHtml(action.reason)}</p>
          <button class="next-step-action" type="button" ${attrs}>${escapeHtml(action.button)}</button>
        </section>`;
      }

      function buildNextStepAction(message, messageIndex) {
        const sourceClaim = (message.evidenceChain?.claims || []).find((claim) => claim?.type === "source_evidence" && claim.id);
        if (sourceClaim) {
          return {
            action: "review-evidence",
            claimTarget: `${messageIndex}:${sourceClaim.id}`,
            title: "先核对关键来源",
            reason: "这轮回答已经命中原文证据。先看最关键的一条证据，再决定采纳、排除，或带产品数据继续问。",
            button: "定位关键证据",
            stage: "证据先行",
          };
        }

        if (Array.isArray(message.learningCard?.missingInputs) && message.learningCard.missingInputs.length > 0) {
          return {
            action: "fill-data",
            title: "先补真实产品数据",
            reason: "这轮还缺产品、关键词、页面或广告数据。补完后再追问，系统会把用户数据和原文证据分开处理。",
            button: "去补数据",
            stage: "补料判断",
          };
        }

        if (message.learningCard?.intent) {
          return {
            action: "save-dossier",
            title: "保存为待复核档案",
            reason: "这轮已经形成可复用的学习卡。保存后还需要继续做证据复核、业务材料补充和实验复盘。",
            button: "保存档案",
            stage: "沉淀到档案",
          };
        }

        return null;
      }

      function renderProductInputSummary(summary) {
        if (!summary || !Array.isArray(summary.facts)) return "";
        const facts = summary.facts.slice(0, 8);
        const sections = facts.length
          ? `<div class="product-summary-grid">${facts.map((section) => renderProductSummarySection(section)).join("")}</div>`
          : `<p>这轮没有识别到足够具体的产品材料。</p>`;
        const missing = (summary.missing || []).filter(Boolean).slice(0, 8);
        return `<section class="product-input-summary" aria-label="本轮产品输入">
          <header>
            <strong>本轮产品输入</strong>
            <span>${escapeHtml(summary.summary || "用户提供的信息")}</span>
          </header>
          ${sections}
          ${missing.length ? `<p class="product-summary-missing"><strong>仍缺材料：</strong>${escapeHtml(missing.join("、"))}</p>` : ""}
          <p>${escapeHtml(summary.caution || "这些是用户输入，不是资料证据。")}</p>
        </section>`;
      }

      function renderProductSummarySection(section) {
        const items = Array.isArray(section.items) ? section.items.slice(0, 6) : [];
        const missing = Array.isArray(section.missing) ? section.missing.slice(0, 4) : [];
        return `<article class="product-summary-section">
          <strong>${escapeHtml(section.label || "产品信息")}</strong>
          ${items.length ? `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : "<p>暂无具体内容。</p>"}
          ${missing.length ? `<p>还缺：${escapeHtml(missing.join("、"))}</p>` : ""}
        </article>`;
      }

      function renderDiagnosisPanel(panel, messageIndex) {
        if (!panel || !Array.isArray(panel.tracks) || panel.tracks.length === 0) return "";
        const checked = panel.checked || {};
        const gate = learningActionGate(messages[messageIndex]);
        const tracks = panel.tracks
          .slice(0, 6)
          .map((track) => renderDiagnosisTrack(track, messageIndex, checked, gate))
          .join("");
        return `<section class="diagnosis-panel" data-message-index="${messageIndex}" aria-label="诊断排查面板">
          <header>
            <strong>诊断排查面板</strong>
            <span>${escapeHtml(panel.summary || "把本轮诊断拆成可执行检查项。")}</span>
          </header>
          <div class="diagnosis-priority">
            <strong>${escapeHtml(panel.priority || "先确认最关键的问题入口")}</strong>
            <p>${escapeHtml(panel.reason || "")}</p>
          </div>
          <div class="diagnosis-tracks">${tracks}</div>
          ${panel.caution ? `<p>${escapeHtml(panel.caution)}</p>` : ""}
        </section>`;
      }

      function renderDiagnosisTrack(track, messageIndex, checked = {}, gate = { locked: false }) {
        const checks = Array.isArray(track.checks) ? track.checks.slice(0, 6) : [];
        const checkRows = checks
          .map((check) => {
            const key = diagnosisCheckKey(track.id, check.id);
            const isChecked = checked[key] === true;
            return `<label>
              <input type="checkbox" data-diagnosis-check data-message-index="${messageIndex}" data-track-id="${escapeAttribute(track.id || "")}" data-check-id="${escapeAttribute(check.id || "")}" ${isChecked ? "checked" : ""} ${gate.locked ? "disabled" : ""} />
              <span>${escapeHtml(check.label || "")}</span>
            </label>`;
          })
          .join("");
        const prompt = track.prompt
          ? `<button class="diagnosis-prompt" type="button" data-diagnosis-prompt="${escapeAttribute(track.prompt)}" ${gate.locked ? "disabled" : ""} title="${escapeAttribute(gate.reason || "")}">${escapeHtml(gate.locked ? gate.label : "用这项继续追问")}</button>`
          : "";
        return `<article class="diagnosis-track">
          <div class="diagnosis-track-head">
            <strong>${escapeHtml(track.label || "检查项")}</strong>
            ${track.level ? `<span class="diagnosis-level">${escapeHtml(track.level)}</span>` : ""}
          </div>
          ${track.why ? `<p>${escapeHtml(track.why)}</p>` : ""}
          <div class="diagnosis-checks">${checkRows}</div>
          ${prompt}
        </article>`;
      }

      function renderValidationPack(pack, messageIndex) {
        if (!pack || typeof pack !== "object") return "";
        const gate = learningActionGate(messages[messageIndex]);
        const hypotheses = Array.isArray(pack.hypotheses) ? pack.hypotheses.slice(0, 4) : [];
        const dataRequests = Array.isArray(pack.dataRequests) ? pack.dataRequests.slice(0, 6) : [];
        const experiments = Array.isArray(pack.experiments) ? pack.experiments.slice(0, 3) : [];
        const decisionRules = Array.isArray(pack.decisionRules) ? pack.decisionRules.slice(0, 5) : [];
        if (hypotheses.length === 0 && dataRequests.length === 0 && experiments.length === 0 && decisionRules.length === 0) return "";
        const sourceBacked = pack.status === "source_backed";
        const hypothesisRows = hypotheses.length
          ? `<ol>${hypotheses.map((item) => {
              const sourceTarget = Number.isInteger(item.sourceIndex) ? `${messageIndex}-${item.sourceIndex}` : "";
              const sourceButton = sourceTarget
                ? ` <button class="claim-source-button" type="button" data-source-target="${escapeAttribute(sourceTarget)}">看来源 ${item.sourceIndex + 1}</button>`
                : "";
              return `<li>${escapeHtml(item.label || "")}${sourceButton}</li>`;
            }).join("")}</ol>`
          : `<p>${sourceBacked ? "暂无可显示假设。" : "这轮还没有作者来源，先补来源再提炼待验证假设。"}</p>`;
        const dataRows = dataRequests.length
          ? `<ul>${dataRequests.map((item) => `<li><strong>${escapeHtml(item.label || "")}</strong>：${escapeHtml(item.why || "")}</li>`).join("")}</ul>`
          : "<p>暂无数据项。</p>";
        const experimentRows = experiments.length
          ? `<ol>${experiments.map((item) => `<li><strong>${escapeHtml(item.title || "")}</strong>：${escapeHtml((item.steps || []).join(" -> "))}${item.successSignal ? `；观察：${escapeHtml(item.successSignal)}` : ""}</li>`).join("")}</ol>`
          : "<p>暂无小实验。</p>";
        const ruleRows = decisionRules.length
          ? `<ul>${decisionRules.map((item) => `<li>如果 ${escapeHtml(item.if || "")}，则 ${escapeHtml(item.then || "")}</li>`).join("")}</ul>`
          : "<p>暂无判断规则。</p>";
        const validationInputs = dataRequests.map((item, index) => ({
          id: item.id || `validation:${index}`,
          label: item.label || `验证数据 ${index + 1}`,
          verifies: item.why || "用于复核本轮回答",
          targetRole: index < 3 ? "primary" : "supporting",
        }));
        const dataForm = validationInputs.length > 0
          ? renderStructuredDataForm("validation-data-form", pack.followUpPrompt || "我补充了验证数据，请继续判断下一步。", validationInputs, "生成验证追问", gate)
          : "";
        const promptButton = pack.followUpPrompt
          ? `<button class="diagnosis-prompt" type="button" data-validation-prompt="${escapeAttribute(pack.followUpPrompt)}" ${gate.locked ? "disabled" : ""} title="${escapeAttribute(gate.reason || "")}">${escapeHtml(gate.locked ? gate.label : "带任务继续追问")}</button>`
          : "";
        return `<section class="validation-pack" data-status="${escapeAttribute(pack.status || "")}" aria-label="本轮业务验证任务包">
          <header>
            <strong>本轮业务验证任务包</strong>
            <span>${escapeHtml(pack.summary || "把这轮回答推进成可验证的业务动作。")}</span>
          </header>
          ${renderBusinessDecision(pack.businessDecision)}
          <div class="validation-grid">
            <div class="validation-block"><strong>待验证假设</strong>${hypothesisRows}</div>
            <div class="validation-block"><strong>要收集的数据</strong>${dataRows}</div>
            <div class="validation-block"><strong>小实验</strong>${experimentRows}</div>
            <div class="validation-block"><strong>判断规则</strong>${ruleRows}</div>
          </div>
          ${dataForm}
          <div class="validation-actions">${promptButton}</div>
          <div class="validation-boundary">${escapeHtml(pack.boundary || "用户业务材料只用于验证，不是作者原文证据。")}</div>
        </section>`;
      }

      function renderBusinessDecision(decision) {
        if (!decision || typeof decision !== "object") return "";
        const supportingData = Array.isArray(decision.supportingData) ? decision.supportingData.filter((item) => item?.label).slice(0, 6) : [];
        const missingData = Array.isArray(decision.missingData) ? decision.missingData.filter((item) => item?.label).slice(0, 5) : [];
        const opposingData = Array.isArray(decision.opposingData) ? decision.opposingData.filter((item) => item?.label).slice(0, 4) : [];
        const status = decision.status || "needs_data";
        const label = decision.label || "数据不足，暂时不能判断。";
        const supportingRows = supportingData.length
          ? `<ul>${supportingData.map((item) => `<li><strong>${escapeHtml(item.label || "")}</strong>：${escapeHtml(item.value || item.why || "")}</li>`).join("")}</ul>`
          : "<p class=\"business-decision-summary\">暂无已填写数据。</p>";
        const missingRows = missingData.length
          ? `<ul>${missingData.map((item) => `<li><strong>${escapeHtml(item.label || "")}</strong>：${escapeHtml(item.why || "")}</li>`).join("")}</ul>`
          : "<p class=\"business-decision-summary\">暂无关键缺口。</p>";
        const opposingRows = opposingData.length
          ? `<div class="business-decision-block"><strong>反向提醒</strong><ul>${opposingData.map((item) => `<li><strong>${escapeHtml(item.label || "")}</strong>：${escapeHtml(item.value || item.why || "")}</li>`).join("")}</ul></div>`
          : "";
        return `<section class="business-decision" data-business-decision-status="${escapeAttribute(status)}" aria-label="当前产品判断">
          <header>
            <div>
              <strong>当前产品判断</strong>
              <p class="business-decision-summary">${escapeHtml(label)}</p>
            </div>
            <span class="business-decision-status">${escapeHtml(businessDecisionStatusLabel(status))}</span>
          </header>
          ${decision.summary ? `<p class="business-decision-summary">${escapeHtml(decision.summary)}</p>` : ""}
          <div class="business-decision-grid">
            <div class="business-decision-block"><strong>支持这个判断的数据</strong>${supportingRows}</div>
            <div class="business-decision-block"><strong>仍缺的数据</strong>${missingRows}</div>
            ${opposingRows}
          </div>
          <p class="business-decision-boundary">${escapeHtml(decision.boundary || "用户产品数据不是作者原文证据，只用于判断适配性。")}</p>
        </section>`;
      }

      function businessDecisionStatusLabel(status) {
        if (status === "ready") return "可判断";
        if (status === "insufficient_data") return "数据不足";
        if (status === "needs_source") return "缺来源";
        return "待补数据";
      }

      function renderAnswerContent(content, messageIndex) {
        const text = String(content || "");
        const markerPattern = /【(?:(资料|证据|来源|推断|行动)(\d+)|缺少来源)】/g;
        let output = "";
        let cursor = 0;
        for (const match of text.matchAll(markerPattern)) {
          output += escapeHtml(text.slice(cursor, match.index));
          output += renderInlineReference(match, messageIndex);
          cursor = match.index + match[0].length;
        }
        output += escapeHtml(text.slice(cursor));
        return output;
      }

      function renderInlineReference(match, messageIndex) {
        if (match[0] === "【缺少来源】") {
          return `<span class="inline-ref missing">缺少来源</span>`;
        }
        const kind = match[1];
        const number = Number(match[2]);
        if (!Number.isInteger(number) || number < 1) return escapeHtml(match[0]);
        if (kind === "推断") {
          return `<button class="inline-ref inference" type="button" data-claim-target="${escapeAttribute(`${messageIndex}:system-inference:${number - 1}`)}">推断${number}</button>`;
        }
        if (kind === "证据") {
          return `<button class="inline-ref evidence" type="button" data-claim-target="${escapeAttribute(`${messageIndex}:source-evidence:${number - 1}`)}">证据${number}</button>`;
        }
        if (kind === "行动") {
          return `<button class="inline-ref action" type="button" data-claim-target="${escapeAttribute(`${messageIndex}:action-advice:${number - 1}`)}">行动${number}</button>`;
        }
        return `<button class="inline-ref source-ref" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${number - 1}`)}">资料${number}</button>`;
      }

      function bindDiagnosisPanelEvents() {
        document.querySelectorAll("[data-diagnosis-check]").forEach((input) => {
          input.addEventListener("change", () => {
            updateDiagnosisCheck(
              Number(input.dataset.messageIndex),
              input.dataset.trackId || "",
              input.dataset.checkId || "",
              input.checked,
            );
          });
        });
        document.querySelectorAll("[data-diagnosis-prompt]").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.disabled || learningActionGate(messages[messageIndexFromElement(button.closest(".message.assistant"))]).locked) return;
            const prompt = button.dataset.diagnosisPrompt || "";
            if (!prompt) return;
            questionEl.value = prompt;
            questionEl.focus();
          });
        });
        document.querySelectorAll("[data-conflict-question]").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.disabled || learningActionGate(messages[messageIndexFromElement(button.closest(".message.assistant"))]).locked) return;
            const prompt = button.dataset.conflictQuestion || "";
            if (!prompt) return;
            questionEl.value = prompt;
            safeLocalRemove(RETRY_QUESTION_KEY);
            questionEl.focus();
            questionEl.setSelectionRange(questionEl.value.length, questionEl.value.length);
          });
        });
      }

      function bindValidationPackEvents() {
        document.querySelectorAll("[data-validation-prompt]").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.disabled || learningActionGate(messages[messageIndexFromElement(button.closest(".message.assistant"))]).locked) return;
            const prompt = button.dataset.validationPrompt || "";
            if (!prompt) return;
            questionEl.value = prompt;
            safeLocalRemove(RETRY_QUESTION_KEY);
            questionEl.focus();
            questionEl.setSelectionRange(questionEl.value.length, questionEl.value.length);
          });
        });
      }

      function bindWorkflowIntentEvents() {
        document.querySelectorAll("[data-workflow-action]").forEach((button) => {
          button.addEventListener("click", () => handleWorkflowIntentAction(button));
        });
      }

      function handleWorkflowIntentAction(button) {
        if (button.disabled) return;
        const action = button.dataset.workflowAction || "";
        const messageEl = button.closest(".message.assistant");
        const gate = learningActionGate(messages[messageIndexFromElement(messageEl)]);
        const mayBypassGate = action === "review-evidence" || action === "mark-retry" ||
          (action === "fill-intent-prompt" && messages[messageIndexFromElement(messageEl)]?.workflowIntent?.type === "source_search");
        if (gate.locked && !mayBypassGate) return;
        if (action === "review-evidence" && button.dataset.claimTarget) {
          focusClaimByKey(button.dataset.claimTarget);
          return;
        }
        if (action === "save-dossier") {
          saveLearningNote(messageIndexFromElement(messageEl));
          return;
        }
        if (action === "fill-data") {
          focusFirstStructuredDataField(messageEl);
          return;
        }
        if (action === "review-diagnosis") {
          const diagnosis = messageEl?.querySelector(".diagnosis-panel");
          if (diagnosis) diagnosis.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        if (action === "review-validation") {
          const pack = messageEl?.querySelector(".validation-pack");
          if (pack) pack.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        if (action === "fill-intent-prompt") {
          fillQuestionFromWorkflowPrompt(button.dataset.workflowPrompt || "");
          return;
        }
        if (action === "mark-retry") {
          const messageIndex = messageIndexFromElement(messageEl);
          updateAuditFeedback(messageIndex, "retry");
        }
      }

      function messageIndexFromElement(messageEl) {
        if (!messageEl) return -1;
        const all = [...document.querySelectorAll("#messages .message")];
        return all.indexOf(messageEl);
      }

      function focusFirstStructuredDataField(scopeEl) {
        const firstField = scopeEl?.querySelector("[data-conflict-field-label]");
        if (!firstField) return;
        firstField.scrollIntoView({ behavior: "smooth", block: "center" });
        firstField.focus();
      }

      function fillQuestionFromWorkflowPrompt(prompt) {
        const text = String(prompt || "").trim();
        if (!text) return;
        questionEl.value = text;
        safeLocalRemove(RETRY_QUESTION_KEY);
        questionEl.focus();
        questionEl.setSelectionRange(questionEl.value.length, questionEl.value.length);
      }

      function bindStructuredDataFormEvents() {
        document.querySelectorAll("[data-conflict-fill-question]").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.disabled || learningActionGate(messages[messageIndexFromElement(button.closest(".message.assistant"))]).locked) return;
            fillStructuredDataQuestion(button.closest(".structured-data-form"));
          });
        });
      }

      function fillStructuredDataQuestion(form) {
        if (!form) return;
        const basePrompt = form.dataset.basePrompt || "";
        const rows = [...form.querySelectorAll("[data-conflict-field-label]")].map((input) => ({
          label: input.dataset.conflictFieldLabel || "",
          verifies: input.dataset.conflictFieldVerifies || "",
          role: input.dataset.conflictFieldRole || "",
          value: input.value.trim(),
          input,
        })).filter((item) => item.label);
        const filled = rows.filter((item) => item.value);
        const missing = rows.filter((item) => !item.value).map((item) => item.label);
        const note = form.querySelector(".structured-data-note");
        if (filled.length === 0) {
          if (note) note.textContent = "先至少填写一项真实数据，再生成追问。";
          rows[0]?.input.focus();
          return;
        }
        const productText = buildStructuredProductText(filled);
        const question = buildConflictDataQuestion(basePrompt, productText, missing);
        queueProductInputForPrompt(question, productText, null, {
          requirePromptMatch: false,
          rebuildFromText: true,
          allowEditedQuestion: true,
        });
        questionEl.value = question;
        safeLocalRemove(RETRY_QUESTION_KEY);
        questionEl.focus();
        questionEl.setSelectionRange(questionEl.value.length, questionEl.value.length);
        if (note) note.textContent = missing.length ? `已带入 ${filled.length} 项数据，仍缺 ${missing.slice(0, 3).join("、")}。` : `已带入 ${filled.length} 项数据。`;
      }

      function buildStructuredProductText(filled) {
        return filled
          .map((item) => {
            const purpose = item.verifies ? `（用途：${item.verifies}）` : "";
            return `${item.label}：${item.value}${purpose}`;
          })
          .join("\n");
      }

      function buildConflictDataQuestion(basePrompt, productText, missing = []) {
        const prompt = String(basePrompt || "请结合我补充的产品数据和本地资料，判断下一步优先级。").trim();
        const missingLine = missing.length ? `\n仍缺数据：${missing.slice(0, 6).join("、")}。如果这些数据不足，请先指出缺口，不要直接下最终判断。` : "";
        return [
          prompt,
          "",
          "我补充的产品数据：",
          productText,
          missingLine,
        ].filter(Boolean).join("\n");
      }

      function renderSourceTrustCard(trust, messageIndex) {
        if (!trust || typeof trust !== "object") return "";
        const categories = Array.isArray(trust.categories) ? trust.categories.slice(0, 5) : [];
        if (categories.length === 0) return "";
        const status = trust.status === "source_backed" ? "source_backed" : "needs_source";
        const trustTitle = String(trust.title || "本轮来源核对状态").replace("本轮来源可信链路", "本轮来源核对状态");
        return `<section class="source-trust" data-status="${escapeAttribute(status)}" aria-label="本轮来源核对状态">
          <header>
            <div>
              <strong>${escapeHtml(trustTitle)}</strong>
              <p class="source-trust-summary">${escapeHtml(trust.summary || "先看作者原文证据，再看系统整理。")}</p>
            </div>
            <span class="source-trust-status">${escapeHtml(trust.label || (status === "source_backed" ? "有作者原文支撑" : "缺少作者原文证据"))}</span>
          </header>
          <div class="source-trust-grid">${categories.map((item) => renderSourceTrustItem(item, messageIndex)).join("")}</div>
          ${renderSourceTreeRoute(trust.sourceTree)}
          <p class="source-trust-boundary">${escapeHtml(trust.boundary || "有来源不等于已经人工核验或业务验证完成；用户产品材料不是作者原文证据，实验复盘不是作者原文证据。")}</p>
        </section>`;
      }

      function renderSourceTreeRoute(route) {
        if (!route || typeof route !== "object" || route.status === "empty") return "";
        const resolved = Number(route.resolvedSourceCount || 0);
        const candidates = Number(route.candidateCount || 0);
        const hints = Number(route.summaryHintCount || 0);
        const statusText = resolved > 0
          ? `已回到 ${resolved} 个作者原文`
          : candidates > 0
            ? `${candidates} 个候选待核对`
            : `${hints} 条摘要提示`;
        return `<div class="source-trust-route" data-state="${escapeAttribute(route.status || "empty")}">
          <strong>${escapeHtml(route.title || "OpenHuman 来源树找路")} · ${escapeHtml(statusText)}</strong>
          <p>${escapeHtml(route.summary || "来源树只作为找路提示，本轮不会把摘要当成作者原文证据。")}</p>
          <p>${escapeHtml(route.boundary || "来源树摘要不能当成作者原文证据；回答引用必须回到本地作者原文上下文。")}</p>
        </div>`;
      }

      function renderSourceTrustItem(item, messageIndex) {
        const count = Number.isFinite(Number(item?.count)) ? Number(item.count) : 0;
        const sourceButtons = Array.isArray(item?.sourceIndexes)
          ? item.sourceIndexes
              .filter((sourceIndex) => Number.isInteger(sourceIndex))
              .slice(0, 2)
              .map((sourceIndex) => {
                const target = `${messageIndex}-${sourceIndex}`;
                return `<button class="claim-source-button" type="button" data-source-context-target="${escapeAttribute(target)}">原文上下文</button>`;
              })
              .join("")
          : "";
        const claimButtons = Array.isArray(item?.claimIds)
          ? item.claimIds
              .filter(Boolean)
              .slice(0, 2)
              .map((claimId) => `<button class="claim-source-button" type="button" data-claim-target="${escapeAttribute(`${messageIndex}:${claimId}`)}">定位证据</button>`)
              .join("")
          : "";
        return `<article class="source-trust-item" data-kind="${escapeAttribute(item?.id || "")}" data-state="${escapeAttribute(item?.status || "missing")}">
          <strong>${escapeHtml(item?.label || SOURCE_TRUST_LABELS[item?.id] || "核对分类")}</strong>
          <span class="source-trust-count">${escapeHtml(count ? `${count} 项` : "暂无")}</span>
          <p>${escapeHtml(item?.description || "")}</p>
          ${sourceButtons || claimButtons ? `<div class="source-trust-actions">${sourceButtons}${claimButtons}</div><div class="source-context-slot"></div>` : ""}
        </article>`;
      }

      function updateDiagnosisCheck(messageIndex, trackId, checkId, checked) {
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant" || !message.diagnosisPanel || !trackId || !checkId) return;
        const next = { ...(message.diagnosisPanel.checked || {}) };
        const key = diagnosisCheckKey(trackId, checkId);
        if (checked) next[key] = true;
        else delete next[key];
        message.diagnosisPanel = { ...message.diagnosisPanel, checked: next };
        saveMessages();
      }

      function diagnosisCheckKey(trackId, checkId) {
        return `${trackId}::${checkId}`;
      }

      function renderEvidenceAudit(audit, messageIndex) {
        if (!audit || !Array.isArray(audit.checks) || audit.checks.length === 0) return "";
        const feedbackValue = audit.feedback || "";
        const checks = audit.checks.slice(0, 6).map((check) => {
          const sourceButtons = Array.isArray(check.sourceIndexes) && check.sourceIndexes.length
            ? `<div class="claim-actions">${check.sourceIndexes.slice(0, 4).map((sourceIndex) => `<button class="claim-source-button" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${sourceIndex}`)}">看来源 ${sourceIndex + 1}</button>`).join("")}</div>`
            : "";
          return `<article class="audit-check" data-status="${escapeAttribute(check.status || "warn")}">
            <strong>${escapeHtml(check.label || "")}</strong>
            <p class="claim-meta">${escapeHtml(check.message || "")}</p>
            ${sourceButtons}
          </article>`;
        }).join("");
        const conflictSignals = Array.isArray(audit.conflictSignals) ? audit.conflictSignals.slice(0, 4) : [];
        const conflictPanel = conflictSignals.length
          ? `<div class="audit-conflicts">
              <strong>需要人工对比的冲突点</strong>
              ${conflictSignals.map((item) => renderAuditConflictItem(item, messageIndex)).join("")}
              <p class="claim-meta">这是风险提示，不是在判断哪篇资料一定正确。先看双方来源，再带具体产品继续追问。</p>
            </div>`
          : "";
        const followup = feedbackValue === "citation_wrong"
          ? "已标记引用位置不准；下一步建议定位具体来源，或用更具体的问题重新查。"
          : feedbackValue === "retry"
            ? "已标记需要重查；上一轮问题会保留在输入框，方便你调整后再问。"
            : feedbackValue === "useful"
              ? "已标记本回答有帮助；这只是答案层面的反馈，不会自动采纳具体证据。"
              : "";
        return `<section class="evidence-audit" data-level="${escapeAttribute(audit.level || "medium")}" aria-label="答案引用核对">
          <header>
            <div>
              <strong>答案引用核对</strong>
              <p class="claim-meta">${escapeHtml(audit.summary || "检查本次答案的来源支撑和推断边界。")}</p>
              ${audit.caution ? `<p class="claim-meta">${escapeHtml(String(audit.caution).replace("可信度检查", "引用核对"))}</p>` : ""}
            </div>
            <span class="audit-level">${escapeHtml(String(audit.label || "").replace("可信度较高", "引用支撑较充分"))}</span>
          </header>
          <div class="audit-grid">${checks}</div>
          ${conflictPanel}
          <div class="audit-feedback">
            <span class="claim-meta">这次答案：</span>
            ${renderAuditFeedbackButton(messageIndex, "useful", "本回答有帮助", feedbackValue)}
            ${renderAuditFeedbackButton(messageIndex, "citation_wrong", "引用位置不准", feedbackValue)}
            ${renderAuditFeedbackButton(messageIndex, "retry", "需要重查", feedbackValue)}
          </div>
          ${followup ? `<p class="claim-meta">${escapeHtml(followup)}</p>` : ""}
        </section>`;
      }

      function renderAuditConflictItem(item, messageIndex) {
        const comparison = item.comparison && typeof item.comparison === "object" ? item.comparison : null;
        const conceptTitle = renderConflictConceptTitle(item);
        if (comparison) {
          return `<article class="audit-conflict-item">
            <strong>${escapeHtml(conceptTitle)}</strong>
            <p class="claim-meta">${escapeHtml(comparison.summary || "")}</p>
            ${comparison.differenceFocus ? `<p class="claim-meta">${escapeHtml(comparison.differenceFocus)}</p>` : ""}
            <div class="conflict-compare">
              ${renderConflictSide(comparison.supportLabel || "支持先处理", comparison.supportQuote, comparison.supportSource, messageIndex)}
              ${renderConflictSide(comparison.cautionLabel || "提醒先复核", comparison.cautionQuote, comparison.cautionSource, messageIndex)}
            </div>
            ${comparison.suggestedCheck ? `<p class="claim-meta"><strong>先验证：</strong>${escapeHtml(comparison.suggestedCheck)}</p>` : ""}
            ${renderSupportingConflictReasons(item.supportingReasons)}
            ${renderConflictNextQuestion(comparison.nextQuestion, messageIndex)}
          </article>`;
        }
        const indexes = Array.isArray(item.sourceIndexes) ? item.sourceIndexes.filter(Number.isInteger).slice(0, 4) : [];
        const buttons = indexes.length
          ? `<div class="claim-actions">${indexes.map((sourceIndex) => `<button class="claim-source-button" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${sourceIndex}`)}">看来源 ${sourceIndex + 1}</button>`).join("")}</div>`
          : "";
        const support = Array.isArray(item.support) && item.support[0]?.quote
          ? `一边强调：${item.support[0].quote}`
          : "一边可能强调优先处理。";
        const caution = Array.isArray(item.caution) && item.caution[0]?.quote
          ? `另一边提醒：${item.caution[0].quote}`
          : "另一边可能提醒暂缓或先看其他瓶颈。";
        return `<article class="audit-conflict-item">
          <strong>${escapeHtml(conceptTitle)}</strong>
          <p class="claim-meta">${escapeHtml(`${support} ${caution}`)}</p>
          ${buttons}
        </article>`;
      }

      function renderConflictConceptTitle(item) {
        return [item?.concept, ...(Array.isArray(item?.relatedConcepts) ? item.relatedConcepts : [])].filter(Boolean).slice(0, 4).join(" / ") || "未知概念";
      }

      function renderAuthorPerspectiveRoom(room, messageIndex) {
        if (!room || typeof room !== "object" || room.status !== "ready") return "";
        const authors = Array.isArray(room.authors) ? room.authors.filter((item) => item?.author && Array.isArray(item.items) && item.items.length).slice(0, 3) : [];
        if (authors.length < 2) return "";
        const concepts = Array.isArray(room.sharedConcepts) ? room.sharedConcepts.filter((item) => item?.label).slice(0, 6) : [];
        const differences = Array.isArray(room.differences) ? room.differences.filter((item) => item?.label || item?.focus).slice(0, 3) : [];
        const requiredData = Array.isArray(room.requiredData) ? room.requiredData.filter((item) => item?.label).slice(0, 5) : [];
        const open = room.trigger === "conflict" ? " open" : "";
        const summary = `${authors.length} 位作者 · ${concepts.length || 0} 个共同概念 · ${differences.length || 0} 个分歧点`;
        return `<details class="author-perspective"${open} data-trigger="${escapeAttribute(room.trigger || "")}" aria-label="跨作者观点对照">
          <summary>
            <span class="author-perspective-title">
              <strong>${escapeHtml(room.title || "跨作者观点对照")}</strong>
              <span>${escapeHtml(summary)}。只在真实冲突或明确对比问题中显示。</span>
            </span>
            <span class="audit-level">${escapeHtml(room.trigger === "conflict" ? "需对照" : "对照")}</span>
          </summary>
          ${concepts.length ? `<div class="author-perspective-chip-list">${concepts.map((item) => `<span class="author-perspective-chip">${escapeHtml(item.label)}</span>`).join("")}</div>` : ""}
          ${differences.length ? `<div class="author-perspective-differences">${differences.map((item) => `<article class="author-perspective-difference"><strong>${escapeHtml(item.label || "分歧点")}</strong>${item.focus ? `<p class="author-perspective-meta">${escapeHtml(item.focus)}</p>` : ""}</article>`).join("")}</div>` : ""}
          <div class="author-perspective-authors">${authors.map((author) => renderAuthorPerspectiveAuthor(author, messageIndex)).join("")}</div>
          ${requiredData.length ? `<div class="author-perspective-data"><strong>判断适配性前要补的数据</strong>${requiredData.map((item) => `<article class="author-perspective-data-item"><strong>${escapeHtml(item.label)}</strong><span class="author-perspective-meta">${escapeHtml(item.why || item.placeholder || "")}</span></article>`).join("")}</div>` : ""}
          <div class="author-perspective-actions">
            ${room.nextPrompt ? `<button class="diagnosis-prompt" type="button" data-author-perspective-prompt="${escapeAttribute(room.nextPrompt)}">带这些数据继续判断</button>` : ""}
          </div>
          <p class="author-perspective-boundary">${escapeHtml(room.boundary || "对照室只整理待核对来源，不自动判断哪位作者正确。")}</p>
        </details>`;
      }

      function renderAuthorPerspectiveAuthor(author, messageIndex) {
        const first = author.items[0] || {};
        const target = Number.isInteger(first.sourceIndex) ? `${messageIndex}-${first.sourceIndex}` : "";
        return `<article class="author-perspective-author">
          <strong>${escapeHtml(author.author || "未知作者")}</strong>
          ${author.role ? `<span class="author-perspective-meta">${escapeHtml(author.role)}</span>` : ""}
          ${author.summary ? `<p class="author-perspective-meta">${escapeHtml(author.summary)}</p>` : ""}
          ${first.stance ? `<p>${escapeHtml(first.stance)}</p>` : ""}
          ${first.quote ? `<blockquote>${escapeHtml(first.quote)}</blockquote>` : ""}
          <div class="author-perspective-actions">
            ${target ? `<button class="evidence-button" type="button" data-source-context-target="${escapeAttribute(target)}" data-source-context-quote="${escapeAttribute(first.quote || "")}">原文上下文</button>` : ""}
            ${target ? `<button class="evidence-button" type="button" data-source-target="${escapeAttribute(target)}">定位来源</button>` : ""}
          </div>
        </article>`;
      }

      function renderSupportingConflictReasons(items) {
        const reasons = Array.isArray(items) ? items.filter((item) => item?.concept).slice(0, 4) : [];
        if (reasons.length === 0) return "";
        return `<div class="conflict-supporting">
          <strong>辅助判断因素</strong>
          <div class="conflict-data-list">
            ${reasons.map((item) => `<span class="conflict-data" title="${escapeAttribute(item.summary || item.suggestedCheck || "")}">${escapeHtml(renderConflictConceptTitle(item))}</span>`).join("")}
          </div>
          <p class="claim-meta">${escapeHtml(reasons[0].summary || "这些因素用于验证主冲突，不单独作为优先级结论。")}</p>
        </div>`;
      }

      function renderConflictNextQuestion(nextQuestion, messageIndex) {
        if (!nextQuestion || typeof nextQuestion !== "object") return "";
        const gate = learningActionGate(messages[messageIndex]);
        const prompt = String(nextQuestion.question || "").trim();
        if (!prompt) return "";
        const requiredData = Array.isArray(nextQuestion.requiredData) ? nextQuestion.requiredData.filter((item) => item?.label).slice(0, 7) : [];
        const primaryData = requiredData.filter((item) => item.targetRole !== "supporting");
        const supportingData = requiredData.filter((item) => item.targetRole === "supporting");
        return `<div class="conflict-next">
          <strong>带数据判断</strong>
          ${renderConflictDataGroup("验证主判断", primaryData)}
          ${renderConflictDataGroup("排除辅助因素", supportingData)}
          ${renderStructuredDataForm("conflict-data-form", prompt, requiredData, "生成数据追问", gate)}
          ${nextQuestion.boundary ? `<p class="claim-meta">${escapeHtml(nextQuestion.boundary)}</p>` : ""}
          <button class="diagnosis-prompt" type="button" data-conflict-question="${escapeAttribute(prompt)}" ${gate.locked ? "disabled" : ""} title="${escapeAttribute(gate.reason || "")}">${escapeHtml(gate.locked ? gate.label : nextQuestion.label || "带数据项追问")}</button>
        </div>`;
      }

      function renderConflictDataGroup(title, items) {
        const list = Array.isArray(items) ? items.filter((item) => item?.label).slice(0, 7) : [];
        if (list.length === 0) return "";
        return `<div>
          <p class="claim-meta"><strong>${escapeHtml(title)}：</strong></p>
          <div class="conflict-data-list">
            ${list.map((item) => {
              const purpose = item.verifies || item.reason || "";
              return `<div class="conflict-data conflict-data-detail" title="${escapeAttribute(purpose)}"><span class="conflict-data-label">${escapeHtml(item.label)}</span>${purpose ? `<span class="conflict-data-purpose">${escapeHtml(purpose)}</span>` : ""}</div>`;
            }).join("")}
          </div>
        </div>`;
      }

      function renderStructuredDataForm(formClass, prompt, items, buttonLabel, gate = { locked: false }) {
        const fields = Array.isArray(items) ? items.filter((item) => item?.label).slice(0, 7) : [];
        if (fields.length === 0) return "";
        return `<div class="${escapeAttribute(formClass)} structured-data-form" data-base-prompt="${escapeAttribute(prompt || "")}">
          <div class="structured-data-fields">
            ${fields.map((item) => {
              const purpose = item.verifies || item.reason || "";
              return `<div class="structured-data-field">
                <label for="${escapeAttribute(`data-${item.id || safeFieldId(item.label)}`)}">${escapeHtml(item.label)}</label>
                ${purpose ? `<span>${escapeHtml(purpose)}</span>` : ""}
                <input id="${escapeAttribute(`data-${item.id || safeFieldId(item.label)}`)}" type="text" inputmode="text" placeholder="填写你的实际数据" data-conflict-field-id="${escapeAttribute(item.id || "")}" data-conflict-field-label="${escapeAttribute(item.label)}" data-conflict-field-role="${escapeAttribute(item.targetRole || "")}" data-conflict-field-verifies="${escapeAttribute(purpose)}" />
              </div>`;
            }).join("")}
          </div>
          <div class="structured-data-actions">
            <button class="diagnosis-prompt" type="button" data-conflict-fill-question ${gate.locked ? "disabled" : ""} title="${escapeAttribute(gate.reason || "")}">${escapeHtml(gate.locked ? gate.label : buttonLabel || "生成数据追问")}</button>
            <span class="structured-data-note">${escapeHtml(gate.locked ? gate.reason : "填写的数据只作为你的产品材料，不会被当成原文证据。")}</span>
          </div>
        </div>`;
      }

      function safeFieldId(value) {
        return String(value || "field").replace(/[^a-zA-Z0-9_-]+/g, "-").slice(0, 50) || "field";
      }

      function renderConflictSide(label, quote, source, messageIndex) {
        const sourceIndex = Number.isInteger(source?.sourceIndex) ? source.sourceIndex : null;
        const sourceLine = [source?.author, source?.date, source?.title].filter(Boolean).join(" · ");
        const button = sourceIndex !== null
          ? `<button class="claim-source-button" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${sourceIndex}`)}">定位来源 ${sourceIndex + 1}</button>`
          : "";
        return `<article class="conflict-side">
          <strong>${escapeHtml(label || "观点")}</strong>
          <blockquote>${escapeHtml(quote || "暂无摘录")}</blockquote>
          ${sourceLine ? `<p class="claim-meta">${escapeHtml(sourceLine)}</p>` : ""}
          ${button}
        </article>`;
      }

      function renderAuditFeedbackButton(messageIndex, value, label, currentValue) {
        const active = currentValue === value;
        return `<button class="feedback-button${active ? " is-active" : ""}" type="button" data-message-index="${messageIndex}" data-audit-feedback="${escapeAttribute(value)}" aria-pressed="${active ? "true" : "false"}">${label}</button>`;
      }

      function renderEvidenceChain(chain, messageIndex, feedback = {}) {
        if (!chain || !Array.isArray(chain.claims) || chain.claims.length === 0) return "";
        const claims = chain.claims.slice(0, 12).map((claim) => renderClaim(claim, messageIndex, feedback)).join("");
        return `<section class="evidence-chain" data-message-index="${messageIndex}" aria-label="逐条证据链">
          <header>
            <strong>逐条证据链</strong>
            <span>${escapeHtml(chain.summary || "区分原文证据和系统推断")}</span>
          </header>
          <div class="claim-list">${claims}</div>
        </section>`;
      }

      function renderSynthesisAnswer(synthesis, messageIndex) {
        if (!synthesis || typeof synthesis !== "object") return "";
        const status = synthesis.status || "needs_source";
        const statusLabel = status === "source_backed" ? "来源支撑" : status === "needs_review" ? "先核对冲突" : "需要补来源";
        const coverage = synthesis.sourceCoverage || {};
        const coverageText = Number(coverage.evidenceCount || 0) > 0
          ? `${Number(coverage.evidenceCount || 0)} 条原文证据 · ${Number(coverage.sourceCount || 0)} 个来源 · ${Number(coverage.authorCount || 0)} 位作者`
          : "暂无可绑定原文证据";
        const points = Array.isArray(synthesis.points) ? synthesis.points.slice(0, 5) : [];
        const authorRows = Array.isArray(synthesis.authorPerspectives) ? synthesis.authorPerspectives.slice(0, 3) : [];
        const conflicts = Array.isArray(synthesis.conflicts) ? synthesis.conflicts.slice(0, 3) : [];
        const gaps = Array.isArray(synthesis.gaps) ? synthesis.gaps.slice(0, 4) : [];
        return `<section class="synthesis-answer" data-status="${escapeAttribute(status)}" aria-label="本轮综合答案">
          <header>
            <div>
              <strong>${escapeHtml(synthesis.title || "本轮综合答案")}</strong>
              <p class="synthesis-meta">${escapeHtml(coverageText)}</p>
            </div>
            <span class="synthesis-status">${escapeHtml(statusLabel)}</span>
          </header>
          ${synthesis.summary ? `<p class="synthesis-summary">${escapeHtml(synthesis.summary)}</p>` : ""}
          ${points.length ? `<div class="synthesis-points">${points.map((point) => renderSynthesisPoint(point, messageIndex)).join("")}</div>` : ""}
          ${authorRows.length > 1 ? `<div class="synthesis-authors">${authorRows.map((item) => renderSynthesisAuthor(item, messageIndex)).join("")}</div>` : ""}
          ${conflicts.length ? `<div class="synthesis-conflicts">${conflicts.map((item) => renderSynthesisConflict(item, messageIndex)).join("")}</div>` : ""}
          ${gaps.length ? `<div class="synthesis-gaps">${gaps.map((item) => renderSynthesisGap(item)).join("")}</div>` : ""}
          <p class="synthesis-boundary">${escapeHtml(synthesis.boundary || "系统综合，不是新的作者原文证据；需要回到来源和业务数据验证。")}</p>
        </section>`;
      }

      function renderSynthesisPoint(point, messageIndex) {
        const support = Array.isArray(point?.support) ? point.support.slice(0, 3) : [];
        const actions = support
          .map((item) => renderSynthesisSupportAction(item, messageIndex))
          .filter(Boolean)
          .join("");
        return `<article class="synthesis-point">
          <strong>${escapeHtml(point?.label || "综合要点")}</strong>
          <p>${escapeHtml(point?.text || "")}</p>
          <p class="synthesis-meta">${escapeHtml(point?.basis || "系统综合，不是新的作者原文证据。")}</p>
          ${actions ? `<div class="synthesis-actions">${actions}</div>` : ""}
        </article>`;
      }

      function renderNotebookGuide(guide, messageIndex) {
        if (!guide || typeof guide !== "object") return "";
        const status = guide.status === "source_backed" ? "source_backed" : "needs_source";
        const coverage = guide.sourceCoverage || {};
        const statusLabel = status === "source_backed"
          ? `${Number(coverage.evidenceCount || 0)} 条原文证据`
          : "需要补来源";
        const briefing = Array.isArray(guide.briefing) ? guide.briefing.slice(0, 4) : [];
        const faq = Array.isArray(guide.faq) ? guide.faq.slice(0, 3) : [];
        const quiz = Array.isArray(guide.quiz) ? guide.quiz.slice(0, 3) : [];
        const glossary = Array.isArray(guide.glossary) ? guide.glossary.slice(0, 6) : [];
        const gaps = Array.isArray(guide.gaps) ? guide.gaps.slice(0, 4) : [];
        return `<section class="notebook-guide" data-status="${escapeAttribute(status)}" aria-label="本轮学习简报">
          <header>
            <div>
              <strong>${escapeHtml(guide.title || "本轮学习简报")}</strong>
              <p class="notebook-guide-meta">${escapeHtml(status === "source_backed" ? `${Number(coverage.sourceCount || 0)} 个来源 · ${Number(coverage.authorCount || 0)} 位作者` : "暂无可绑定原文证据")}</p>
            </div>
            <span class="notebook-guide-status">${escapeHtml(statusLabel)}</span>
          </header>
          ${guide.summary ? `<p class="notebook-guide-summary">${escapeHtml(guide.summary)}</p>` : ""}
          ${briefing.length ? `<div class="notebook-guide-grid">${briefing.map((item) => renderNotebookBriefingItem(item, messageIndex)).join("")}</div>` : ""}
          ${faq.length ? `<div class="notebook-guide-list">${faq.map((item) => renderNotebookQaItem(item, messageIndex, "FAQ")).join("")}</div>` : ""}
          ${quiz.length ? `<div class="notebook-guide-list">${quiz.map((item) => renderNotebookQaItem(item, messageIndex, "自测")).join("")}</div>` : ""}
          ${glossary.length ? `<div class="notebook-guide-grid">${glossary.map((item) => renderNotebookGlossaryItem(item, messageIndex)).join("")}</div>` : ""}
          ${gaps.length ? `<div class="notebook-guide-list">${gaps.map((item) => renderNotebookGapItem(item)).join("")}</div>` : ""}
          ${renderNotebookGuidePrompts(guide.nextPrompts)}
          <p class="notebook-guide-boundary">${escapeHtml(guide.boundary || "系统整理，不是作者原文证据；要采纳结论必须回到来源。")}</p>
        </section>`;
      }

      function renderNotebookBriefingItem(item, messageIndex) {
        return `<article class="notebook-guide-card">
          <strong>${escapeHtml(item?.label || "学习要点")}</strong>
          <p>${escapeHtml(item?.text || "")}</p>
          <p class="notebook-guide-meta">系统整理，不是作者原文证据</p>
          ${renderNotebookGuideActions(item, messageIndex)}
        </article>`;
      }

      function renderNotebookQaItem(item, messageIndex, label) {
        return `<article class="notebook-guide-card">
          <strong>${escapeHtml(label)} · ${escapeHtml(item?.question || "复习问题")}</strong>
          <p>${escapeHtml(item?.answer || "")}</p>
          <p class="notebook-guide-meta">系统整理，不是作者原文证据</p>
          ${renderNotebookGuideActions(item, messageIndex)}
        </article>`;
      }

      function renderNotebookGlossaryItem(item, messageIndex) {
        return `<article class="notebook-guide-card">
          <strong>${escapeHtml(item?.term || "概念")}</strong>
          <p>${escapeHtml(item?.definition || "")}</p>
          <p class="notebook-guide-meta">系统整理，不是作者原文证据</p>
          ${renderNotebookGuideActions(item, messageIndex)}
        </article>`;
      }

      function renderNotebookGapItem(item) {
        const prompt = item?.prompt || "";
        return `<article class="notebook-guide-card">
          <strong>${escapeHtml(item?.label || "待补缺口")}</strong>
          <p>${escapeHtml(item?.reason || "")}</p>
          ${prompt ? `<button class="diagnosis-prompt" type="button" data-notebook-guide-prompt="${escapeAttribute(prompt)}">${escapeHtml(compactText(prompt, 42))}</button>` : ""}
        </article>`;
      }

      function renderNotebookGuideActions(item, messageIndex) {
        const sourceIndex = Array.isArray(item?.sourceIndexes) ? item.sourceIndexes.find(Number.isInteger) : null;
        const target = Number.isInteger(sourceIndex) ? `${messageIndex}-${sourceIndex}` : "";
        const prompt = item?.prompt || "";
        const sourceButton = target ? `<button class="evidence-button" type="button" data-notebook-guide-source-target="${escapeAttribute(target)}" data-source-target="${escapeAttribute(target)}">定位来源</button>` : "";
        const contextButton = target ? `<button class="evidence-button" type="button" data-source-context-target="${escapeAttribute(target)}" data-source-context-quote="${escapeAttribute(item?.quote || item?.answer || item?.text || "")}">原文上下文</button>` : "";
        const promptButton = prompt ? `<button class="diagnosis-prompt" type="button" data-notebook-guide-prompt="${escapeAttribute(prompt)}">继续追问</button>` : "";
        return sourceButton || contextButton || promptButton ? `<div class="notebook-guide-actions">${sourceButton}${contextButton}${promptButton}</div>` : "";
      }

      function renderNotebookGuidePrompts(prompts) {
        const rows = Array.isArray(prompts) ? prompts.filter(Boolean).slice(0, 3) : [];
        return rows.length ? `<div class="notebook-guide-actions">${rows.map((prompt) => `<button class="diagnosis-prompt" type="button" data-notebook-guide-prompt="${escapeAttribute(prompt)}">${escapeHtml(compactText(prompt, 54))}</button>`).join("")}</div>` : "";
      }

      function renderSourceDecisionTable(table, messageIndex) {
        if (!table || typeof table !== "object") return "";
        const status = ["ready", "needs_data", "needs_review", "needs_source"].includes(table.status) ? table.status : "needs_review";
        const statusLabel = status === "ready"
          ? "可进入验证"
          : status === "needs_data"
            ? "先补业务数据"
            : status === "needs_source"
              ? "缺少来源"
              : "先复核来源";
        const rows = Array.isArray(table.rows) ? table.rows.filter((item) => Number.isInteger(item?.sourceIndex)).slice(0, 6) : [];
        const nextPrompt = String(table.nextPrompt || "").trim();
        const body = rows.length
          ? `<div class="source-decision-grid">${rows.map((row) => renderSourceDecisionRow(row, messageIndex)).join("")}</div>`
          : `<article class="source-decision-row"><div class="source-decision-cell"><span>状态</span><strong>缺少作者原文</strong><p>这轮不能生成来源决策表，请先补可定位来源。</p></div></article>`;
        return `<section class="source-decision-table" data-status="${escapeAttribute(status)}" aria-label="来源决策表">
          <header>
            <div>
              <strong>${escapeHtml(table.title || "来源决策表")}</strong>
              <p class="source-decision-summary">${escapeHtml(table.summary || "把本轮来源拆成可复核的行动判断。")}</p>
            </div>
            <span class="source-decision-status">${escapeHtml(statusLabel)}</span>
          </header>
          ${body}
          <div class="source-decision-actions">
            ${nextPrompt ? `<button class="diagnosis-prompt" type="button" data-notebook-guide-prompt="${escapeAttribute(nextPrompt)}">${escapeHtml(compactText(nextPrompt, 56))}</button>` : ""}
          </div>
          <p class="source-decision-boundary">${escapeHtml(table.boundary || "来源决策表是系统整理的决策辅助，不是新的作者原文证据。")}</p>
        </section>`;
      }

      function renderSourceDecisionRow(row, messageIndex) {
        const target = `${messageIndex}-${row.sourceIndex}`;
        const meta = [row.author, row.date, row.title].filter(Boolean).join(" · ");
        return `<article class="source-decision-row">
          <div class="source-decision-cell">
            <span>作者原文</span>
            <strong>${escapeHtml(row.title || `来源 ${row.sourceIndex + 1}`)}</strong>
            ${meta ? `<p class="source-decision-meta">${escapeHtml(compactText(meta, 90))}</p>` : ""}
            ${row.quote ? `<blockquote>${escapeHtml(compactText(row.quote, 160))}</blockquote>` : ""}
            <div class="source-decision-actions">
              <button class="evidence-button" type="button" data-source-context-target="${escapeAttribute(target)}" data-source-context-quote="${escapeAttribute(row.quote || "")}">原文上下文</button>
              <button class="evidence-button" type="button" data-source-target="${escapeAttribute(target)}">定位来源</button>
            </div>
          </div>
          <div class="source-decision-cell">
            <span>能支持什么</span>
            <p>${escapeHtml(row.supports || "只能作为本轮问题的原文核对线索。")}</p>
          </div>
          <div class="source-decision-cell">
            <span>不能证明什么</span>
            <p>${escapeHtml(row.cannotProve || "不能替代你的产品数据和真实验证。")}</p>
          </div>
          <div class="source-decision-cell">
            <span>下一步</span>
            <p>${escapeHtml(row.validation || row.nextAction || "先核对原文，再补业务数据。")}</p>
            ${row.nextAction ? `<p class="source-decision-meta">${escapeHtml(row.nextAction)}</p>` : ""}
            ${row.prompt ? `<button class="diagnosis-prompt" type="button" data-notebook-guide-prompt="${escapeAttribute(row.prompt)}">继续判断</button>` : ""}
          </div>
        </article>`;
      }

      function renderSynthesisSupportAction(item, messageIndex) {
        if (!Number.isInteger(item?.sourceIndex)) return "";
        const target = `${messageIndex}-${item.sourceIndex}`;
        const label = [item.author, item.title].filter(Boolean).join(" · ") || `来源 ${item.sourceIndex + 1}`;
        return `<button class="evidence-button" type="button" data-synthesis-source-target="${escapeAttribute(target)}" data-source-target="${escapeAttribute(target)}">${escapeHtml(compactText(label, 48))}</button>
          <button class="evidence-button" type="button" data-source-context-target="${escapeAttribute(target)}" data-source-context-quote="${escapeAttribute(item.quote || "")}">原文上下文</button>`;
      }

      function renderSynthesisAuthor(item, messageIndex) {
        const target = Number.isInteger(item?.sourceIndexes?.[0]) ? `${messageIndex}-${item.sourceIndexes[0]}` : "";
        const sourceButton = target
          ? `<button class="evidence-button" type="button" data-source-target="${escapeAttribute(target)}">看作者来源</button>`
          : "";
        return `<article class="synthesis-author">
          <strong>${escapeHtml(item?.author || "作者视角")}</strong>
          <p>${escapeHtml(item?.summary || "")}</p>
          ${sourceButton ? `<div class="synthesis-actions">${sourceButton}</div>` : ""}
        </article>`;
      }

      function renderSynthesisConflict(item, messageIndex) {
        const buttons = (Array.isArray(item?.sourceIndexes) ? item.sourceIndexes : [])
          .filter(Number.isInteger)
          .slice(0, 3)
          .map((sourceIndex) => `<button class="evidence-button" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${sourceIndex}`)}">对比来源 ${sourceIndex + 1}</button>`)
          .join("");
        return `<article class="synthesis-conflict">
          <strong>${escapeHtml(item?.concept || "观点冲突")}</strong>
          <p>${escapeHtml(item?.message || "需要打开来源逐条核对。")}</p>
          ${buttons ? `<div class="synthesis-actions">${buttons}</div>` : ""}
        </article>`;
      }

      function renderSynthesisGap(item) {
        return `<article class="synthesis-gap">
          <strong>${escapeHtml(item?.label || "待补缺口")}</strong>
          <p>${escapeHtml(item?.reason || "")}</p>
        </article>`;
      }

      function renderTopicSourceTree(tree, messageIndex) {
        if (!tree || typeof tree !== "object") return "";
        const status = tree.status === "ready" ? "已连接来源" : "先补来源";
        const concepts = Array.isArray(tree.concepts) ? tree.concepts.slice(0, 8) : [];
        const allSources = Array.isArray(tree.sources) ? tree.sources : [];
        const sources = allSources.slice(0, 6);
        const allAuthors = Array.isArray(tree.authors) ? tree.authors : [];
        const authors = allAuthors.slice(0, 4);
        const allPaths = Array.isArray(tree.paths) ? tree.paths : [];
        const paths = allPaths.slice(0, 6);
        const prompts = Array.isArray(tree.nextPrompts) ? tree.nextPrompts.slice(0, 3) : [];
        const overviewParts = [
          allSources.length ? `${sources.length}/${allSources.length} 条来源` : "",
          allAuthors.length ? `${authors.length}/${allAuthors.length} 个作者` : "",
          allPaths.length ? `${paths.length}/${allPaths.length} 条路径` : "",
        ].filter(Boolean);
        const conceptRows = concepts.length
          ? `<div class="topic-source-tree-concepts">${concepts.map((item) => `<span class="topic-source-tree-chip">${escapeHtml(item.label || "")}</span>`).join("")}</div>`
          : "";
        const sourceRows = sources.length
          ? sources.map((source) => renderTopicSource(source, messageIndex)).join("")
          : `<article class="topic-source-tree-source"><strong>暂无来源支撑</strong><p class="topic-source-tree-meta">这轮还没有可绑定的作者原文，不能生成正式来源树。</p></article>`;
        const sourceMore = allSources.length > sources.length
          ? `<p class="topic-source-tree-meta">另有 ${allSources.length - sources.length} 条来源保留在下方来源列表，可继续核对。</p>`
          : "";
        const authorRows = authors.length
          ? `<div class="topic-source-tree-authors">${authors.map((author) => renderTopicAuthor(author, messageIndex)).join("")}</div>`
          : "";
        const pathRows = paths.length
          ? `<div class="topic-source-tree-paths">${paths.map((path) => renderTopicPath(path, messageIndex)).join("")}</div>`
          : "";
        const promptRows = prompts.length
          ? `<div class="topic-source-tree-prompts">${prompts.map((prompt) => `<button class="topic-source-tree-prompt" type="button" data-topic-tree-prompt="${escapeAttribute(prompt)}">${escapeHtml(compactText(prompt, 54))}</button>`).join("")}</div>`
          : "";
        return `<section class="topic-source-tree" data-status="${escapeAttribute(tree.status || "needs_source")}" data-message-index="${messageIndex}" aria-label="本轮主题来源树">
          <header>
            <div>
              <strong>${escapeHtml(tree.title || "本轮主题来源树")}</strong>
              <p class="topic-source-tree-summary">${escapeHtml(tree.summary || "把本轮问题、关键概念、作者原文和下一步学习顺序连接起来。")}</p>
            </div>
            <span class="topic-source-tree-status">${escapeHtml(status)}</span>
          </header>
          <div class="topic-source-tree-layout">
            <article class="topic-source-tree-panel">
              <strong>${escapeHtml(tree.topic?.label || "本轮问题")}</strong>
              ${overviewParts.length ? `<p class="topic-source-tree-meta">已展开 ${escapeHtml(overviewParts.join(" · "))}</p>` : ""}
              ${conceptRows}
              ${promptRows}
            </article>
            <div class="topic-source-tree-list">${sourceRows}${sourceMore}</div>
          </div>
          ${authorRows}
          ${pathRows}
          <p class="topic-source-tree-boundary">${escapeHtml(tree.boundary || "主题来源树只基于本轮可引用的作者原文；概念和路径是系统整理，不是新的作者证据。")}</p>
        </section>`;
      }

      function renderTopicSource(source, messageIndex) {
        const target = Number.isInteger(source?.sourceIndex) ? `${messageIndex}-${source.sourceIndex}` : "";
        const meta = [source?.author, source?.date, source?.title].filter(Boolean).join(" · ");
        const sourceButton = target
          ? `<button class="evidence-button topic-source-tree-action" type="button" data-topic-tree-source-target="${escapeAttribute(target)}" data-source-target="${escapeAttribute(target)}">定位来源 ${Number(source.sourceIndex) + 1}</button>`
          : "";
        const contextButton = target
          ? `<button class="evidence-button topic-source-tree-action" type="button" data-source-context-target="${escapeAttribute(target)}" data-source-context-quote="${escapeAttribute(source?.quote || "")}">原文上下文</button>`
          : "";
        return `<article class="topic-source-tree-source">
          <strong>${escapeHtml(source?.label || source?.title || "来源片段")}</strong>
          ${meta ? `<p class="topic-source-tree-meta">${escapeHtml(meta)}</p>` : ""}
          ${source?.quote ? `<blockquote>${escapeHtml(compactText(source.quote, 110))}</blockquote>` : ""}
          ${source?.reason ? `<p class="topic-source-tree-meta">${escapeHtml(compactText(source.reason, 90))}</p>` : ""}
          ${sourceButton || contextButton ? `<div class="topic-source-tree-actions">${sourceButton}${contextButton}</div>` : ""}
        </article>`;
      }

      function renderTopicAuthor(author, messageIndex) {
        const sourceIndex = Array.isArray(author?.sourceIndexes) ? author.sourceIndexes.find((item) => Number.isInteger(item)) : undefined;
        const sourceButton = Number.isInteger(sourceIndex)
          ? `<button class="evidence-button topic-source-tree-action" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${sourceIndex}`)}">看作者来源</button>`
          : "";
        return `<article class="topic-source-tree-author">
          <strong>${escapeHtml(author?.author || "作者视角")}</strong>
          <p class="topic-source-tree-meta">${escapeHtml(author?.summary || author?.role || "")}</p>
          ${sourceButton ? `<div class="topic-source-tree-actions">${sourceButton}</div>` : ""}
        </article>`;
      }

      function renderTopicPath(path, messageIndex) {
        const sourceButton = Number.isInteger(path?.sourceIndex)
          ? `<button class="evidence-button topic-source-tree-action" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${path.sourceIndex}`)}">定位来源</button>`
          : "";
        return `<article class="topic-source-tree-path">
          <strong>${escapeHtml(path?.label || "学习路径")}</strong>
          <p class="topic-source-tree-meta">${escapeHtml(path?.detail || "")}</p>
          ${sourceButton ? `<div class="topic-source-tree-actions">${sourceButton}</div>` : ""}
        </article>`;
      }

      function renderSourceStudyPack(pack, messageIndex) {
        if (!pack || typeof pack !== "object") return "";
        const message = messages[messageIndex] || {};
        const gate = learningActionGate(message);
        const acceptedCards = acceptedSourceStudyCards(pack, message);
        const sourceCards = Array.isArray(pack.sourceCards) ? pack.sourceCards.filter((item) => item?.claimId).slice(0, 5) : [];
        const unlocked = !gate.locked && acceptedCards.length > 0;
        const cardsToShow = unlocked ? acceptedCards : sourceCards.slice(0, 3);
        const claimIds = new Set(cardsToShow.map((item) => item.claimId).filter(Boolean));
        const concepts = Array.isArray(pack.concepts)
          ? pack.concepts.filter((item) => (item.sourceClaimIds || []).some((id) => claimIds.has(id))).slice(0, 6)
          : [];
        const flashcards = unlocked && Array.isArray(pack.flashcards)
          ? pack.flashcards.filter((item) => claimIds.has(item.claimId)).slice(0, 4)
          : [];
        const gaps = Array.isArray(pack.gaps) ? pack.gaps.slice(0, 4) : [];
        const prompts = unlocked && Array.isArray(pack.prompts) ? pack.prompts.slice(0, 3) : [];
        const status = pack.status === "needs_source"
          ? "缺少来源"
          : unlocked
            ? "已基于确认有用的来源展开"
            : gate.label || "先核对证据";
        const lockNote = pack.status === "needs_source"
          ? "这轮还没有可绑定的作者原文，研读包只显示缺口。"
          : unlocked
            ? ""
            : `${gate.reason || "先把至少一条作者原文证据标记为有用，再展开正式研读包。"}`;
        const sourceRows = cardsToShow.length
          ? `<div class="source-study-grid">${cardsToShow.map((card) => renderSourceStudyCard(card, messageIndex, !unlocked)).join("")}</div>`
          : "";
        const conceptRows = concepts.length
          ? `<div class="source-study-concepts">${concepts.map((item) => `<button class="source-study-prompt" type="button" data-source-study-prompt="${escapeAttribute(item.prompt || "")}" ${unlocked ? "" : "disabled"}>${escapeHtml(item.label || "")}</button>`).join("")}</div>`
          : "";
        const flashRows = flashcards.length
          ? `<div class="source-study-grid">${flashcards.map((item) => renderSourceStudyFlashcard(item, messageIndex, gate)).join("")}</div>`
          : "";
        const gapRows = gaps.length
          ? `<div class="source-study-grid">${gaps.map((item) => renderSourceStudyGap(item, gate, unlocked)).join("")}</div>`
          : "";
        const promptRows = prompts.length
          ? `<div class="source-study-prompts">${prompts.map((prompt) => `<button class="source-study-prompt" type="button" data-source-study-prompt="${escapeAttribute(prompt)}">${escapeHtml(compactText(prompt, 44))}</button>`).join("")}</div>`
          : "";
        return `<section class="source-study${unlocked ? "" : " is-locked"}" data-message-index="${messageIndex}" aria-label="本轮来源研读包">
          <header>
            <strong>${escapeHtml(pack.title || "本轮来源研读包")}</strong>
            <span class="source-study-status">${escapeHtml(status)}</span>
          </header>
          ${lockNote ? `<p class="source-study-note">${escapeHtml(lockNote)}</p>` : ""}
          ${sourceRows}
          ${conceptRows ? `<div class="source-study-block"><p class="source-study-note">关键概念</p>${conceptRows}</div>` : ""}
          ${flashRows ? `<div class="source-study-block"><p class="source-study-note">系统整理抽认卡</p>${flashRows}</div>` : ""}
          ${gapRows ? `<div class="source-study-block"><p class="source-study-note">证据缺口</p>${gapRows}</div>` : ""}
          ${promptRows}
          <p class="source-study-boundary">${escapeHtml(pack.boundary || "研读包只帮助学习；作者原文证据和系统整理必须分开看。")}</p>
        </section>`;
      }

      function renderSourceStudyCard(card, messageIndex, locked) {
        const target = Number.isInteger(card?.sourceIndex) ? `${messageIndex}-${card.sourceIndex}` : "";
        const sourceButton = target
          ? `<button class="evidence-button" type="button" data-source-context-target="${escapeAttribute(target)}" data-source-context-quote="${escapeAttribute(card?.quote || "")}">原文上下文</button>`
          : "";
        const promptButton = card?.prompt
          ? `<button class="source-study-prompt" type="button" data-source-study-prompt="${escapeAttribute(card.prompt)}" ${locked ? "disabled" : ""}>${escapeHtml(locked ? "先核对证据" : "继续研读")}</button>`
          : "";
        const meta = [card?.author, card?.title, card?.date].filter(Boolean).join(" · ");
        return `<article class="source-study-card">
          <span class="source-study-badge">${escapeHtml(card?.identity || "作者原文")}</span>
          <strong>${escapeHtml(card?.label || card?.title || "来源片段")}</strong>
          ${meta ? `<span class="source-study-meta">${escapeHtml(meta)}</span>` : ""}
          ${card?.quote ? `<blockquote>${escapeHtml(card.quote)}</blockquote>` : ""}
          ${card?.why ? `<p>${escapeHtml(card.why)}</p>` : ""}
          ${sourceButton || promptButton ? `<div class="source-study-actions">${sourceButton}${promptButton}</div>` : ""}
        </article>`;
      }

      function renderSourceStudyFlashcard(card, messageIndex, gate) {
        const target = Number.isInteger(card?.sourceIndex) ? `${messageIndex}-${card.sourceIndex}` : "";
        const sourceButton = target
          ? `<button class="evidence-button" type="button" data-source-context-target="${escapeAttribute(target)}" data-source-context-quote="${escapeAttribute(card?.answer || "")}">回到原文</button>`
          : "";
        const promptButton = card?.prompt
          ? `<button class="source-study-prompt" type="button" data-source-study-prompt="${escapeAttribute(card.prompt)}" ${gate.locked ? "disabled" : ""}>继续追问</button>`
          : "";
        return `<article class="source-study-flashcard">
          <span class="source-study-badge">${escapeHtml(card?.identity || "系统整理")}</span>
          <strong>${escapeHtml(card?.question || "复习问题")}</strong>
          <p>${escapeHtml(card?.answer || "")}</p>
          <p>${escapeHtml(card?.boundary || "系统整理不是新的作者证据。")}</p>
          ${sourceButton || promptButton ? `<div class="source-study-actions">${sourceButton}${promptButton}</div>` : ""}
        </article>`;
      }

      function renderSourceStudyGap(item, gate, unlocked) {
        const disabled = !unlocked || gate.locked || !item?.prompt;
        return `<article class="source-study-gap">
          <span class="source-study-badge">证据缺口</span>
          <strong>${escapeHtml(item?.label || "待补证据")}</strong>
          <p>${escapeHtml(item?.reason || "")}</p>
