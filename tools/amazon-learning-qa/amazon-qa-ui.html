          ${item?.prompt ? `<button class="source-study-prompt" type="button" data-source-study-prompt="${escapeAttribute(item.prompt)}" ${disabled ? "disabled" : ""}>${escapeHtml(disabled ? "先核对证据" : "补这个缺口")}</button>` : ""}
        </article>`;
      }

      function acceptedSourceStudyCards(pack, message) {
        const feedback = message?.evidenceFeedback || {};
        const sources = Array.isArray(message?.sources) ? message.sources : [];
        const cards = Array.isArray(pack?.sourceCards) ? pack.sourceCards : [];
        return cards.filter((card) => {
          if (!card?.claimId || feedback[card.claimId] !== "useful" || !Number.isInteger(card.sourceIndex)) return false;
          const source = sources[card.sourceIndex];
          if (!source) return false;
          return !sourceIdentityKeys(source).some((key) => isSourceExcluded(key));
        });
      }

      function renderClaim(claim, messageIndex, feedback = {}) {
        const type = claimTypeClass(claim?.type);
        const claimId = claim?.id || "";
        const feedbackValue = feedback?.[claimId] || "";
        const directTarget = Number.isInteger(claim?.sourceIndex) ? `${messageIndex}-${claim.sourceIndex}` : "";
        const directButton = directTarget
          ? `<button class="claim-source-button" type="button" data-source-target="${escapeAttribute(directTarget)}">定位原文来源</button>`
          : "";
        const relatedButtons = directButton
          ? ""
          : (claim?.evidenceIndexes || [])
            .filter((sourceIndex) => Number.isInteger(sourceIndex))
            .slice(0, 3)
            .map((sourceIndex) => `<button class="claim-source-button" type="button" data-source-target="${escapeAttribute(`${messageIndex}-${sourceIndex}`)}">查看相关证据 ${sourceIndex + 1}</button>`)
            .join("");
        const meta = [claim?.author, claim?.title, claim?.date].filter(Boolean).join(" · ") || claim?.basis || "";
        const quote = claim?.quote ? `<blockquote>${escapeHtml(claim.quote)}</blockquote>` : "";
        const basis = claim?.basis ? `<p class="claim-meta">${escapeHtml(claim.basis)}</p>` : "";
        const validation = claim?.validation ? `<p class="claim-meta">${escapeHtml(claim.validation)}</p>` : "";
        const claimKey = `${messageIndex}:${claimId}`;
        const feedbackControls = type === "source_evidence" && claimId
          ? `<div class="claim-feedback">
              <span>只影响本轮后续追问，不会自动写入作者证据库</span>
              ${renderFeedbackButton(messageIndex, claimId, "useful", "采纳为本轮作者证据", feedbackValue)}
              ${renderFeedbackButton(messageIndex, claimId, "irrelevant", "本轮不采用", feedbackValue)}
            </div>`
          : "";
        return `<article class="claim ${type}" data-claim-key="${escapeAttribute(claimKey)}">
          <div class="claim-head">
            <span class="claim-label">${escapeHtml(claimLabel(type))}</span>
            ${claim?.trustLabel && claim.trustLabel !== claimLabel(type) ? `<span class="claim-label">${escapeHtml(claim.trustLabel)}</span>` : ""}
            ${meta ? `<span class="claim-meta">${escapeHtml(meta)}</span>` : ""}
          </div>
          <p class="claim-text">${escapeHtml(claim?.text || "")}</p>
          ${quote}
          ${basis}
          ${validation}
          ${directButton || relatedButtons ? `<div class="claim-actions">${directButton}${relatedButtons}</div>` : ""}
          ${feedbackControls}
        </article>`;
      }

      function renderFeedbackButton(messageIndex, claimId, value, label, currentValue) {
        const active = currentValue === value;
        return `<button class="feedback-button${active ? " is-active" : ""}" type="button" data-message-index="${messageIndex}" data-claim-id="${escapeAttribute(claimId)}" data-feedback-value="${value}" aria-pressed="${active ? "true" : "false"}">${label}</button>`;
      }

      function claimTypeClass(type) {
        return ["source_evidence", "system_inference", "action_advice", "needs_source"].includes(type) ? type : "system_inference";
      }

      function claimLabel(type) {
        if (type === "source_evidence") return "作者原文证据";
        if (type === "action_advice") return "行动建议";
        if (type === "needs_source") return "缺少来源";
        return "系统推断";
      }

      function renderOpenHumanMemoryStatus(memory, options = {}) {
        if (!memory || typeof memory !== "object") return "";
        const status = memory.status || "";
        if (!["synced", "failed", "pending", "skipped"].includes(status)) return "";
        const label = status === "synced"
          ? "已沉淀到 OpenHuman 本地记忆"
          : status === "failed"
            ? "沉淀到 OpenHuman 本地记忆失败"
            : status === "skipped"
              ? "旧学习档案已失效"
              : memory.indexStatus === "missing_embeddings"
                ? "已保存，语义索引未完成"
                : "正在沉淀到 OpenHuman 本地记忆";
        const detail = (status === "failed" || status === "skipped") && memory.error ? `：${memory.error}` : "";
        const title = memory.namespace && memory.key ? `${memory.namespace} · ${memory.key}` : "";
        const className = options.className ? ` ${options.className}` : "";
        return `<span class="memory-status${className}" data-status="${escapeAttribute(status)}" title="${escapeAttribute(title)}">${escapeHtml(label + detail)}</span>`;
      }

      function renderLearningMemoryReminder(reminder) {
        const items = Array.isArray(reminder?.items) ? reminder.items.filter((item) => item?.title || item?.excerpt).slice(0, 3) : [];
        if (items.length === 0) return "";
        const rows = items
          .map((item) => {
            const kindLabel = learningMemoryKindLabel(item);
            const meta = [kindLabel, item.namespace, item.key].filter(Boolean).join(" · ");
            return `<div class="learning-memory-item">
              <strong>${escapeHtml(item.title || "学习档案")}</strong>
              <p>${escapeHtml(item.excerpt || "这条学习档案暂时没有摘要。")}</p>
              ${meta ? `<span class="learning-memory-meta">${escapeHtml(meta)}</span>` : ""}
            </div>`;
          })
          .join("");
        const boundary = reminder.boundary || "这些是你保存过的学习档案提醒，不是作者原文证据；本轮引用和证据链仍只来自作者资料。";
        return `<section class="learning-memory" aria-label="本地学习档案提醒">
          <header>
            <strong>本地学习档案提醒</strong>
            <span>这是你过去保存的学习沉淀，只用于提示上下文。</span>
          </header>
          <div class="learning-memory-list">${rows}</div>
          ${renderLearningMemoryAlignment(reminder.alignment)}
          <div class="learning-memory-boundary">${escapeHtml(boundary)}</div>
        </section>`;
      }

      function renderLearningMemoryAlignment(alignment) {
        if (!alignment || typeof alignment !== "object" || !alignment.message) return "";
        const status = alignment.status || "unknown";
        const label = alignment.label || (status === "conflict" ? "历史档案与本轮作者证据不一致" : "学习档案校准");
        const conflicts = Array.isArray(alignment.conflicts) ? alignment.conflicts.filter((item) => item?.concept).slice(0, 3) : [];
        const conflictRows = conflicts.length
          ? `<ul>${conflicts.map((item) => {
              const sourceLine = [item.author, item.sourceTitle].filter(Boolean).join(" · ");
              return `<li>${escapeHtml(item.concept)}：历史档案提示「${escapeHtml(item.memoryTitle || "学习档案")}」，本轮作者证据${sourceLine ? `来自 ${escapeHtml(sourceLine)}` : ""}。</li>`;
            }).join("")}</ul>`
          : "";
        return `<div class="learning-memory-alignment" data-status="${escapeAttribute(status)}">
          <strong>${escapeHtml(label)}</strong>
          <p>${escapeHtml(alignment.message)}</p>
          ${conflictRows}
        </div>`;
      }

      function learningMemoryKindLabel(item) {
        if (!item || typeof item !== "object") return LEARNING_MEMORY_KIND_LABELS.study_note;
        return item.memoryKindLabel || LEARNING_MEMORY_KIND_LABELS[item.memoryKind] || LEARNING_MEMORY_KIND_LABELS.study_note;
      }

      function renderLearningCard(card, messageIndex) {
        if (!card || !card.intent) return "";
        const actions = renderList(card.nextActions || []);
        const missing = renderList(card.missingInputs || []);
        const actionGate = learningActionGate(messages[messageIndex]);
        const dataForm = renderLearningDataForm(card, messageIndex, actionGate);
        const memoryStatus = renderOpenHumanMemoryStatus(messages[messageIndex]?.openhumanMemory);
        const saveGate = learningDossierSaveGate(messages[messageIndex]);
        const saveLocked = saveGate.locked;
        const saveLabel = saveGate.label;
        const saveTitle = saveLocked ? saveGate.reason : "";
        const studyChecks = renderStudyChecks(card.studyChecks, messageIndex, actionGate);
        const followUps = (card.followUps || [])
          .map((item) => `<button class="follow-up" type="button" data-follow-up="${escapeAttribute(item)}" data-message-index="${messageIndex}" ${actionGate.locked ? "disabled" : ""} title="${escapeAttribute(actionGate.reason || "")}">${escapeHtml(actionGate.locked ? actionGate.label : item)}</button>`)
          .join("");
        const evidence = (card.evidence || [])
          .map((item) => {
            const target = Number.isInteger(item.sourceIndex) ? `${messageIndex}-${item.sourceIndex}` : "";
            const source = Number.isInteger(item.sourceIndex) ? messages[messageIndex]?.sources?.[item.sourceIndex] : null;
            const excluded = source ? sourceIdentityKeys(source).some((key) => isSourceExcluded(key)) : false;
            const attrs = target ? ` data-source-target="${escapeAttribute(target)}"` : "";
            const suffix = excluded ? " · 已排除" : "";
            return `<button class="evidence-button${excluded ? " is-excluded" : ""}" type="button"${attrs}>${escapeHtml(item.author || "来源")} · ${escapeHtml(item.title || "")}${suffix}</button>`;
          })
          .join("");

        return `<section class="learning-card" data-message-index="${messageIndex}">
          <header>
            <div class="intent">
              <strong>${escapeHtml(card.intent.label || "本轮学习卡")}</strong>
              <span>${escapeHtml(card.intent.description || "")}</span>
            </div>
            <button class="save-note" type="button" data-message-index="${messageIndex}" ${saveLocked ? "disabled" : ""} title="${escapeAttribute(saveTitle)}">${escapeHtml(saveLabel)}</button>
          </header>
          ${memoryStatus}
          <p>${escapeHtml(card.takeaway || "")}</p>
          <div class="learning-grid">
            <div class="learning-block"><strong>行动顺序</strong>${actions}</div>
            <div class="learning-block"><strong>还缺什么</strong>${missing}</div>
          </div>
          ${studyChecks}
          ${dataForm}
          ${followUps ? `<div class="learning-block"><strong>继续追问</strong><div class="follow-ups">${followUps}</div></div>` : ""}
          ${evidence ? `<div class="learning-block"><strong>来源证据</strong><div class="evidence-links">${evidence}</div></div>` : ""}
        </section>`;
      }

      function evidenceGateStatus(message) {
        if (!message || message.role !== "assistant") return "none";
        const gateItem = (message.learningQueue?.items || []).find((item) => item.id === "queue:evidence" && item.claimId);
        if (!gateItem) return "none";
        const feedback = message.evidenceFeedback?.[gateItem.claimId] || "";
        if (feedback === "useful") return "passed";
        if (feedback === "irrelevant") return "rejected";
        return "locked";
      }

      function learningDossierSaveGate(message) {
        const gateStatus = evidenceGateStatus(message);
        const auditBlock = evidenceAuditBlocksSave(message);
        if (auditBlock.locked) return auditBlock;
        if (messageNeedsSourceBeforeSave(message)) {
          return {
            locked: true,
            label: "先补来源",
            reason: "这轮没有可采纳的作者原文证据，先重新检索或补来源后再保存学习档案。",
          };
        }
        if (gateStatus === "passed") {
          if (!hasAcceptedAvailableSourceEvidence(message)) {
            return {
              locked: true,
              label: "先恢复来源",
              reason: "已标记有用的关键证据来自已排除来源，先恢复来源或重新检索后再保存学习档案。",
            };
          }
          return { locked: false, label: "保存档案", reason: "" };
        }
        if (gateStatus === "rejected") {
          return {
            locked: true,
            label: "先重查证据",
            reason: "关键证据已被标记不相关，先重新检索或换问法后再保存学习档案。",
          };
        }
        if (gateStatus === "locked") {
          return {
            locked: true,
            label: "先核对证据",
            reason: "先把关键原文证据标记为有用，再保存学习档案。",
          };
        }
        if (!hasAcceptedAvailableSourceEvidence(message)) {
          return {
            locked: true,
            label: "先核对证据",
            reason: "先把至少一条作者原文证据标记为有用，再保存学习档案。",
          };
        }
        return { locked: false, label: "保存档案", reason: "" };
      }

      function learningActionGate(message) {
        const gate = learningDossierSaveGate(message);
        if (!gate.locked) return gate;
        return {
          ...gate,
          label: gate.label === "保存档案" ? "先核对证据" : gate.label,
        };
      }

      function evidenceAuditBlocksSave(message) {
        const feedback = message?.evidenceAudit?.feedback || "";
        if (feedback === "citation_wrong" || feedback === "retry") {
          return {
            locked: true,
            label: "先重查证据",
            reason: "这轮回答已被标记为引用不准或需要重查，先重新核对来源后再保存学习档案。",
          };
        }
        return { locked: false, label: "", reason: "" };
      }

      function messageNeedsSourceBeforeSave(message) {
        if (!message || message.role !== "assistant") return true;
        const items = Array.isArray(message.learningQueue?.items) ? message.learningQueue.items : [];
        const hasSourceSearchQueue = items.some((item) => item.id === "queue:source-search" || item.kind === "source_search");
        const claims = Array.isArray(message.evidenceChain?.claims) ? message.evidenceChain.claims : [];
        const hasSourceEvidence = claims.some((claim) => claim?.type === "source_evidence" && claim.id);
        return hasSourceSearchQueue || !hasSourceEvidence;
      }

      function hasAcceptedAvailableSourceEvidence(message) {
        const feedback = message?.evidenceFeedback || {};
        const claims = Array.isArray(message?.evidenceChain?.claims) ? message.evidenceChain.claims : [];
        const sources = Array.isArray(message?.sources) ? message.sources : [];
        return claims.some((claim) => {
          if (claim?.type !== "source_evidence" || feedback[claim.id] !== "useful" || !Number.isInteger(claim.sourceIndex)) return false;
          const source = sources[claim.sourceIndex];
          if (!source) return false;
          return !sourceIdentityKeys(source).some((key) => isSourceExcluded(key));
        });
      }

      function renderStudyChecks(checks, messageIndex, gate = { locked: false }) {
        const safeChecks = Array.isArray(checks)
          ? checks.filter((item) => item?.question && item?.expectedAnswer).slice(0, 4)
          : [];
        if (safeChecks.length === 0) return "";
        const rows = safeChecks.map((item, index) => {
          const sourceTarget = Number.isInteger(item.sourceIndex) ? `${messageIndex}-${item.sourceIndex}` : "";
          const sourceButton = sourceTarget
            ? `<button class="evidence-button" type="button" data-source-target="${escapeAttribute(sourceTarget)}">看来源</button>`
            : "";
          const promptButton = item.prompt
            ? `<button class="evidence-button" type="button" data-study-check-prompt="${escapeAttribute(item.prompt)}" ${gate.locked ? "disabled" : ""} title="${escapeAttribute(gate.reason || "")}">${escapeHtml(gate.locked ? gate.label : "继续追问")}</button>`
            : "";
          return `<details class="study-check" data-study-check-kind="${escapeAttribute(item.kind || "")}">
            <summary>${escapeHtml(index + 1)}. ${escapeHtml(item.question || "")}</summary>
            <p class="study-check-answer">${escapeHtml(item.expectedAnswer || "")}</p>
            <p class="study-check-answer">${escapeHtml(item.boundary || "理解检查只用于学习复盘，不产生新证据。")}</p>
            ${sourceButton || promptButton ? `<div class="study-check-actions">${sourceButton}${promptButton}</div>` : ""}
          </details>`;
        }).join("");
        return `<div class="study-checks" aria-label="本轮理解检查">
          <strong>理解检查</strong>
          <p>默认折叠，只帮助你复盘本轮来源和边界，不写入原始知识库。</p>
          ${rows}
        </div>`;
      }

      function renderLearningDataForm(card, messageIndex, gate = { locked: false }) {
        const inputs = (card.missingInputs || []).filter(Boolean).slice(0, 6).map((label, index) => ({
          id: `learning-${index}`,
          label,
          verifies: "用于让下一轮诊断区分入口、页面、流量和竞争问题",
          targetRole: index < 2 ? "primary" : "supporting",
        }));
        if (inputs.length === 0) return "";
        const prompt = (card.followUps || [])[0] || "我补充了产品数据，请结合本地资料判断下一步优先级。";
        return `<div class="learning-block"><strong>补数据继续问</strong>${renderStructuredDataForm("learning-data-form", prompt, inputs, "生成数据追问", gate)}</div>`;
      }

      function renderList(items) {
        const safeItems = (items || []).filter(Boolean).slice(0, 6);
        if (safeItems.length === 0) return "<p>暂无</p>";
        return `<ul>${safeItems.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function renderAnswerGraph(graph, messageIndex) {
        if (!graph || !Array.isArray(graph.nodes) || graph.nodes.length === 0) return "";
        const layout = layoutGraph(graph);
        const edgeMarkup = layout.edges
          .map((edge) => {
            const from = layout.positions.get(edge.from);
            const to = layout.positions.get(edge.to);
            if (!from || !to) return "";
            return `<line class="graph-edge" data-from="${escapeAttribute(edge.from)}" data-to="${escapeAttribute(edge.to)}" data-type="${escapeAttribute(edge.type || "related")}" data-strength="${escapeAttribute(edge.strength || (edge.type === "supported_by" ? "evidence" : "related"))}" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}"></line>`;
          })
          .join("");
        const nodeMarkup = layout.nodes.map((node) => renderGraphNode(node, layout.positions.get(node.id), messageIndex)).join("");

        return `<section class="answer-graph" data-graph-index="${messageIndex}" aria-label="本轮沟通图谱">
          <div class="graph-head">
            <strong>本轮沟通图谱</strong>
            <span>${layout.nodes.length} 个节点 · ${layout.edges.length} 条关系</span>
          </div>
          <div class="graph-legend"><span>原文证据支撑</span><span>关键词相关</span></div>
          ${renderGraphMobileList(layout.nodes, messageIndex)}
          <svg class="graph-svg" viewBox="0 0 900 440" role="img" aria-label="本轮问题、答案要点、概念和来源的关系图">
            <g>${edgeMarkup}</g>
            <g>${nodeMarkup}</g>
          </svg>
        </section>`;
      }

      function renderGraphMobileList(nodes, messageIndex) {
        const items = prioritizeGraphMobileNodes(nodes)
          .slice(0, 12)
          .map((node) => {
            const sourceTarget = (node.type === "source" || node.type === "evidence") && Number.isInteger(node.sourceIndex)
              ? `${messageIndex}-${node.sourceIndex}`
              : "";
            const claimTarget = !sourceTarget && node.type === "evidence" && node.claimId ? `${messageIndex}:${node.claimId}` : "";
            const graphPrompt = graphPromptForNode(node);
            const tag = graphMobileTypeLabel(node.type);
            if (sourceTarget) {
              return `<button class="graph-mobile-item evidence-button" type="button" data-source-target="${escapeAttribute(sourceTarget)}"><strong>${escapeHtml(node.label || "")}</strong><span>${escapeHtml(tag)}</span></button>`;
            }
            if (claimTarget) {
              return `<button class="graph-mobile-item evidence-button" type="button" data-claim-target="${escapeAttribute(claimTarget)}"><strong>${escapeHtml(node.label || "")}</strong><span>${escapeHtml(tag)}</span></button>`;
            }
            if (graphPrompt) {
              return `<button class="graph-mobile-item graph-prompt-button" type="button" data-graph-prompt="${escapeAttribute(graphPrompt)}"><strong>${escapeHtml(node.label || "")}</strong><span>${escapeHtml(tag)}，点击继续问</span></button>`;
            }
            return `<div class="graph-mobile-item"><strong>${escapeHtml(node.label || "")}</strong><span>${escapeHtml(tag)}</span></div>`;
          })
          .join("");
        return items ? `<div class="graph-mobile-list">${items}</div>` : "";
      }

      function prioritizeGraphMobileNodes(nodes) {
        const allowed = new Set(["question", "point", "step", "evidence", "concept", "source"]);
        const priority = {
          question: 0,
          source: 1,
          evidence: 2,
          point: 3,
          step: 4,
          concept: 5,
        };
        return nodes
          .filter((node) => allowed.has(node.type))
          .map((node, index) => ({ node, index }))
          .sort((left, right) => {
            const leftPriority = priority[left.node.type] ?? 99;
            const rightPriority = priority[right.node.type] ?? 99;
            return leftPriority - rightPriority || left.index - right.index;
          })
          .map((item) => item.node);
      }

      function graphMobileTypeLabel(type) {
        if (type === "question") return "本轮问题";
        if (type === "point") return "答案要点";
        if (type === "step") return "执行步骤";
        if (type === "evidence") return "原文证据，点击定位";
        if (type === "concept") return "相关概念";
        if (type === "source") return "来源，点击可定位";
        return "节点";
      }

      function renderGraphNode(node, position, messageIndex) {
        if (!position) return "";
        const radius = graphNodeRadius(node.type);
        const sourceTarget = (node.type === "source" || node.type === "evidence") && Number.isInteger(node.sourceIndex)
          ? `${messageIndex}-${node.sourceIndex}`
          : "";
        const claimTarget = !sourceTarget && node.type === "evidence" && node.claimId ? `${messageIndex}:${node.claimId}` : "";
        const graphPrompt = !sourceTarget && !claimTarget ? graphPromptForNode(node) : "";
        const actionAttrs = sourceTarget
          ? ` data-source-target="${escapeAttribute(sourceTarget)}" role="button" tabindex="0"`
          : claimTarget
            ? ` data-claim-target="${escapeAttribute(claimTarget)}" role="button" tabindex="0"`
            : graphPrompt
              ? ` data-graph-prompt="${escapeAttribute(graphPrompt)}" role="button" tabindex="0"`
              : "";
        const labels = splitGraphLabel(node.label);
        return `<g class="graph-node type-${escapeAttribute(node.type || "item")}" data-node-id="${escapeAttribute(node.id)}"${actionAttrs} transform="translate(${position.x} ${position.y})">
          <title>${escapeHtml(node.detail || node.label || "")}</title>
          <circle r="${radius}"></circle>
          <text y="${labels.length > 1 ? -2 : 4}">${escapeHtml(labels[0] || "")}</text>
          ${labels[1] ? `<text class="sub-label" y="13">${escapeHtml(labels[1])}</text>` : ""}
        </g>`;
      }

      function graphPromptForNode(node) {
        if (!node || node.type === "source" || node.type === "author" || node.type === "evidence") return "";
        const prompt = String(node.prompt || "").trim();
        if (prompt) return prompt;
        const label = String(node.detail || node.label || "").trim();
        if (!label) return "";
        if (node.type === "concept") return `请围绕本轮图谱概念「${label}」继续学习：它和本轮问题有什么关系、有哪些来源支撑、下一步我该如何验证。`;
        if (node.type === "step") return `我准备执行这一步：「${label}」。请基于本轮来源拆成低风险检查清单，并说明需要补哪些产品或广告数据。`;
        if (node.type === "point") return `请围绕这个答案要点继续展开：「${label}」。请说明它由哪些作者原文支撑、哪些只是系统推断、下一步应该怎么验证。`;
        if (node.type === "question") return `请围绕本轮问题「${label}」继续拆成学习路线，并区分作者原文、系统整理和我的业务验证。`;
        return "";
      }

      function layoutGraph(graph) {
        const nodes = graph.nodes.slice(0, 32);
        const nodeIds = new Set(nodes.map((node) => node.id));
        const edges = (graph.edges || []).filter((edge) => nodeIds.has(edge.from) && nodeIds.has(edge.to)).slice(0, 64);
        const rows = [
          { types: ["question"], y: 50 },
          { types: ["point", "step"], y: 126 },
          { types: ["evidence"], y: 212 },
          { types: ["concept"], y: 288 },
          { types: ["source", "empty"], y: 360 },
          { types: ["author"], y: 416 },
        ];
        const positions = new Map();

        for (const row of rows) {
          const rowNodes = nodes.filter((node) => row.types.includes(node.type));
          const count = rowNodes.length;
          rowNodes.forEach((node, index) => {
            const x = count === 1 ? 450 : 90 + (720 * index) / Math.max(1, count - 1);
            positions.set(node.id, { x: Math.round(x), y: row.y });
          });
        }

        return { nodes, edges, positions };
      }

      function graphNodeRadius(type) {
        if (type === "question") return 34;
        if (type === "source") return 26;
        if (type === "evidence") return 22;
        if (type === "author") return 21;
        if (type === "empty") return 24;
        return 23;
      }

      function splitGraphLabel(label) {
        const text = String(label || "").replace(/\s+/g, " ").trim();
        if (text.length <= 10) return [text];
        return [text.slice(0, 10), text.length > 18 ? `${text.slice(10, 17)}…` : text.slice(10)];
      }

      function bindGraphEvents() {
        document.querySelectorAll(".answer-graph").forEach((graphEl) => {
          const nodes = [...graphEl.querySelectorAll(".graph-node")];
          const edges = [...graphEl.querySelectorAll(".graph-edge")];
          nodes.forEach((node) => {
            node.addEventListener("mouseenter", () => focusGraphNode(graphEl, node.dataset.nodeId));
            node.addEventListener("mouseleave", () => clearGraphFocus(graphEl));
            node.addEventListener("click", () => activateGraphNode(node));
            node.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                activateGraphNode(node);
              }
            });
          });
          graphEl.querySelectorAll(".graph-prompt-button[data-graph-prompt]").forEach((button) => {
            button.addEventListener("click", () => fillQuestionFromWorkflowPrompt(button.dataset.graphPrompt || ""));
          });
          edges.forEach((edge) => {
            edge.addEventListener("mouseenter", () => {
              graphEl.classList.add("has-focus");
              markGraphFocus(graphEl, [edge.dataset.from, edge.dataset.to], edge);
            });
            edge.addEventListener("mouseleave", () => clearGraphFocus(graphEl));
          });
        });
      }

      function bindAnswerStudioEvents() {
        document.querySelectorAll("[data-answer-studio-action]").forEach((button) => {
          button.addEventListener("click", () => handleAnswerStudioAction(button));
        });
        document.querySelectorAll("[data-answer-studio-feedback]").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.disabled) return;
            const messageIndex = messageIndexFromElement(button.closest(".message.assistant"));
            updateEvidenceFeedback(messageIndex, button.dataset.answerStudioClaimId, button.dataset.answerStudioFeedback);
          });
        });
      }

      function handleAnswerStudioAction(button) {
        if (button.disabled) return;
        const action = button.dataset.answerStudioAction || "";
        const messageEl = button.closest(".message.assistant");
        const messageIndex = messageIndexFromElement(messageEl);
        if (action === "focus") {
          focusAnswerStudioTarget(button);
          return;
        }
        if (action === "read-source") {
          if (button.dataset.claimTarget) focusClaimByKey(button.dataset.claimTarget);
          if (button.dataset.sourceTarget) {
            window.setTimeout(() => focusSourceByKey(button.dataset.sourceTarget), 120);
          }
          return;
        }
        if (action === "save-dossier") {
          saveLearningNote(messageIndex);
          return;
        }
        if (action === "fill-prompt") {
          fillQuestionFromWorkflowPrompt(button.dataset.answerStudioPrompt || "");
        }
      }

      function focusAnswerStudioTarget(button) {
        const messageEl = button.closest(".message.assistant");
        const selector = button.dataset.answerStudioTarget || "";
        if (!messageEl || !selector) return;
        const target = messageEl.querySelector(selector);
        if (!target) return;
        target.classList.add("is-studio-focused");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        window.setTimeout(() => target.classList.remove("is-studio-focused"), 1600);
      }

      function bindEvidenceChainEvents() {
        document.querySelectorAll(".claim-source-button[data-source-target]").forEach((button) => {
          button.addEventListener("click", () => focusSourceByKey(button.dataset.sourceTarget));
        });
        document.querySelectorAll(".claim-source-button[data-claim-target]").forEach((button) => {
          button.addEventListener("click", () => focusClaimByKey(button.dataset.claimTarget));
        });
      }

      function bindEvidenceFeedbackEvents() {
        document.querySelectorAll(".feedback-button[data-claim-id]").forEach((button) => {
          button.addEventListener("click", () => {
            updateEvidenceFeedback(Number(button.dataset.messageIndex), button.dataset.claimId, button.dataset.feedbackValue);
          });
        });
      }

      function bindAuditFeedbackEvents() {
        document.querySelectorAll(".feedback-button[data-audit-feedback]").forEach((button) => {
          button.addEventListener("click", () => {
            updateAuditFeedback(Number(button.dataset.messageIndex), button.dataset.auditFeedback);
          });
        });
      }

      function bindAnswerEffectivenessEvents() {
        document.querySelectorAll(".answer-effectiveness-button[data-answer-effectiveness]").forEach((button) => {
          button.addEventListener("click", () => {
            updateAnswerEffectiveness(Number(button.dataset.messageIndex), button.dataset.answerEffectiveness);
          });
        });
      }

      async function updateEvidenceFeedback(messageIndex, claimId, value) {
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant" || !claimId) return;
        const next = { ...(message.evidenceFeedback || {}) };
        if (next[claimId] === value) {
          delete next[claimId];
        } else if (value === "useful" || value === "irrelevant") {
          next[claimId] = value;
        }
        message.evidenceFeedback = next;
        applyEvidenceGateFeedback(message, claimId, message.evidenceFeedback[claimId]);
        if (message.savedDossierId && message.evidenceFeedback[claimId] !== "useful") {
          await invalidateSavedDossierForMessage(message);
        }
        saveMessages();
        await syncMessageFeedback(messageIndex).catch((error) => {
          console.warn(`证据反馈保存失败：${error.message}`);
        });
        renderMessages({ scrollToBottom: false });
        focusClaimByKey(`${messageIndex}:${claimId}`);
      }

      function applyEvidenceGateFeedback(message, claimId, value) {
        if (!message?.learningQueue || !claimId) return;
        const items = Array.isArray(message.learningQueue.items) ? message.learningQueue.items : [];
        const gateIndex = items.findIndex((item) => item.id === "queue:evidence" && item.claimId === claimId);
        if (gateIndex < 0) return;
        const nextItems = items.map((item) => ({ ...item }));
        const gateItem = nextItems[gateIndex];
        gateItem.done = value === "useful";
        gateItem.locked = false;
        gateItem.boundary = value === "useful"
          ? "这条证据已标记有用；后续补材料、保存档案仍只代表进入验证流程，不代表结论自动成立。"
          : value === "irrelevant"
            ? "这条证据已标记不相关；先重新提问或补来源，不要继续沉淀本轮结论。"
            : "核对原文只确认证据存在，不等于你的产品已经适用这个结论。";
        nextItems.forEach((item) => {
          if (item.requiresEvidenceGate !== true) return;
          if (value === "useful") {
            item.locked = false;
            item.lockedReason = "";
          } else {
            item.done = false;
            item.locked = true;
            item.lockedReason = value === "irrelevant"
              ? "关键证据已被标记不相关，先重新检索或换问法后再继续。"
              : "先把关键原文证据标记为“有用”或“不相关”，再进入这一步。";
          }
        });
        message.learningQueue = rebuildLearningQueueProgress(message.learningQueue, nextItems);
      }

      async function updateAuditFeedback(messageIndex, value) {
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant" || !message.evidenceAudit) return;
        const allowed = new Set(["useful", "citation_wrong", "retry"]);
        const current = message.evidenceAudit.feedback || "";
        message.evidenceAudit = {
          ...message.evidenceAudit,
          feedback: current === value ? "" : allowed.has(value) ? value : "",
        };
        if (message.savedDossierId && evidenceAuditBlocksSave(message).locked) {
          await invalidateSavedDossierForMessage(message);
        }
        saveMessages();
        await syncMessageFeedback(messageIndex).catch((error) => {
          console.warn(`引用复核保存失败：${error.message}`);
        });
        if (value === "retry" && message.evidenceAudit.feedback === "retry") {
          const retryQuestion = previousUserQuestion(messageIndex);
          questionEl.value = retryQuestion;
          safeLocalSet(RETRY_QUESTION_KEY, retryQuestion);
          questionEl.focus();
        } else if (value === "retry") {
          safeLocalRemove(RETRY_QUESTION_KEY);
        }
        renderMessages({ scrollToBottom: false });
      }

      async function updateAnswerEffectiveness(messageIndex, value) {
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant") return;
        const allowed = new Set(["resolved", "needs_source", "switch_intent", "add_product_data"]);
        const current = message.answerEffectiveness?.status || "";
        const nextStatus = current === value ? "" : allowed.has(value) ? value : "";
        if (nextStatus) {
          message.answerEffectiveness = {
            status: nextStatus,
            updatedAt: new Date().toISOString(),
            question: compactText(previousUserQuestion(messageIndex), 240),
          };
        } else {
          message.answerEffectiveness = undefined;
        }
        saveMessages();
        await syncAnswerEffectiveness(messageIndex).catch((error) => {
          console.warn(`结果确认保存失败：${error.message}`);
        });
        const prompt = answerEffectivenessPrompt(message, messageIndex, nextStatus);
        if (prompt) fillQuestionFromWorkflowPrompt(prompt);
        renderMessages({ scrollToBottom: false });
      }

      async function syncAnswerEffectiveness(messageIndex) {
        if (!sessionId || messages.length === 0) return;
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant") return;
        const payload = await fetchJson(`/api/notebooks/${encodeURIComponent(sessionId)}/answer-effectiveness`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            messageIndex,
            answerEffectiveness: message.answerEffectiveness,
            evidenceAudit: message.evidenceAudit,
          }),
        });
        if (payload.notebook) upsertNotebook(payload.notebook);
      }

      async function syncMessageFeedback(messageIndex) {
        if (!sessionId || messages.length === 0) return;
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant") return;
        const payload = await fetchJson(`/api/notebooks/${encodeURIComponent(sessionId)}/message-feedback`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            messageIndex,
            evidenceFeedback: message.evidenceFeedback,
            evidenceAudit: message.evidenceAudit,
            learningQueue: message.learningQueue,
            answerEffectiveness: message.answerEffectiveness,
          }),
        });
        if (payload?.message) {
          messages[messageIndex] = { ...messages[messageIndex], ...payload.message };
          saveMessages();
        }
        if (payload.notebook) upsertNotebook(payload.notebook);
      }

      function answerEffectivenessPrompt(message, messageIndex, status) {
        if (!status || status === "resolved") return "";
        const original = previousUserQuestion(messageIndex);
        if (status === "needs_source") {
          return message?.knowledgeGapRadar?.priority?.prompt
            || message?.nextBestSource?.recommended?.prompt
            || `请先帮我补充和核对更多作者原文来源，再回答这个问题：${original}`;
        }
        if (status === "switch_intent") {
          return [
            "请先重新确认这次问题的意图：方法学习、产品诊断、实验复盘，还是补来源检索。",
            `原问题：${original}`,
            "确认意图后，再按对应范围选择资料，不要直接下结论。",
          ].join("\n");
        }
        if (status === "add_product_data") {
          return [
            "请结合我补充的产品数据和本地作者资料，重新判断下一步优先级。",
            `原问题：${original}`,
            "",
            "我补充的产品数据：",
            "- ASIN/类目：",
            "- 曝光/点击率/转化率：",
            "- 广告数据：",
            "- Listing 或主图当前情况：",
            "",
            "如果数据不足，请先指出还缺什么，不要把我的产品数据当成作者原文证据。",
          ].join("\n");
        }
        return "";
      }

      async function invalidateSavedDossierForMessage(message) {
        const id = message?.savedDossierId || "";
        if (!id) return;
        message.savedDossierId = "";
        message.openhumanMemory = {
          status: "skipped",
          error: "关键证据已被撤销或答案需要重查，旧学习档案已失效。",
        };
        message.dossierPersistence = null;
        try {
          await fetchJson(`/api/dossiers/${encodeURIComponent(id)}`, { method: "DELETE" });
          await loadDossiers();
        } catch (error) {
          message.openhumanMemory = {
            status: "failed",
            error: `旧学习档案已失效，但自动删除失败：${error.message}`,
          };
        }
      }

      function previousUserQuestion(messageIndex) {
        for (let index = messageIndex - 1; index >= 0; index -= 1) {
          if (messages[index]?.role === "user" && messages[index]?.content) return messages[index].content;
        }
        return questionEl.value || "";
      }

      function bindSourceControlEvents() {

      }

          button.addEventListener("click", () => focusClaimByKey(button.dataset.workbenchClaimTarget));

        document.querySelectorAll("[data-workbench-source-action]").forEach((button) => {

      function bindNextStepEvents() {
        document.querySelectorAll("[data-next-step-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.nextStepAction || "";
            const message = messages[Number(button.dataset.messageIndex)];
            const gate = learningActionGate(message);
            if (action === "review-evidence" && button.dataset.claimTarget) {
              focusClaimByKey(button.dataset.claimTarget);
              return;
            }
            if (gate.locked) return;
            if (action === "fill-data") {
              focusFirstStructuredDataField(button.closest(".message.assistant"));
              return;
            }
            if (action === "fill-prompt") {
              fillQuestionFromWorkflowPrompt(button.dataset.nextStepPrompt || "");
              return;
            }
            if (action === "review-validation") {
              const pack = button.closest(".message.assistant")?.querySelector(".validation-pack");
              if (pack) pack.scrollIntoView({ behavior: "smooth", block: "center" });
              return;
            }
            if (action === "review-audit") {
              const audit = button.closest(".message.assistant")?.querySelector(".evidence-audit");
              if (audit) audit.scrollIntoView({ behavior: "smooth", block: "center" });
              return;
            }
            if (action === "save-dossier") {
              saveLearningNote(Number(button.dataset.messageIndex));
            }
          });
        });
      }

      function bindLearningQueueEvents() {
        document.querySelectorAll("[data-learning-queue-action]").forEach((button) => {
          button.addEventListener("click", () => handleLearningQueueAction(button));
        });
        document.querySelectorAll("[data-learning-queue-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            updateLearningQueueItemState(Number(button.dataset.messageIndex), button.dataset.learningQueueToggle);
          });
        });
      }

      function handleLearningQueueAction(button) {
        if (button.disabled) return;
        const action = button.dataset.learningQueueAction || "";
        const messageEl = button.closest(".message.assistant");
        const message = messages[Number(button.dataset.messageIndex)];
        const itemId = button.dataset.learningQueueItemId || "";
        const item = (message?.learningQueue?.items || []).find((entry) => entry.id === itemId);
        if (item?.requiresEvidenceGate && learningActionGate(message).locked) return;
        if (action === "review-evidence" && button.dataset.claimTarget) {
          focusClaimByKey(button.dataset.claimTarget);
          return;
        }
        if (action === "review-audit") {
          const audit = messageEl?.querySelector(".evidence-audit");
          if (audit) audit.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        if (action === "review-validation") {
          const pack = messageEl?.querySelector(".validation-pack");
          if (pack) pack.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        if (action === "fill-data") {
          focusFirstStructuredDataField(messageEl);
          return;
        }
        if (action === "save-dossier") {
          saveLearningNote(Number(button.dataset.messageIndex));
          return;
        }
        if (action === "fill-prompt") {
          fillQuestionFromWorkflowPrompt(button.dataset.learningQueuePrompt || "");
          return;
        }
        if (button.dataset.sourceTarget) {
          focusSourceByKey(button.dataset.sourceTarget);
        }
      }

      function updateLearningQueueItemState(messageIndex, itemId) {
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant" || !message.learningQueue || !itemId) return;
        const items = Array.isArray(message.learningQueue.items) ? message.learningQueue.items : [];
        const target = items.find((item) => item.id === itemId);
        if (target?.locked || (target?.requiresEvidenceGate && learningActionGate(message).locked)) return;
        const nextItems = items.map((item) => item.id === itemId ? { ...item, done: item.done !== true } : item);
        message.learningQueue = rebuildLearningQueueProgress(message.learningQueue, nextItems);
        saveMessages();
        renderMessages({ scrollToBottom: false });
      }

      function setLearningQueueItemDone(messageIndex, itemId, done = true) {
        const message = messages[messageIndex];
        if (!message || message.role !== "assistant" || !message.learningQueue || !itemId) return false;
        const items = Array.isArray(message.learningQueue.items) ? message.learningQueue.items : [];
        const target = items.find((item) => item.id === itemId);
        if (!target || (target.requiresEvidenceGate && learningActionGate(message).locked)) return false;
        const nextItems = items.map((item) => item.id === itemId ? { ...item, done } : item);
        message.learningQueue = rebuildLearningQueueProgress(message.learningQueue, nextItems);
        return true;
      }

      function rebuildLearningQueueProgress(queue, items) {
        const nextItems = Array.isArray(items) ? items : [];
        const completed = nextItems.filter((item) => item.done === true).length;
        const total = nextItems.length;
        const currentItem = nextItems.find((item) => item.done !== true) || nextItems[0];
        return {
          ...queue,
          currentItemId: currentItem?.id || "",
          progress: {
            completed,
            total,
            percent: total > 0 ? Math.round((completed / total) * 100) : 0,
          },
          items: nextItems,
        };
      }
