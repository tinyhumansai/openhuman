          return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : null;
        } catch {
          return null;
        }
      }

      function parseJsonArray(value) {
        try {
          const parsed = JSON.parse(String(value || "[]"));
          return Array.isArray(parsed) ? parsed.filter((item) => typeof item === "string" && item.trim()).map((item) => item.trim()) : [];
        } catch {
          return [];
        }
      }

      async function fillDossierPromptWithContext(prompt, productTextOverride) {
        const text = String(prompt || "").trim();
        if (!text || !selectedDossier?.id) return;
        const hasOverride = typeof productTextOverride === "string";
        const productText = hasOverride ? productTextOverride : currentProductText();
        const productIntake = hasOverride
          ? { diagnosticPrompt: text, summary: "使用已保存的业务验证材料继续追问。", caution: "这是用户提供的业务验证材料，不是本地资料证据。" }
          : productText === selectedProductText ? selectedProductIntake : null;
        await restoreDossierSession(selectedDossier.id);
        queueProductInputForPrompt(text, productText, productIntake, {
          requirePromptMatch: false,
          rebuildFromText: !productIntake || productText !== selectedProductText,
        });
        questionEl.value = text;
        questionEl.focus();
      }

      async function fillBusinessVerificationPrompt(recordId) {
        const record = (selectedDossierWorkbench?.businessVerification?.records || []).find((item) => item.id === recordId);
        if (!record?.diagnosticPrompt || !selectedDossier?.id) return;
        await restoreDossierSession(selectedDossier.id);
        queueProductInputForPrompt(record.diagnosticPrompt, record.rawText, record);
        questionEl.value = record.diagnosticPrompt;
        questionEl.focus();
      }

      async function saveDossierSourceDecision(sourceIndex, decision) {
        if (!selectedDossier?.id || !Number.isInteger(sourceIndex) || !["useful", "irrelevant"].includes(decision)) return;
        const payload = await fetchJson(`/api/dossiers/${encodeURIComponent(selectedDossier.id)}/evidence-decision`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sourceIndex, decision }),
        });
        selectedDossier = payload.dossier || selectedDossier;
        selectedDossierWorkbench = payload.workbench || selectedDossierWorkbench;
        renderDossierDetail();
        await loadDossiers();
      }

      function renderDossierList(items) {
        const safeItems = (items || []).filter(Boolean).slice(0, 8);
        if (safeItems.length === 0) return `<p>暂无</p>`;
        return `<ul>${safeItems.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function renderDossierEvidenceList(items, kind) {
        const safeItems = (items || []).filter(Boolean).slice(0, 8);
        if (safeItems.length === 0) return `<p>暂无</p>`;
        return `<div class="dossier-evidence-list">${safeItems.map((item) => renderDossierEvidence(item, kind)).join("")}</div>`;
      }

      function renderDossierEvidence(item, kind) {
        const label = kind === "accepted" ? "采纳证据" : "排除证据";
        const meta = [item.author, item.date, item.title].filter(Boolean).join(" · ");
        const safeUrl = safeSourceUrl(item.sourceUrl);
        const link = safeUrl
          ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">原文链接</a>`
          : "";
        const identity = [item.sourceKey, item.sourcePath, item.sourceUrl].filter(Boolean);
        return `<article class="dossier-evidence">
          <strong>${escapeHtml(label)} · ${escapeHtml(meta || "来源未知")}</strong>
          <blockquote>${escapeHtml(compactText(item.quote || item.text || "", 260))}</blockquote>
          ${link ? `<p>${link}</p>` : ""}
          ${identity.length ? `<details><summary>来源身份</summary>${identity.map((value) => `<p>${escapeHtml(value)}</p>`).join("")}</details>` : ""}
        </article>`;
      }

      function renderExcludedDossierSources(items) {
        const safeItems = (items || []).filter((item) => item?.key).slice(0, 12);
        if (safeItems.length === 0) return `<p>暂无</p>`;
        return `<div class="dossier-source-list">${safeItems
          .map((item) => `<article class="dossier-source">
            <strong>${escapeHtml(item.label || compactSourceKey(item.key))}</strong>
            <details><summary>来源身份</summary><p>${escapeHtml(item.key)}</p></details>
          </article>`)
          .join("")}</div>`;
      }

      function renderDossierSources(items, dossier = selectedDossier) {
        const safeItems = (items || []).filter((item) => item?.title).slice(0, 12);
        if (safeItems.length === 0) return `<p>暂无</p>`;
        return `<p class="dossier-meta">候选不等于证据；确认摘录真正支撑结论后才会进入已采纳证据。业务材料和实验结果不会当成作者原文证据。</p><div class="dossier-source-list">${safeItems
          .map((source, index) => {
            const safeUrl = safeSourceUrl(source.sourceUrl);
            const link = safeUrl
              ? `<a href="${escapeAttribute(safeUrl)}" target="_blank" rel="noreferrer">原文链接</a>`
              : "";
            const identity = [source.sourcePath, source.sourceUrl, sourceKeyForSource(source)].filter(Boolean);
            const decision = dossierSourceDecision(dossier, source);
            const decisionLabel = decision === "accepted"
              ? "已采纳为证据"
              : decision === "rejected"
                ? "已标记不相关"
                : "待你确认";
            return `<article class="dossier-source" data-dossier-source-index="${index}" data-dossier-source-key="${escapeAttribute(sourceKeyForSource(source))}" data-dossier-source-path="${escapeAttribute(source.sourcePath || "")}" data-dossier-source-url="${escapeAttribute(source.sourceUrl || "")}">
              <strong>${escapeHtml(source.title)}</strong>
              <p>${escapeHtml([source.author, source.date].filter(Boolean).join(" · "))} ${link}</p>
              ${source.excerpt ? `<p>${escapeHtml(compactText(source.excerpt, 180))}</p>` : ""}
              <p class="dossier-meta">${escapeHtml(decisionLabel)}</p>
              ${source.excerpt ? `<div class="workbench-actions">
                <button class="small-action${decision === "accepted" ? " is-active" : ""}" type="button" data-dossier-source-index="${index}" data-dossier-source-decision="useful">确认这段有用</button>
                <button class="small-action${decision === "rejected" ? " is-active" : ""}" type="button" data-dossier-source-index="${index}" data-dossier-source-decision="irrelevant">这段不相关</button>
              </div>` : ""}
              ${identity.length ? `<details><summary>来源身份</summary>${identity.map((value) => `<p>${escapeHtml(value)}</p>`).join("")}</details>` : ""}
            </article>`;
          })
          .join("")}</div>`;
      }

      function dossierSourceDecision(dossier, source) {
        if (!dossier || !source) return "";
        const keys = new Set(sourceIdentityKeys(source));
        const matches = (item) => evidenceIdentityKeys(item).some((key) => keys.has(key));
        if ((dossier.acceptedEvidence || []).some(matches)) return "accepted";
        if ((dossier.rejectedEvidence || []).some(matches)) return "rejected";
        return "";
      }

      function evidenceIdentityKeys(item) {
        return [item?.sourceKey, item?.sourcePath, item?.sourceUrl, sourceKeyForSource(item || {})].filter(Boolean);
      }

      async function loadNotebooks() {
        try {
          const payload = await fetchJson("/api/notebooks");
          notebooks = Array.isArray(payload.notebooks) ? payload.notebooks : [];
          hiddenTestNotebookCount = Number(payload.hiddenTestNotebookCount || 0);
          renderNotebooks();
        } catch (error) {
          notebooksEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
      }

      function renderNotebooks() {
        const hiddenNotice = hiddenTestNotebookCount > 0
          ? `<p class="status">已隐藏 ${escapeHtml(hiddenTestNotebookCount)} 个验收测试会话，避免混入真实专题。</p>`
          : "";
        if (!notebooks.length) {
          notebooksEl.innerHTML = `${hiddenNotice}<p class="status">提问后会自动保存为专题会话，刷新或重启后可恢复。</p>`;
          return;
        }
        notebooksEl.innerHTML = hiddenNotice + notebooks
          .slice(0, 8)
          .map((notebook) => {
            const active = notebook.id === sessionId;
            const updated = notebook.updatedAt ? new Date(notebook.updatedAt).toLocaleString("zh-CN") : "";
            const meta = `${Number(notebook.messageCount || 0)} 条消息 · ${Number(notebook.sourceCount || 0)} 个来源`;
            return `<article class="note-item${active ? " is-active" : ""}">
              <strong>${escapeHtml(notebook.title || "亚马逊学习专题")}</strong>
              <p>${escapeHtml(notebook.topic || "")}</p>
              <p>${escapeHtml([meta, updated].filter(Boolean).join(" · "))}</p>
              <p>${escapeHtml(notebook.boundary || "专题会话是系统整理，不是作者原文证据。")}</p>
              <div class="workbench-actions">
                <button class="workbench-button" type="button" data-notebook-open="${escapeAttribute(notebook.id)}">${active ? "当前会话" : "打开会话"}</button>
                <button class="workbench-button" type="button" data-notebook-study-pack="${escapeAttribute(notebook.id)}">学习包</button>
              </div>
            </article>`;
          })
          .join("");
        notebooksEl.querySelectorAll("[data-notebook-open]").forEach((button) => {
          button.addEventListener("click", () => {
            restoreNotebookSession(button.dataset.notebookOpen, { silent: false }).catch((error) => {
              notebooksEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });

        notebooksEl.querySelectorAll("[data-notebook-study-pack]").forEach((button) => {
          button.addEventListener("click", () => {
            loadNotebookStudyPack(button.dataset.notebookStudyPack).catch((error) => {
              selectedStudyPack = { error: error.message };

      function upsertNotebook(notebook) {
        if (!notebook || !notebook.id) return;
        notebooks = [notebook, ...notebooks.filter((item) => item.id !== notebook.id)].slice(0, 50);
        renderNotebooks();
      }

      async function restoreNotebookSession(id, options = {}) {
        if (!id) return;
        const payload = await fetchJson(`/api/notebooks/${encodeURIComponent(id)}`);
        const notebook = payload.notebook || {};
        if (!Array.isArray(notebook.messages)) return;
        sessionId = notebook.id || id;
        messages = notebook.messages;
        sourceControls = normalizeSourceControls(notebook.sourceControls || {});
        userSourceControls = normalizeUserSourceControls(notebook.userSourceControls || {});
        safeLocalSet(SESSION_KEY, sessionId);
        updateSessionUrl(sessionId);
        saveMessages();
        saveSourceControls();
        saveUserSourceControls();
        selectedDossier = null;
        selectedDossierWorkbench = null;
        selectedTopicRoomId = "";
        selectedStudyPack = null;
        topicReadingSelections.clear();
        renderSourceScopeControls();
        renderUserSources();
        renderDossierDetail();
        renderTopicReadingRoom();
        renderMessages({ scrollToBottom: !options.silent });
        renderEvidenceWorkbench();
        await loadNotebooks();
        if (!options.silent) await loadNotebookStudyPack(sessionId).catch(() => {});
      }

      function updateSessionUrl(id) {
        if (!window.history?.replaceState) return;
        const nextUrl = new URL(window.location.href);
        if (id) nextUrl.searchParams.set("session", id);
        else nextUrl.searchParams.delete("session");
        window.history.replaceState(null, "", nextUrl);
      }

      async function loadNotebookStudyPack(id) {

        selectedStudyPack = { id, loading: true };

        selectedStudyPack = payload.studyPack || null;
        renderNotebookStudyPack();
        notebookStudyPackEl.scrollIntoView({ behavior: "smooth", block: "start" });

              ${step.successSignal ? `<p>判断信号：${escapeHtml(step.successSignal)}</p>` : ""}
              <span>${Array.isArray(step.sourceIndexes) && step.sourceIndexes.length ? `来源 ${escapeHtml(step.sourceIndexes.map((sourceIndex) => Number(sourceIndex) + 1).join("、"))}` : "回到来源账本核对"}</span>

      function renderStudyPackStudioMastery(quiz, packId = "") {
        if (!quiz || typeof quiz !== "object") return "";
        const items = Array.isArray(quiz.items) ? quiz.items.filter((item) => item?.question).slice(0, 8) : [];
        if (!items.length) return "";
        const state = readStudyPackMasteryState();
        return `<section class="study-pack-section">
          <strong>${escapeHtml(quiz.title || "掌握度自测")}</strong>
          <div class="study-pack-mastery">
            <div class="study-pack-mastery-head">
              <strong>${Number(items.length)} 题</strong>
              <span>${escapeHtml(quiz.boundary || "自测只检查你对本专题的理解，不会写入作者原文证据。")}</span>
            </div>
            <div class="study-pack-mastery-list">${items.map((item, index) => {
              const itemKey = studyPackMasteryItemKey(packId, item, index);
              const status = state[itemKey] || "";
              const sourceText = Array.isArray(item.sourceIndexes) && item.sourceIndexes.length
                ? `来源 ${item.sourceIndexes.map((sourceIndex) => Number(sourceIndex) + 1).join("、")}`
                : "回到来源账本核对";
              return `<article class="study-pack-mastery-item">
                <strong>${escapeHtml(item.question || `自测 ${index + 1}`)}</strong>
                ${item.expectedAnswer ? `<p>参考：${escapeHtml(item.expectedAnswer)}</p>` : ""}
                ${item.explanation ? `<p>${escapeHtml(item.explanation)}</p>` : ""}
                <span>${escapeHtml(sourceText)} · ${escapeHtml(studyPackMasteryStatusLabel(status))}</span>
                <div class="study-pack-mastery-actions">
                  <button class="small-action" type="button" data-study-pack-mastery="mastered" data-active="${status === "mastered" ? "true" : "false"}" data-study-pack-mastery-key="${escapeAttribute(itemKey)}">掌握</button>
                  <button class="small-action" type="button" data-study-pack-mastery="review" data-active="${status === "review" ? "true" : "false"}" data-study-pack-mastery-key="${escapeAttribute(itemKey)}">再练</button>
                </div>
              </article>`;
            }).join("")}</div>
            <p class="study-pack-boundary">${escapeHtml(quiz.scoring || "点“掌握”或“再练”只保存在当前浏览器。")}</p>
          </div>
        </section>`;
      }

      function studyPackMasteryItemKey(packId, item, index) {
        const stableId = item?.id || `quiz-${index + 1}`;
        const fingerprint = studyPackTextFingerprint([
          item?.question || "",
          item?.expectedAnswer || "",
          Array.isArray(item?.sourceIndexes) ? item.sourceIndexes.join(",") : "",
        ].join("|"));
        return `${packId || "study-pack"}:${stableId}:${fingerprint}`;
      }

      function studyPackTextFingerprint(value) {
        const text = compactText(value, 800);
        let hash = 0;
        for (let index = 0; index < text.length; index += 1) {
          hash = ((hash << 5) - hash + text.charCodeAt(index)) | 0;
        }
        return Math.abs(hash).toString(36);
      }

      function readStudyPackMasteryState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STUDY_PACK_MASTERY_KEY) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch {
          return {};
        }
      }

      function updateStudyPackMastery(key, status) {
        if (!key || !["mastered", "review"].includes(status)) return;
        const state = readStudyPackMasteryState();
        if (state[key] === status) {
          delete state[key];
        } else {
          state[key] = status;
        }
        try {
          localStorage.setItem(STUDY_PACK_MASTERY_KEY, JSON.stringify(pruneStudyPackMasteryState(state)));
        } catch {
          // 浏览器存储不可用时，自测按钮只在当前渲染周期内失效。
        }
      }

      function pruneStudyPackMasteryState(state) {
        const entries = Object.entries(state || {}).filter(([, value]) => ["mastered", "review"].includes(value));
        return Object.fromEntries(entries.slice(-240));
      }

      function studyPackMasteryStatusLabel(status) {
        if (status === "mastered") return "当前：已掌握";
        if (status === "review") return "当前：待复习";
        return "当前：未标记";
      }

      function renderStudyPackStudioFlashcards(cards) {
        const safeCards = Array.isArray(cards) ? cards.filter((card) => card?.front || card?.back).slice(0, 8) : [];
        if (!safeCards.length) return "";
        return `<section class="study-pack-section">
          <strong>复习卡预览</strong>
          <div class="study-pack-flashcards">${safeCards.map((card, index) => `<article class="study-pack-flashcard">
            <strong>${escapeHtml(card.front || `复习卡 ${index + 1}`)}</strong>
            <p>${escapeHtml(card.back || "回到来源账本复核。")}</p>
            <span>${escapeHtml(card.boundary || "复习卡用于检查理解，不会写入原始知识库。")}</span>
          </article>`).join("")}</div>
        </section>`;
      }

      function renderStudyPackStudioMindMap(mindMap) {
        const nodes = Array.isArray(mindMap?.nodes) ? mindMap.nodes : [];
        if (!nodes.length) return "";
        const topic = nodes.find((node) => node.type === "topic") || nodes[0];
        const groups = [
          ["concept", "关键概念"],
          ["takeaway", "学习结论"],
          ["source", "来源文章"],
        ].map(([type, label]) => ({
          type,
          label,
          nodes: nodes.filter((node) => node.type === type).slice(0, 8),
        })).filter((group) => group.nodes.length);
        if (!groups.length) return "";
        return `<section class="study-pack-section">
          <strong>思维导图预览</strong>
          <div class="study-pack-mindmap">
            <div class="study-pack-mindmap-topic">
              <strong>${escapeHtml(topic.label || "亚马逊学习专题")}</strong>
              <span>${Number(nodes.length)} 个节点 · ${Number(mindMap.edges?.length || 0)} 条关系</span>
            </div>
            <div class="study-pack-mindmap-branches">${groups.map((group) => `<div class="study-pack-mindmap-column">
              <strong>${escapeHtml(group.label)}</strong>
              ${group.nodes.map((node) => `<span class="study-pack-mindmap-node">${escapeHtml(node.label || "")}</span>`).join("")}
            </div>`).join("")}</div>
          </div>
        </section>`;
      }

      function renderStudyPackStudioSourceTable(sources) {
        const safeSources = Array.isArray(sources) ? sources.filter((source) => source?.title || source?.author).slice(0, 12) : [];
        if (!safeSources.length) return "";
        return `<section class="study-pack-section">
          <strong>来源数据表</strong>
          <div class="study-pack-source-table" role="table" aria-label="来源数据表">${safeSources.map((source) => `<article class="study-pack-table-row" role="row">
            <strong>${Number(source.index || 0)}</strong>
            <span>${escapeHtml(source.author || "未知作者")}</span>
            <span>${escapeHtml(source.title || "未命名来源")}</span>
            <span>${escapeHtml(source.identity || source.claim || "作者原文证据来源")}</span>
          </article>`).join("")}</div>
        </section>`;
      }

      function downloadStudyPackFile(pack, kind) {
        const isJson = kind === "json";
        const isFlashcards = kind === "flashcards";
        const isSources = kind === "sources";
        const content = isJson
          ? (pack.exportJson || JSON.stringify(pack, null, 2))
          : isFlashcards
            ? (pack.studio?.flashcardsCsv || "")
            : isSources
              ? (pack.studio?.sourceTableCsv || "")
              : (pack.exportMarkdown || pack.markdown || "");
        if (!String(content || "").trim()) {
          notesEl.innerHTML = `<p class="status">当前学习包没有可导出的内容。</p>`;
          return;
        }
        const ext = isJson ? "json" : (isFlashcards || isSources) ? "csv" : "md";
        const suffix = isFlashcards ? "flashcards" : isSources ? "sources" : "studio";
        const filename = sanitizeDownloadFilename(`${pack.title || "亚马逊学习专题"}-${suffix}.${ext}`);
        const blob = new Blob([content], { type: isJson ? "application/json;charset=utf-8" : (ext === "csv" ? "text/csv;charset=utf-8" : "text/markdown;charset=utf-8") });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 0);
        notesEl.innerHTML = `<p class="status">已导出本地学习包预览：${escapeHtml(filename)}。</p>`;
      }

      function renderStudyPackCards(title, items, renderer) {
        const safeItems = Array.isArray(items) ? items.slice(0, 12) : [];
        if (safeItems.length === 0) return "";
        return `<section class="study-pack-section">
          <strong>${escapeHtml(title)}</strong>
          <div class="study-pack-grid">${safeItems.map(renderer).join("")}</div>
        </section>`;
      }

      function renderStudyPackTakeaway(item) {
        const supportLabel = item.support === "source_backed" ? "已绑定来源" : "待补来源";
        return `<article class="study-pack-card">
          <strong>${escapeHtml(item.label || "学习要点")}</strong>
          <p>${escapeHtml(item.text || "")}</p>
          <span>${escapeHtml(supportLabel)} · ${escapeHtml(item.identity || "系统整理")}</span>
          <span>${escapeHtml(item.boundary || "系统整理，不是作者原文证据。")}</span>
        </article>`;
      }

      function renderStudyPackChecklistItem(item) {
        return `<article class="study-pack-card">
          <strong>${escapeHtml(item.label || "")}</strong>
          ${item.reason ? `<p>${escapeHtml(item.reason)}</p>` : ""}
          <span>${escapeHtml(item.boundary || "行动建议需要业务数据验证。")}</span>
        </article>`;
      }

      function renderStudyPackReviewQuestion(item) {
        return `<article class="study-pack-card">
          <strong>${escapeHtml(item.question || "")}</strong>
          ${item.answer ? `<p>${escapeHtml(item.answer)}</p>` : ""}
          ${item.prompt ? `<button class="diagnosis-prompt" type="button" data-study-pack-prompt="${escapeAttribute(item.prompt)}">继续追问</button>` : ""}
          <span>${escapeHtml(item.boundary || "复习题用于检查理解。")}</span>
        </article>`;
      }

      function renderStudyPackConcepts(items) {
        const concepts = Array.isArray(items) ? items.slice(0, 16) : [];
        if (concepts.length === 0) return "";
        return `<section class="study-pack-section">
          <strong>概念地图</strong>
          <div class="topic-source-tree-concepts">${concepts.map((item) => `<span class="topic-source-tree-chip">${escapeHtml(item.label || "")}</span>`).join("")}</div>
          <p class="study-pack-boundary">概念来自本轮问答图谱，是学习索引，不是作者原文。</p>
        </section>`;
      }

      function renderStudyPackSources(items) {
        const sources = Array.isArray(items) ? items.slice(0, 12) : [];
        if (sources.length === 0) {
          return `<section class="study-pack-section"><strong>来源账本</strong><p class="study-pack-boundary">暂无作者原文来源，先继续提问补来源。</p></section>`;
        }
        return `<section class="study-pack-section">
          <strong>来源账本</strong>
          <div class="study-pack-grid">${sources.map((source) => `<article class="study-pack-source">
            <strong>${escapeHtml(source.title || "未命名来源")}</strong>
            <p>${escapeHtml([source.author, source.date].filter(Boolean).join(" · "))}</p>
            ${source.excerpt ? `<blockquote>${escapeHtml(compactText(source.excerpt, 220))}</blockquote>` : ""}
            ${safeSourceUrl(source.sourceUrl) ? `<a href="${escapeAttribute(safeSourceUrl(source.sourceUrl))}" target="_blank" rel="noreferrer">原文链接</a>` : ""}
            <p>${escapeHtml(source.identity || "作者原文证据来源")}</p>
          </article>`).join("")}</div>
        </section>`;
      }

      function renderNotes() {
        if (!dossiers.length) {
          notesEl.innerHTML = `<p class="status">还没有保存学习档案。</p>`;
          return;
        }
        notesEl.innerHTML = dossiers
          .map((dossier) => {
            const diagnosisMeta = dossier.counts?.diagnosisChecks
              ? ` · 诊断 ${dossier.counts.diagnosisChecked || 0}/${dossier.counts.diagnosisChecks} 项`
              : "";
            const productMeta = dossier.counts?.productFactGroups
              ? ` · 产品输入 ${dossier.counts.productFactGroups} 类`
              : "";
            const reviewMeta = dossier.counts?.reviewTotal
              ? ` · 已处理 ${dossier.counts.reviewCompleted || 0}/${dossier.counts.reviewTotal} 项`
              : "";
            const selfTestMeta = dossier.counts?.selfTestTotal
              ? ` · 自测理解 ${dossier.counts.selfTestMastered || 0}/${dossier.counts.selfTestTotal} 张`
              : "";
            const businessMeta = dossier.counts?.businessVerificationRecords
              ? ` · 业务验证 ${dossier.counts.businessVerificationReady || 0}/${dossier.counts.businessVerificationRecords} 条 · 验证覆盖 ${dossier.counts.businessVerificationDimensionsReady || 0}/${dossier.counts.businessVerificationDimensionsTotal || 0}`
              : "";
            const experimentMeta = dossier.counts?.experimentResults
              ? ` · 实验复盘 ${dossier.counts.experimentResults} 条`
              : "";
            const mission = dossier.researchMission || null;
            const missionMeta = mission ? `任务阶段：${mission.stageLabel || "研究任务"} · ${mission.nextAction || "继续推进"}` : "";
            return `<article class="note-item">
              <strong>${escapeHtml(dossier.title || "亚马逊学习档案")}</strong>
              <p>${escapeHtml(dossier.question || "")}</p>
              <p>${escapeHtml(dossier.takeaway || "")}</p>
              ${missionMeta ? `<p>${escapeHtml(missionMeta)}</p>` : ""}
              ${renderOpenHumanMemoryStatus(dossier.openhumanMemory)}
              <p>采纳 ${dossier.counts?.acceptedEvidence || 0} 条 · 排除证据 ${dossier.counts?.rejectedEvidence || 0} 条 · 排除来源 ${dossier.counts?.excludedSources || 0} 篇${escapeHtml(productMeta)}${escapeHtml(diagnosisMeta)}${escapeHtml(reviewMeta)}${escapeHtml(selfTestMeta)}${escapeHtml(businessMeta)}${escapeHtml(experimentMeta)}</p>
              ${dossier.nextActions?.length ? `<p>${escapeHtml(dossier.nextActions.slice(0, 2).join(" / "))}</p>` : ""}
              <div class="workbench-actions">
                <button class="workbench-button" type="button" data-dossier-view="${escapeAttribute(dossier.id)}">查看详情</button>
                <button class="small-action" type="button" data-dossier-delete="${escapeAttribute(dossier.id)}">删除档案</button>
              </div>
            </article>`;
          })
          .join("");
        notesEl.querySelectorAll("[data-dossier-view]").forEach((button) => {
          button.addEventListener("click", () => {
            showDossierDetails(button.dataset.dossierView).catch((error) => {
              notesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });
        });
        notesEl.querySelectorAll("[data-dossier-delete]").forEach((button) => {
          button.addEventListener("click", () => {
            deleteDossier(button.dataset.dossierDelete).catch((error) => {
              notesEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
            });
          });
        });
      }

      async function openDossier(id) {
        if (!id) return;
        await restoreDossierSession(id);
        questionEl.value = "";
        questionEl.focus();
      }

      async function restoreDossierSession(id) {
        const payload = await fetchJson(`/api/dossiers/${encodeURIComponent(id)}/session`);
        sessionId = "";
        safeLocalRemove(SESSION_KEY);
        updateSessionUrl("");
        messages = Array.isArray(payload.messages) ? payload.messages : [];
        sourceControls = normalizeSourceControls(payload.sourceControls || {});
        selectedDossier = null;
        selectedDossierWorkbench = null;
        selectedProductText = "";
        selectedProductIntake = null;
        selectedExperimentResultText = "";
        selectedExperimentResultError = "";
        selectedExperimentResultSaving = false;
        pendingProductInput = null;
        saveMessages();
        saveSourceControls();
        renderSourceScopeControls();
        renderDossierDetail();
        renderMessages();
        renderEvidenceWorkbench();
      }

      async function fetchJson(url, options) {
        const response = await fetch(url, options);
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "请求失败");
        return payload;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }

      function cssEscape(value) {
        if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(value);
        return String(value).replace(/["\\]/g, "\\$&");
      }
    </script>
  </body>
</html>
