[package]
name = "openhuman-tinyhumans"
description = "OpenHuman on the hosted TinyHumans backend: the SDK-backed transport, an embed runtime that boots connected, and the host-side login/session owner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

# Every gate forwards 1:1 to `openhuman-embed`, which forwards it to the core.
# This crate adds no gates of its own: it is the layer that *connects* an
# embed runtime to the TinyHumans backend, not a feature surface.
[features]
# `jev` is this crate's one gate of its own: the Jev-backed `tool_search`
# ranker (`tinytools-jev` over the TinyHumans System One proxy). On by
# default and forwarded by every shipped host; without it the core ranks
# `tool_search` with BM25 alone.
default = ["openhuman-embed/default", "jev"]
jev = ["dep:tinytools-jev", "dep:tinyjevclient"]
http-server = ["openhuman-embed/http-server"]
inference = ["openhuman-embed/inference"]
documents = ["openhuman-embed/documents"]
hosting = ["openhuman-embed/hosting"]
modules = ["openhuman-embed/modules"]
voice = ["openhuman-embed/voice"]
web3 = ["openhuman-embed/web3"]
runtime-node = ["openhuman-embed/runtime-node"]
contacts = ["openhuman-embed/contacts"]
media = ["openhuman-embed/media"]
flows = ["openhuman-embed/flows"]
skills = ["openhuman-embed/skills"]
mcp = ["openhuman-embed/mcp"]
crash-reporting = ["openhuman-embed/crash-reporting"]
channels = ["openhuman-embed/channels"]
sandbox-landlock = ["openhuman-embed/sandbox-landlock"]
sandbox-bubblewrap = ["openhuman-embed/sandbox-bubblewrap"]
whatsapp-web = ["openhuman-embed/whatsapp-web"]
file-logging = ["openhuman-embed/file-logging"]
scheduler-gate = ["openhuman-embed/scheduler-gate"]

[dependencies]
openhuman-embed = { path = "../openhuman-embed", default-features = false }
# Direct access to `api::transport` / `core::all` — the surfaces embed does
# not (and should not) re-export. Features unify with embed's forwarding.
openhuman-core = { path = "../openhuman-core", package = "openhuman", default-features = false }
# The vendored TinyHumans SDK: the only crate in the tree that may depend on
# it. `default-features = false` drops the Socket.IO client; realtime stays
# on the core's own `platform::socket` transport.
tinyhumans-sdk = { path = "../../vendor/tinyhumans-sdk", default-features = false }
# The `tool_search` ranker backed by TypeSafe's Jev, reached through the
# backend's `/agent-integrations/openrouter/systemone` proxy with the same
# credential every other backend call uses. Same vendored tree as the core's
# `tinytools`, so the `ToolRanker` types unify.
tinytools = { path = "../../vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-jev = { path = "../../vendor/tinyagents/vendor/tinytools/crates/tinytools-jev", optional = true }
# The System One transport behind the Jev evaluator; `tinytools-jev` is
# transport-free and this crate owns the wire, the credential and the deadline.
# Consumed by pinned revision, as that crate's README asks.
tinyjevclient = { git = "https://github.com/tinyhumansai/tinyjevclient", rev = "84b3983c7e1e14f7515658ceafabb6c4e7967c94", optional = true }
# The channel controller contract (result types, credential-provider keys)
# for the managed Telegram/Discord link flows in `hosted::channel_link`. Same
# vendored path as the core's, so the types unify. Sync and I/O-free.
tinychannels-bus = { path = "../../vendor/tinychannels/crates/tinychannels-bus" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
urlencoding = "2.1"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows honours the OS certificate store through schannel so corporate
# TLS-inspecting proxies keep working — the session client builds its HTTP
# client through the core's `util::tls::tls_client_builder`, which needs the
# `native-tls` backend compiled in.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "native-tls"] }

[dev-dependencies]
# The core's own axum feature set: axum's defaults would switch on extra axum,
# tower and tracing features and force a separate core build (see below).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
# Feature unification with openhuman-cli's dev-dependencies. Cargo builds the
# core once per distinct feature set of its dependencies, and the tests of
# openhuman-embed, openhuman-tinyhumans and openhuman-cli each pull in the core
# with these dev-dependencies unified in. Keeping the three dev graphs equal
# lets CI (and local `cargo test -p ...` runs) reuse one core build instead of
# recompiling it per crate. Not referenced by this crate's code.
sentry = { version = "0.47.0", default-features = false, features = ["test"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
