# The `openhuman-core` binary, the ops bins (`openhuman-fleet`, the MCP test
# stub), and every root `tests/*.rs` / `examples/*.rs` target.
#
# The binary is a host like the desktop app and the TUI: its normal
# dependencies name `openhuman-rpc` and no other openhuman crate (chain: core
# -> embed -> tinyhumans -> rpc -> app/cli/tui; enforced by
# `scripts/ci/check-crate-chain.mjs`). `main.rs` is `openhuman_rpc::host::cli`.
# The integration tests still reach into the core directly, so the core, embed
# and tinyhumans are DEV-dependencies here: they build into the test and
# example targets and never into the shipped binary.
#
# Auto-discovery is off because Cargo only scans beside this manifest; the
# repository layout gate (`scripts/ci/check-openhuman-rust-layout.mjs`)
# requires every root `tests/*.rs` and `examples/*.rs` file to have an explicit
# target HERE.
[package]
name = "openhuman-cli"
version.workspace = true
edition.workspace = true
description = "OpenHuman core CLI binary, developer bins, and the repository integration tests"
license.workspace = true
repository.workspace = true
publish = false
autobins = false
# Shared with the core: globs tests/raw_coverage/*.rs into the single
# `raw_coverage_all` target and exports OPENHUMAN_REPOSITORY_ROOT.
build = "../../build.rs"
autotests = false
autoexamples = false
autobenches = false

[package.metadata.cargo-machete]
# Optional deps are named only by bin/test targets through `required-features`.
ignored = []

[[bin]]
name = "openhuman-core"
path = "src/main.rs"

[[bin]]
name = "test-mcp-stub"
path = "src/bin/test_mcp_stub.rs"

[[bin]]
name = "openhuman-fleet"
path = "src/bin/fleet.rs"
# The fleet supervisor embeds the axum control-plane server, so it only builds
# with the HTTP transport compiled in (#5048). Under `--no-default-features`
# (no `http-server`) this target is skipped rather than failing to link.
required-features = ["http-server", "bin-tools"]

# The benchmark and profiling binaries (`library-profile`, `rss-bench`,
# `tool-search-bench`, `tool-dialect-bench`) and their driver scripts live in
# tinyhumansai/openhuman-benchmarks (`profile/`), which builds them against a
# vendored checkout of this workspace.

# ── Integration tests that need a PRODUCT gate ──────────────────────────────
#
# `[features] default` is the contributor set and no longer turns on `voice`,
# `web3`, `crash-reporting` or `inference`. These four `tests/` targets name
# symbols that only exist behind those gates, so without a `required-features`
# line a bare `cargo test` fails to COMPILE — not skip, fail — and the failure
# is in a file the contributor did not touch.
#
# `required-features` makes cargo skip the target instead, which is the honest
# outcome: the test exercises a domain that build does not contain. The CI
# product lanes pass `--features "$(scripts/ci/product-features.sh)"`, so every
# one of these still runs there, against the code that ships.
#
# Autodiscovery stays on for the other ~59 `tests/*.rs` targets; declaring a
# target explicitly only opts THAT file out of it.
#
# This replaces the per-symbol `#[cfg]` cleanup tracked in #5021 for these four
# files. #5021 is still the right fix for symbols named in the middle of an
# otherwise gate-free target — required-features is the blunt instrument, and
# it costs the whole target when the gate is off.
[[test]]
# Reproduction of the removed spend cap: needs its own process because the
# global CostTracker is a `OnceCell`, so a shared `--lib` process makes the
# spend state order-dependent.
name = "cost_cap_removed"
path = "../../tests/cost_cap_removed.rs"

[[test]]
# `cost_report`/`cost_cache_report` over a seeded ledger and a refuse budget:
# the global CostTracker and OPENHUMAN_WORKSPACE need a process of their own.
name = "cost_report_e2e"
path = "../../tests/cost_report_e2e.rs"

[[test]]
# Installs a backend into the process-wide storage slot, so it needs its own
# process: in a shared one it would reroute other suites' approvals.
name = "storage_approvals_e2e"
path = "../../tests/storage_approvals_e2e.rs"

[[test]]
# Its own binary for the same reason as storage_approvals_e2e: it installs a
# storage backend into the process-wide slot.
name = "storage_domains_e2e"
path = "../../tests/storage_domains_e2e.rs"

[[test]]
# Its own binary: it installs a storage backend into the process-wide slot.
name = "storage_flows_e2e"
path = "../../tests/storage_flows_e2e.rs"

[[test]]
# Its own binary: it installs a storage backend into the process-wide slot and
# sets the keyring master-key environment.
name = "storage_secrets_e2e"
path = "../../tests/storage_secrets_e2e.rs"

[[test]]
# Its own binary: it boots a core and installs a storage backend into the
# process-wide slot.
name = "storage_scope_e2e"
path = "../../tests/storage_scope_e2e.rs"

[[test]]
# Its own binary: two agents on one backend keep cron jobs and flows apart.
name = "storage_agent_scopes_e2e"
path = "../../tests/storage_agent_scopes_e2e.rs"

[[test]]
# Its own binary: the delegation graph's checkpointer on every driver.
name = "storage_delegation_e2e"
path = "../../tests/storage_delegation_e2e.rs"

[[test]]
name = "embedded_server_shutdown_e2e"
path = "../../tests/embedded_server_shutdown_e2e.rs"

[[test]]
name = "observability_smoke"
path = "../../tests/observability_smoke.rs"
# The `is_*_event` Sentry filters are all `#[cfg(feature = "crash-reporting")]`.
required-features = ["crash-reporting"]

[[test]]
name = "computer_bali_live_e2e"
path = "../../tests/computer_bali_live_e2e.rs"
# Loads the TinyComputer module through the registry.
required-features = ["modules"]

[[test]]
name = "x402_twit_sh_live"
path = "../../tests/x402_twit_sh_live.rs"
# `x402::request_tool()` — the x402 domain is part of the web3 family.
required-features = ["web3"]

[[test]]
name = "memory_v2_e2e"
path = "../../tests/memory_v2_e2e.rs"
# Memory v2 over JSON-RPC against the shared node mock backend
# (`scripts/mock-api-server.mjs`, which needs `node` on PATH).

[[test]]
name = "memory_cortexdb_live"
path = "../../tests/memory_cortexdb_live.rs"
# Memory v2 through the real `openhuman-core` binary against a live CortexDB.
# Skips unless OPENHUMAN_LIVE_CORTEXDB_URL is set; run it with
# scripts/test-memory-cortexdb-live.sh, which boots the server in Docker.

[[test]]
name = "json_rpc_e2e"
path = "../../tests/json_rpc_e2e.rs"
# `voice::reply_speech::{test_seam, TEST_SEAM_ENV}` — the reply-speech seam
# only exists in the real voice module, not the stub.
required-features = ["voice"]

[[test]]
name = "raw_coverage_all"
path = "../../tests/raw_coverage_all.rs"
# The merged raw-coverage target spans ~76 former files, so it reaches the
# widest surface of any single target: `lettre` (pulled in through the voice
# gate's `tinychannels/email`) and the local inference download service.
required-features = ["voice", "inference"]

# ~20 former `tests/*.rs` targets folded into one binary (one link of the
# `openhuman` rlib instead of ~20): `tests/in_process/*.rs`, globbed by the
# root `build.rs`. No `required-features` — these suites exercise gate-free
# surfaces, so they run in the default contributor build too. Suites that need
# a process of their own stay separate targets.
[[test]]
name = "in_process_all"
path = "../../tests/in_process_all.rs"

[[test]]
name = "agent_harness_e2e"
path = "../../tests/agent_harness_e2e.rs"

[[test]]
name = "cli_model_overrides_e2e"
path = "../../tests/cli_model_overrides_e2e.rs"

[[test]]
name = "cli_sigpipe"
path = "../../tests/cli_sigpipe.rs"

[[test]]
name = "cli_storage_url_e2e"
path = "../../tests/cli_storage_url_e2e.rs"

[[test]]
name = "saas_mode_e2e"
path = "../../tests/saas_mode_e2e.rs"

[[test]]
name = "saas_profile_isolation_e2e"
path = "../../tests/saas_profile_isolation_e2e.rs"

[[test]]
name = "composio_list_tools_stack_overflow_regression"
path = "../../tests/composio_list_tools_stack_overflow_regression.rs"

[[test]]
name = "cwd_jail_e2e"
path = "../../tests/cwd_jail_e2e.rs"

[[test]]
name = "windows_sandbox_env_e2e"
path = "../../tests/windows_sandbox_env_e2e.rs"

[[test]]
name = "inference_provider_e2e"
path = "../../tests/inference_provider_e2e.rs"

[[test]]
name = "keyring_secretstore_e2e"
path = "../../tests/keyring_secretstore_e2e.rs"

[[test]]
name = "keyring_secretstore_fresh_e2e"
path = "../../tests/keyring_secretstore_fresh_e2e.rs"

[[test]]
name = "live_flows_demo_e2e"
path = "../../tests/live_flows_demo_e2e.rs"

[[test]]
name = "live_routing_e2e"
path = "../../tests/live_routing_e2e.rs"

[[test]]
name = "mcp_registry_e2e"
path = "../../tests/mcp_registry_e2e.rs"

[[test]]
name = "mcp_registry_multi_server"
path = "../../tests/mcp_registry_multi_server.rs"

[[test]]
name = "mcp_stdio_integration"
path = "../../tests/mcp_stdio_integration.rs"

[[test]]
name = "media_generation_e2e"
path = "../../tests/media_generation_e2e.rs"
required-features = ["media"]

[[test]]
name = "observability_wallet_expected_e2e"
path = "../../tests/observability_wallet_expected_e2e.rs"

[[test]]
name = "skills_mcp_registry_live"
path = "../../tests/skills_mcp_registry_live.rs"

[[example]]
name = "embed_headless"
path = "../../examples/embed_headless.rs"

[[example]]
name = "embed_kernel"
path = "../../examples/embed_kernel.rs"

[dependencies]
# The only openhuman crate the binary depends on. Every gate below forwards to
# it, and it forwards down the chain to the core.
openhuman-rpc = { workspace = true, features = ["server"] }
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
clap = { version = "4.5", features = ["derive"], optional = true }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream", "http2", "multipart", "socks"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Root tests and examples reach into the core, embed and tinyhumans directly.
# Dev-only, so none of them is an edge of the shipped binary. Same spelling as
# the library crates' own manifests (`default-features = false`; the gates come
# from this crate's features through `openhuman-rpc`), so the dev graphs unify
# and `cargo test -p` reuses one core build.
openhuman-core = { path = "../openhuman-core", package = "openhuman", default-features = false }
openhuman-embed = { workspace = true }
openhuman-tinyhumans = { workspace = true }
aes-gcm = "0.10"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tinyinference-llm = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinytools = { path = "../../vendor/tinyagents/vendor/tinytools/crates/tinytools" }
# The completion log a detached sub-agent leaves, for the SaaS delivery-recovery e2e.
tinyagents-tasks = { path = "../../vendor/tinyagents/crates/tinyagents-tasks" }
toml = "1.0"
tracing = "0.1"
# The TinyComputer contract, for the live computer-use e2e (`computer_bali_live_e2e`).
tinycomputer-bus = { path = "../../vendor/tinycomputer/crates/tinycomputer-bus" }
# sentry's TestTransport for the observability before_send smoke tests;
# `default-features = false` keeps actix out of the graph (see the core manifest).
sentry = { version = "0.47.0", default-features = false, features = ["test"] }
base64 = "0.22"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
parking_lot = "0.12"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "0.10"
tar = "0.4"
tinyagents-graph = { path = "../../vendor/tinyagents/crates/tinyagents-graph", features = ["sqlite", "storage-drivers"] }
tinyagents-harness = { path = "../../vendor/tinyagents/crates/tinyagents-harness", features = ["sqlite", "multimodal"] }
tinyagents-session = { path = "../../vendor/tinyagents/crates/tinyagents-session" }
tinybus = { path = "../../vendor/tinybus/crates/tinybus", default-features = false, features = ["macros", "uds"] }
tinychannels = { version = "0.1", features = ["relay-websocket"] }
tinyinference-core = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-local = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-voice = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }
tinymcp = { path = "../../vendor/tinymcp/crates/tinymcp", default-features = false, features = ["rustls-tls"] }
tinymcp-bus = { path = "../../vendor/tinymcp/crates/tinymcp-bus", features = ["schemars"] }
tinytools-agent = { path = "../../vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower = { version = "0.5", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
urlencoding = "2.1"
wiremock = "0.6"

[features]
# The contributor set: the core's `[features] default` gates (listed, because
# `openhuman-rpc`'s own default carries only its server and client) plus the
# Jev ranker. The product lanes pass `--features
# "$(scripts/ci/product-features.sh)"`; every product gate name resolves here.
default = [
    "media",
    "skills",
    "flows",
    "mcp",
    "channels",
    "http-server",
    "scheduler-gate",
    "file-logging",
    "modules",
    "jev",
    "tinymemes",
]
# Every gate forwards to `openhuman-rpc` alone (chain: rpc -> tinyhumans ->
# embed -> core); `scripts/ci/check-feature-forwarding.mjs` checks the link.
# The Jev-backed `tool_search` ranker.
jev = ["openhuman-rpc/jev"]
http-server = ["openhuman-rpc/http-server"]
inference = ["openhuman-rpc/inference"]
documents = ["openhuman-rpc/documents"]
hosting = ["openhuman-rpc/hosting"]
tinymemes = ["openhuman-rpc/tinymemes"]
modules = ["openhuman-rpc/modules"]
voice = ["openhuman-rpc/voice"]
web3 = ["openhuman-rpc/web3"]
# Storage drivers for `[storage] url` (see the core `storage` domain).
storage-sqlite = ["openhuman-rpc/storage-sqlite"]
storage-mongodb = ["openhuman-rpc/storage-mongodb"]
storage-file = ["openhuman-rpc/storage-file"]
runtime-node = ["openhuman-rpc/runtime-node"]
media = ["openhuman-rpc/media"]
flows = ["openhuman-rpc/flows"]
skills = ["openhuman-rpc/skills"]
mcp = ["openhuman-rpc/mcp"]
channels = ["openhuman-rpc/channels"]
whatsapp-web = ["openhuman-rpc/whatsapp-web"]
e2e-test-support = ["openhuman-rpc/e2e-test-support"]
file-logging = ["openhuman-rpc/file-logging"]
scheduler-gate = ["openhuman-rpc/scheduler-gate"]
# Sentry init in `main.rs` (through `embed::process::sentry`) plus the
# `observability_smoke` test target.
crash-reporting = ["openhuman-rpc/crash-reporting"]
# CLI argument parsing + logger init for `openhuman-fleet`.
bin-tools = ["dep:clap"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
