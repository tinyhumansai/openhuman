[package]
name = "openhuman-embeddings"
version = "0.1.0"
edition = "2021"
description = "Embedding provider trait and implementations for the OpenHuman memory system"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
