[[permission]]
identifier = "allow-core-process"
description = "Privileged desktop permissions for core process control, service management, dictation, window/UI, notifications, log access, and workspace integration"

[permission.commands]

allow = [

    # =========================
    # CORE PROCESS
    # =========================
    "core_rpc_url",
    "core_rpc_token",
    # `core_rpc_endpoint` returns the (url, token) pair from ONE snapshot so the
    # renderer can never pair one core's URL with another's bearer. It is the
    # command `resolveShellEndpoint()` actually calls; `core_rpc_url` /
    # `core_rpc_token` above are only the legacy split accessors. It was added
    # to `generate_handler!` but never here, so every invoke was denied with
    # "core_rpc_endpoint not allowed. Command not found" — which surfaced as
    # `getCoreRpcToken()` returning null, `callCoreRpc` throwing "Core RPC token
    # unavailable in Tauri" before any HTTP left the webview, and BootCheckGate
    # reporting "Can't Reach the Runtime / Local core did not respond in time"
    # against a perfectly healthy core. Same failure mode as `reset_local_data`
    # (#4950) below.
    "core_rpc_endpoint",
    # `relay_http_rpc` proxies a JSON-RPC POST through the Rust host so the
    # secure webview can reach a self-hosted runtime on a cleartext LAN IP
    # without tripping mixed-content/CORS (#3865). Without this allow entry the
    # invoke is rejected with "Command not allowed by ACL".
    "relay_http_rpc",
    # `relay_remote_socket` opens a secret loopback-only TCP relay for private
    # LAN WebSocket endpoints when the secure webview blocks ws:// mixed content.
    "relay_remote_socket",
    # `start_core_process` is invoked by BootCheckGate after the user picks
    # Local mode, before redux-persist hydrates the rest of the app (#1316).
    # Without this allow entry the invoke is rejected with "Command not
    # found" and the boot gate stalls.
    "start_core_process",
    "restart_core_process",
    # `reset_local_data` is the "Clear App Data" command (Settings → Account,
    # and the Welcome-screen decryption-recovery flow). It stops the embedded
    # core, deletes the signed-in user's data dir + active markers, then
    # restarts the core. It replaced the old two-step
    # `callCoreRpc('config_reset_local_data') + restartCoreProcess()` dance
    # (which reached Rust via the ACL-permitted `relay_http_rpc`), but the new
    # dedicated command was never added here — so the invoke was rejected with
    # "reset_local_data not allowed. Command not found" and Clear App Data
    # silently did nothing (#4950). Without this allow entry the ACL denies it
    # before it reaches Rust.
    "reset_local_data",
    # `restart_app` triggers `app.restart()` so CEF re-initializes against
    # the active user's `users/<id>/cef` profile after an identity flip
    # (#900). Without this allow entry, the invoke is silently denied by
    # Tauri capabilities and webviews keep the prior user's third-party
    # cookies.
    "restart_app",
    # The Windows custom X and BootCheckGate's Quit action exit the host and
    # embedded core through this command. Registration alone is insufficient.
    "app_quit",
    # `get_active_user_id` reads `~/.openhuman/active_user.toml` so the
    # frontend can prime `userScopedStorage` from the Rust source of truth
    # BEFORE redux-persist hydrates — the prior `localStorage`-only seed
    # was bound to the per-user CEF profile dir and went stale across
    # restart-driven flips, causing a false re-flip and restart loop on
    # every login. (#900)
    "get_active_user_id",
    # The renderer RPC URL handed to a child overlay webview that was spawned
    # with `OPENHUMAN_CORE_RPC_URL` (falls back to `None` when unset).
    "overlay_parent_rpc_url",

    # =========================
    # GATEWAYS
    # =========================
    # The gateway picker (`services/gatewayService.ts`, BootCheckGate and
    # `coreModeSlice`) lists, saves, deletes and activates remote runtimes and
    # reads the active one. These commands are registered only with the
    # `gateways` feature; listing them here is harmless in builds without it.
    "gateway_list",
    "gateway_save",
    "gateway_delete",
    "gateway_activate",
    "gateway_active",
    "gateway_status",

    # =========================
    # SERVICE FALLBACK
    # =========================
    # The daemon service is reached through the core RPC first
    # (`openhuman.service_install` and friends). When that path is unavailable
    # — the embedded core is not running yet, or the renderer talks to a remote
    # runtime — `tauriCommands/service.ts` falls back to these commands, which
    # run the same operation as a one-shot `openhuman-core service …` CLI
    # invocation. The frontend already invoked them, but no such command was
    # registered on the Rust side, so every fallback invoke failed with
    # "Command … not found".
    "service_install_direct",
    "service_start_direct",
    "service_stop_direct",
    "service_status_direct",
    "service_uninstall_direct",

    # =========================
    # CORE UPDATE
    # =========================
    # Probe and apply an update of the embedded core (`tauriCommands/core.ts`),
    # separate from the shell bundle updater in `allow-app-update`.
    "check_core_update",
    "apply_core_update",

    # =========================
    # STARTUP RECOVERY
    # =========================
    # BootCheckGate's port-conflict recovery (`services/bootCheckService.ts`).
    # `force_quit_port_owner` re-validates that the pid still owns the core
    # port and refuses our own pid before it signals anything.
    "recover_port_conflict",
    "force_quit_port_owner",
    "process_diagnostics_list_owned",

    # =========================
    # MCP AND CLAUDE CODE
    # =========================
    # MCP server settings panel: resolve the `openhuman-core` binary path and
    # open a client's MCP config file; Claude Code provider login launcher.
    "mcp_resolve_binary_path",
    "mcp_open_client_config",
    "claude_code_login_launch",

    # =========================
    # SESSION OWNER
    # =========================
    # The renderer delegates login-token exchange, session validation, logout,
    # and the current-user cache to the Tauri shell. Registering these commands
    # in `generate_handler!` is not enough: Tauri v2 rejects every invoke until
    # the active window capability also allows it.
    "auth_login_with_token",
    "auth_store_session",
    "auth_logout",
    "auth_state",
    "auth_current_user",

    # =========================
    # DICTATION
    # =========================
    "register_dictation_hotkey",
    "unregister_dictation_hotkey",

    # =========================
    # PUSH-TO-TALK (PTT)
    # =========================
    # Voice settings panel registers/unregisters the global PTT hotkey and shows
    # the PTT overlay via these invokes. Without these allow entries the invoke
    # is rejected with "Command <name> not allowed by ACL" and PTT (plus the
    # always-on listening flow that depends on hotkey registration) never works.
    "register_ptt_hotkey",
    "unregister_ptt_hotkey",
    "show_ptt_overlay",

    # =========================
    # WINDOW / UI
    # =========================
    "activate_main_window",
    # RootShellLayout keeps the native titlebar in sync with the sidebar.
    "set_titlebar_for_sidebar",
    # Floating mascot window (native NSPanel on macOS; errors elsewhere).
    "mascot_window_show",
    "mascot_window_hide",
    # Notch activity indicator (transparent NSPanel pill, macOS). The Voice
    # settings panel + app boot call these via `syncNotchVisibility` to mirror
    # always-on listening state. Without these allow entries the invoke is
    # rejected with "Command not found" and the notch never shows/hides.
    "notch_window_show",
    "notch_window_hide",

    # =========================
    # NOTIFICATIONS
    # =========================
    # Native notification surface (see src/native_notifications/). The
    # frontend bridge in app/src/lib/nativeNotifications/tauriBridge.ts
    # calls these directly instead of routing through the bundled
    # tauri-plugin-notification (whose desktop permission_state is
    # hardcoded to Granted, see #1152). Without these allow entries the
    # invokes return "Command not found" and the UI falsely reports the
    # OS as denied.
    "notification_permission_state",
    "notification_permission_request",
    "show_native_notification",

    # =========================
    # LOGS
    # =========================
    # Surface the embedded core's daily-rotated log directory
    # (`<data_dir>/logs/`) so the Settings → Developer Options panel can
    # show users the path and reveal it in the platform file manager when
    # collecting support bundles. Read-only; no writes occur in the
    # backing commands.
    "logs_folder_path",
    "reveal_logs_folder",

]

deny = []
