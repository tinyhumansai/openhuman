[package]
name = "openhuman-rpc"
description = "OpenHuman's JSON-RPC protocol: envelopes, the HTTP client, and the core's JSON-RPC server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Every product gate forwards 1:1 to `openhuman-tinyhumans`, which forwards it
# to embed and then the core (chain: core -> embed -> tinyhumans -> rpc ->
# hosts). `http-client`, `server` and `session-store` are this crate's own.
[features]
langfuse = ["openhuman-tinyhumans/langfuse"]
default = ["http-client", "server"]
# Authenticated HTTP client for reaching a core's `/rpc` endpoint.
http-client = ["dep:reqwest"]
# The core's JSON-RPC server: HTTP router, Socket.IO, and the listener bind.
# Turns on the core's `http-server` gate, which carries the domain-owned HTTP
# handlers (the `/v1` inference router, the dictation WebSocket) the router
# mounts.
server = [
    "http-server",
    "dep:axum",
    "dep:socketioxide",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:futures",
    "dep:tracing",
    "dep:chrono",
    "dep:anyhow",
    "dep:once_cell",
    "dep:tinyinference-core",
    "dep:base64",
    "dep:rand",
    "dep:uuid",
    "dep:urlencoding",
    "session-store",
]
# The on-disk session store (`session_store`): OpenHuman's classic
# `session_raw/` / `session_db/` / `tinyagents_store/` layout behind
# TinyAgents' session store port. On with `server`; the TUI, which runs the
# core without the server, turns it on by itself.
session-store = ["dep:tinyagents-session", "dep:tinyagents-harness", "dep:chrono", "dep:anyhow", "tinyagents-session/storage-drivers"]
# The Jev `tool_search` ranker the shared host boot (`host`) wires in.
jev = ["openhuman-tinyhumans/jev"]
# Product gates, forwarded down the chain.
http-server = ["openhuman-tinyhumans/http-server"]
inference = ["openhuman-tinyhumans/inference"]
documents = ["openhuman-tinyhumans/documents"]
hosting = ["openhuman-tinyhumans/hosting"]
tinymemes = ["openhuman-tinyhumans/tinymemes"]
modules = ["openhuman-tinyhumans/modules"]
voice = ["openhuman-tinyhumans/voice"]
web3 = ["openhuman-tinyhumans/web3"]
# Storage drivers for `[storage] url` (see the core `storage` domain and
# `session_store::install_for_host`).
storage-sqlite = ["openhuman-tinyhumans/storage-sqlite"]
storage-mongodb = ["openhuman-tinyhumans/storage-mongodb"]
storage-file = ["openhuman-tinyhumans/storage-file"]
media = ["openhuman-tinyhumans/media"]
flows = ["openhuman-tinyhumans/flows"]
skills = ["openhuman-tinyhumans/skills"]
mcp = ["openhuman-tinyhumans/mcp"]
# Also lets the server's Sentry-routing tests run against a core that reports
# to Sentry.
crash-reporting = ["openhuman-tinyhumans/crash-reporting"]
channels = ["openhuman-tinyhumans/channels"]
whatsapp-web = ["openhuman-tinyhumans/whatsapp-web"]
file-logging = ["openhuman-tinyhumans/file-logging"]
scheduler-gate = ["openhuman-tinyhumans/scheduler-gate"]
# E2E builds only (`openhuman.test_reset`); default-OFF. The desktop app
# and the CLI forward it from their own `e2e-test-support` gate.
e2e-test-support = ["openhuman-tinyhumans/e2e-test-support"]

[dependencies]
# The only openhuman crate this layer depends on. Core internals the server
# needs come through embed's `#[doc(hidden)]` `__host` list (reached as
# `openhuman_tinyhumans::__host`, which tinyhumans forwards); there is no direct `openhuman-core`
# edge (chain: core -> embed -> tinyhumans -> rpc -> hosts).
openhuman-tinyhumans = { path = "../openhuman-tinyhumans", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }
socketioxide = { version = "0.15", features = ["extensions"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt", "io"], optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", default-features = false, optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
anyhow = { version = "1.0", optional = true }
once_cell = { version = "1.19", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
urlencoding = { version = "2.1", optional = true }
tinyinference-core = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core", optional = true }
# The session store port and the file/SQLite building blocks behind
# `session_store` (`session-store` feature); same paths as the core's.
tinyagents-session = { path = "../../vendor/tinyagents/crates/tinyagents-session", optional = true }
tinyagents-harness = { path = "../../vendor/tinyagents/crates/tinyagents-harness", default-features = false, optional = true }

[dev-dependencies]
# Property tests for the SaaS gateway's header handling; same spelling as the
# core's dev-dependency.
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sentry = { version = "0.47.0", default-features = false, features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", default-features = false }
# Same spelling as embed's, tinyhumans' and cli's dev-dependency, so the dev
# graphs unify and `cargo test -p openhuman-rpc` reuses their core build.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
