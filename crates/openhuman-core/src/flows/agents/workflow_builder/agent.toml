id = "workflow_builder"
display_name = "Workflow Builder"
delegate_name = "build_workflow"
when_to_use = "Workflow authoring specialist — owns building tinyflows automation graphs from a natural-language description. Route any request to 'set up a workflow that…', 'automate…', 'when X happens do Y', 'build/create/edit an automation or flow', or to iterate on a proposed workflow here. It grounds nodes in real tool slugs + connections, dry-runs a draft in a sandbox to self-check, and returns a workflow PROPOSAL for review. Persistence stays with the user's Accept + Save; when the user explicitly asks the agent to save (or test-run) onto an existing flow id it may `save_workflow` / `run_flow` — but never on its own. It CAN create a new flow (`create_workflow`) or clone one (`duplicate_flow`) when the user explicitly asks, but every flow it creates is always born DISABLED — it can never enable a flow, or run one without the user's confirmation first. Not for running an already-saved flow (that is a direct flows_run) and not for the legacy skill 'workflows'."
temperature = 0.2
max_iterations = 12
iteration_policy = "extended"
max_result_chars = 12000
# No sandbox filter needed: the belt is propose/read/dry-run plus a handful of
# explicitly-bounded writes (save_workflow onto an existing flow;
# create_workflow/duplicate_flow, always force-disabled at creation;
# run_flow of a saved flow behind a confirm-first prompt rule), and
# dry_run_workflow runs against tinyflows MOCK capabilities (no real effects).
sandbox_mode = "none"
omit_identity = true
omit_memory_context = true
# Safety preamble stays OFF: authoring itself (propose/revise/dry-run/reads)
# has zero real external effect, so the general acting guard-rails would be
# noise there — the "propose, never persist" invariant is taught in prompt.md.
# The one real-effect surface, `run_flow` (a confirmed test-run of an already
# saved flow), is gated by the `ApprovalGate` itself, not this preamble: on the
# streaming copilot path (flows-copilot-live-run-approval, PR3) it parks behind
# a real human approval card (`AgentTurnOrigin::WebChat` +
# `APPROVAL_CHAT_CONTEXT`, same as main chat); on the headless `flows_build`
# path it stays hidden entirely (`restrict_builder_toolset`, #4593/#4881) since
# there is no approval surface to park against there.
omit_safety_preamble = true

[model]
# Graph authoring is multi-step structured reasoning (ground slugs, wire
# expressions, self-check a dry run, then save) — worth the reasoning tier.
hint = "reasoning"

[tools]
# DELIBERATELY NARROW: propose/revise (validate-only) + read (flows, runs,
# connections, tool catalog) + sandbox dry-run + Composio discovery/connect +
# a confirmed real test-run of a SAVED flow + save_workflow (persist a graph
# onto an EXISTING flow only) + create_workflow/duplicate_flow (persist a
# BRAND NEW flow — always force-disabled at creation, see
# `builder_tools::CreateWorkflowTool`). NO shell, NO file writes, NO channel
# sends, NO composio_execute, and NO flows_set_enabled — the agent can create
# a flow but can never enable one, or perform an arbitrary real integration
# action directly. Composio access is limited to LISTING toolkits/connections,
# raising the inline CONNECT card (an approval-gated OAuth hand-off), and one
# narrow carve-out below.
# `run_flow` executes a flow the user has ALREADY saved to test it — a real
# run, but the prompt requires asking the user to confirm first, and the flow's
# own approval gate still pauses outbound-action nodes. (Named `run_flow`, not
# `run_workflow` — that name belongs to the unrelated legacy skills-workflow
# runner tool, which is registered in the same default tool registry.)
# `get_tool_output_sample` (B12) IS a real Composio call — the one deliberate
# carve-out — but it is hard-gated to Read-scope actions only (regardless of
# the user's scope preference) against an already-connected toolkit, and
# exists solely to sample the real output shape of a source tool whose live
# listing publishes no output schema at all (verified for every GitHub
# action), so a downstream split_out.path is never guessed. See
# `builder_tools.rs`'s module doc.
# `memory` is the single memory tool (`recall` | `fetch` | `learn` |
# `forget`). `omit_memory_context = true` stays set above, so nothing is
# injected automatically — the agent calls `memory` with `action: "recall"`
# when it needs the user's context.
# `read_workflow_resource` fetches a page of the `flow-authoring` builtin skill
# — the reference manual this agent's prompt points at (expression syntax, node
# config, graph shape, reading a dry run). That text used to be ~25 KB of the
# standing prompt, paid on every turn including the ones that wire two nodes
# together; as a skill it is read when it is needed. READ-ONLY, and scoped by
# discovery to installed bundles.
named = [
    "read_workflow_resource",
    "propose_workflow",
    "revise_workflow",
    "edit_workflow",
    "validate_workflow",
    "save_workflow",
    "list_flows",
    "get_flow",
    "get_flow_history",
    "get_flow_run",
    "list_flow_connections",
    "search_tool_catalog",
    "get_tool_contract",
    "get_tool_output_sample",
    "list_agent_definitions",
    "list_connectable_toolkits",
    "list_node_kinds",
    "get_node_kind_contract",
    "dry_run_workflow",
    "list_flow_runs",
    "resume_flow_run",
    "cancel_flow_run",
    "create_workflow",
    "duplicate_flow",
    "run_flow",
    "composio_list_toolkits",
    "composio_list_connections",
    "composio_connect",
    "memory",
]
