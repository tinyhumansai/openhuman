id = "vision_agent"
display_name = "Vision"
when_to_use = "Image-understanding specialist: describe, OCR, read charts, compare images, or locate UI elements when the primary model cannot accept the image. Forward workspace images with image_paths. Read-only."
temperature = 0.3
max_iterations = 6
max_result_chars = 16000
sandbox_mode = "read_only"
omit_identity = true
omit_memory_context = true
omit_safety_preamble = true

# Pinned to a dedicated OpenRouter passthrough model rather than the
# deprecated `hint:vision` (`vision-v1` silently falls back to the chat
# default on managed routes, with no error — regression R4). This exact id
# is in `MANAGED_MULTIMODAL_MODELS`, so `oh_tier_supports_vision` still
# reports it as image-enabled and the turn engine never strips the attached
# image at the vision gate.
[model]
exact = "openrouter/qwen/qwen3.5-flash-02-23"

[tools]
# Attached images arrive inline in the sub-agent's context via the multimodal
# pipeline (no tool call needed to "see" them). These tools cover the extra
# actions a vision task may need, such as inspecting image metadata. These
# tools do not attach additional images to the model's input.
named = [
    "file_read",
    "image_info",
]
