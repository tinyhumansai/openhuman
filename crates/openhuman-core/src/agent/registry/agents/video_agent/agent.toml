id = "video_agent"
display_name = "Video Creator"
delegate_name = "create_video"
when_to_use = "Video-generation specialist: short clips from a prompt, or animate a supplied image. Route make/generate-a-video and animate-this-image requests here. Takes a few minutes, then saves the clip and returns the local path."
temperature = 0.6
max_iterations = 8
agent_tier = "worker"
omit_identity = true
omit_memory_context = true
omit_safety_preamble = false

# Pinned to a dedicated OpenRouter passthrough model rather than the
# deprecated `hint:vision` (regression R4). This exact id is in
# `MANAGED_MULTIMODAL_MODELS`, so it keeps the multimodal tier needed to
# inspect a reference/first-frame image or the returned thumbnail when
# shaping an image-to-video request. Actual video generation goes through
# `media_generate_video`, which defaults to `bytedance/seedance-2.0-mini` on
# OpenRouter — a separate model from the one this agent's own turns run on.
[model]
exact = "openrouter/qwen/qwen3.5-flash-02-23"

[tools]
# media_generate_video submits the generation and returns a saved local path;
# media_list_models surfaces the catalog; image_info / file_read let it inspect
# a reference image before animating it.
named = [
    "media_generate_video",
    "media_list_models",
    "image_info",
    "file_read",
]
