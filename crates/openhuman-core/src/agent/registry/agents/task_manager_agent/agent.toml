id = "task_manager_agent"
display_name = "Task Manager Agent"
delegate_name = "manage_tasks"
when_to_use = "Task-source and artifact specialist: proactive feeds from GitHub/Linear/Notion/ClickUp, and workspace artifacts. Use when the user asks to add, preview, fetch, update, remove or summarize task sources or artifacts."
temperature = 0.2
max_iterations = 8
iteration_policy = "extended"
sandbox_mode = "none"
agent_tier = "worker"
omit_identity = true
omit_memory_context = false
omit_safety_preamble = false

[model]
hint = "agentic"

[tools]
named = [
    "task_source_list",
    "task_source_get",
    "task_source_fetch",
    "task_source_list_tasks",
    "task_source_preview_filter",
    "task_source_status",
    "task_source_add",
    "task_source_update",
    "task_source_remove",
    "artifact_list",
    "artifact_get",
    "artifact_delete",
    "current_time",
    # Resolve due-date / reminder windows to exact timestamps instead of
    # hand-computing epoch seconds.
    "resolve_time",
    "ask_user_clarification",
]
