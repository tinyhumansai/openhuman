# The core package and its implementation live together under `crates/`:
# domain modules live directly under `src/`, alongside backend API and runtime
# composition, and the controller contract (`core::Outcome`, schemas, dispatch).
# The JSON-RPC protocol and server that expose it belong to `openhuman-rpc`,
# which depends on this crate; the typed embedding facade belongs to
# `openhuman-embed`.
# This package is the LIBRARY only. The `openhuman-core` binary, the other
# developer bins, and every root `tests/*.rs` / `examples/*.rs` target belong
# to `crates/openhuman-cli`, which depends on `openhuman-tinyhumans` for the
# backend transport the core itself no longer carries. Auto-discovery stays
# off so a stray file beside this manifest can never become a target here.
[package]
name = "openhuman"
publish = false
version.workspace = true
edition.workspace = true
description = "OpenHuman core business logic and RPC server"
# The crate ships a verbatim GPLv3 `LICENSE` file but carried no `license` key,
# which left the grant ambiguous to every tool that reads metadata rather than
# the file (cargo-deny, crates.io, SBOM generators). Declared explicitly as
# `only` — not `or-later` — to match the `GPL-3.0-only`
# first-party crates in the closure (`tinyagents`).
license.workspace = true
repository.workspace = true
readme = "README.md"
autobins = false
# build.rs globs tests/raw_coverage/*.rs into the single `raw_coverage_all`
# integration target (see tests/raw_coverage_all.rs). Those files used to be ~76
# individual `tests/*.rs` targets, each statically relinking the whole crate —
# collapsing them into one target removes ~75 full-crate link steps per test run.
build = "../../build.rs"
autotests = false
autoexamples = false
autobenches = false

# `cargo machete` reports a dependency as unused when no `use` names it; the
# list is empty because there is nothing to excuse.
[package.metadata.cargo-machete]
ignored = []

[lib]
name = "openhuman_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# The TinyHumans SDK is deliberately NOT a dependency of the core. The core
# reaches the hosted backend only through `backend::transport::BackendTransport`;
# the SDK-backed implementation is `crates/openhuman-tinyhumans`, which hosts
# install at boot. `scripts/assert-shed.sh` / `cargo tree -i tinyhumans-sdk`
# must stay empty for this package.
# tinyflows — host-agnostic workflow engine (typed node graph → validate → compile →
# run on tinyagents). Powers the "Workflows" feature via the seam in
# `crates/openhuman-core/src/tinyflows/` + the `flows::` domain. Pulls tinyagents 2.1 transitively
# (same version OpenHuman uses directly, preserving one trait identity). Published
# on crates.io and patched below to the vendored submodule.
#
# `mock` feature: enables `tinyflows::caps::mock::mock_capabilities()` — the
# deterministic in-memory capability bundle the flows `dry_run_workflow` agent
# tool (Phase 5b) runs a *draft* graph against so the workflow-builder agent can
# self-verify a proposal without any real side effects (no real LLM/tool/HTTP/code).
#
# Optional: exclusive to the default-ON `flows` feature (#4797). A slim build
# without `flows` drops this crate and its `jaq-*` JSON-query stack entirely.
tinyflows = { version = "0.8", features = ["mock"], optional = true }
# Schedule model + pure next-run logic for the `cron::` domain (cron expressions,
# time zones, active hours, cadence floor). Unconditional: the cron scheduler is
# not behind the `flows` gate. Runtime, store and config stay in `cron::`.
tinyflows-schedule = { path = "../../vendor/tinyflows/crates/tinyflows-schedule" }
# The saved-flow catalog and its SQLite backend, split out of this crate's
# `flows::` domain so a second host storing workflows does not have to reinvent
# them. `tinyflows-catalog` is the model (flows, revisions, runs, drafts,
# suggestions, the n8n importer, the save/run safety predicates);
# `tinyflows-sqlite` is one storage backend for it plus the engine checkpointer.
#
# Neither is published, so both are path dependencies into the same vendored
# workspace `tinyflows` itself comes from — one checkout, one `tinyflows`
# package, one `WorkflowGraph` type. Optional and exclusive to `flows` for the
# same reason the engine is.
tinyflows-catalog = { path = "../../vendor/tinyflows/crates/tinyflows-catalog", optional = true }
# The cron job/run store half (`schedule`) is unconditional, so `tinyflows-sqlite`
# is too; only its `catalog` half (which needs the engine) rides the `flows` gate.
tinyflows-sqlite = { path = "../../vendor/tinyflows/crates/tinyflows-sqlite", default-features = false, features = ["schedule"] }
# tinyflows' stores on the storage ports, used instead of the SQLite files when
# a storage backend is configured (`storage`). The cron half (`schedule`) is
# unconditional like cron itself; the catalog, flow state and checkpointer
# (`catalog`, which needs the engine) ride the `flows` gate.
tinyflows-drivers = { path = "../../vendor/tinyflows/crates/tinyflows-drivers", default-features = false, features = ["schedule"] }
# The authoring copilot's words: the `workflow_builder` / `flow_discovery`
# standing archetypes and the turn brief that opens a builder turn. Harness-free
# by construction — it names no tool trait and no model client — so this host
# keeps only the wiring: the `Tool` impls, the agent registry entries, and the
# prompt assembly that appends its own runtime sections.
tinyflows-copilot = { path = "../../vendor/tinyflows/crates/tinyflows-copilot", optional = true }
# TinyAgents — Rust LLM orchestration framework (LangGraph/LangChain-style):
# durable state graphs, agent-loop harness, model/tool registries, REPL +
# `.rag` workflow language. openhuman's agent engine + orchestration run on this
# crate's primitives via the adapter seam in `crates/openhuman-core/src/agent/tinyagents/` (issue
# #4249): every turn drives through the harness; the workflow phase DAG, team
# member runtime, parallel fan-out, and multi-stage delegation run on graphs.
# We wire openhuman's own Provider/Tool, not the removed bundled openai client.
#
# tinyagents was split into a workspace of focused crates (tinyhumansai/tinyagents
# commit 612ea5e "refactor: split tinyagents into focused crates" and follow-on
# work): there is no longer a single `tinyagents` package. openhuman now depends
# directly on the members it actually uses — `tinyagents-harness` (agent loop,
# tools, middleware), `tinyagents-graph` (durable state graphs),
# `tinyagents-registry` (capability/model registry), and
# `tinyagents-session` (durable session history + run ledger, previously gated
# behind this crate's own `sqlite` feature — it is its own always-on crate now).
# The `sqlite` feature is enabled on the harness/graph crates now that openhuman's
# direct rusqlite pin is aligned to 0.40, avoiding duplicate `links = "sqlite3"`
# native bindings. Durable graph checkpoints still use `SqlRunLedgerCheckpointer`
# until the migration re-points those rows to the crate checkpointer.
# The `repl` feature/`rhai` scripting engine no longer exists in the split crates
# (see the tinyagents-harness module list) — the comment that used to describe
# `tinyagents/repl` gating `rhai` in for `flows` builds is stale; `rhai` is pulled
# in by `flows`'s own dependency on the `rhai` crate directly, not through tinyagents.
# None of these crates can be dropped: 26+ domains consume tinyagents.
# `multimodal` is not optional here: `agent::multimodal` is kernel surface —
# web chat and the agent harness both resolve attachment markers on every turn
# — so the gate is on for every OpenHuman build. It costs the dependency graph
# nothing: `base64`, `flate2` and `sha2` are all already resolved in the kernel
# profile, so turning it on moves neither the package count nor the native
# build count that `scripts/check-kernel-floor.sh` ratchets.
#
# A large share of the old crate's re-exported surface (Message, ModelRequest/
# Response, ToolCall/ToolSchema, Usage, embeddings, hosted-provider plumbing)
# moved further upstream still, into `tinyinference` (vendored as a submodule
# of vendor/tinyagents at vendor/tinyagents/vendor/tinyinference) — declared
# below as its own path dependency for the same "one checkout, one type
# identity" reason `tinytools` is.
tinyagents-harness = { path = "../../vendor/tinyagents/crates/tinyagents-harness", features = [
    "sqlite",
    "multimodal",
    "builtin-tools",
] }
# Per-process directory jail (Landlock / Seatbelt / AppContainer / noop). Owned by
# tinybox; OpenHuman keeps only the policy of when to jail (`sandbox::ops`).
tinybox-jail = { path = "../../vendor/tinybox/crates/tinybox-jail" }
# One-shot `docker run --rm` execution for the Docker sandbox; OpenHuman keeps
# only the policy mapping (`sandbox::docker`).
tinybox-docker = { path = "../../vendor/tinybox/crates/tinybox-docker" }
# Quote-aware shell command-string scanners (`tinybox_core::shell::scan`); the
# classification policy built on them stays in `security::policy`.
tinybox-core = { path = "../../vendor/tinybox/crates/tinybox-core" }
tinyagents-definition = { path = "../../vendor/tinyagents/crates/tinyagents-definition" }
# Live (realtime voice) agent sessions: `tinyagents-live` runs a
# `tinyliveagents` provider session (Gemini Live direct/relayed, ElevenLabs
# Agents, the Sarvam cascade) and executes its tool calls through the turn
# harness pipeline. Only the `voice` feature's `voice::live` uses it.
tinyagents-live = { path = "../../vendor/tinyagents/crates/tinyagents-live", optional = true }
tinyagents-graph = { path = "../../vendor/tinyagents/crates/tinyagents-graph", features = [
    "sqlite",
    "storage-drivers",
] }
tinyagents-registry = { path = "../../vendor/tinyagents/crates/tinyagents-registry" }
tinyagents-session = { path = "../../vendor/tinyagents/crates/tinyagents-session", features = ["storage-drivers"] }
# The storage ports and the URL-to-backend facade (`storage` domain). No driver
# by default: the `storage-*` features below add them.
tinystoragedrivers = { path = "../../vendor/tinyagents/vendor/tinystoragedrivers/crates/tinystoragedrivers", default-features = false, features = ["blocking", "secrets"] }
tinyagents-runtime = { path = "../../vendor/tinyagents/crates/tinyagents-runtime" }
tinyagents-orchestration = { path = "../../vendor/tinyagents/crates/tinyagents-orchestration" }
tinyagents-tasks = { path = "../../vendor/tinyagents/crates/tinyagents-tasks" }
tinyinference-core = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice", features = ["schemars"] }
# TinyTools — the tool vocabulary: the `Tool` trait, `ToolResult`, and the
# permission / scope / timeout classifications this host enforces around a call.
#
# Reached through tinyagents' own vendored checkout **on purpose**, not through
# a second `vendor/tinytools` submodule of our own. Two path dependencies on
# the same repository are two distinct packages to cargo, and
# `tinytools::ToolResult` from one would not be the same type as from the
# other — every tool in this crate would stop satisfying the harness's trait,
# with a type error that names the same path twice. tinyagents declares
# `vendor/tinytools/crates/tinytools` relative to itself, so naming that exact
# path here resolves to one package.
#
# No `[patch.crates-io]` entry: the crate is not published, so the path is the
# whole address — the same arrangement as `tinyhumans-sdk` and the `-bus`
# crates. After cloning: `git submodule update --init --recursive vendor/`.
tinytools = { path = "../../vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-agent = { path = "../../vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }
tinytools-std = { path = "../../vendor/tinyagents/vendor/tinytools/crates/tinytools-std" }

# tinyruntime — the runtime router
# (https://github.com/tinyhumansai/tinyruntime). Only the *contract* crate is
# taken here, never the router itself: the router ships as a loadable TinyBus
# module, and a host that also compiled it would carry the download pipeline, the
# worker pool, and their dependency trees for nothing.
#
# `tinyruntime-bus` is deliberately dependency-light — `serde` and `serde_json`
# and nothing else — which is what makes naming the payload types cost this
# manifest almost nothing. The module's own CI asserts it stays that way.
#
# After cloning: `git submodule update --init --recursive vendor/tinyruntime`.
tinyruntime-bus = { path = "../../vendor/tinyruntime/crates/tinyruntime-bus" }
#
# `tinyruntime-pyserver` is the one library crate of that repository the core
# links: the persistent Python worker (spaCy, Kompress) that
# `runtime::python_server` hosts. It is a pure library (no bus, no module), so
# it needs no registry record; it carries only `serde`, `tokio` and `tracing`,
# which this manifest already has. The pin is the tinyruntime module pin plus
# the crate itself; see `scripts/ci/module-pin-exemptions.json`.
tinyruntime-pyserver = { path = "../../vendor/tinyruntime/crates/tinyruntime-pyserver" }

# TinyMemory (https://github.com/tinyhumansai/tinymemory), three crates:
# - `tinymemory-api`: the engine contract (`MemoryEngine`: recall / fetch /
#   store / forget / list / consolidate) and its types. No I/O.
# - `tinymemory-tools`: the agent surface over any engine — the lifecycle this
#   host drives around every turn (`AgentMemory`: start_session, pre_turn,
#   post_turn, recall_for_compaction), the standard `MemoryLayout`, the shared
#   `Brain`, holistic recall (`ContextPack`) and `BackgroundJob`s.
# - `tinymemory-integrations`: everything that touches the outside world — the
#   CortexDB engines (`cortexdb` direct, `tinyhumans` hosted), document
#   conversion and the brain filer, source readers (with the SSRF-guarded
#   network readers), secret/PII scrubbing and the read-only v1 importer.
# `memory::` is the only module that names the engine side.
tinymemory-api = { path = "../../vendor/tinymemory/crates/tinymemory-api" }
tinymemory-tools = { path = "../../vendor/tinymemory/crates/tinymemory-tools" }
tinymemory-integrations = { path = "../../vendor/tinymemory/crates/tinymemory-integrations", default-features = false, features = ["cortex", "brain", "sources-network", "safety", "legacy-import"] }
# tinyconnectors-bus — the OAuth connector wire contract
# (https://github.com/tinyhumansai/tinyconnectors). Payload types and member
# names for the connector surface, with no transport and no behaviour: this
# crate makes calls into the loaded `tinyconnectors` module and compiles none
# of it.
#
tinyconnectors-bus = { path = "../../vendor/tinyconnectors/crates/tinyconnectors-bus" }
# tinyconnectors — the connector module's implementation crate, linked as a
# plain Rust library (never as the loaded module) for its pure, host-agnostic
# helpers: failure classification, action-argument preparation, the daily
# trigger archive, calendar defaults and the task-recency window.
# `default-features = false` drops the `module` feature, so no TinyBus adapter or
# ABI export is compiled into the host (and no second copy of `tinybus` enters
# the graph). Live connector calls still go over the bus to the loaded module.
tinyconnectors = { path = "../../vendor/tinyconnectors/crates/tinyconnectors", default-features = false }


# tinymcp — the Model Context Protocol client, extracted out of this tree
# (https://github.com/tinyhumansai/tinymcp). Owns both transports, the static
# config-declared server set, the dynamic registry with its store, supervisor
# and OAuth, and the write-audit log. What stays here is the host half: the RPC
# surface, the agent-facing tools, and the prompt-injection scan over remote
# tool definitions, which is host policy.
#
# `tinymcp-bus` is the wire contract — payload types and member names, with no
# transport and no runtime. The `schemars` feature is on because this crate
# generates a settings schema for the desktop application from those types
# rather than from a hand-kept copy.
#
# The path dependency on `tinymcp` itself is still the step-one arrangement. The
# registry entry step two calls for now exists — `crates/openhuman-core/src/modules/registry.rs`
# pins the v0.3.6 release — but the host still calls the library directly, because
# `tinymcp-bus` v0.3.6 does not yet publish everything this host reaches for:
# `OAuthComplete`, a member returning the already-exported `ConnectedServerOverview`,
# the boot-connect and reconnect-supervisor passes, the `ServerDetail` /
# `AuthDetection` / `AuthKind` reply types, the registry curation helpers, an error
# anchor for the `McpServerNeedsAuth` classifier coupling test, and
# `render_tool_result` / `redact_endpoint` for the ungated `gitbooks` tool. It also
# needs a per-`data_dir` object seam of the shape `modules::memory` already uses,
# since `mcp::host` keys one store per workspace and a module gets one `data_dir` at
# load. Those are upstream work in tinyhumansai/tinymcp.
#
# Correcting what this comment used to promise: dropping the path dependency does
# NOT take reqwest/rusqlite with it. Measured in the kernel profile, `rusqlite` has
# six parents and `reqwest` ten, so `scripts/dep-sim.py --cut tinymcp` projects the
# entire shed at -1 package / -1 name / 0 native builds — the `tinymcp` package and
# nothing beneath it. The boundary buys compilation isolation, not a dependency shed.
#
# After cloning: `git submodule update --init vendor/tinymcp`.
# `default-features = false` drops the TinyBus adapter: this build calls the
# library directly and has no use for a bus inside it.
tinymcp = { path = "../../vendor/tinymcp/crates/tinymcp", default-features = false, features = [
    "rustls-tls",
    # Server tools as `tinytools::Tool`s over the persistent tool cache. Needs
    # the root `[patch]` that redirects tinymcp's git tinytools to ours.
    "tools",
    # Tool UI rules: widget templates, documents, link classification, and the
    # widget tool-call policy, behind the `mcp_ui` host glue.
    "ui",
] }
tinymcp-bus = { path = "../../vendor/tinymcp/crates/tinymcp-bus", features = ["schemars"] }
# The transport-free channel vocabulary: inbound envelopes, outbound intents,
# the config schema, controller metadata, relay frames and the session-key
# rules. UNCONDITIONAL, and deliberately so — `DomainEvent` embeds
# `ChannelInboundEnvelope`, `config/schema/channels.rs` re-exports the config
# types and `security/pairing.rs` re-exports the pairing helpers, so this
# vocabulary is always-on kernel surface. It costs serde/schemars and nothing
# this build did not already have.
tinychannels-bus = { version = "0.1", path = "../../vendor/tinychannels/crates/tinychannels-bus" }
# `CliChannel` (always compiled) and the channel runtime helpers.
tinychannels-runtime = { version = "0.1", path = "../../vendor/tinychannels/crates/tinychannels-runtime" }
# The provider stack that IMPLEMENTS that vocabulary — Telegram, Discord,
# Slack, IMAP, WhatsApp, the relay transport loop. Optional: it owns the
# `reqwest` / `rusqlite` / `rustls` / `tokio-tungstenite` cohort, which a
# workflow-only build has no use for. Enabled by `channels`, and by `voice`
# for `EmailChannel` alone.
tinychannels = { version = "0.1", features = ["relay-websocket"], optional = true }
# tinybus — the message bus. Owns what `crates/openhuman-core/src/core/event_bus/` used to: the typed
# pub/sub surface (`EventBus`, `EventHandler`, `SubscriptionHandle`), the
# in-process zero-serialization request registry (`NativeRegistry`), and peer
# version negotiation. Vendored as a git submodule beside the other tiny*
# crates and consumed by path.
#
# `DomainEvent` stays here, in `crates/openhuman-core/src/core/events.rs`: the catalog is OpenHuman's
# own vocabulary and a generic bus crate must not know it. tinybus is generic
# over the event type and `DomainEvent` implements `tinybus::Event`.
#
# After cloning: `git submodule update --init vendor/tinybus`.
# `uds` is on so the kernel can join a broker that out-of-process integrations
# are already attached to (`core::bus::init_over_socket`). `cli` is not: the
# `tinybus` binary is a developer tool, not something the kernel links.
#
# The dynamic module loader is NOT enabled here. It arrives through this
# crate's own default-ON `modules` feature, which forwards `tinybus/modules`.
# Enabling it unconditionally would put a `dlopen` loader in the kernel
# profile — `tinybus` is always-on surface, so `--no-default-features
# --features flows` would carry `ureq` and the archive stack for a host that
# never loads a module. The kernel-floor ratchet catches exactly that, and did.
tinybus = { path = "../../vendor/tinybus/crates/tinybus", default-features = false, features = ["macros", "uds"] }
tinysearch-bus = { path = "../../vendor/tinysearch/crates/tinysearch-bus" }
tinycomputer-bus = { path = "../../vendor/tinycomputer/crates/tinycomputer-bus", optional = true }
# Desktop accessibility middleware, linked as a plain library (not through the
# tinycomputer module): the voice pipeline needs focus lookup, paste validation,
# permission checks and the Globe key synchronously and in-process. Deps are
# serde, serde_json and log; `cpal` only via the `inference` gate. The
# submodule pin sits on `oh-accessibility-on-v0.7.0` (v0.7.0 + this crate) — see
# scripts/ci/module-pin-exemptions.json.
tinycomputer-accessibility = { path = "../../vendor/tinycomputer/crates/tinycomputer-accessibility" }
# Portable skill metadata, parsing, discovery, and filesystem hardening.
tinyskills = { path = "../../vendor/tinyskills/crates/tinyskills" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
# (Removed `html2md` dep. dhat-rs profiling on real Gmail inboxes
# showed `html2md::walk` and `html2md::tables::handle` allocating
# ~894 MB peak heap on a 10 KB HTML input from Otter.ai-style emails
# (deeply-nested table-as-layout HTML). Cause: recursive walker holding
# per-frame Vec state across nesting layers + 5 sequential
# `regex::replace_all` passes in `clean_markdown` each producing a
# fresh full-size String. We now use a linear-time tag-and-entity
# stripper (`fast_html_to_text` in
# providers/gmail/post_process.rs) and prefer the email's
# `text/plain` MIME part when available.)
# TLS: rustls only in the base declaration, so Linux/macOS — including the
# headless embedding target (#5046) — link a single TLS stack + cert set
# (Mozilla webpki-roots). Windows re-adds `native-tls` via the
# `[target.'cfg(windows)'.dependencies]` block below (Cargo unions features
# per target), because `crates/openhuman-core/src/tls/mod.rs` deliberately routes the
# Windows client through the SChannel/OS cert store for corporate MITM +
# AV root CAs. So the two TLS backends coexist only on Windows, never on
# the RAM-sensitive platforms.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream", "http2", "multipart", "socks"] }
# Already in-tree via reqwest/hyper; named directly so `IntegrationClient::get_bytes`
# can return `bytes::Bytes` without a copy.
bytes = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1.19"
parking_lot = "0.12"
log = "0.4"
libc = "0.2"
nu-ansi-term = "0.50"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.10"
dirs = "6"
sha2 = "0.10"
# NO `git2` HERE, DELIBERATELY — this crate never touches a repository
# itself, and `git2` sets `links = "git2"`: two majors in one graph is a hard
# cargo error, not a warning.
# Archive handling for the Piper voice installer and the document tools. The
# Node.js and Python toolchain archives are no longer unpacked here — the
# `tinyruntime` module owns that — which is what let `xz2` and its static
# liblzma C build leave this manifest entirely.
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# gzip decoder for the Piper tar.gz binary releases on macOS / Linux. Already
# pulled in transitively by zip's `deflate` feature; declared directly so
# the installer module can `use flate2::read::GzDecoder`.
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1.0"
async-trait = "0.1"
chacha20poly1305 = "0.10"
# Wipe master keys / decrypted secret buffers from memory on drop (audit C9).
# Already present transitively (resolved to 1.8.x via the *-dalek / cipher
# crates); declared directly so the keyring module can `use zeroize::Zeroizing`.
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hex = "0.4"
# The SaaS gateway signature. 0.13 on sha2 0.11, the versions tinychannels-bus
# already brings, so it adds no package to the graph.
hmac = "0.13"
sha2_011 = { package = "sha2", version = "0.11" }
tokio-util = { version = "0.7", features = ["rt", "io"] }
# tokio-tungstenite is declared per-target below so the TLS backend
# (native-tls on Windows, rustls on macOS / Linux) matches the reqwest
# backend selected at each TLS call site.
futures = "0.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
# Validates the user's IANA time zone setting (`Config::time_zone`).
chrono-tz = "0.10"
futures-util = "0.3"
directories = "6"
toml = "1.0"
schemars = "1.2"
tracing = { version = "0.1", default-features = false }
tracing-log = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
tracing-appender = { version = "0.2", optional = true }
urlencoding = "2.1"
thiserror = "2.0"
dotenvy = "0.15"
regex = "1.10"
# Multi-pattern fixed-string DFA matcher used by `routing::quality` for
# refusal/empty-noise detection on local-model responses. Already in the
# dep graph transitively via `regex` (which uses it for literal
# optimization); declared directly here so `openhuman` owns the
# version pin and the import isn't an unstable transitive surface.
aho-corasick = "1.1"
walkdir = "2"
hostname = "0.4.2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"], optional = true }
# HTTP server framework for the domain-owned routes (`/v1`, dictation, the MCP
# HTTP transport). Exclusive to the default-ON `http-server`
# feature (#5048); the JSON-RPC server that mounts them lives in
# `openhuman-rpc`. See the `http-server` feature note below and
# `crates/openhuman-core/src/core/http_server_status.rs`.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }
sentry = { version = "0.47.0", default-features = false, optional = true, features = ["backtrace", "contexts", "panic", "tracing", "debug-images", "httpdate"] }
url = "2"
tempfile = "3"
fs2 = "0.4"
# The scheduler gate's battery/AC probe (`cron::scheduler_gate::signals`),
# behind the `scheduler-gate` feature. CPU sampling uses `sysinfo` above.
starship-battery = { version = "0.12", optional = true }

# The WhatsApp Web provider (and its `whatsapp-rust` / `wacore` / `serde-big-array`
# stack) now lives in the tinychannels crate; the `whatsapp-web` feature forwards
# to `tinychannels/whatsapp-web`.
# TinyDocs — the document wire contract, and nothing else.
#
# `tinydocs-bus` is the whole dependency: the spec types, their size limits,
# the validation rules, the PNG/JPEG header reader, the error vocabulary and
# the member names. It is `serde` + `thiserror` and nothing else — no writer,
# no `tinybus`, no runtime. Synthesis happens in the `tinydocs` TinyBus module
# (`crates/openhuman-core/src/modules/`), so this build carries the shape of a document
# without carrying the code that produces one, which is why `docx-rs`,
# `ppt-rs` and `pdf-extract` are absent from the graph entirely rather than
# merely gated.
#
# Sharing the contract rather than re-declaring it is the point. The specs are
# what an LLM is shown as a JSON tool schema and what the module validates
# against; two definitions of that would drift, and the drift would be a tool
# description promising limits the module does not enforce. This crate carried
# a verbatim copy of the contract for exactly that reason and paid exactly that
# risk — `crates/openhuman-core/src/tools/impl/document/format/` was 1,873 lines that
# differed from `crates/tinydocs-bus/src/` only in doc-link paths.
#
# Vendored as a path dependency like `tinyhumans-sdk`: the crate is not
# published to crates.io, so there is no `[patch.crates-io]` entry for it.
# After cloning: `git submodule update --init vendor/tinydocs`.
#
# Optional: exclusive to the `documents` feature, which is **default-OFF,
# product-ON** — `[features] default` is the contributor set and this is not in
# it; `scripts/ci/product-features.txt` is what the shipped desktop app has, and
# it is. The comment here said "default-ON", which was true before #4919 split
# the two sets and has been wrong since.
tinydocs-bus = { path = "../../vendor/tinydocs/crates/tinydocs-bus", optional = true }

# TinyVoice — the voice wire contract, and nothing else.
#
# Same arrangement as `tinydocs-bus`: member names, the payload types the
# module answers with, and the contract version, at a cost of `serde`. The
# processing lives in the `tinyvoice` TinyBus module, so nothing here decodes
# audio. `crates/openhuman-core/src/modules/voice.rs` used to redeclare these types with a
# comment saying it did so because this crate did not depend on TinyVoice;
# it does now.
#
# After cloning: `git submodule update --init vendor/tinyvoice`.
#
# Optional: exclusive to the `voice` feature — default-OFF, product-ON, the
# same split as `documents` above.
tinyvoice-bus = { path = "../../vendor/tinyvoice/crates/tinyvoice-bus", optional = true }
# The global push-to-talk hotkey listener (`voice::hotkey`) and the `cpal`
# microphone capture (`voice::audio_capture`, `voice::always_on`) live in the
# `tinyvoice` library behind its off-by-default `hotkey` and `capture` features (it owns the
# `rdev` dependency). Linked as a library, not loaded as the module.
tinyvoice = { path = "../../vendor/tinyvoice/crates/tinyvoice", default-features = false, features = ["hotkey", "capture"], optional = true }

# TinyJuice — the compression wire contract, and nothing else.
#
# Same arrangement as `tinydocs-bus` and `tinyvoice-bus`: the payload types, the
# request and response envelopes, the member names and the contract version, at
# a cost of `serde`. The router, the compressors, the CCR cache and the rule
# engine all live in the `tinyjuice` module and are not in this build.
#
# `crates/openhuman-core/src/inference/tokenjuice/types.rs` was a 259-line hand-copy of
# these types headed "Stable wire types shared with the separately compiled
# TinyJuice module" — shared by convention and checked by nobody. It is a
# re-export now.
#
# Not optional: `inference::tokenjuice` is always compiled (the compression
# middleware sits in the agent turn path, which is kernel), so the contract has
# no gate to hang off.
#
# After cloning: `git submodule update --init vendor/tinyjuice`.
tinyjuice-bus = { path = "../../vendor/tinyjuice/crates/tinyjuice-bus" }

# TinyJuice — the engine crate, for its pure content transforms only.
#
# The router, the CCR cache, the rule engine and ranged retrieval stay behind
# the loadable-module boundary: those need the module's state, its disk tier and
# its retrieval markers, and nothing here calls them. What this dependency buys
# is the stateless half — `compressors::html::html_to_markdown`, which `web_fetch`
# runs on every HTML response so the model reads a page's prose, headings and
# links instead of its minified JS.
#
# That transform has no business being reimplemented here: it is content
# handling, TinyJuice owns content handling, and a second copy would drift.
# Reaching it through TinyBus instead would make a core tool's default output
# depend on whether an optional cdylib loaded and on `compaction_enabled`
# (default `false`), which is not a defensible way to decide what a fetched page
# looks like. See `src/inference/tokenjuice/README.md`.
#
# `default-features = false` drops `tinyjuice-treesitter` and with it the three
# tree-sitter grammars — those serve the code compressor, which lives behind the
# module boundary and is not called from here.
#
# The `tinytools` feature adds `tinyjuice::repl::tools`, the `juice_find`,
# `juice_extract` and `juice_summarize` tool declarations. It names tinytools by
# URL; the root `[patch]` redirects that to the copy tinyagents vendors, so
# there is still exactly one `tinytools` package and one `Tool` trait. The CCR
# store those ops read lives in the module, so the host wraps the tools and
# feeds them each original over the bus: see `inference/tokenjuice/repl_tools.rs`.
tinyjuice = { path = "../../vendor/tinyjuice", default-features = false, features = ["tinytools", "host"] }

# TinyHosts — the unified hosting API: one `Host` trait over a hosting provider,
# and the `launch` flow that puts a Next.js application, its database, its
# environment and its domains on it in the one order that works.
#
# The provider vocabulary stops inside the crate. What OpenHuman gets is the
# model — sites, deployments, databases, domains, analytics — so which provider
# a user pastes a key for is a config value here rather than a code path.
#
# Taken with the `vercel` provider only, which is the one that exists.
#
# Vendored as a path dependency like `tinyhumans-sdk`: the crate is not
# published to crates.io, so there is no `[patch.crates-io]` entry for it.
# After cloning: `git submodule update --init vendor/tinyhosts`.
#
# Optional: exclusive to the default-OFF `hosting` feature.
tinyhosts = { path = "../../vendor/tinyhosts", default-features = false, features = ["vercel", "tools"], optional = true }

# TinyWallet — host-agnostic multi-chain wallet primitives. Owns the address
# formats themselves: parsing, validation, and the conversions between their
# encodings for Bitcoin, EVM chains, Solana and Tron. Nothing about "is this a
# well-formed Solana address" is OpenHuman-specific, so the rules live where
# any host can reach them. What stays in `crates/openhuman-core/src/web3/` is everything
# the crate deliberately refuses to own: RPC endpoint resolution, transaction
# assembly and broadcast, and key custody.
#
# Vendored as a path dependency like `tinyhumans-sdk`: the crate is not
# published to crates.io, so there is no `[patch.crates-io]` entry for it.
# After cloning: `git submodule update --init vendor/tinywallet`.
#
# Optional: exclusive to the `web3` feature — OFF in the contributor set
# (`[features] default`) and ON in the product set
# (`scripts/ci/product-features.txt`), so it ships but a bare `cargo check` does
# not pay for it. See the two-set note above `default`.
#
# Taken as `tinywallet-bus`, the contract crate, and NOT the root `tinywallet`
# crate. The root crate is where key derivation, transaction building, signing
# and the chain clients live, and those are the gates that pull the `bitcoin`
# crate and its native secp256k1 build; all of it happens inside the loaded
# `tinywallet` module now, so this binary links none of it. What the contract
# crate carries is exactly what a host still runs itself: the wire types that
# cross the bus, the bus member names, address validation, the EIP-712 and ERC-20
# encoders the x402 payment path builds with, the `Transport` seam this crate
# implements, and the Tron verifier that checks what a node handed back before
# a transaction is sent for signing.
#
# The root crate is still taken under [dev-dependencies], where test fixtures
# derive a known account. Dev-dependency features are not linked into the
# shipped binary, so that does not undo the shed.
tinywallet-bus = { path = "../../vendor/tinywallet/crates/tinywallet-bus", default-features = false, features = ["btc", "evm", "solana", "tron", "keccak", "net", "wire", "eip712", "abi", "tx-codec"], optional = true }
# The x402 payment flow (402 challenge, EVM/Solana payment builders, the
# spending ledger, the `x402_request` tool), moved out of `web3/x402`. The host
# keeps signing, proxy policy and RPC controllers and hands them in as seams.
tinywallet-x402 = { path = "../../vendor/tinywallet/crates/tinywallet-x402", default-features = false, features = ["wire", "pay", "ledger", "tools"], optional = true }
# The wallet engine and the swap/bridge/dapp service, moved out of `web3/`.
# The host implements its seams (signer, accounts, RPC endpoints, quote scope,
# backend) and keeps the controllers, keyring and consent.
tinywallet-web3 = { path = "../../vendor/tinywallet/crates/tinywallet-web3", default-features = false, features = ["tools"], optional = true }


[target.'cfg(windows)'.dependencies]
# Windows: tokio-tungstenite uses native-tls (schannel) so wss://
# connections honor the Windows cert store, including corporate CAs
# installed by AV / TLS-inspection proxies. See run-dev-win.sh notes.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "native-tls"] }
# Windows re-adds reqwest's native-tls backend (dropped from the base decl in
# `[dependencies]`) so `tls::tls_client_builder()` can call `.use_native_tls()`
# and reach the SChannel/OS cert store — same rationale as tokio-tungstenite
# above. Cargo unions these features with the base rustls decl, so on Windows
# reqwest carries both backends; Linux/macOS keep rustls only.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# Win32 surface for host code (e.g. atomic file replace in turn_state). The
# AppContainer jail backend lives in `tinybox-jail` with its own windows-sys.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
# macOS / Linux: keep rustls + Mozilla webpki-roots — the historical
# default. Avoids pulling OpenSSL as a runtime dep on Linux.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
# The TinyMemory reference engine (an in-memory `MemoryEngine`) and the
# behavioural suite every engine must pass. Memory unit tests bind it as the
# engine instead of talking to CortexDB.
tinymemory-api = { path = "../../vendor/tinymemory/crates/tinymemory-api", features = ["conformance"] }
# Turns on `tinyflows-sqlite`'s `test-fixtures` gate for test builds only: the
# flows test suite stages a terminal run flipped back to `running` and a
# `graph_json` column that does not deserialize, neither of which any production
# write path can produce. Declared here rather than in `[dependencies]` so the
# shipped binary never carries those two writers.
tinyflows-sqlite = { path = "../../vendor/tinyflows/crates/tinyflows-sqlite", features = ["test-fixtures"] }
# The document catalog's `*_for_test` fixtures, which the flows store forwards
# in test builds.
tinyflows-drivers = { path = "../../vendor/tinyflows/crates/tinyflows-drivers", default-features = false, features = ["schedule", "test-fixtures"] }
# Test fixtures derive a known account from the BIP-39 vector phrase. Production
# does not derive at all — see the note on the main `tinywallet` entry. Cargo
# does not link dev-dependency features into the shipped binary, so enabling
# `key` here does not put the derivation stack back into the product.
tinywallet = { path = "../../vendor/tinywallet", default-features = false, features = ["key", "btc", "evm", "solana", "tron"] }
# `agent_orchestration::tools::tools_e2e_tests` (a #[cfg(test)] LIB module)
# initialises it; the bins that used to share it live in `crates/openhuman-cli`.
env_logger = "0.11"
# Enable sentry's TestTransport for runtime smoke of the observability
# before_send filter (see tests/observability_smoke.rs). `default-features
# = false` here is load-bearing — sentry's default feature set pulls in
# actix-web / actix-http / actix-server / sentry-actix and ~13 transitive
# crates we never use (and that bloat the dev Cargo.lock noticeably).
# TestTransport only needs the `test` feature.
sentry = { version = "0.47.0", default-features = false, features = ["test"] }
# axum is optional in `[dependencies]` (exclusive to the default-ON
# `http-server` feature, #5048), but ~17 `#[cfg(test)]` modules stand up
# in-process axum mock servers / call `build_core_http_router` regardless of
# the feature set under test. Declaring a plain (non-optional) dev-dep keeps
# those tests compiling in ALL test builds without per-file `#[cfg]` — mirrors
# the `sentry` dual-declaration above. The prod fns those tests exercise are
# still gated, so the *tests* naming them carry `#[cfg(feature = "http-server")]`.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
# `tower` was a plain runtime dep only for its re-exports in the axum server
# path; with `http-server` optional it is test-only (tower::ServiceExt::oneshot
# drives the mock routers), so it lives here as a dev-dep now.
tower = { version = "0.5", default-features = false }
# Mock HTTP server for provider E2E tests (inference_provider_e2e).
wiremock = "0.6"
# `test-util` enables tokio's paused virtual clock (`start_paused`,
# `time::advance`) so the #4270 inference-heartbeat tests assert the periodic
# beat without real-time waits. Test-only — the runtime feature set in
# `[dependencies]` (`full`) intentionally excludes it.
tokio = { version = "1", features = ["test-util"] }
# Property-based testing for adversarial command-classifier and encryption
# round-trip inputs. Version already resolved in Cargo.lock.
proptest = "1"

[features]
# Storage drivers for `[storage] url` / `OPENHUMAN_STORAGE_URL` (see the
# `storage` domain). Memory is always available. Off in the product until a
# desktop domain moves onto the ports; a cloud build turns on `storage-mongodb`.
storage-sqlite = ["tinystoragedrivers/sqlite"]
storage-mongodb = ["tinystoragedrivers/mongodb"]
storage-file = ["tinystoragedrivers/file"]
# THE CONTRIBUTOR SET — not the product set.
#
# This list is what a bare `cargo check`, `cargo test` and rust-analyzer
# compile. It is deliberately SMALLER than what the desktop app ships: the
# product set lives in `scripts/ci/product-features.txt` and is forwarded
# explicitly by `crates/openhuman-app/Cargo.toml`, with
# `scripts/ci/check-feature-forwarding.mjs` asserting the two are equal in both
# directions. Read that file's header before changing either list.
#
# Why the split: the gates left ON below cost almost nothing to compile, so
# keeping them on means `cargo check` and rust-analyzer still typecheck nearly
# all of the tree. The gates turned OFF are the ones that carry the graph —
# web3's ethers/secp256k1 cohort, `documents`' zstd/bzip2 native builds,
# `voice`+`inference`'s cpal/lettre/arboard/enigo/rdev stack and
# `crash-reporting`'s sentry tree. The terminal-specific
# ratatui/crossterm cohort lives in the separate `openhuman-tui` package.
# Turning the core gates off takes a
# bare `cargo check` from 540 packages / 7 native builds down to ~350 / 2, which
# is the inner loop every contributor pays on every edit.
#
# THIS DOES NOT CHANGE WHAT SHIPS. The desktop shell has always set
# `default-features = false` (#1061), so it never inherited this list to begin
# with — that is exactly why the forwarding guard had to exist. What DOES
# change is that a lane relying on default features no longer covers the
# gated-off domains, so every CI lane that builds or tests "the product" now
# passes `--features "$(scripts/ci/product-features.sh)"`. If you add a lane,
# decide which of the two sets it is testing and say so.
# `modules` is in this list because the loadable-module seams (tokenjuice,
# documents, voice, runtimes) are exercised by the default test suite, and it
# costs no new native builds. It matches `scripts/ci/product-features.txt`. This
# does NOT move the kernel floor: that profile is
# `--no-default-features --features flows` and never reads this list.
default = ["media", "skills", "flows", "mcp", "channels", "http-server", "scheduler-gate", "file-logging", "modules"]
# The core's domain-owned HTTP surfaces (#5048): the `/v1` OpenAI-compatible
# router (`inference::http`), the WebSocket dictation handler
# (`voice::streaming`), the `openhuman text-input run` dev server, and the MCP
# Streamable-HTTP transport (`mcp::server::http`, additionally gated by `mcp`).
# The JSON-RPC server that mounts them — `/rpc`, auth, CORS, SSE, Socket.IO,
# the listener — lives in `openhuman-rpc`, whose `server` feature turns this
# gate on. Default-ON; the desktop shell REQUIRES it (see the
# `HTTP_SERVER_COMPILED_IN` compile assert in `crates/openhuman-app/src/lib.rs`).
# Slim / headless-embedding builds opt out via `--no-default-features
# --features "<explicit list without http-server>"`, which drops `axum`; the
# core is then driven over the CLI / native dispatch surface instead.
#
# `web_chat`'s event payload types (`WebChannelEvent`, `TurnUsagePayload`, …)
# stay compiled in BOTH builds, since ~10 always-on domains construct them.
# Likewise `inference::http::types` and `EXTERNAL_OPENAI_COMPAT_PROVIDER` stay
# compiled for the server's auth policy.
# TinyMCP HTTP serving is kept optional with the rest of this server surface.
# Keep vendor/tinymcp pinned to a revision that defines `server-http`.
http-server = ["dep:axum", "tinymcp/server-http"]
# Local audio-device access: the accessibility microphone-permission probe
# (which links `cpal`). The capture stack for voice recording itself is the
# `tinyvoice` library's `capture` feature, enabled by `voice` below. Default-ON. Slim /
# headless builds opt out via `--no-default-features --features "<explicit list
# without inference>"`, which drops the exclusive `cpal` dependency; the
# microphone probe then reports `Unknown`. `voice` requires this gate, so
# building `voice` always pulls `inference` in transitively.
#
# NOTE ON THE NAME (do not "fix" it to `audio`): this gate used to cover the
# bundled whisper.cpp STT engine (`whisper-rs` + the `whisper-rs-sys` CRT
# patch) as well. That engine is gone — STT is now cloud/engine-configurable
# only (`voice_server.stt_engine`, `voice::factory`) — so `cpal` is all that is
# left behind the gate. The gate name stays `inference` because it is forwarded
# by name from `crates/openhuman-app/Cargo.toml`, asserted by `INFERENCE_COMPILED_IN`,
# and referenced from `tinycomputer-accessibility`'s `microphone-probe` feature (forwarded below); renaming it buys
# nothing and would silently drop the microphone probe from the shipped app if
# the forwarding list were not updated in lockstep.
inference = ["tinycomputer-accessibility/microphone-probe"]
# Office-document tools: the `generate_document` and `generate_presentation`
# agent tools, plus PDF text extraction during multimodal file ingest.
# Default-ON.
#
# The synthesis is NOT in this build. All three run in the `tinydocs` TinyBus
# module, downloaded and verified at first use (`crates/openhuman-core/src/modules/`), so
# this gate turns on the tools and the host policy around them — the artifact
# pipeline, the deadlines, image resolution under the security policy — and
# `tinydocs` is here for the wire contract only. `docx-rs`, `ppt-rs` and
# `pdf-extract` are not in the dependency graph in any configuration.
#
# Leaf gate (no stub facade): when off, the two tools are absent from the tool
# list rather than degraded to an error, and PDF ingest degrades the file to a
# reference instead of extracted text
# (`agent::multimodal::extract_pdf_text`). Slim / headless builds opt out via
# `--no-default-features --features "<explicit list without documents>"`.
# `tinymemory-integrations/documents-office`: memory's brain and file sources
# read PDF, DOCX, PPTX and XLSX (memory::convert). Kept behind `documents` so
# the parsers stay off the always-on path (kernel floor).
documents = ["modules", "dep:tinydocs-bus", "tinymemory-integrations/documents-office"]
# Hosting: the `hosting_*` agent tools that put a workspace on a real hosting
# provider — a site, a managed database wired into it, its environment, its
# domains, its deployments and the traffic they served. Default-OFF,
# product-ON: a host with no hosting credential has no use for the tools, and
# an agent that can deploy to the internet is authority a headless embedding
# should have to ask for.
#
# Leaf gate: when off, `openhuman::hosting` is not compiled and the tools are
# absent from the registry rather than degraded to an error. When on, they are
# still only registered once a credential actually resolves — from
# `[hosting].api_key` or the provider's environment variable — because a tool
# that cannot work is worse than a tool that is not there.
hosting = ["dep:tinyhosts"]
# The dynamic module host (`openhuman::modules`): the loader that admits a
# compiled `cdylib` through tinybus's ABI descriptor, manifest, dependency and
# SHA-256 gates, plus the `modules` RPC namespace and the registry of modules
# this build trusts. Default-ON, and implied by every gate whose work happens in
# a module — today that is `documents`.
#
# Off ⇒ the `modules.*` controllers are unregistered (unknown-method over
# `/rpc`, absent from `/schema`) and nothing can load a native module. Forwarding
# `tinybus/modules` here rather than on the dependency itself keeps the loader
# out of the kernel profile, where `tinybus` is always-on: a workflow-only host
# should not carry `ureq` and an archive stack to support a loader it cannot use.
#
# A loaded module is trusted in-process code with this process's privileges, and
# tinybus never unloads one. See `crates/openhuman-core/src/modules/` before adding an entry
# to the registry.
modules = ["tinybus/modules", "dep:tinycomputer-bus"]
# Voice + audio_toolkit domains: STT/TTS providers, the standalone dictation
# server, always-on listening, and podcast audio generation/email delivery.
# Default-ON — the desktop app always ships with voice. Slim / headless builds
# opt out via `--no-default-features --features "<explicit list without voice>"`,
# which also drops the exclusive `lettre` (podcast email) dependency. `hound`
# used to be on that list; WAV framing moved to the `tinyvoice` module, so the
# crate left this graph entirely rather than merely being gated. Composes with the runtime `DomainSet::voice` flag (#4796): the
# feature narrows the compile-time surface, `DomainSet` gates it at runtime.
# Requires `inference` (the microphone-permission probe), so enabling `voice` turns
# `inference` on transitively.
# `arboard`/`enigo` (now behind `tinycomputer-accessibility/paste`) and `tinyvoice` (the `rdev` hotkey listener) join here rather than getting their own gate: their
# only call sites are `tinycomputer_accessibility::paste` (clipboard + synthetic keystrokes to
# insert a dictated transcript) and `voice::hotkey` (the global push-to-talk
# listener), both already `#[cfg(feature = "voice")]`, and nothing outside
# `voice/` reaches them. Worth 17 crates — the largest single shed in the wave —
# because `arboard` alone drags an X11/wayland clipboard stack (11 crates) into
# any build that just wants workflow execution.
voice = [
    "inference",
    # Wake-word gating, command routing and hallucination detection run in the
    # `tinyvoice` module, so the voice domain needs the module host the same way
    # `documents` needs it for `tinydocs`. Without this, `--features voice`
    # alone fails to resolve `openhuman::modules` — which the product build
    # hides, because `documents` turns `modules` on anyway.
    "modules",
    # The member names and payload types the module answers with. Contract
    # only — `serde` and nothing else.
    "dep:tinyvoice-bus",
    "dep:lettre",
    # `voice::server` inserts dictated text through `tinycomputer_accessibility::paste`
    # (clipboard + synthetic keystrokes: `arboard`/`enigo` live behind that feature).
    "tinycomputer-accessibility/paste",
    "dep:tinyvoice",
    # `audio_toolkit::ops` delivers generated podcasts through tinychannels'
    # EmailChannel, so the provider — and therefore the implementation crate —
    # has to exist even in a channels-less build. This is the ONE reason a
    # channels-less build still links the provider stack.
    "dep:tinychannels",
    "tinychannels/email",
    # `voice::live`: live voice agent sessions over tinyagents-live.
    "dep:tinyagents-live",
]
# Web3 family: openhuman::web3 + web3::wallet + web3::x402 — the
# crypto wallet (multi-chain sign/broadcast), the high-level swap/bridge/dapp
# surface, and the x402 machine-payment protocol. Default-ON — the desktop app
# always ships with the wallet. Slim / headless builds opt out via
# `--no-default-features --features "<explicit list without web3>"`, which
# drops the exclusive `bitcoin` (P2WPKH PSBT) + `ethers-core` / `ethers-signers`
# / `coins-bip39` (EVM/mnemonic signing, used by the multi-chain wallet's EVM
# path) dependencies. Composes
# with the runtime `DomainSet::Web3` flag (#4796): the feature narrows the
# compile-time surface, `DomainSet` gates it at runtime.
# `k256` and `coins-bip39` are gone from this list: nothing in the shipped
# binary derives a key or signs with secp256k1 any more — the wallet module
# does both. `k256` is gone entirely; `coins-bip39` is gone entirely
# (the fixtures derive through `tinywallet`'s own copy).
#
# `curve25519-dalek` is gone from this list: the Solana off-curve check that
# derives an Associated Token Account is address arithmetic that now lives in
# `tinywallet-web3` (and `tinywallet-x402`), which own their own copy.
web3 = [
    "dep:tinywallet-bus",
    "dep:tinywallet-x402",
    "dep:tinywallet-web3",
    "modules",
]

# Managed Node.js runtime: `runtime::node` (the client that asks the
# `tinyruntime` module for a toolchain), the `runtime::javascript` language slot
# over it, `runtime::pool::node`, the `node_exec` / `npm_exec` agent tools, and
# the `node_runtime` harness-init step. Default-ON. Slim builds opt out via
# `--no-default-features --features "<list without runtime-node>"`.
#
# This gate no longer sheds a dependency. It used to carry the exclusive `xz2`
# and its static liblzma C build; downloading and unpacking a toolchain moved to
# the `tinyruntime` module, so that native build left this manifest for every
# configuration rather than only for slim ones. What the gate still buys is the
# absence of the tools and controllers themselves.
#
# FACADE + STUB, not a leaf gate. `ShellTool` holds `Option<Arc<NodeBootstrap>>`
# for managed-Node PATH injection and `tools/impl/system/shell.rs` is kernel, so
# deleting the module would take the shell tool with it. `runtime/node/stub.rs`
# carries the `NodeBootstrap` type surface; registration sites (`node_runtime_step`,
# the `javascript` controllers, `node_exec`/`npm_exec`) are leaf-gated at their call
# sites, because registration sites want absence.
#
# The generic native-tool dispatcher (`runtime::node::ops` / `runtime::node::types`)
# is deliberately NOT gated: it backs both the gated `javascript.*` controllers and
# the ungated `flows` `oh:` `NativeToolBackend`, so native flow tools keep working
# when the managed Node runtime is compiled out.
#
# Off-state: `try_cached`/`probe_installed` return `None`, so the shell never
# prepends a managed bin dir — identical to today's `node.enabled = false` path.
runtime-node = []

# Media-generation + image domains: the `media_generate_*` agent tools
# (image/video via OpenRouter through the backend's
# `/agent-integrations/openrouter` proxy) and the `openhuman::image` tool
# contracts scaffold. Default-ON. Slim builds opt out via
# `--no-default-features --features "<explicit list without media>"`.
# Composes with the runtime `DomainSet::media` flag (#4796).
# Enables `tinyagents-harness/media`, which pulls in `tinyinference-image` and
# `tinyinference-video` (the wire contract, job loop and generic tools); both
# are light (serde + the already-shared reqwest), so this remains mostly a
# surface gate. There are no controllers / stores / subscribers tagged `Media`
# (agent tools only), and `openhuman::image` is currently unwired scaffold.
media = ["tinyagents-harness/media"]
# Flows domains: the `flows::` automation surface (saved tinyflows graphs —
# create/run/schedule + the workflow_builder / flow_discovery agents), the
# `tinyflows::` adapter seam, and the `rhai_workflows::` language-workflow tool.
# Default-ON — the desktop app always ships with Workflows. Slim / headless
# builds opt out via `--no-default-features --features "<list without flows>"`,
# which drops `tinyflows` + its `jaq-core`/`jaq-std`/`jaq-json` JSON-query stack
# (the `rhai` scripting engine no longer rides along: tinyagents dropped its
# `repl`/`rlm` features, and nothing here referenced them). Composes with the
# runtime `DomainSet::flows` flag (#4796): the feature narrows the compile-time
# surface, `DomainSet` gates it at runtime.
# NOTE: this gate does NOT drop `tinyagents` itself — 26+ domains consume it.
flows = ["dep:tinyflows", "dep:tinyflows-catalog", "dep:tinyflows-copilot", "tinyflows-drivers/catalog", "tinyflows-sqlite/catalog"]
# Skills domains: `openhuman::skills` (metadata/discovery/install),
# `openhuman::skill_runtime` (SKILL.md execution + the skill_executor agent),
# and `openhuman::skill_registry` (remote catalogs + the skill_setup agent).
# Default-ON — the desktop app always ships with skills. Slim / headless builds
# opt out via `--no-default-features --features "<explicit list without skills>"`.
# Composes with the runtime `DomainSet::skills` flag (#4796): the feature
# narrows the compile-time surface, `DomainSet` gates it at runtime.
#
# The dep list is INTENTIONALLY EMPTY — do not "fix" it. Unlike `voice`
# (`hound`/`lettre`), these domains have no exclusive dependencies: every crate
# they touch (serde, serde_json, tokio, anyhow, async-trait, …) is shared with
# always-on domains, and `runtime_node`/`runtime_python` are used by Agent /
# Flows / Memory too. This gate's value is tool-surface + prompt-bloat +
# startup cost, NOT binary size.
#
# NOTE: `openhuman::skills::types` and `::ops_types` stay compiled even when
# this feature is OFF — `tools::traits` re-exports `ToolResult`/`ToolContent`
# out of `skills::types` and ~236 files consume them, so those inert serde
# types are a type carve-out, not part of the gated behaviour. See
# `crates/openhuman-core/src/skills/stub.rs`.
skills = ["tinyskills/registry"]
# MCP domains, all under the `mcp/` family: `mcp::server` (the `openhuman mcp`
# stdio/HTTP server exposing our tool surface), `mcp::registry` (dynamic
# Smithery installs — SQLite, lifecycle, `mcp_clients` RPC namespace),
# `mcp::audit` (write-audit log), and the static/config-declared server set in
# `mcp::config_servers`. Default-ON — the desktop
# app always ships with MCP. Composes with the runtime `DomainSet::mcp` flag
# (#4796): this feature narrows the compile-time surface, `DomainSet` gates it
# at runtime.
#
# INTENTIONALLY EMPTY — do NOT "fix" this by adding `dep:` entries. There is no
# MCP SDK in this crate: the whole protocol stack is hand-rolled over tokio
# process stdio + reqwest + axum, every one of which is load-bearing for
# non-MCP domains. So this gate drops ~20k LOC and ~19 agent tools but ZERO
# dependencies. The issue-level DoD line claiming it "sheds the MCP SDK /
# transport stack" is superseded by this correction (see AGENTS.md).
#
# NOTE: the family root `pub mod mcp;` and `mcp::http_client` stay ALWAYS
# compiled. `http_client` is a mis-housed shared utility (the gitbooks docs
# tool dials `McpHttpClient`; `core::observability` names
# `McpUnauthorizedError`), and the server/registry/audit stubs need their
# parent compiled. `sanitize` left the family entirely for `util::sanitize` —
# the orchestrator prompt sanitises *skill* descriptions through it. The gate
# follows the real dependency graph, not the directory name.
mcp = []
# Sentry crash/error reporting: the `sentry::init` guard + secret-scrubbing
# `before_send` hook (src/main.rs), the sentry-tracing bridge layer
# (core::logging), the ~24 `before_send` Event classifiers + the two
# `report_*_message` capture paths (core::observability), the session-boundary
# scope binding (credentials::sentry_scope), and the `openhuman sentry-test`
# CLI probe. Default-ON — the desktop app always ships with crash reporting.
# Slim / headless builds opt out via `--no-default-features --features
# "<explicit list without crash-reporting>"`, which drops the exclusive
# `sentry` dependency (and its transitive backtrace/contexts/panic/tracing/
# debug-images/reqwest/rustls stack) from the non-test build.
#
# TYPE CARVE-OUT (see AGENTS.md "Compile-time domain gates"): the sentry-free
# string classifiers (`is_transient_message_failure`,
# `is_insufficient_credits_message`, `contains_transient_transport_phrase`, …)
# and the `report_*_message` / `sentry_scope::{bind,clear}` signatures stay
# compiled in BOTH builds — only the `sentry::`-touching bodies are gated — so
# NO stub file is needed and always-on callers need no per-call `#[cfg]`. When
# off, `report_error_message`/`report_warning_message` still emit their
# `tracing::{error,warn}!` diagnostic, `sentry_tracing_layer()` degrades to a
# no-op `Identity` layer, and `openhuman sentry-test` returns a "built without
# the crash-reporting feature" error.
crash-reporting = ["dep:sentry"]


# Channels domain: `openhuman::channels` (external-messaging providers — Telegram,
# Discord, Slack, Signal, WhatsApp, iMessage, IRC, … — plus the channel runtime,
# controllers, host, proactive messaging and inbound dispatch) together with the
# `webview_notifications` bridge domain. Default-ON — the desktop app always ships with
# channels. Slim / headless builds opt out via `--no-default-features --features
# "<explicit list without channels>"`. Composes with the runtime
# `DomainSet::Channels` flag (#4796): this feature narrows the compile-time
# surface, `DomainSet` gates it at runtime.
#
# This gate now owns the `tinychannels` CRATE, not just two of its providers.
# The three always-on pins that used to make the crate unconditional
# (`config/schema/channels.rs` re-exporting the config types, `DomainEvent`
# embedding `ChannelInboundEnvelope`, `security/pairing.rs` re-exporting the
# pairing helpers) now resolve through `tinychannels-bus`, the transport-free
# contract crate, which stays unconditional. What is left behind this gate is
# the provider stack and the relay transport loop.
#
# It sheds NO dependencies and is not meant to: measured, the kernel profile is
# 288 packages / 270 names / 2 native both before and after, and the package-list
# diff is one line (`tinychannels` out, `tinychannels-bus` in). Every heavy crate
# tinychannels carried is shared with kernel surface. What the gate buys is
# compile surface — ~31.7k lines a channels-less build no longer compiles — plus
# the contract crate the eventual module extraction needs.
#
# ONE caveat, and it is the reason a channels-less product build still links
# the crate: `voice` enables `dep:tinychannels` for `EmailChannel` alone
# (`audio_toolkit::ops` mails generated podcasts). A build with neither
# `channels` nor `voice` drops it entirely. (`whatsapp-web` refines this gate —
# see below — forwarding to the `tinychannels/whatsapp-web` provider feature.)
#
# NOTE: the in-app web chat (`openhuman::web_chat`, RPC namespace `channel`) is
# NOT gated by this feature even though its runtime tag is
# `DomainGroup::Channels` — it is core product surface and stays always
# compiled (decoupled from `channels/` in #5002). The `channels::{traits, cli}`
# carve-outs also stay ungated — `traits` is a 1-line tinychannels re-export and
# `cli::CliChannel` is the dep-free local REPL used by the always-on agent
# harness interactive loop. See AGENTS.md "channels gate" + `channels/mod.rs`.
# The crate itself is now droppable, which it was not before: splitting
# `tinychannels-bus` out moved every always-on pin into a contract crate. That
# is a compile-surface and architecture win, NOT a dependency win — see the
# measured note above before claiming otherwise.
channels = ["dep:tinychannels", "tinychannels/email", "tinychannels/lark"]
# The WhatsApp Web provider now lives in tinychannels; forward to its feature.
# It is a refinement INSIDE the `channels` gate — enabling it pulls in the whole
# channels domain (the provider re-exports live under `channels/providers/`).
whatsapp-web = ["channels", "tinychannels/whatsapp-web"]
# Exposes the destructive `openhuman.test_reset` RPC. Off by default; the E2E
# build (app/scripts/e2e-build.sh) flips it on. Shipped binaries never have
# this feature so the wipe RPC isn't even registered, let alone reachable.
e2e-test-support = []
# Library-side gate for the embedded-RSS benchmark (#5046): the one prompt
# renderer hook in `agent/prompts/render_helpers` (and the mock provider) that
# the benchmark bins need. Default-OFF and absent from
# `scripts/ci/product-features.txt`, so nothing shipped enables it. The
# `rss-bench` / `library-profile` binaries and the `rss-bench-dhat` profiling
# variant live in tinyhumansai/openhuman-benchmarks (`profile/`), which
# enables this gate on the core directly.
rss-bench = []
# Battery/AC probe feeding the scheduler's throttle decision. Default-ON.
# When off there is no hardware probe: `sample_power` reports "on AC, no charge
# signal", which is the same answer the real probe gives on a server or
# container. Consequence to be explicit about — `require_ac_power` and
# `battery_floor` are NOT enforced in such a build. CPU throttling and
# server-mode detection are unaffected.
# Rolling on-disk log files, plus the `log`->`tracing` bridge. Default-ON.
# Two consequences worth being explicit about when it is off:
#   * nothing is written to disk, so a packaged desktop build has no durable
#     log to attach to a support request. stderr and Sentry are unaffected.
#   * `tracing-log` goes with it, so `log::*` records from dependencies stop
#     reaching tracing in EVERY init path — including the stderr-only CLI one,
#     which otherwise has nothing to do with file logging.
# `tracing` and `tracing-subscriber` are NOT part of this gate and stay always-on.
file-logging = ["dep:tracing-appender", "dep:tracing-log"]

scheduler-gate = ["dep:starship-battery"]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# These project-wide shape/documentation lints describe intentional public APIs
# and long-standing module docs. Keep them explicitly baselined so `-D warnings`
# can make every other Clippy and rustc diagnostic a hard failure.
[lints.clippy]
borrowed_box = "allow"
doc_overindented_list_items = "allow"
field_reassign_with_default = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"
while_let_loop = "allow"
