# Virtual workspace root. Members: `crates/openhuman-core` (package `openhuman`,
# the core library), `crates/openhuman-embed` (library facade),
# `crates/openhuman-rpc` (JSON-RPC envelopes, client and server, and the on-disk
# session store hosts install, above the core), `crates/openhuman-tinyhumans`
# (SDK-backed backend transport + login/session ownership for hosts),
# `crates/openhuman-cli` (the `openhuman-core` binary, developer bins and the
# root integration tests), and `crates/openhuman-tui` (terminal client). `crates/openhuman-app` is deliberately excluded: it is its
# own Cargo world with its own lockfile and target directory so that root-only
# Cargo commands don't resolve GTK/WebKit/Tauri, and it must mirror this file's
# `[patch]` tables rather than inherit them. Vendored module workspaces are also
# excluded so their workspace-inherited keys continue to resolve against their
# own roots.
[workspace]
resolver = "2"
members = [
    "crates/openhuman-cli",
    "crates/openhuman-core",
    "crates/openhuman-embed",
    "crates/openhuman-modules-linked",
    "crates/openhuman-rpc",
    "crates/openhuman-tinyhumans",
    "crates/openhuman-tui",
]
exclude = [
    "vendor",
    "worktrees",
    "crates/openhuman-app",
    "app/src-tauri-mobile",
    "packages/tauri-plugin-ptt",
]

[workspace.package]
version = "0.64.20"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/openhuman"

[workspace.dependencies]
# The library chain: core -> embed -> tinyhumans -> rpc -> app/cli/tui. Hosts
# name `openhuman-rpc` only (`scripts/ci/check-crate-chain.mjs`). There is no
# `openhuman-core` entry on purpose: one spelled here carried the core's whole
# `default` feature set into whichever member named it.
openhuman-rpc = { path = "crates/openhuman-rpc", default-features = false }
openhuman-embed = { path = "crates/openhuman-embed", default-features = false }
openhuman-tinyhumans = { path = "crates/openhuman-tinyhumans", default-features = false }
tinyagents-hooks = { path = "vendor/tinyagents/crates/tinyagents-hooks", default-features = false }
tinyagents-harness-tools = { path = "vendor/tinyagents/crates/tinyagents-harness-tools", default-features = false }

# Patches are workspace-root settings; Cargo ignores them in member manifests.
[patch."https://github.com/tinyhumansai/tinytools"]
# tinymcp's `tools` feature names tinytools by git rev so it can be built on its
# own. Redirect it to the copy tinyagents vendors — the one the harness and
# every host tool link — so there is exactly one `tinytools` package and one
# `Tool` trait. Without this, MCP tools would not satisfy the harness's trait.
tinytools = { path = "vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-agent = { path = "vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }

[patch."https://github.com/tinyhumansai/tinybus"]
# tinystoragedrivers-bus (and tinywallet, which names tinybus by git rev) name
# tinybus by git. Redirect them to the in-tree copy so the graph holds exactly
# one `tinybus` (one `Interface`, one `Connection`) and one module SDK instead of
# a second set compiled only for the storage wire types.
tinybus = { path = "vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module" }

[patch."https://github.com/senamakel/tinybus"]
# The v2 storage and TinyBox modules depend on the migration fork URL. Patch
# that source identity to the same checkout as the canonical dependency above
# so all bus interfaces share one Rust type identity.
tinybus = { path = "vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module" }

[patch."https://github.com/tinyhumansai/tinystoragedrivers"]
# Both canonical and fork module manifests can name TSD by Git. Resolve both
# source identities to the one editable fork checkout below so every module
# shares the same v2 types and bus contracts.
tinystoragedrivers = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers" }
tinystoragedrivers-api = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-api" }
tinystoragedrivers-blob = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-blob" }
tinystoragedrivers-bus = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-connect = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-connect" }
tinystoragedrivers-document = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-document" }
tinystoragedrivers-kv = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-kv" }
tinystoragedrivers-queue = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-queue" }
tinystoragedrivers-secrets = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-secrets" }
tinystoragedrivers-testkit = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-testkit" }
tinystoragedrivers-types = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-types" }

[patch."https://github.com/senamakel/tinystoragedrivers"]
tinystoragedrivers = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers" }
tinystoragedrivers-api = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-api" }
tinystoragedrivers-blob = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-blob" }
tinystoragedrivers-bus = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-connect = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-connect" }
tinystoragedrivers-document = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-document" }
tinystoragedrivers-kv = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-kv" }
tinystoragedrivers-queue = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-queue" }
tinystoragedrivers-secrets = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-secrets" }
tinystoragedrivers-testkit = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-testkit" }
tinystoragedrivers-types = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers-types" }

[patch."https://github.com/tinyhumansai/tinyinference"]
# tinycomputer depends on the Jev client by git; resolve it to the vendored copy.
tinyinference-decisions = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-decisions" }
tinyinference-core = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }

[patch.crates-io]
# Module crates name TinyAgents by version (with a nested-path patch of their
# own for standalone builds); resolve those names to the one copy the host uses.
tinyagents-live = { path = "vendor/tinyagents/crates/tinyagents-live" }
tinyagents-harness = { path = "vendor/tinyagents/crates/tinyagents-harness" }
tinyagents-hooks = { path = "vendor/tinyagents/crates/tinyagents-hooks" }
tinytools = { path = "vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinybus = { path = "vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module" }
tinyinference-core = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }
tinyflows = { path = "vendor/tinyflows/crates/tinyflows" }
tinychannels = { path = "vendor/tinychannels" }
tiny-artifacts = { path = "vendor/tiny-artifacts/crates/tiny-artifacts" }

# Emit enough release DWARF for server-side Sentry symbolication while keeping
# shipped binaries small. The CI profile deliberately disables LTO/debug info.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.ci]
inherits = "release"
opt-level = 1
codegen-units = 16
lto = false
incremental = false
strip = true
debug = false

[profile.dev.package."*"]
debug = false

# Module admission hashes the host executable (tinybus `attach_linked`), once
# per process. nextest runs every test in its own process, so an unoptimised
# SHA-256 over a ~500 MB test binary cost ~10 s per module-backed test. Keep
# in sync with the other workspace manifest.
[profile.dev.package.sha2]
opt-level = 3
