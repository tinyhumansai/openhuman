---
# Deployment workflow for OpenHuman
# Handles deployment of both the Rust core (openhuman-core CLI) and the React + Tauri desktop app.
#
# This workflow:
# - Validates the environment and build prerequisites
# - Compiles the Rust core + CLI binaries
# - Builds the React frontend + Tauri desktop bundles (macOS, Linux, Windows)
# - Stages artifacts for distribution
# - Notarizes macOS bundles (if required)
# - Publishes release assets and Docker images
#
# Triggers:
# - Manual dispatch for on-demand deployments (specify environment: staging/production)
# - Can also be triggered from release workflows as a reusable workflow
#
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment (staging | production)
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      skip_tests:
        description: Skip pre-deployment tests (use with caution)
        required: false
        type: boolean
        default: false
      deploy_platforms:
        description: |
          Platforms to deploy (comma-separated).
          Options: macos-arm64, macos-x64, linux-x64, linux-arm64, windows-x64, docker
        required: false
        type: string
        default: "macos-arm64,macos-x64,linux-x64,windows-x64,docker"

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tinyhumansai/openhuman-core
  NODE_VERSION: 24.x
  RUST_VERSION: 1.93.0

jobs:
  # =========================================================================
  # Phase 0: Validate deployment context
  # =========================================================================
  validate:
    name: Validate deployment context
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    outputs:
      platforms: ${{ steps.platforms.outputs.list }}
      ref: ${{ steps.context.outputs.ref }}
      version: ${{ steps.context.outputs.version }}
      short_sha: ${{ steps.context.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve deployment context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          
          # Extract version from package.json
          VERSION=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("app/package.json")).version)')
          SHORT_SHA="${GITHUB_SHA:0:12}"
          
          echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          
          echo "[deploy] environment=${{ inputs.environment }}"
          echo "[deploy] ref=${GITHUB_REF_NAME}"
          echo "[deploy] version=${VERSION}"
          echo "[deploy] short_sha=${SHORT_SHA}"

      - name: Parse platform filters
        id: platforms
        shell: bash
        env:
          DEPLOY_PLATFORMS: ${{ inputs.deploy_platforms }}
        run: |
          # Default to all platforms if not specified
          PLATFORMS="${DEPLOY_PLATFORMS:-macos-arm64,macos-x64,linux-x64,linux-arm64,windows-x64,docker}"
          echo "list=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "[deploy] platforms=${PLATFORMS}"

      - name: Validate prerequisites
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          
          case "$ENVIRONMENT" in
            staging|production)
              echo "[deploy] Valid environment: $ENVIRONMENT"
              ;;
            *)
              echo "[deploy] ERROR: Invalid environment '$ENVIRONMENT'"
              exit 1
              ;;
          esac

  # =========================================================================
  # Phase 1: Pre-deployment tests (optional)
  # =========================================================================
  pre-checks:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (TypeScript)
        run: pnpm compile
        continue-on-error: true

      - name: Lint
        run: pnpm lint
        continue-on-error: true

  # =========================================================================
  # Phase 2: Build Rust core binaries
  # =========================================================================
  build-rust-core:
    name: Build Rust core (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform_filter: linux-x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform_filter: linux-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            platform_filter: windows-x64
          - target: aarch64-apple-darwin
            runner: macos-latest
            platform_filter: macos-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            platform_filter: macos-x64
    if: contains(needs.validate.outputs.platforms, matrix.platform_filter)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build openhuman-core binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OPENHUMAN_BUILD_SHA: ${{ needs.validate.outputs.short_sha }}
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path Cargo.toml \
            --release \
            --target "$TARGET" \
            --bin openhuman-core
          echo "[build] openhuman-core compiled for $TARGET"

      - name: Stage core binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/core
          
          # Determine binary name based on platform
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="openhuman-core.exe"
          else
            BIN_NAME="openhuman-core"
          fi
          
          cp "target/$TARGET/release/$BIN_NAME" "artifacts/core/$BIN_NAME"
          ls -lh "artifacts/core/$BIN_NAME"

      - name: Upload core binary
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: artifacts/core/
          retention-days: 7

  # =========================================================================
  # Phase 3: Build desktop bundles (Tauri + React)
  # =========================================================================
  build-desktop:
    name: Build desktop (${{ matrix.settings.artifact_suffix }})
    runs-on: ${{ matrix.settings.platform }}
    needs: [validate]
    environment: ${{ inputs.environment || 'staging' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            artifact_suffix: aarch64-apple-darwin
            platform_filter: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            artifact_suffix: x86_64-apple-darwin
            platform_filter: macos-x64
          - platform: ubuntu-24.04
            args: --target x86_64-unknown-linux-gnu --bundles deb appimage
            target: x86_64-unknown-linux-gnu
            artifact_suffix: ubuntu
            platform_filter: linux-x64
          - platform: ubuntu-24.04-arm
            args: --target aarch64-unknown-linux-gnu --bundles deb appimage
            target: aarch64-unknown-linux-gnu
            artifact_suffix: ubuntu-arm64
            platform_filter: linux-arm64
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows
            platform_filter: windows-x64
    if: contains(needs.validate.outputs.platforms, matrix.settings.platform_filter)
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENHUMAN_TELEGRAM_BOT_USERNAME: ${{ vars.OPENHUMAN_TELEGRAM_BOT_USERNAME }}
      VITE_TELEGRAM_BOT_USERNAME: ${{ vars.OPENHUMAN_TELEGRAM_BOT_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set Xcode version (macOS)
        if: matrix.settings.platform == 'macos-latest'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ (matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin') || matrix.settings.target }}

      - name: Install Tauri dependencies (Ubuntu)
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf cmake libasound2-dev libxdo-dev libxtst-dev libx11-dev libxi-dev \
            libevdev-dev libssl-dev libclang-dev desktop-file-utils \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libatspi2.0-0 libxshmfence1 libu2f-udev

      - name: Cache Cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ matrix.settings.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-${{ matrix.settings.target }}-

      - name: Cache CEF distribution
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/tauri-cef
            ~/.cache/tauri-cef
            ~/AppData/Local/tauri-cef
          key: cef-${{ matrix.settings.target }}-${{ hashFiles('app/src-tauri/Cargo.toml') }}
          restore-keys: |
            cef-${{ matrix.settings.target }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop application
        shell: bash
        working-directory: app
        env:
          BASE_URL: ${{ inputs.environment == 'production' && 'https://api.tinyhumans.ai/' || 'https://staging-api.tinyhumans.ai/' }}
          OPENHUMAN_APP_ENV: ${{ inputs.environment || 'staging' }}
          VITE_OPENHUMAN_APP_ENV: ${{ inputs.environment || 'staging' }}
          VITE_BUILD_SHA: ${{ needs.validate.outputs.short_sha }}
          SENTRY_RELEASE: openhuman@${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.short_sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_REACT }}
          VITE_SENTRY_DSN: ${{ vars.OPENHUMAN_REACT_SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WITH_UPDATER: "true"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.settings.platform == 'macos-latest' && '10.15' || '' }}
        run: |
          set -euo pipefail
          pnpm tauri:ensure
          
          # Handle Linux AppImage build separately due to lib4bin ldd resolution
          if [ "${{ runner.os }}" = "Linux" ]; then
            NODE_OPTIONS="--max-old-space-size=8192" cargo tauri build \
              --no-bundle ${{ matrix.settings.args }}
            CEF_LIB_DIR="$(find "$HOME/.cache/tauri-cef" -name libcef.so -printf '%h\n' 2>/dev/null | head -1)"
            if [ -z "$CEF_LIB_DIR" ]; then
              echo "::error::libcef.so not found; cannot satisfy lib4bin ldd resolution."
              exit 1
            fi
            export LD_LIBRARY_PATH="$CEF_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          
          NODE_OPTIONS="--max-old-space-size=8192" cargo tauri build ${{ matrix.settings.args }}
          echo "[build] Desktop application compiled for ${{ matrix.settings.target }}"

      - name: Sign and notarize macOS bundle
        if: matrix.settings.platform == 'macos-latest' && inputs.environment == 'production'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Validation
          for var in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing macOS signing secret: $var"
              exit 1
            fi
          done
          
          echo "[deploy] Notarizing macOS bundle..."
          # Import certificate (implementation depends on your notarization setup)
          # This is a placeholder — integrate with your actual macOS signing pipeline

      - name: Stage desktop artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.settings.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop
          
          # Copy bundled artifacts to staging directory
          if [ -d "app/src-tauri/target/$TARGET/release/bundle" ]; then
            cp -r app/src-tauri/target/$TARGET/release/bundle/* artifacts/desktop/
          fi
          
          find artifacts/desktop -type f -exec ls -lh {} \;

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.settings.artifact_suffix }}
          path: artifacts/desktop/
          retention-days: 7

  # =========================================================================
  # Phase 4: Build and push Docker image
  # =========================================================================
  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [validate]
    environment: ${{ inputs.environment || 'staging' }}
    if: contains(needs.validate.outputs.platforms, 'docker')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }}
            type=sha,prefix=${{ inputs.environment }}-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log Docker image info
        run: |
          echo "[deploy] Docker image built and pushed:"
          echo "  Repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "  Tags: ${{ steps.meta.outputs.tags }}"

  # =========================================================================
  # Phase 5: Publish release assets
  # =========================================================================
  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [validate, build-rust-core, build-desktop, build-docker]
    if: always() && needs.validate.result == 'success'
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist/
          find . -type f \( -name "*.exe" -o -name "*.app" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "openhuman-core*" \) | while read f; do
            sha256sum "$f" >> CHECKSUMS.txt
          done
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        if: inputs.environment == 'production'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          release_name: OpenHuman v${{ needs.validate.outputs.version }}
          body: |
            # OpenHuman v${{ needs.validate.outputs.version }}
            
            **Build Info:**
            - Commit: ${{ github.sha }}
            - Environment: ${{ inputs.environment }}
            - Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
            
            **Checksums:** See attached CHECKSUMS.txt file.
            
            **Release Assets:**
            - Desktop applications (macOS, Linux, Windows)
            - CLI binaries (openhuman-core)
            - Docker image (ghcr.io/${{ env.IMAGE_NAME }}:v${{ needs.validate.outputs.version }})
          draft: false
          prerelease: ${{ inputs.environment == 'staging' }}

      - name: Upload release assets
        if: inputs.environment == 'production'
        shell: bash
        run: |
          set -euo pipefail
          echo "[deploy] Release assets prepared in dist/"
          find dist/ -type f | head -20

  # =========================================================================
  # Phase 6: Post-deployment verification
  # =========================================================================
  verify-deployment:
    name: Verify deployment
    runs-on: ubuntu-latest
    needs: [validate, publish-release]
    if: always()
    steps:
      - name: Check deployment status
        shell: bash
        run: |
          set -euo pipefail
          echo "[deploy] Deployment verification:"
          echo "  Environment: ${{ inputs.environment }}"
          echo "  Version: ${{ needs.validate.outputs.version }}"
          echo "  Short SHA: ${{ needs.validate.outputs.short_sha }}"
          echo "  Platforms: ${{ needs.validate.outputs.platforms }}"
          
          if [ "${{ needs.publish-release.result }}" = "success" ]; then
            echo "  Status: ✓ SUCCESS"
          else
            echo "  Status: ✗ PARTIAL (some artifacts may have failed)"
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** ${{ needs.validate.outputs.platforms }}" >> $GITHUB_STEP_SUMMARY
