---
name: E2E Playwright

on:
  workflow_dispatch: {}

permissions:
  # `actions: read` lets scripts/ci-cancel-aware.sh poll the run status so
  # cancelled builds inside container jobs stop themselves (docker exec
  # swallows the runner's signals).
  actions: read
  contents: read
  packages: read

env:
  # Consumed by scripts/ci-cancel-aware.sh's cancellation watchdog.
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-playwright:
    name: E2E (Playwright / web lane)
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest
    # The complete serial web suite currently takes about 45 minutes on the
    # shared runner; keep the standalone diagnostic workflow aligned with the
    # 90-minute budget used by CI Full.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/openhuman-app -> target
          cache-on-failure: true
          key: e2e-playwright-linux

      - name: Install JS dependencies
        run: bash scripts/ci-cancel-aware.sh pnpm install --frozen-lockfile

      - name: Ensure .env exists for E2E build
        run: |
          touch .env
          touch app/.env

      - name: Install native test modules
        run: |
          # tinybus validates every directory ancestor. GitHub mounts the
          # checkout as the host runner uid while this container runs as root,
          # so keep native fixtures in a root-owned, ephemeral tree.
          module_root="/opt/openhuman-test-modules/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          juice_dir="$module_root/tinyjuice"
          connectors_dir="$module_root/tinyconnectors"
          juice_archive="$juice_dir/tinyjuice-module-0.5.2-ubuntu-22.04-x86_64.tar.gz"
          rm -rf "$juice_dir" "$connectors_dir"
          mkdir -p "$juice_dir" "$connectors_dir"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/tinyhumansai/tinyjuice/releases/download/v0.5.2/$(basename "$juice_archive")" \
            --output "$juice_archive"
          echo "1a9bc9479ce51c87d82a6f145408cfcbe7d06de4613b0ca7cec1fd04bbc2b5b5  $juice_archive" \
            | sha256sum --check
          tar --no-same-owner -xzf "$juice_archive" -C "$juice_dir"
          bash scripts/ci-cancel-aware.sh cargo build --release \
            --manifest-path vendor/tinyconnectors/crates/tinyconnectors/Cargo.toml
          cp vendor/tinyconnectors/target/release/libtinyconnectors.so \
            "$connectors_dir/libtinyconnectors.so"
          echo "TINYJUICE_TEST_MODULE=$juice_dir/libtinyjuice_module.so" >> "$GITHUB_ENV"
          echo "TINYCONNECTORS_TEST_MODULE=$connectors_dir/libtinyconnectors.so" >> "$GITHUB_ENV"

      - name: Build Playwright web E2E bundle + standalone core
        run: bash scripts/ci-cancel-aware.sh pnpm --filter openhuman-app test:e2e:web:build

      - name: Install Playwright Chromium dependencies
        run: bash scripts/ci-cancel-aware.sh pnpm --filter openhuman-app exec playwright install-deps chromium

      - name: Install Playwright Chromium headless shell
        run: bash scripts/ci-cancel-aware.sh pnpm --filter openhuman-app exec playwright install chromium-headless-shell

      - name: Run Playwright web E2E suite
        env:
          OPENHUMAN_WORKSPACE: ${{ runner.temp }}/openhuman-playwright-workspace
        run: |
          mkdir -p "$OPENHUMAN_WORKSPACE"
          workspace_root="$OPENHUMAN_WORKSPACE"
          # These route-only files each create a browser context. Running them
          # together made the second bootstrap push the core to 929 MiB RSS,
          # where the hosted runner kills it without a Rust error. Give each
          # one its own core, then omit their titles from the regular matrix.
          export OPENHUMAN_WORKSPACE="$workspace_root/connections-aliases"
          mkdir -p "$OPENHUMAN_WORKSPACE"
          bash scripts/ci-cancel-aware.sh bash app/scripts/e2e-web-session.sh \
            test/playwright/specs/connections-tab-aliases.spec.ts

          export OPENHUMAN_WORKSPACE="$workspace_root/connections-deeplinks"
          mkdir -p "$OPENHUMAN_WORKSPACE"
          bash scripts/ci-cancel-aware.sh bash app/scripts/e2e-web-session.sh \
            test/playwright/specs/connections-tab-deeplinks.spec.ts

          # The Skills catalog tests intentionally start real connector-backed
          # discovery. On hosted runners, keeping that native module alive
          # across the next browser context exhausts the core process. Run
          # every assertion with a new core instead of dropping coverage.
          skills_index=0
          while IFS= read -r skills_test; do
            export OPENHUMAN_WORKSPACE="$workspace_root/skills-$skills_index"
            mkdir -p "$OPENHUMAN_WORKSPACE"
            bash scripts/ci-cancel-aware.sh bash app/scripts/e2e-web-session.sh \
              test/playwright/specs/skills-search-install.spec.ts \
              -g "$skills_test"
            skills_index=$((skills_index + 1))
          done <<'EOF'
          a burst of typing issues ONE catalog search
          a pause between words issues a second search
          a query with no matches leaves no catalog rows
          the typed text is preserved in the box while results load
          offers Install, and the button is enabled before it is pressed
          disables the button and shows Installing while the RPC is in flight
          a failed install re-enables the button rather than stranding it
          EOF

          # Each remaining shard gets a fresh standalone core. Keep the
          # shard's persisted state fresh too: reusing a workspace silently
          # carries every prior shard's transcripts and memory tree into the
          # next core process.
          for shard_index in $(seq 1 64); do
            shard="$shard_index/64"
            export OPENHUMAN_WORKSPACE="$workspace_root/shard-$shard_index"
            mkdir -p "$OPENHUMAN_WORKSPACE"
            bash scripts/ci-cancel-aware.sh bash app/scripts/e2e-web-session.sh \
              --shard="$shard" \
              --grep-invert='Connections (aliases|deep links)|Skills explorer'
          done

      - name: Pack Playwright E2E failure artifacts
        if: failure()
        run: |
          mkdir -p .ci/artifacts
          tar -czf .ci/artifacts/openhuman-playwright-failure-logs.tar.gz \
            -C "$OPENHUMAN_WORKSPACE" .
        env:
          OPENHUMAN_WORKSPACE: ${{ runner.temp }}/openhuman-playwright-workspace

      - name: Upload Playwright E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-failure-logs-${{ github.run_id }}
          path: .ci/artifacts/openhuman-playwright-failure-logs.tar.gz
          retention-days: 7
          if-no-files-found: ignore
