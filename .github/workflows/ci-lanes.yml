---
# CI lanes — the shared body behind ci-fast.yml (org members, EX63 microVMs)
# and ci-fast-hosted.yml (everyone else, GitHub-hosted runners).
#
# Both profiles run the same lane plan (scripts/ci/self-hosted/lanes-plan.mjs):
# every check ci-lite.yml runs, grouped into lanes that execute in parallel,
# with changed-line coverage enforced at >= 80% by the same diff-cover gate.
#
#   ex63    one job on one throwaway Firecracker microVM (runner group
#           `openhuman-ex63`, host code in tinyhumansai/gh-hosted-runner). All
#           lanes run at once; target dirs live on the per-job scratch disk;
#           sccache, cargo and pnpm caches live on a 10 GB capped cache disk.
#   hosted  the same lanes split over a few GitHub-hosted jobs sized to fit
#           those runners, with GitHub's Actions cache.
#
# Area flags pick whole suites. Nothing here narrows a suite to changed files.
name: CI Lanes

on:
  workflow_call:
    inputs:
      profile:
        description: "ex63 or hosted"
        type: string
        required: true
      pr-number:
        type: number
        required: true
      base-ref:
        type: string
        required: true

defaults:
  run:
    shell: bash

env:
  # Consumed by scripts/ci-cancel-aware.sh's cancellation watchdog.
  GH_TOKEN: ${{ github.token }}
  PR_TITLE: ${{ github.event.pull_request.title }}

jobs:
  # ── ex63: the whole CI in one job on one microVM ────────────────────────────
  ex63:
    name: CI Fast (EX63)
    if: inputs.profile == 'ex63'
    runs-on: [self-hosted, openhuman-ex63]
    timeout-minutes: 120
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ inputs.pr-number }}/merge
          # Full history: the module-pin monotonicity check and diff-cover
          # both compare against the base branch.
          fetch-depth: 0
          # Submodules come from the step below: only the ones a build reads,
          # fetched in parallel (checkout fetches every nested one serially).
          submodules: false
          persist-credentials: false
          # Deliberate. This job only runs when ci-fast.yml's route job (run
          # from main, never from the PR) found the PR author and pusher to be
          # org members, and only on the `openhuman-ex63` runner group, which
          # admits nothing but ci-fast.yml / ci-lanes.yml at refs/heads/main.
          # The token is read-only, no secrets reach this job, and each job
          # runs in a throwaway microVM whose supervisor re-checks membership.
          # Without the opt-in, checkout@v7 refuses every fork PR here.
          allow-unsafe-pr-checkout: true

      - name: Check out submodules
        run: bash scripts/ci/checkout-submodules.sh

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/ci-paths-filter.yml
          base: ${{ inputs.base-ref }}

      - name: Install jq for release-script tests
        if: steps.filter.outputs.scripts == 'true'
        env:
          JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          JQ_SHA256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
        run: |
          if command -v jq >/dev/null; then
            exit 0
          fi
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::no jq on this runner and no pinned build for $(uname -m)"
            exit 1
          fi
          bin="$RUNNER_TEMP/jq-bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$bin/jq" "$JQ_URL"
          echo "$JQ_SHA256  $bin/jq" | sha256sum -c -
          chmod +x "$bin/jq"
          "$bin/jq" --version
          echo "$bin" >> "$GITHUB_PATH"

      # One step per lane: `Start lanes` launches every lane in the background
      # (they still run in parallel); each `Lane:` step streams its own lane's
      # log live and passes or fails on that lane alone; `Lane summary` waits
      # for the whole run and carries the overall result. `!cancelled()` keeps
      # a red lane from hiding the lanes after it.
      # The embed-consumer bootstrap uses stdlib tomllib (Python >= 3.11).
      # Both runner profiles must use the same interpreter before spawning lanes.
      # It is handed to the lanes explicitly (OPENHUMAN_CI_PYTHON) rather than
      # exported: an exported toolcache PATH/LD_LIBRARY_PATH leaks into the
      # Rust tests, whose agent shell keeps PATH but not LD_LIBRARY_PATH, so a
      # PATH-resolved python3 then cannot load libpython.
      - name: Setup Python for lanes
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          update-environment: false

      - name: Start lanes
        id: lanes
        env:
          CI_AREA_FRONTEND: ${{ steps.filter.outputs.frontend }}
          CI_AREA_I18N: ${{ steps.filter.outputs.i18n }}
          CI_AREA_DOCS: ${{ steps.filter.outputs.docs }}
          CI_AREA_RUST_CORE: ${{ steps.filter.outputs['rust-core'] }}
          CI_AREA_RUST_TAURI: ${{ steps.filter.outputs['rust-tauri'] }}
          CI_AREA_SCRIPTS: ${{ steps.filter.outputs.scripts }}
          CI_AREA_INVENTORY: ${{ steps.filter.outputs.inventory }}
          CI_AREA_TOOLCHAIN_IMAGE: ${{ steps.filter.outputs['toolchain-image'] }}
          CI_AREA_INSTALL_PS1: ${{ steps.filter.outputs.install_ps1 }}
          CI_AREA_STORAGE: ${{ steps.filter.outputs.storage }}
          OPENHUMAN_CI_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/ci/self-hosted/lanes.mjs --profile ex63 --detach

      - name: "Lane: static checks"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'static') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait static

      - name: "Lane: frontend checks"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'frontend') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait frontend

      - name: "Lane: frontend tests (vitest + coverage)"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'frontend-tests') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait frontend-tests

      - name: "Lane: Rust core coverage"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'rust-cov') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait rust-cov

      - name: "Lane: Rust lint + crate tests"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'rust-lint') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait rust-lint

      - name: "Lane: Rust gates-off smoke"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'rust-gates-off') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait rust-gates-off

      - name: "Lane: Tauri clippy + coverage"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'tauri') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait tauri

      - name: "Lane: storage drivers (sqlite + file)"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'storage-drivers') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait storage-drivers

      - name: "Lane: install.ps1 (Pester)"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'pester') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait pester

      - name: Lane summary
        id: summary
        if: ${{ !cancelled() && steps.lanes.outcome == 'success' }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait-all

      - name: Enforce >= 80% coverage on changed lines
        # Only over complete coverage: a failed lane already fails this job.
        if: >-
          steps.summary.outcome == 'success' &&
          (steps.filter.outputs.frontend == 'true' ||
           steps.filter.outputs['rust-core'] == 'true' ||
           steps.filter.outputs['rust-tauri'] == 'true')
        run: bash scripts/ci/self-hosted/diff-cover.sh ci-out/lcov "origin/${{ inputs.base-ref }}" ci-out/diff-cover

      - name: Upload lane logs, timings and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-out-ex63
          path: ci-out/
          retention-days: 14
          if-no-files-found: warn

  # ── hosted: plan, then one GitHub-hosted job per lane group ─────────────────
  plan:
    name: Plan lanes
    if: inputs.profile == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      frontend: ${{ steps.filter.outputs.frontend }}
      i18n: ${{ steps.filter.outputs.i18n }}
      docs: ${{ steps.filter.outputs.docs }}
      rust-core: ${{ steps.filter.outputs['rust-core'] }}
      rust-tauri: ${{ steps.filter.outputs['rust-tauri'] }}
      scripts: ${{ steps.filter.outputs.scripts }}
      inventory: ${{ steps.filter.outputs.inventory }}
      toolchain-image: ${{ steps.filter.outputs['toolchain-image'] }}
      install-ps1: ${{ steps.filter.outputs.install_ps1 }}
      storage: ${{ steps.filter.outputs.storage }}
      coverage: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs['rust-core'] == 'true' || steps.filter.outputs['rust-tauri'] == 'true' }}
    steps:
      - name: Checkout filter and lane plan
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr-number }}/merge
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts/ci/self-hosted
            scripts/lib

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/ci-paths-filter.yml

      - name: Build the job matrix
        id: plan
        env:
          CI_AREA_FRONTEND: ${{ steps.filter.outputs.frontend }}
          CI_AREA_I18N: ${{ steps.filter.outputs.i18n }}
          CI_AREA_DOCS: ${{ steps.filter.outputs.docs }}
          CI_AREA_RUST_CORE: ${{ steps.filter.outputs['rust-core'] }}
          CI_AREA_RUST_TAURI: ${{ steps.filter.outputs['rust-tauri'] }}
          CI_AREA_SCRIPTS: ${{ steps.filter.outputs.scripts }}
          CI_AREA_INVENTORY: ${{ steps.filter.outputs.inventory }}
          CI_AREA_TOOLCHAIN_IMAGE: ${{ steps.filter.outputs['toolchain-image'] }}
          CI_AREA_INSTALL_PS1: ${{ steps.filter.outputs.install_ps1 }}
          CI_AREA_STORAGE: ${{ steps.filter.outputs.storage }}
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci/self-hosted/lanes.mjs --profile hosted --print-matrix)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "[ci][plan] ${matrix}"

  lanes:
    name: Lanes (${{ matrix.group }})
    needs: plan
    if: inputs.profile == 'hosted' && fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    container:
      # Empty for the pester group: pwsh ships on the bare runner image.
      image: ${{ matrix.container }}
      # The runner's PID 1 (`tail -f /dev/null`) never reaps orphans, so a
      # killed grandchild stays a zombie that `kill(pid, 0)` still finds and the
      # process-group timeout tests fail. `--init` puts a reaping init at PID 1.
      options: --init
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      NPM_CONFIG_STORE_DIR: .pnpm-store
      CI_AREA_FRONTEND: ${{ needs.plan.outputs.frontend }}
      CI_AREA_I18N: ${{ needs.plan.outputs.i18n }}
      CI_AREA_DOCS: ${{ needs.plan.outputs.docs }}
      CI_AREA_RUST_CORE: ${{ needs.plan.outputs['rust-core'] }}
      CI_AREA_RUST_TAURI: ${{ needs.plan.outputs['rust-tauri'] }}
      CI_AREA_SCRIPTS: ${{ needs.plan.outputs.scripts }}
      CI_AREA_INVENTORY: ${{ needs.plan.outputs.inventory }}
      CI_AREA_TOOLCHAIN_IMAGE: ${{ needs.plan.outputs['toolchain-image'] }}
      CI_AREA_INSTALL_PS1: ${{ needs.plan.outputs['install-ps1'] }}
      CI_AREA_STORAGE: ${{ needs.plan.outputs.storage }}
    steps:
      - name: Free disk space
        # Inside the container /opt/hostedtoolcache is bind-mounted at /__t;
        # clearing it frees ~8 GB on the partition the build uses.
        if: matrix.container != ''
        run: |
          rm -rf /__t/* || true
          df -h /__w || true

      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr-number }}/merge
          # Only the checks group compares against the base branch.
          fetch-depth: ${{ matrix.group == 'checks' && '0' || '1' }}
          # Submodules come from the step below (see the ex63 job).
          submodules: false
          persist-credentials: false

      - name: Trust the workspace for git
        # The checkout is owned by the runner uid; the container runs as root.
        if: matrix.container != ''
        run: git config --global --add safe.directory '*'

      - name: Install jq for release-script tests
        if: matrix.container != '' && needs.plan.outputs.scripts == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq python3-tomli

      - name: Check out submodules
        run: bash scripts/ci/checkout-submodules.sh

      - name: Cache Rust build artifacts
        if: matrix.group == 'rust-lint' || matrix.group == 'rust-cov' || matrix.group == 'tauri' || matrix.group == 'storage'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/openhuman-app -> target
          cache-on-failure: ${{ matrix.group != 'rust-cov' }}
          shared-key: ci-fast-${{ matrix.group }}

      - name: Prune stale coverage test executables
        # Instrumented test binaries in a restored cache can exhaust the disk.
        if: matrix.group == 'rust-cov'
        run: find target/llvm-cov-target -type f -path '*/debug/deps/*' -perm -111 -delete 2>/dev/null || true

      - name: Cache pnpm store
        if: matrix.group == 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        if: matrix.group == 'rust-cov' || matrix.group == 'tauri'
        uses: taiki-e/install-action@cargo-llvm-cov

      # One step per lane: `Start lanes` launches every lane in the background
      # (they still run in parallel); each `Lane:` step streams its own lane's
      # log live and passes or fails on that lane alone; `Lane summary` waits
      # for the whole run and carries the overall result. `!cancelled()` keeps
      # a red lane from hiding the lanes after it.
      # The embed-consumer bootstrap uses stdlib tomllib (Python >= 3.11).
      # Both runner profiles must use the same interpreter before spawning lanes.
      # It is handed to the lanes explicitly (OPENHUMAN_CI_PYTHON) rather than
      # exported: an exported toolcache PATH/LD_LIBRARY_PATH leaks into the
      # Rust tests, whose agent shell keeps PATH but not LD_LIBRARY_PATH, so a
      # PATH-resolved python3 then cannot load libpython.
      - name: Setup Python for lanes
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          update-environment: false

      - name: Start lanes
        id: lanes
        env:
          OPENHUMAN_CI_PYTHON: ${{ steps.python.outputs.python-path }}
        run: >-
          node scripts/ci/self-hosted/lanes.mjs --profile hosted --detach
          --lanes '${{ matrix.lanes }}' --max-parallel ${{ matrix['max-parallel'] }}

      - name: "Lane: static checks"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'static') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait static

      - name: "Lane: frontend checks"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'frontend') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait frontend

      - name: "Lane: frontend tests (vitest + coverage)"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'frontend-tests') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait frontend-tests

      - name: "Lane: Rust core coverage"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'rust-cov') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait rust-cov

      - name: "Lane: Rust lint + crate tests"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'rust-lint') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait rust-lint

      - name: "Lane: Rust gates-off smoke"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'rust-gates-off') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait rust-gates-off

      - name: "Lane: Tauri clippy + coverage"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'tauri') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait tauri

      - name: "Lane: storage drivers (sqlite + file)"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'storage-drivers') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait storage-drivers

      - name: "Lane: install.ps1 (Pester)"
        if: ${{ !cancelled() && contains(fromJSON(steps.lanes.outputs.lanes || '[]'), 'pester') }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait pester

      - name: Lane summary
        id: summary
        if: ${{ !cancelled() && steps.lanes.outcome == 'success' }}
        run: node scripts/ci/self-hosted/lanes.mjs --wait-all

      - name: Prune coverage test executables before cache save
        if: always() && matrix.group == 'rust-cov'
        run: find target/llvm-cov-target -type f -path '*/debug/deps/*' -perm -111 -delete 2>/dev/null || true

      - name: Upload lane logs, timings and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-out-${{ matrix.group }}
          path: ci-out/
          retention-days: 14
          if-no-files-found: warn

  gate:
    name: CI Fast (hosted) Gate
    needs: [plan, lanes]
    if: always() && inputs.profile == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every lane job to pass
        run: |
          set -euo pipefail
          echo "plan=${{ needs.plan.result }} lanes=${{ needs.lanes.result }}"
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "::error::Lane planning did not succeed."
            exit 1
          fi
          case "${{ needs.lanes.result }}" in
            success|skipped) ;;
            *) echo "::error::A lane job did not pass (result=${{ needs.lanes.result }})."; exit 1 ;;
          esac

      - name: Checkout for the coverage compare ref
        if: needs.plan.outputs.coverage == 'true'
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr-number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        if: needs.plan.outputs.coverage == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install diff-cover
        if: needs.plan.outputs.coverage == 'true'
        run: pip install 'diff-cover>=9.2.0'

      - name: Download lane outputs
        if: needs.plan.outputs.coverage == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ci-artifacts
          pattern: ci-out-*

      - name: Enforce >= 80% coverage on changed lines
        if: needs.plan.outputs.coverage == 'true'
        run: bash scripts/ci/self-hosted/diff-cover.sh ci-artifacts "origin/${{ inputs.base-ref }}" diff-cover

      - name: Upload diff-cover report
        if: always() && needs.plan.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diff-coverage-report
          path: diff-cover/
          retention-days: 14
          if-no-files-found: warn
