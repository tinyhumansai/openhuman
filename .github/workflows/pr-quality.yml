---
name: PR Quality (soft)
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs') && !contains(github.event.pull_request.labels.*.name, 'chore') }}
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      release-scripts: ${{ steps.filter.outputs.release_scripts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - '.github/workflows/pr-quality.yml'
              - 'docs/**/*.md'
              - 'src/**/README.md'
              - '.github/PULL_REQUEST_TEMPLATE.md'
            release_scripts:
              - '.github/workflows/pr-quality.yml'
              - 'scripts/release/**'
  checklist-guard:
    name: PR Submission Checklist
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Submission Checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-checklist.mjs
  coverage-matrix:
    name: Coverage Matrix Sync
    needs: [changes]
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Coverage Matrix
        run: node scripts/check-coverage-matrix.mjs
  markdown-link-check:
    name: Markdown Link Check
    needs: [changes]
    if: github.event.action != 'edited' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          # Product Hunt denies GitHub-hosted runners (403) for the translated
          # README badge destination, so it cannot be a stable external-link
          # check.
          # The managed Discord vanity endpoint currently returns 404 before
          # forwarding anonymous requests; keep checking all other links until
          # its provider-side redirect is restored.
          args: >-
            --no-progress
            --include-fragments
            --exclude '^http://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude 'docs/install\.md#apt-debianubuntu$'
            --exclude '^https://github\.com/tinyhumansai/homebrew-openhuman'
            --exclude '^https://www\.reddit\.com/r/tinyhumansai/?$'
            --exclude '^https://www\.star-history\.com/#tinyhumansai/openhuman&type=date&legend=top-left$'
            --exclude '^https://github\.com/tinyhumansai/openhuman/stargazers'
            --exclude '^https://api\.star-history\.com/'
            --exclude '^https://x\.com/karpathy/status/2039805659525644595$'
            --exclude '^https://www\.producthunt\.com/'
            --exclude '^https://discord\.tinyhumans\.ai/?$'
            'docs/**/*.md'
            'src/**/README.md'
            '.github/PULL_REQUEST_TEMPLATE.md'
          fail: true
  appimage-rpath-guard:
    name: AppImage RPATH + libxdo guard
    needs: [changes]
    if: github.event.action != 'edited' && needs.changes.outputs.release-scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install patchelf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
      - name: Syntax check release scripts
        run: |
          bash -n scripts/release/strip-appimage-graphics-libs.sh
          bash -n scripts/release/upload-macos-artifacts.sh
          bash -n scripts/release/tauri-signer.sh
      - name: Run AppImage RPATH sanitize + libxdo guard test (issue #3224)
        run: bash scripts/release/test-strip-appimage-rpaths.sh
      - name: Run updater-signing guard test (issue #5658)
        run: bash scripts/release/test-tauri-signer.sh
