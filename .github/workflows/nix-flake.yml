name: Nix flake

# Validates `flake.nix` so it cannot rot: the lock file stays consistent, every
# output evaluates on every supported system, and the dev shell's inputs
# resolve.
#
# The default job is evaluation-only on purpose: a full `nix build` of the core
# is a multi-hour job (~800 crates + a bundled SQLite) that exceeds a hosted
# runner's budget. The heavy build runs in the opt-in `build` job below, which
# is meant for a self-hosted runner or a manual dispatch. See NIX.md.
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "NIX.md"
      - ".github/workflows/nix-flake.yml"
      # The flake's source is only valid while it matches the submodule pins;
      # a bump to any of these changes what the dev shell and packages build.
      - ".gitmodules"
      - "vendor/**"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-flake.yml"
      - ".gitmodules"
      - "vendor/**"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      build_packages:
        description: "Also build openhuman-core (multi-hour; needs a beefy runner)"
        type: boolean
        default: false
  # Also build the core once a week on `main`, so the flake's build path is
  # continuously validated. It runs on `main` only — never on a fork PR, whose
  # flake would be the code being compiled.
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: nix-flake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: flake check (evaluation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Submodules are required: the flake's `src` includes `vendor/`, and
      # without the submodule contents even evaluation-time source inspection
      # is incomplete.
      #
      # `persist-credentials: false`: this runs on `pull_request` and then
      # *evaluates and enters* a flake the PR can edit (`shellHook` in
      # `nix develop` is arbitrary code), so the checkout token must not be
      # left in the local Git config for that code to reach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluation only — a bare `nix flake check` builds the `checks`
      # derivations, and the core is a multi-hour Rust build. Inspecting the
      # derivation paths proves every output (packages included) evaluates,
      # without compiling anything.
      # `path:.` (not a bare `nix flake check`, which would use the git copier)
      # is required: the git copier drops the submodule contents this checkout
      # just fetched, and the flake's `src` guard then stops evaluation.
      - name: Evaluate all outputs (all systems)
        run: |
          nix flake check "path:." --no-build --all-systems --show-trace
          for attr in openhuman-core openhuman-tui; do
            nix eval "path:.#packages.x86_64-linux.${attr}.drvPath"
          done

      # Prove the dev shell's inputs resolve (toolchain + system libraries).
      #
      # `nix develop` runs the flake's `shellHook`, which a PR controls, so the
      # read-scoped `GITHUB_TOKEN` GitHub injects into every step is blanked
      # here: this step needs no API access, and the token would otherwise be
      # readable from the environment by that code.
      - name: Build dev shell inputs
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: nix develop "path:." --command bash -c 'rustc --version && node --version && pnpm --version'

      - name: flake.lock is up to date
        run: |
          nix flake lock
          git diff --exit-code flake.lock

  # The real build. Manual, or on a self-hosted runner where the multi-hour
  # Rust compile is acceptable; it also populates the Nix store so later builds
  # are fast. Left out of the pull_request path because a fork PR can edit the
  # flake and the build would run that code.
  build:
    name: build openhuman-core
    if: (github.event_name == 'workflow_dispatch' && inputs.build_packages) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and smoke-test
        run: |
          nix build "path:.#openhuman-core" --print-build-logs
          ./result/bin/openhuman-core --help > /dev/null
          echo "openhuman-core built and runs"