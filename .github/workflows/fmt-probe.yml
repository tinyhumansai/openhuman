name: Fmt Probe

on:
  push:
    branches:
      - "ci/fmt-probe"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fmt-fix:
    name: Fmt Fix
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v5
        with:
          ref: fix/5268-dedup-run-graph-snapshot
          fetch-depth: 1
          persist-credentials: true

      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt
          rustup component add rustfmt --toolchain 1.96.1
          rustup run 1.96.1 rustfmt --version

      - name: Detect edition
        id: ed
        run: |
          ED=$(grep -m1 -E '^\s*edition\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "edition=${ED:-2021}" >> "$GITHUB_OUTPUT"
          echo "edition is ${ED:-2021}"

      - name: Format the two touched files
        run: |
          rustup run 1.96.1 rustfmt \
            --edition "${{ steps.ed.outputs.edition }}" \
            src/openhuman/flows/bus.rs \
            src/openhuman/flows/bus_tests.rs

      - name: Show what rustfmt changed
        run: |
          git --no-pager diff --stat
          git --no-pager diff > applied.diff || true
          {
            echo '### rustfmt applied'
            echo '```diff'
            cat applied.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s applied.diff ]; then
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' applied.diff | awk '{printf "%s%%0A", $0}')
            echo "::warning title=APPLIED::$msg"
          else
            echo "::notice title=APPLIED::already clean, nothing to do"
          fi

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain -- src/openhuman/flows)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/openhuman/flows/bus.rs src/openhuman/flows/bus_tests.rs
          git commit -m "style: apply cargo fmt to the touched flows files"
          git push origin HEAD:fix/5268-dedup-run-graph-snapshot
