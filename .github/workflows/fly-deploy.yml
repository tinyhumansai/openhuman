# Continuous deployment of openhuman-core to Fly.io.
#
# Prerequisites:
#   1. Set up fly.toml with your app name and region (see fly.toml).
#   2. Generate a deploy token: fly tokens create deploy
#   3. Add it as a repository secret named FLY_API_TOKEN.
#
# See gitbooks/features/cloud-deploy.md for the full Fly.io deployment guide.

name: Fly Deploy
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'fly.toml'
      - 'scripts/docker-entrypoint-core.sh'

jobs:
  deploy:
    name: Deploy openhuman-core
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
