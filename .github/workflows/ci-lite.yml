---
# CI Lite — the quick lane (pushes to main + PRs targeting main or release).
#
# Runs quality checks and complete unit-test suites per changed area, with
# diff-cover enforcing >= 80% coverage on changed lines. Release-only mock-backend
# and cross-platform E2E suites run via ci-full.yml on PRs targeting `release`
# and on every push to `release` (the maintainer-dispatched
# promote-main-to-release.yml merge and fix-PR merges). Fix PRs against
# release get this fast lane too, for quick lint/coverage feedback alongside
# the full suite.
#
# The gate job keeps its historical "PR CI Gate" check name so the main
# ruleset's required-status-check reference stays valid.
name: CI Lite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release]

permissions:
  # `actions: read` lets scripts/ci-cancel-aware.sh poll the run status so
  # cancelled builds inside container jobs stop themselves (docker exec
  # swallows the runner's signals).
  actions: read
  contents: read
  packages: read
  pull-requests: read

env:
  # Consumed by scripts/ci-cancel-aware.sh's cancellation watchdog.
  GH_TOKEN: ${{ github.token }}
  NPM_CONFIG_STORE_DIR: .pnpm-store

# Keep only the newest run per PR/branch. Long Rust/Tauri build commands must
# run through scripts/ci-cancel-aware.sh so cancellation reaches descendants.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Org members' PRs run on the EX63 (ci-fast.yml); CI Lite then skips every
  # job, PR CI Gate included, and ci-gate.yml's "CI Gate" follows CI Fast.
  # Outsiders' PRs, pushes to main, and any commit ci-fast.yml did not route
  # to the EX63 run CI Lite as before.
  route:
    name: Route (EX63 runs org members' PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - name: Checkout the routing script
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci/ci-fast-route.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Follow ci-fast.yml's routing decision
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "${EVENT}" != "pull_request" ]; then
            echo "[ci][route] event=${EVENT}: CI Lite runs"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          out="$(mktemp)"
          # Skip only on ci-fast.yml's own decision. Its fallback (no CI Fast
          # run within 3 minutes) or any error runs CI Lite: skipping is the
          # only unsafe answer.
          if GITHUB_OUTPUT="${out}" bash scripts/ci/ci-fast-route.sh &&
            grep -q '^outsider=false$' "${out}" && grep -q '^source=ci-fast$' "${out}"; then
            echo "[ci][route] the EX63 runs this commit: CI Lite skips"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "[ci][route] CI Lite runs"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  changes:
    name: Detect Changed Areas
    needs: [route]
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      i18n: ${{ steps.filter.outputs.i18n }}
      docs: ${{ steps.filter.outputs.docs }}
      rust-core: ${{ steps.filter.outputs['rust-core'] }}
      rust-tauri: ${{ steps.filter.outputs['rust-tauri'] }}
      # Mock backend + shared scripts → run the scripts self-test suite.
      scripts: ${{ steps.filter.outputs.scripts }}
      # Test wiring surface (workflows, package.json, all.rs, tests/, script
      # tests) → run the test-inventory orphan + controller-domain guard.
      inventory: ${{ steps.filter.outputs.inventory }}
      # CI image and toolchain pin inputs → check that every workflow, the
      # image Dockerfile, and rust-toolchain.toml stay in lockstep.
      toolchain-image: ${{ steps.filter.outputs['toolchain-image'] }}
      # Windows installer or its unit test → run the Pester install lane.
      install-ps1: ${{ steps.filter.outputs.install_ps1 }}
      coverage: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs['rust-core'] == 'true' || steps.filter.outputs['rust-tauri'] == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Shared with ci-lanes.yml; see the header of that file.
          filters: .github/ci-paths-filter.yml

  frontend-checks:
    name: Frontend Checks (quality, i18n, docs, coverage)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.i18n == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest
    steps:
      - name: Checkout code
        # Pinned to the v7 commit SHA for supply-chain hardening (CodeRabbit
        # review on #3892). The combined frontend lane keeps that hardening
        # from the former docs-drift job.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The RPC-catalog drift guard reads tinychannels, while the app's
      # `rust:format:check` now formats the virtual root workspace. Cargo must
      # load every local path dependency's manifest before rustfmt can select
      # workspace packages, so initialize the complete root vendor graph.
      #
      # `actions/checkout` scopes its own `safe.directory` config to a
      # temporary HOME for the duration of the checkout step only — it does
      # not persist into this container job's real HOME, so a bare `git`
      # invocation in a later step hits "detected dubious ownership" here.
      # Add the workspace as a safe directory ourselves before touching git.
      - name: Init Rust workspace submodules
        if: needs.changes.outputs.frontend == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive vendor/

      - name: Cache pnpm store
        id: pnpm-cache
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.i18n == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.i18n == 'true'
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: always() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.i18n == 'true') && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Type check TypeScript files
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter openhuman-app compile
        env:
          NODE_ENV: test

      # `compile` above covers `app/src`; its tsconfig does not include the
      # test trees, so the 205 WDIO + Playwright specs were never type-checked
      # by any lane. `test/tsconfig.e2e.json` was already correct and simply had
      # no runner (#6566). Running it found 34 errors, 7 of which were
      # `@ts-expect-error` directives that had stopped suppressing anything and
      # would have silently swallowed the next real error on the line below them.
      - name: Type check E2E and Playwright specs
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter openhuman-app typecheck:e2e
        env:
          NODE_ENV: test

      - name: Check Prettier formatting
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter openhuman-app format:check
        env:
          NODE_ENV: test

      - name: Run ESLint
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter openhuman-app lint
        env:
          NODE_ENV: test

      - name: Verify i18n coverage (missing / extra / drifted keys across locales)
        if: needs.changes.outputs.i18n == 'true'
        run: pnpm i18n:check

      # The generator + its tests use only Node built-ins (no workspace deps),
      # so docs-only changes still skip `pnpm install`.
      - name: Generator unit tests
        if: needs.changes.outputs.docs == 'true'
        run: pnpm docs:test

      - name: Verify generated architecture docs are not stale
        if: needs.changes.outputs.docs == 'true'
        run: pnpm docs:check

      - name: Run complete frontend unit suite with coverage
        if: needs.changes.outputs.frontend == 'true'
        run: bash scripts/ci-cancel-aware.sh pnpm --filter openhuman-app test:coverage
        env:
          NODE_ENV: test

      - name: Normalize lcov source paths to repo root
        if: needs.changes.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          test -f app/coverage/lcov.info
          sed -i -E 's#^SF:(src/)#SF:app/\1#' app/coverage/lcov.info
          sed -i -E 's#^SF:(\./src/)#SF:app/src/#' app/coverage/lcov.info

      - name: Upload frontend lcov
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-frontend
          path: app/coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  rust-quality:
    name: Rust Quality (fmt, clippy)
    needs: [changes]
    if: needs.changes.outputs['rust-core'] == 'true' || needs.changes.outputs['rust-tauri'] == 'true'
    runs-on: ubuntu-22.04
    # This lane compiles the product and contributor core graphs, executes the
    # embedding facade tests, then checks the detached Tauri Cargo world. A cold
    # runner needs more than the former 20-minute budget to reach Tauri clippy.
    timeout-minutes: 40
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/openhuman-app -> target
          cache-on-failure: true
          # shared-key (not key) so the cache name is stable and not suffixed
          # with the job id. Swatinem caches the full target/, which is why we
          # no longer layer sccache on top (it logged 0% hits under a warm
          # rust-cache and just doubled the cache footprint).
          shared-key: pr-rust-quality

      # `!cancelled()` on every independent check below, so one failure stops
      # concealing the rest (#6451). A step's `if` defaults to `success()`, so
      # today a red `cargo fmt` reports the remaining eleven steps as SKIPPED —
      # which reads as "not applicable" rather than "never ran".
      #
      # NOT `continue-on-error`. That SUPPRESSES the failure, making the job's
      # redness depend on an aggregation step being written correctly — a
      # false-green path installed into the gate that guards everything else.
      # `!cancelled()` runs the step without suppressing it: each still fails
      # the job on its own, exactly as today. `!cancelled()` rather than
      # `always()` so a cancelled run still stops promptly instead of grinding
      # through every remaining check.
      - name: Check Rust formatting
        id: fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Enforce OpenHuman Rust file layout
        id: layout
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        run: node scripts/ci/check-openhuman-rust-layout.mjs

      - name: Enforce agent runtime ownership boundary
        id: runtime_boundary
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        run: pnpm agent:runtime-boundary

      - name: Enforce the ignored-test ratchet
        # Counts `#[ignore]` attributes in the source tree per crate and refuses
        # any increase. Deliberately static: `#[ignore]` is a source attribute,
        # so this needs no build, no feature-set choice and no dependence on the
        # dispatch-only full-suite lane (#5021) — which is why it can sit here,
        # ahead of clippy, rather than waiting for a lane that runs tests.
        # Covers openhuman-app too, hence both filters.
        if: needs.changes.outputs['rust-core'] == 'true' || needs.changes.outputs['rust-tauri'] == 'true'
        run: pnpm rust:ignored-tests

      - name: Enforce Linux TLS dependency policy
        id: linux_tls
        if: ${{ !cancelled() && (needs.changes.outputs['rust-core'] == 'true' || needs.changes.outputs['rust-tauri'] == 'true') }}
        run: bash scripts/check-linux-tls-dependencies.sh

      - name: Run clippy (core crate, product feature set)
        id: clippy_product
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        # `--features` is load-bearing. `[features] default` is the CONTRIBUTOR
        # set (see the comment above it in Cargo.toml) and omits voice, web3,
        # documents, meet, contacts, inference and crash-reporting — so a bare
        # `cargo clippy` no longer lints code that ships. Product set:
        # scripts/ci/product-features.txt, asserted equal to the shell's
        # forwarding list by check-feature-forwarding.mjs.
        run: |
          bash scripts/ci-cancel-aware.sh cargo clippy -p openhuman \
            --features "$(bash scripts/ci/product-features.sh)" -- -D warnings

      - name: Run clippy (core crate, contributor default set)
        id: clippy_default
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        # The set a contributor's editor and pre-push hook actually compile. A
        # lint that only fires with those gates OFF — an import left unused once
        # a domain is compiled out, say — is invisible to the product lane above
        # and would land red on every contributor's machine while CI stayed
        # green. Cheap: this graph is ~356 packages against the product's ~567.
        run: bash scripts/ci-cancel-aware.sh cargo clippy -p openhuman -- -D warnings

      # Split one-command-per-step (#6451). These were a single `run:` block, and
      # GitHub runs those under `bash -e`: a clippy failure meant the `check` and
      # the TEST SUITE below it never ran and were reported as NOTHING — not even
      # "skipped". Job-level, concealed work at least looks skipped; inside a
      # multi-command step it looks like work that does not exist. Worse here
      # because the step is named "Check", so reading the step list does not
      # reveal that a test suite sits behind a lint.
      - name: Lint embedding facade
        id: embed_clippy
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        run: bash scripts/ci-cancel-aware.sh cargo clippy -p openhuman-embed --all-targets -- -D warnings

      - name: Check embedding facade builds without default features
        id: embed_check
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        run: bash scripts/ci-cancel-aware.sh cargo check -p openhuman-embed --no-default-features

      - name: Test embedding facade
        id: embed_test
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        run: bash scripts/ci-cancel-aware.sh cargo test -p openhuman-embed

      # `openhuman-tinyhumans` is the SDK-backed backend transport plus the
      # host-side login/session owner shared by the Tauri shell and the TUI.
      # Its tests run against wiremock / in-process stubs, never the backend.
      # Split for the same reason as the embedding facade above.
      - name: Lint tinyhumans crate
        id: tinyhumans_clippy
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        run: bash scripts/ci-cancel-aware.sh cargo clippy -p openhuman-tinyhumans --all-targets -- -D warnings

      - name: Test tinyhumans crate
        id: tinyhumans_test
        if: ${{ !cancelled() && needs.changes.outputs['rust-core'] == 'true' }}
        run: bash scripts/ci-cancel-aware.sh cargo test -p openhuman-tinyhumans

      # Unchained because the step BELOW it needs what it produces, not because
      # it is independent. "Independent" is not "self-sufficient": `Run clippy
      # (Tauri shell)` is logically unrelated to the core checks, but it needs
      # the CEF binary distribution this restore puts on disk. This restore sits
      # after the core checks, so leaving it chained while unchaining the clippy
      # would have that clippy compile with no CEF present whenever any earlier
      # step failed — failing or crawling for a reason unrelated to the code
      # under test, and reading as a new flake rather than as a missing cache.
      # When unchaining a step, check what it consumes, not only what it checks.
      - name: Cache CEF binary distribution
        if: ${{ !cancelled() && needs.changes.outputs['rust-tauri'] == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/tauri-cef
            ~/.cache/tauri-cef
          key: cef-x86_64-unknown-linux-gnu-v2-${{ hashFiles('crates/openhuman-app/Cargo.toml') }}
          restore-keys: |
            cef-x86_64-unknown-linux-gnu-v2-

      - name: Run clippy (Tauri shell)
        id: clippy_tauri
        if: ${{ !cancelled() && needs.changes.outputs['rust-tauri'] == 'true' }}
        run: bash scripts/ci-cancel-aware.sh cargo clippy --manifest-path crates/openhuman-app/Cargo.toml -- -D warnings

      # Report every check's own outcome (#6451).
      #
      # `skipped` and `success` are easy to conflate when scanning a job: a
      # skipped step reads as "not applicable" rather than "never ran". This
      # lists each check with its actual outcome so the distinction is explicit.
      #
      # INFORMATIONAL ONLY. It never fails and never decides the job's result —
      # every check above still fails the job on its own. A reporting step that
      # could gate would be a place for a red job to come out green, which is
      # the whole defect this change exists to remove.
      - name: Summarise Rust Quality checks
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          {
            echo "### Rust Quality — per-check outcome"
            echo
            echo "| check | outcome |"
            echo "| --- | --- |"
            node -e '
              const steps = JSON.parse(process.env.STEP_OUTCOMES || "{}");
              const rows = Object.entries(steps)
                .filter(([, v]) => v && v.outcome)
                .map(([id, v]) => `| ${id} | ${v.outcome} |`);
              console.log(rows.length ? rows.join("\n") : "| (no step ids declared) | — |");
            '
            echo
            echo "\`skipped\` means the step did not run. It is not a pass."
          } >> "$GITHUB_STEP_SUMMARY"

  # Feature-gate smoke: proves the core still compiles with a domain gate turned
  # OFF. The disabled build is the ONLY thing that catches stub-facade signature
  # drift (see AGENTS.md "Compile-time domain gates"), so it must run in CI, not
  # just locally. Pathfinder lane for #4803 (voice); plain --no-default-features
  # turns every default gate OFF, so it also covers #4804 (media) and each
  # sibling gate as it lands — no edit needed unless a new gate must stay ON here.
  rust-feature-gate-smoke:
    name: Rust Feature-Gate Smoke (gates off)
    needs: [changes]
    if: needs.changes.outputs['rust-core'] == 'true' || needs.changes.outputs['rust-tauri'] == 'true'
    runs-on: ubuntu-22.04
    # Was 25; raised because the lane now links (--all-targets) and runs a test
    # binary, not just `cargo check`.
    timeout-minutes: 40
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Deep-async-stack belt (same as the coverage lanes) — virtual reservation,
      # zero cost. Keeps a gate-contract test with a deep stack from tripping.
      RUST_MIN_STACK: "67108864"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
          shared-key: pr-rust-feature-gate-smoke

      - name: Check core builds with the default domain gates disabled
        # Lib-scoped on purpose. `--all-targets` would additionally compile the
        # `tests/` integration crates, which today name gated symbols
        # (voice::reply_speech::test_seam, mcp::registry::store, web3::x402::tools) without
        # a #[cfg] and so do not compile with the gates off. That cleanup is tracked
        # in #5021 alongside running the full gates-off suite; until it lands, this
        # lane checks the lib and RUNS the gate-contract lib tests below.
        run: bash scripts/ci-cancel-aware.sh cargo check --manifest-path Cargo.toml -p openhuman --no-default-features

      - name: Check the gate that is in neither the contributor nor the product set
        # This gate is default-OFF *and* absent from the product set, so
        # nothing else in CI compiles them: the product lanes do not select
        # them, the contributor lanes no longer default them on, and the
        # gates-off check above turns them off.
        #
        #   e2e-test-support  — the `test`/`test_support` RPC family, turned on
        #                       only by app/scripts/e2e-build.sh for the packaged
        #                       desktop E2E binary. It includes
        #                       `openhuman.test_reset`, a destructive in-place
        #                       wipe, which is exactly why it must stay out of
        #                       every product lane — so a compile-only smoke
        #                       check here is the right shape, not enabling it
        #                       somewhere that ships.
        #
        # Without this step those families rot silently — the same shape of
        # failure as #4901, pointed at a gate instead of at the shipped app.
        # `e2e-test-support` sat in this position from the day it was added
        # until #6086 and was never `cargo check`ed by CI in either state.
        #
        # If a future gate lands in this same neither-set position, add it here
        # AND to the list in CLAUDE.md's "gate in neither set" note.
        run: |
          bash scripts/ci-cancel-aware.sh cargo check --manifest-path Cargo.toml -p openhuman --no-default-features --features e2e-test-support

      - name: Run the gate-contract tests with the default domain gates disabled
        # `cargo check` (even --all-targets) never RUNS tests, so a gated family that
        # is asserted WITHOUT a matching #[cfg] compiles fine and only fails at
        # runtime — exactly how the two ungated `voice` asserts sat red on main
        # (#5022). This step executes the gate-contract test modules so that class of
        # regression fails CI, not just a local pre-push.
        #
        # `memory::people::address_book::tests` used to be here and was removed: the
        # address-book tests moved into the tinycortex dependency crate with the code
        # they cover, and a dependency's unit tests are not collected by this crate's
        # `--lib` harness — so the filter matched zero tests while reading like
        # coverage. `contacts_gate_tests` is the live replacement (its off-macOS arm
        # compiles on Linux, which is where this lane runs).
        #
        # Scope is deliberate: the full gates-off `--lib` run aborts on a pre-existing
        # task_local stack overflow (`agent::harness::session::tests::
        # turn_dispatches_spawn_subagent_through_full_path`) that reproduces in the
        # gates-ON build too, and also OOMs unscoped. These filters route AROUND that
        # test by scope, not by skip. Running the full suite is tracked in #5021.
        run: |
          bash scripts/ci-cancel-aware.sh cargo test --manifest-path Cargo.toml \
            -p openhuman --no-default-features --lib -- \
            core::all:: core::cli:: core::jsonrpc:: core::legacy_aliases:: core::runtime:: agent::registry::agents::loader:: commands::ops::tests:: memory::people::contacts_gate_tests:: openhuman::config:: openhuman::platform::socket::event_handlers:: tools::schemas:: tools::ops::tests::
          bash scripts/ci-cancel-aware.sh cargo test --manifest-path Cargo.toml \
            -p openhuman --no-default-features --features mcp --lib -- \
            mcp::server::resources::
          # `test_support` is behind `e2e-test-support`, a gate in neither the
          # contributor nor the product set, so no other lane RUNS these — the
          # smoke check above only compiles them. That distinction is the whole
          # point of this step: `resolve_workspace_relative`'s traversal guard
          # (#6085) failed open for every path that did not exist, from the day
          # it landed in #1892, and no `cargo check` anywhere could have caught
          # it because the code compiled perfectly. These are the tests that
          # would have.
          #
          # SCOPED TO `introspect::` ON PURPOSE, and this is a hole, not a
          # tidy-up: the first run of the unscoped `test_support::` filter found
          # `test_support::rpc::wipe_memory_tree_removes_content_dirs_and_reports_summary`
          # already failing here —
          #   "test_reset: memory_tree wipe failed: wipe_all: driver
          #    'tinymemory' does not serve Maintenance"
          # `memory-engine-seams` (= dep:tinymemory-core) is in `default` but not
          # in product-features.txt, so it is off in this profile. Widening the
          # feature list to go green would hide exactly what this lane exists to
          # expose, so the filter is narrowed and the gap is named instead.
          # Re-widen to `test_support::` once that is resolved.
          bash scripts/ci-cancel-aware.sh cargo test --manifest-path Cargo.toml \
            -p openhuman --no-default-features --features e2e-test-support --lib -- \
            test_support::introspect::

      - name: Guard — the kernel dependency floor may not grow
        # The `--no-default-features --features flows` profile is the surface a
        # second host would embed, and left unmeasured it grows: seven heavy
        # dependencies (git2/vendored-libgit2, rusqlite/bundled, enigo, arboard,
        # ethers-*, tokio-tungstenite) are unconditional today, and none of them
        # would likely have landed that way had a number moved in CI when they
        # did. This lane is that number.
        #
        # The ratchet is bidirectional on purpose: it fails on growth AND on a
        # shed that was not written back into scripts/kernel-floor.limits, since
        # an unratcheted improvement silently grows back. Lower the limit in the
        # same PR that sheds the crates.
        run: bash scripts/check-kernel-floor.sh --verbose

      - name: Guard — the removal simulator still agrees with cargo
        # History and lockstep rule: see scripts/ci/check-dep-sim-calibration.sh.
        run: bash scripts/ci/check-dep-sim-calibration.sh

      - name: Guard — new feature-gated test modules must be acknowledged
        # Self-maintaining coverage: the set of source files that #[cfg]-gate a test on
        # a domain feature must equal the allowlist below. When a new gate (or a new
        # test in an existing gate's domain) adds a gated test file, this fails — the
        # author then adds it here AND, if it can hold an ungated-assert regression of
        # the #5022 class, extends the gate-contract `cargo test` filters above. Prevents the
        # smoke lane from silently under-covering as the gate surface grows.
        run: bash scripts/ci/check-gated-test-allowlist.sh

  rust-core-coverage:
    name: Rust Core Coverage (cargo-llvm-cov)
    needs: [changes, rust-quality]
    if: always() && needs.changes.outputs['rust-core'] == 'true' && needs['rust-quality'].result == 'success'
    runs-on: ubuntu-22.04
    # 30 min was only ever enough because a stack overflow aborted the run early
    # (see RUST_MIN_STACK below). With the overflow fixed the job runs the full
    # instrumented suite plus the embed/TUI and sequential integration targets
    # end-to-end. The expanded workspace now runs past 50 minutes on a warm
    # runner, so retain enough headroom for the integration tail to complete.
    timeout-minutes: 90
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Coverage-instrumented test binaries are dominated by DWARF debug info,
      # which exhausts the runner disk and SIGBUSes the linker. Drop debug info
      # entirely for this job — llvm-cov line/region coverage is read from the
      # embedded __llvm_covmap/__llvm_covfun sections (filenames + line numbers
      # included), NOT from DWARF, so coverage numbers are unaffected. This is
      # the maximum-shrink setting; line-tables-only was still too large for the
      # instrumented build.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # cargo-llvm-cov instrumentation inflates per-frame stack usage, so deep
      # async tests (e.g. cron::scheduler agent-job tests that drive the full
      # harness) overflow the default ~2 MB test-thread stack and SIGABRT the
      # whole run with "stack overflow". Give libtest's per-test threads a large
      # stack so coverage runs don't abort. (Virtual reservation only — no real
      # memory cost.)
      RUST_MIN_STACK: "67108864"
    steps:
      - name: Free disk space
        run: |
          # Coverage-instrumented builds produce huge binaries that exhaust the
          # runner's ~14GB free disk during linking (SIGBUS). Inside a container,
          # host paths are bind-mounted:
          #   /opt/hostedtoolcache → /__t
          #   /home/runner/work    → /__w
          # Deleting /__t frees ~8GB on the same partition the build uses.
          rm -rf /__t/* || true
          echo "Disk after cleanup:"
          df -h /__w || true

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: false
          shared-key: pr-rust-core-cov

      - name: Prune stale coverage test executables
        run: |
          # The restored target cache can contain prior llvm-cov integration-test
          # executables. Those are enormous after coverage instrumentation and
          # can exhaust the runner before the current cargo invocation finishes.
          find target/llvm-cov-target -type f -path '*/debug/deps/*' -perm -111 -delete 2>/dev/null || true
          echo "Disk after coverage target prune:"
          df -h /__w || true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install checksum-pinned native test modules
        run: |
          # tinybus validates every directory ancestor. GitHub mounts the
          # checkout as the host runner uid while this container runs as root,
          # so a module below $GITHUB_WORKSPACE is correctly refused. Keep
          # native fixtures in a root-owned, container-ephemeral tree instead.
          # Version and digest are ONE decision and live on adjacent lines for that
          # reason: the archive name, the release tag and the checksum each used to
          # carry the version independently, so a bump could update two of the three
          # and leave a stale digest that only fails after the download. Both values
          # are the ubuntu-22.04-x86_64 row of `crates/openhuman-core/src/modules/registry.rs`,
          # which is the authoritative pin — copy them from there, never recompute.
          memory_version="1.16.1"
          memory_sha256="c025f4a5743bb975ed7cdc5306a16a6aa4ac2ef3c87fa83820d038321123daee"
          module_root="/opt/openhuman-test-modules/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          memory_dir="$module_root/tinymemory"
          juice_dir="$module_root/tinyjuice"
          connectors_dir="$module_root/tinyconnectors"
          memory_archive="$memory_dir/tinymemory-module-${memory_version}-ubuntu-22.04-x86_64.tar.gz"
          juice_archive="$juice_dir/tinyjuice-module-0.2.2-ubuntu-22.04-x86_64.tar.gz"
          rm -rf "$memory_dir" "$juice_dir" "$connectors_dir"
          mkdir -p "$memory_dir" "$juice_dir" "$connectors_dir"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/tinyhumansai/tinymemory/releases/download/v${memory_version}/$(basename "$memory_archive")" \
            --output "$memory_archive"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/tinyhumansai/tinyjuice/releases/download/v0.2.2/$(basename "$juice_archive")" \
            --output "$juice_archive"
          echo "${memory_sha256}  $memory_archive" \
            | sha256sum --check
          echo "fd8caf7fccb53328870fd26922aa9768d253cd4b3bf758967847d6512df03863  $juice_archive" \
            | sha256sum --check
          # Do not restore the release builder's uid into the trusted tree.
          tar --no-same-owner -xzf "$memory_archive" -C "$memory_dir"
          tar --no-same-owner -xzf "$juice_archive" -C "$juice_dir"
          bash scripts/ci-cancel-aware.sh cargo build --release \
            --manifest-path vendor/tinyconnectors/crates/tinyconnectors/Cargo.toml
          cp vendor/tinyconnectors/target/release/libtinyconnectors.so \
            "$connectors_dir/libtinyconnectors.so"
          echo "TINYMEMORY_TEST_MODULE=$memory_dir/libtinymemory_module.so" \
            >> "$GITHUB_ENV"
          echo "TINYJUICE_TEST_MODULE=$juice_dir/libtinyjuice_module.so" \
            >> "$GITHUB_ENV"
          echo "TINYCONNECTORS_TEST_MODULE=$connectors_dir/libtinyconnectors.so" \
            >> "$GITHUB_ENV"

      - name: Run module-gated Rust tests
        run: bash scripts/ci/run-module-gated-tests.sh
        env:
          CARGO_BUILD_JOBS: "1"

      - name: Run complete root Rust suite with cargo llvm-cov
        run: bash scripts/ci/rust-coverage.sh
        env:
          CARGO_BUILD_JOBS: "1"
          OUT: lcov-core.info
          # The tinyagents harness is the agent engine on every build now
          # (issue #4249); the suite exercises it by default. The legacy engine
          # is being removed.

      - name: Prune coverage test executables before cache save
        if: always()
        run: |
          find target/llvm-cov-target -type f -path '*/debug/deps/*' -perm -111 -delete 2>/dev/null || true
          echo "Disk after post-coverage prune:"
          df -h /__w || true

      - name: Upload core lcov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-rust-core
          path: lcov-core.info
          retention-days: 7
          if-no-files-found: error

  rust-tauri-coverage:
    name: Rust Tauri Coverage (cargo-llvm-cov)
    needs: [changes, rust-quality]
    if: always() && needs.changes.outputs['rust-tauri'] == 'true' && needs['rust-quality'].result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # The instrumented Tauri shell binary (whole tauri/zbus/CEF graph) is
      # dominated by DWARF debug info, which exhausts the runner disk and
      # SIGBUSes the linker (collect2: ld terminated with signal 7) during the
      # final link. Drop debug info — llvm-cov reads coverage from the embedded
      # __llvm_covmap/__llvm_covfun sections, NOT from DWARF, so coverage
      # numbers are unaffected. Mirrors rust-core-coverage.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Large test-thread stack so coverage instrumentation's inflated frames
      # don't overflow deep async tests. Mirrors rust-core-coverage.
      RUST_MIN_STACK: "67108864"
    steps:
      - name: Free disk space
        run: |
          # Coverage-instrumented builds produce huge binaries that exhaust the
          # runner's ~14GB free disk during linking (SIGBUS). Inside a container,
          # host paths are bind-mounted:
          #   /opt/hostedtoolcache → /__t
          #   /home/runner/work    → /__w
          # Deleting /__t frees ~8GB on the same partition the build uses.
          # Mirrors rust-core-coverage.
          rm -rf /__t/* || true
          echo "Disk after cleanup:"
          df -h /__w || true

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/openhuman-app -> target
          cache-on-failure: true
          # Tauri shell coverage (instrumented) — its own stable cache; reuses
          # its warm dependency tree run-over-run.
          shared-key: pr-rust-tauri-cov

      - name: Cache CEF binary distribution
        id: cef-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/tauri-cef
            ~/.cache/tauri-cef
          key: cef-x86_64-unknown-linux-gnu-v2-${{ hashFiles('crates/openhuman-app/Cargo.toml') }}
          restore-keys: |
            cef-x86_64-unknown-linux-gnu-v2-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clear stale Tauri coverage artifacts
        # rust-cache restores crates/openhuman-app/target, including llvm-cov-target.
        # cargo's fingerprints do not distinguish a previously restored
        # non-instrumented test executable, which then runs successfully but
        # produces no .profraw file for cargo-llvm-cov to merge.
        run: cargo llvm-cov clean --manifest-path crates/openhuman-app/Cargo.toml

      - name: Run cargo llvm-cov for Tauri shell
        run: |
          # The container's Cargo configuration installs sccache as its rustc
          # wrapper. Use llvm-cov's RustFLAGS mode so that wrapper cannot
          # replace its instrumentation wrapper and silently drop .profraw
          # output after otherwise-passing tests.
          # The job-level linker flag must also be cleared: llvm-cov sets the
          # same variable with `-C instrument-coverage` for this invocation.
          unset RUSTFLAGS
          bash scripts/ci-cancel-aware.sh cargo llvm-cov --no-rustc-wrapper --manifest-path crates/openhuman-app/Cargo.toml --lcov --output-path lcov-tauri.info
        env:
          # Serialize codegen/link to cap peak memory + disk during the
          # instrumented Tauri-shell link (SIGBUS otherwise). Mirrors
          # rust-core-coverage.
          CARGO_BUILD_JOBS: "1"

      - name: Save CEF binary distribution cache
        if: always() && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/tauri-cef
            ~/.cache/tauri-cef
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      - name: Upload tauri lcov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-rust-tauri
          path: lcov-tauri.info
          retention-days: 7
          if-no-files-found: error

  scripts-tests:
    name: Scripts Self-Tests (mock backend + CLIs)
    needs: [changes]
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cache pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # The socket self-tests resolve socket.io-client from app/, so the
      # workspace deps must be installed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: always() && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Run mock-backend + script self-tests
        run: pnpm test:scripts

  test-inventory:
    name: Test Inventory (orphan + controller-domain guard)
    needs: [changes]
    if: needs.changes.outputs.inventory == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Node-only guard (no workspace deps): asserts every script-level test is
      # invoked by a package.json script/workflow, and every controller domain
      # in crates/openhuman-core/src/core/all.rs is referenced under tests/.
      - name: Run test-inventory guard
        run: pnpm test:inventory

  toolchain-image-drift:
    name: Toolchain Image Drift Guard
    needs: [changes]
    if: needs.changes.outputs['toolchain-image'] == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify CI image and Rust toolchain pins
        run: node scripts/ci/check-toolchain-image.mjs

  orch-ip-gate:
    name: Orchestration IP Gate (no local brain re-entry)
    needs: [route]
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Fail if the retired local orchestration brain (reasoning/wake graph,
      # prompt assets, or per-agent model routing) re-enters the open repo.
      - name: Run orchestration IP gate
        run: bash scripts/ci/orch-ip-gate.sh

  feature-forwarding-gate:
    name: Feature Forwarding Gate (shell forwards core defaults)
    needs: [route]
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The shell sets `default-features = false` on `openhuman_core`, so it does
      # NOT inherit the core's default gates — each must be forwarded by hand.
      # When that list drifts, the domain is compiled out of the shipped app with
      # no build error and no failing test: that is how #4901 (voice — 56 users,
      # ~93k Sentry events) and #4918 (tokenjuice-treesitter — silent) shipped.
      #
      # Deliberately NOT filtered on `changes`: drift can be introduced by
      # editing either manifest, so a path filter watching one would miss it, and
      # a skipped job counts as a pass in the gate below. The check is a few
      # seconds of pure Node with no dependencies.
      - name: Verify the desktop shell forwards every default-ON core gate
        run: node scripts/ci/check-feature-forwarding.mjs

  module-pin-gate:
    name: Module Pin Gate (registry pin matches submodule pin)
    needs: [route]
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history and every submodule: the monotonicity half compares this
          # branch's gitlinks against the base branch's and then asks the
          # submodule whether the new pin is an ancestor of the old one. Both
          # answers need real history — `fetch-depth: 1` would leave the script
          # unable to resolve the base, which it reports as a FAILURE rather than
          # passing on an empty comparison.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # actions/checkout populates the pinned submodule commits but does not
      # fetch their tag refs. The pin gate uses `git describe --tags` to compare
      # each source contract to its registry artifact version, so make that
      # metadata available explicitly without widening the main checkout.
      - name: Fetch submodule tags for module pin verification
        run: bash scripts/ci/fetch-submodule-tags.sh

      # Nine subsystems load as downloaded cdylib modules and each is pinned
      # twice: once as a submodule (the contract compiled here) and once as a
      # version + digest in modules/registry.rs (the artifact loaded at runtime).
      # Nothing compared them, so a stale pin compiled clean, passed every lane,
      # and lost a capability on a user's machine — #5598 (capability bitmask
      # 8191 vs 262143), #5623 (missing ListAllFacets), #5641 (missing profile
      # family). All three were fixed by bumping a pin; none added a check.
      #
      # Deliberately NOT filtered on `changes`: a path filter would have to watch
      # registry.rs, modules/memory.rs, three workflows and sixteen gitlinks, and
      # a skipped job counts as a pass in the gate below.
      - name: Verify each module's registry pin matches its submodule pin
        run: node scripts/ci/check-module-pins.mjs

      # The other half, and the one that has actually bitten. A pin set can be
      # internally consistent and still be consistent with an OLDER release:
      # 14a23b994 moved vendor/tinyagents back from #122 to #121, silently
      # dropping a shipped fix until #5796 restored it, and #5725 did the same
      # (undone by #5787). Both were internally consistent, so the check above
      # would have passed them. `tinyagents` has no registry record at all — one
      # pin, nothing to compare — so only movement direction catches it.
      - name: Verify no vendor/ submodule pin moved backwards
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ci/check-submodule-monotonic.mjs

  pester-install:
    name: PowerShell Install Test (Pester)
    needs: [changes]
    if: needs.changes.outputs['install-ps1'] == 'true'
    # GitHub-hosted ubuntu-latest ships pwsh; the test only dot-sources
    # install.ps1 helpers (no MSI, cross-platform), so no Windows runner needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Invoked directly (not via `pnpm test:install-ps1`) so the lane needs no
      # Node/pnpm toolchain — pwsh is preinstalled on ubuntu-latest. Keep this
      # command in sync with the `test:install-ps1` package.json script.
      - name: Run install.ps1 unit tests
        run: pwsh -NoProfile -File scripts/tests/OpenHumanWindowsInstall.Tests.ps1

  pr-ci-gate:
    name: PR CI Gate
    needs:
      - route
      - changes
      - frontend-checks
      - rust-quality
      - rust-core-coverage
      - rust-tauri-coverage
      - scripts-tests
      - test-inventory
      - toolchain-image-drift
      - pester-install
      - orch-ip-gate
      - feature-forwarding-gate
      - module-pin-gate
    # Skipped with the rest when the EX63 runs this commit, so a skipped CI
    # Lite never reads as a pass (ci-gate.yml counts only a success).
    if: always() && needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require PR CI jobs to pass
        run: |
          set -euo pipefail
          declare -A results=(
            ["Detect Changed Areas"]="${{ needs.changes.result }}"
            ["Frontend Checks"]="${{ needs['frontend-checks'].result }}"
            ["Rust Quality"]="${{ needs['rust-quality'].result }}"
            ["Rust Core Coverage"]="${{ needs['rust-core-coverage'].result }}"
            ["Rust Tauri Coverage"]="${{ needs['rust-tauri-coverage'].result }}"
            ["Scripts Self-Tests"]="${{ needs['scripts-tests'].result }}"
            ["Test Inventory"]="${{ needs['test-inventory'].result }}"
            ["Toolchain Image Drift Guard"]="${{ needs['toolchain-image-drift'].result }}"
            ["PowerShell Install Test"]="${{ needs['pester-install'].result }}"
            ["Orchestration IP Gate"]="${{ needs['orch-ip-gate'].result }}"
            ["Feature Forwarding Gate"]="${{ needs['feature-forwarding-gate'].result }}"
            ["Module Pin Gate"]="${{ needs['module-pin-gate'].result }}"
          )

          failed=0
          for name in "${!results[@]}"; do
            result="${results[$name]}"
            echo "${name}: ${result}"
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::${name} did not pass (result=${result})."
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

      - name: Verify coverage lanes completed
        run: |
          set -euo pipefail
          coverage="${{ needs.changes.outputs.coverage }}"
          frontend_needed="${{ needs.changes.outputs.frontend }}"
          core_needed="${{ needs.changes.outputs['rust-core'] }}"
          tauri_needed="${{ needs.changes.outputs['rust-tauri'] }}"
          frontend="${{ needs['frontend-checks'].result }}"
          core="${{ needs['rust-core-coverage'].result }}"
          tauri="${{ needs['rust-tauri-coverage'].result }}"

          echo "Coverage needed: ${coverage}"
          echo "Frontend changed: ${frontend_needed} (job=${frontend})"
          echo "Rust core changed: ${core_needed} (job=${core})"
          echo "Rust Tauri changed: ${tauri_needed} (job=${tauri})"

          if [ "${coverage}" != "true" ]; then
            echo "No coverage-relevant changes detected; skipping diff-cover."
            exit 0
          fi

          if [ "${frontend_needed}" = "true" ] && [ "${frontend}" != "success" ]; then
            echo "::error::Frontend coverage was required but Frontend Checks did not succeed (result=${frontend})."
            exit 1
          fi
          if [ "${core_needed}" = "true" ] && [ "${core}" != "success" ]; then
            echo "::error::Rust core coverage was required but the lane did not succeed (result=${core})."
            exit 1
          fi
          if [ "${tauri_needed}" = "true" ] && [ "${tauri}" != "success" ]; then
            echo "::error::Rust Tauri coverage was required but the lane did not succeed (result=${tauri})."
            exit 1
          fi

      - name: Checkout code
        if: needs.changes.outputs.coverage == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve coverage compare ref
        if: needs.changes.outputs.coverage == 'true'
        id: coverage-compare
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=200
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: needs.changes.outputs.coverage == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install diff-cover
        if: needs.changes.outputs.coverage == 'true'
        run: pip install 'diff-cover>=9.2.0'

      - name: Download all lcov artifacts
        if: needs.changes.outputs.coverage == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: lcov-artifacts
          pattern: lcov-*
          merge-multiple: false

      - name: List collected lcov files
        if: needs.changes.outputs.coverage == 'true'
        run: |
          set -euo pipefail
          find lcov-artifacts -type f -name '*.info' -print

      - name: Enforce >= 80% coverage on changed lines
        if: needs.changes.outputs.coverage == 'true'
        run: |
          set -euo pipefail
          mapfile -t LCOV_FILES < <(find lcov-artifacts -type f -name '*.info' | sort)
          if [ "${#LCOV_FILES[@]}" -eq 0 ]; then
            echo "::error::No lcov files found; coverage gate cannot run"
            exit 1
          fi
          diff-cover "${LCOV_FILES[@]}" \
            --compare-branch="${{ steps.coverage-compare.outputs.ref }}" \
            --fail-under=80 \
            --html-report diff-coverage.html \
            --markdown-report diff-coverage.md \
            --format json:diff-coverage.json

          # diff-cover exits 0 when it measured nothing at all ("No lines with
          # coverage information in this diff"), which is how PR #5593 passed
          # this gate with 1,643 uncompiled lines. Absence of data is not
          # evidence of coverage — but it IS legitimate for a diff whose only
          # Rust/TS changes are comments, imports or type declarations, so this
          # only WARNS. The hard failure for "the file was never compiled" is
          # scripts/ci/assert-coverage-presence.sh, which runs inside the core
          # coverage lane and can tell those two cases apart.
          #
          # `total_num_lines` is diff-cover's own count of changed lines it
          # found coverage rows for: 0 on the "no lines with coverage
          # information" path, non-zero otherwise. Verified against
          # diff-cover 10.5.1 (the version `>=9.2.0` resolves to today) on both
          # an empty and a non-empty diff. `--format json:` rather than the
          # `--json-report` alias, which that release deprecates.
          measured="$(python3 -c 'import json; print(json.load(open("diff-coverage.json"))["total_num_lines"])')"
          echo "diff-cover measured ${measured} changed line(s)"
          if [ "${measured}" -eq 0 ]; then
            echo "::warning::diff-cover measured 0 changed lines. If this PR changed executable code, that code was not compiled by any coverage lane — check the 'Rust Core Coverage' log for the coverage-presence gate."
          fi

      - name: Upload diff-cover report
        if: always() && needs.changes.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diff-coverage-report
          path: |
            diff-coverage.html
            diff-coverage.md
          retention-days: 14
          if-no-files-found: warn
