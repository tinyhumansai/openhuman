name: Module bundle

on:
  pull_request:
    paths:
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/module-bundle.yml"
      - "crates/openhuman-app/tauri.conf.json"
      - "crates/openhuman-core/src/modules/**"
      - "scripts/ci/self-hosted/test-module-assets.mjs"
      - "scripts/__tests__/stage-modules.test.mjs"
      - "scripts/lib/module-pins.mjs"
      - "scripts/release/stage-modules.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # TODO(#8499 follow-up): re-add `aarch64-pc-windows-msvc` once we can
          # provision an arm64 VC runtime on an x64 `windows-latest` CI host.
          # The arm64 code paths in `stage-modules` are unit-tested (see
          # `stage-modules.test.mjs`), `build-desktop.yml` ships no
          # `aarch64-pc-windows-msvc` artifact today, and Sentry
          # TAURI-RUST-14J5 (issue #8499) reports exclusively on x86_64
          # Windows — so dropping the lane here regresses nothing user-visible.
          # Provisioning options to try in the follow-up: `dark.exe` from WiX
          # (extracts named MSIs out of a Burn bundle, unlike 7-Zip which
          # surfaces Burn payload-ids on this image), a pinned Microsoft
          # NuGet redist package, or a native arm64 runner family.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Check registry coverage
        run: node --test scripts/__tests__/stage-modules.test.mjs
      - name: Download and verify every bundled release
        run: node scripts/release/stage-modules.mjs --target ${{ matrix.target }}
