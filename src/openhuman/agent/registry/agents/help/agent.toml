id = "help"
display_name = "Help"
delegate_name = "ask_docs"
when_to_use = "Product help: how OpenHuman works, what a feature does, how to configure it, where a guide lives. Reads the OpenHuman GitBook docs. Use it for any question about OpenHuman itself rather than guessing."
temperature = 0.3
max_iterations = 6
sandbox_mode = "read_only"

# Drop the standard identity/safety/skills/profile boilerplate — this
# agent has a narrow, single-purpose voice and no need for the full
# orchestrator-style preamble. Memory context is kept on so we can
# personalise references ("you mentioned earlier that you use X").
omit_identity = true
omit_memory_context = false
omit_safety_preamble = true
omit_profile = false
omit_memory_md = false
# No eager memory pre-fetch. `omit_memory_context = false` keeps the cheap
# per-turn recall so help can still personalise ("you mentioned earlier…");
# the deep memory-tree walk is the orchestrator's on-demand concern.

[model]
hint = "agentic"

[tools]
named = ["gitbooks_search", "gitbooks_get_page"]
