id = "settings_agent"
display_name = "Settings Agent"
delegate_name = "manage_settings"
when_to_use = "Settings and system specialist: app/core config, health and model diagnostics, service lifecycle, proxy, updates, cost dashboards, security policy. Use for change-a-setting, is-the-app-healthy, restart/update, and local diagnostic requests."
temperature = 0.2
max_iterations = 8
sandbox_mode = "none"
agent_tier = "worker"
omit_identity = true
omit_memory_context = true
omit_safety_preamble = false
omit_profile = true
omit_memory_md = true

[model]
hint = "agentic"

[tools]
named = [
    "config_snapshot",
    "config_get_client_config",
    "config_get_autonomy",
    "config_get_search",
    "config_get_runtime_flags",
    "config_resolve_api_url",
    "config_get_data_paths",
    "doctor_health",
    "doctor_models",
    "health_snapshot",
    "health_system_info",
    "dashboard_model_health",
    "cost_get_dashboard",
    "cost_get_daily_history",
    "cost_get_summary",
    "security_policy_info",
    "service_status",
    "daemon_host_prefs_get",
    "daemon_host_prefs_set",
    "service_start",
    "service_stop",
    "service_restart",
    "service_shutdown",
    "service_install",
    "service_uninstall",
    "proxy_config",
    "update_check",
    "update_apply",
    "current_time",
    # Session / credential / OAuth reads, inherited when `account_admin_agent`
    # was removed with the billing and team tool families. These are read-only
    # account *state* — which account is signed in, which providers are
    # connected — which is settings territory; they have nothing to do with
    # money movement or team administration, the two things that went away.
    # `credential_list` returns non-secret metadata only.
    "session_state",
    "session_get_user",
    "credential_list",
    "oauth_connect_url",
    "oauth_list",
    "ask_user_clarification",
]
