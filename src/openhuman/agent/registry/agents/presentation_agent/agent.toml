id = "presentation_agent"
display_name = "Presentation Agent"
delegate_name = "make_presentation"
when_to_use = "Presentation specialist: builds decks from supplied or retrieved evidence, and owns their grounding, citations and image verification. Use for make-slides, build-a-deck, or pitch-deck requests."
temperature = 0.2
max_iterations = 10
agent_tier = "worker"
omit_identity = true
omit_memory_context = false
omit_safety_preamble = false
omit_profile = true
omit_memory_md = true
# No eager memory pre-fetch. `omit_memory_context = false` keeps the cheap
# per-turn recall for grounding decks in prior context; the deep memory-tree
# walk is the orchestrator's on-demand concern (`delegate_retrieve_memory`).

[model]
hint = "agentic"

[tools]
named = [
    "generate_presentation",
    "web_search_tool",
    "web_fetch",
    "http_request",
]
